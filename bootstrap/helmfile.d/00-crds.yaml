---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# This helmfile is for extracting and installing Custom Resource Definitions (CRDs) from Helm charts.
# It is not intended to be used with helmfile apply or helmfile sync.

# Command:
# helmfile --file bootstrap/helmfile.d/00-crds.yaml template | yq eval-all --exit-status 'select(.kind == "CustomResourceDefinition")' | kubectl apply --server-side --filename -

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

# Each release reads its chart url and tag from kubernetes/apps/<namespace>/<name>/app/, so its name must
# match the app directory (scripts/test_bootstrap_helmfiles.py builds both helmfiles).
templates:
  app-chart:
    chart: '{{ (fromYaml (readFile (printf "../../kubernetes/apps/%s/%s/app/helmrelease.yaml" .Release.Namespace .Release.Name))).spec.chart.spec.url }}'
    version: '{{ (fromYaml (readFile (printf "../../kubernetes/apps/%s/%s/app/helmrelease.yaml" .Release.Namespace .Release.Name))).spec.chart.spec.ref.tag }}'

defaultInherit: app-chart

releases:
  - name: external-dns
    namespace: network

  - name: envoy-gateway
    namespace: network

  - name: grafana
    namespace: observability

  - name: prometheus-operator-crds
    namespace: observability

  - name: keda
    namespace: observability

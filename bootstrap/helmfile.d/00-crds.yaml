---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# This helmfile is for extracting and installing Custom Resource Definitions (CRDs) from Helm charts.
# It is not intended to be used with helmfile apply or helmfile sync.

# Command:
# helmfile --file bootstrap/helmfile.d/00-crds.yaml template | yq eval-all --exit-status 'select(.kind == "CustomResourceDefinition")' | kubectl apply --server-side --filename -

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

templates:
  app-chart:
    chart: '{{- $app := .Release.Name -}}{{- if eq $app "grafana-operator" -}}{{- $app = "grafana" -}}{{- end -}}{{ (fromYaml (readFile (printf "../../kubernetes/apps/%s/%s/app/helmrelease.yaml" .Release.Namespace $app))).spec.chart.spec.url }}'
    version: '{{- $app := .Release.Name -}}{{- if eq $app "grafana-operator" -}}{{- $app = "grafana" -}}{{- end -}}{{ (fromYaml (readFile (printf "../../kubernetes/apps/%s/%s/app/helmrelease.yaml" .Release.Namespace $app))).spec.chart.spec.ref.tag }}'

releases:
  - name: external-dns
    namespace: network
    inherit:
      - template: app-chart

  - name: envoy-gateway
    namespace: network
    inherit:
      - template: app-chart

  - name: grafana-operator
    namespace: observability
    inherit:
      - template: app-chart

  - name: prometheus-operator-crds
    namespace: observability
    inherit:
      - template: app-chart

  - name: keda
    namespace: observability
    inherit:
      - template: app-chart

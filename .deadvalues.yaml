# Configuration for the deadvalues CI check (.github/workflows/deadvalues.yaml).
# Keep in sync with FLATE_API_VERSIONS in .mise.toml and .github/workflows/flate.yaml.
apiVersions:
  - monitoring.coreos.com/v1
  - monitoring.coreos.com/v1/ServiceMonitor
  - grafana.integreatly.org/v1beta1/GrafanaDashboard

ignore:
  # Equals the chart default, but Renovate only tracks an image with both repository and tag.
  - keys:
      - "**.image.registry"
      - "**.image.repository"
  - app: rook-ceph-cluster
    keys:
      - cephImage.repository
  # Bootstrap only: these fields govern a deliberately disabled route.
  # v0.2.0-rc.1 incorrectly calls enabled:false redundant; omission activates it.
  # Reassess this app-specific exception when enabling serving.
  - app: family-blog
    keys:
      - route.app.enabled
      - route.app.annotations.gatus*/enabled
      - route.app.annotations.gethomepage*/enabled
      - route.app.hostnames
      - route.app.parentRefs

flux:
  # cluster-secrets is SOPS-encrypted; charts that parse URLs fail on a literal ${SECRET_DOMAIN}.
  substitute:
    SECRET_DOMAIN: example.com

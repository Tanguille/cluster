---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  encrypt:
    desc: Encrypt all Kubernetes SOPS secrets
    cmd: |
      find "{{.KUBERNETES_DIR}}" -type f -name "*.sops.*" | while read -r file; do
          if sops filestatus "${file}" | jq --exit-status ".encrypted == false" &>/dev/null; then
              sops --encrypt --in-place "${file}"
          fi
      done

  resources:
    desc: Gather common resources in your cluster, useful when asking for support
    cmds:
      - for: { var: RESOURCE }
        cmd: kubectl get {{.ITEM}} {{.CLI_ARGS | default "-A"}}
    vars:
      RESOURCE: >-
        nodes
        gitrepositories
        kustomizations
        helmrepositories
        helmreleases
        certificates
        certificaterequests
        pods
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl

  debug-toolhive-mcp:
    desc: Collect status and logs for ToolHive MCP servers (HA, Grafana, SearXNG) for debugging
    cmd: "{{.ROOT_DIR}}/.taskfiles/kubernetes/debug-toolhive-mcp.sh"
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl

  # https://docs.github.com/en/enterprise-cloud@latest/actions/hosting-your-own-runners/managing-self-hosted-runners-with-actions-runner-controller/deploying-runner-scale-sets-with-actions-runner-controller#upgrading-arc
  upgrade-arc:
    desc: Upgrade the ARC
    cmds:
      # Enumerated, not hardcoded: every scale set must be uninstalled before the controller.
      - for r in $(helm -n actions-runner-system ls -q | grep -v '^actions-runner-controller$'); do helm -n actions-runner-system uninstall "$r"; done
      - helm -n actions-runner-system uninstall actions-runner-controller
      - sleep 5
      - flux -n actions-runner-system reconcile hr actions-runner-controller
      - for r in $(flux -n actions-runner-system get hr --no-header | awk '{print $1}' | grep -v '^actions-runner-controller$'); do flux -n actions-runner-system reconcile hr "$r"; done
    preconditions:
      - which flux helm

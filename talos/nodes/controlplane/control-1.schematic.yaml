---
# control-1 diverges from the fleet: TrueNAS VM (qemu-guest-agent) and the only
# dGPU host, so it carries the amdgpu tuning args the Chuwi boxes do not need.
# Overrides are complete files, not deltas.
customization:
  extraKernelArgs:
    - apparmor=0
    - init_on_alloc=0
    - init_on_free=0
    - talos.auditd.disabled=1
    - talos.dashboard.disabled=1
    - -selinux
    - cpufreq.default_governor=performance
    - amd_pstate=active
    - amdgpu.ppfeaturemask=0xffffffff
    - amdgpu.runpm=0
    # Explicit 0, not absent: GECC persists in PSP firmware state once armed, so
    # dropping the flag leaves it on. It costs exactly 2GiB of VRAM (6.25% carve-out)
    # and sglang runs at 99.6% allocation. MEM ECC corrects regardless of this.
    - amdgpu.ras_enable=0
    - pcie_aspm.policy=performance
    - mitigations=off
    - security=none
    - preempt=voluntary # Talos v1.13+: gpu preemption
  systemExtensions:
    officialExtensions:
      - siderolabs/amdgpu
      - siderolabs/amd-ucode
      - siderolabs/qemu-guest-agent
      - siderolabs/nfsrahead

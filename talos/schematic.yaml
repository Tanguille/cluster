---
# Shared Image Factory schematic: Chuwi ubox nodes (control-2, control-3).
customization:
  extraKernelArgs:
    - apparmor=0
    - init_on_alloc=0
    - init_on_free=0
    - talos.auditd.disabled=1
    - talos.dashboard.disabled=1
    - -selinux
    - amd_pstate=active
    - mitigations=off
    # The stock config builds PREEMPT_LAZY, which defers SCHED_NORMAL wakeups to the next 4 ms tick:
    # etcd and Ceph OSD wakeups would queue behind xmrig. PREEMPT_DYNAMIC makes full selectable here.
    - preempt=full
    - security=none
  systemExtensions:
    officialExtensions:
      - siderolabs/amdgpu
      - siderolabs/amd-ucode
      - siderolabs/nfsrahead
      - siderolabs/gvisor

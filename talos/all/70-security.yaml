---
# Both documents below exist to hold behaviour flat across the migration. topf's generated base
# turns each of them ON, and neither is on today.
#
# workloadIsolation runs kubelet and pods in their own PID/mount namespace (sandboxd). A MISSING
# document means OFF and "preserves the old behavior" (talos internal/app/machined/pkg/sandboxd/
# enabled.go), which is what these nodes run; topf's base writes true. Left false so the cutover
# is a tooling change only -- this cluster is full of hostPID/host-mount workloads
# (node-exporter, the GPU device plugins, Ceph, Kepler). Adopting it is its own change, with its
# own rollback, and on encrypted disks costs a second reboot the first time.
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false
---
# topf's base generates a PodSecurity admission config (enforce: baseline, only kube-system
# exempt). The pre-migration config carried no admission control at all, so keeping it would
# start enforcing baseline on every unlabelled namespace at the same moment the tooling changed.
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
$patch: delete

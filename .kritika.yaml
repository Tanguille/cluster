# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
# Agent files are optional references; Kritika does not discover them automatically.
context:
  - path: AGENTS.md
    description: Repository architecture and conventions; coding-agent workflows are not review tasks.
  - path: kubernetes/AGENTS.md
    description: Kubernetes and Flux conventions.
    paths: ["kubernetes/**"]
  - path: .agents/learned-workspace.md
    description: Cluster-specific chart, networking, storage and controller behavior.
    paths: ["kubernetes/**", "talos/**"]
# Use the existing renderer from .mise.toml to check effective Helm values.
tools:
  "github:home-operations/flate": "v0.6.5"
rules:
  - id: ceph-csi-lockstep
    paths: ["kubernetes/apps/rook-ceph/**"]
    rule: >-
      The ceph-csi-drivers chart must stay compatible with the ceph-csi-operator subchart that the rook-ceph chart pinned in kubernetes/apps/rook-ceph/rook-ceph/app/ocirepository.yaml bundles. For a change to either version, read the rook-ceph chart's Chart.yaml dependencies at that tag with gh and report any gap between the bundled operator version and the ceph-csi-drivers version, with a verdict.

[env]
JUST_UNSTABLE = "1"
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
oxfmt = "0.62.0"
"aqua:evilmartians/lefthook" = "2.1.10"
"aqua:zizmorcore/zizmor" = "1.29.0"
"aqua:google/go-containerregistry" = "0.21.9"
"aqua:budimanjojo/talhelper" = "3.1.16"
"aqua:cilium/cilium-cli" = "0.19.7"
"aqua:cli/cli" = "2.97.0"
"aqua:cloudflare/cloudflared" = "2026.7.3"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:fluxcd/flux2" = "2.9.4"
"aqua:getsops/sops" = "3.13.3"
"aqua:casey/just" = "1.58.0"
"aqua:helm/helm" = "4.2.3"
"aqua:helmfile/helmfile" = "1.7.3"
"aqua:jqlang/jq" = "1.8.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:kubernetes/kubectl" = "1.36.3"
"aqua:mikefarah/yq" = "4.53.3"
"aqua:siderolabs/talos" = "1.13.8"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:derailed/k9s" = "0.51.0"
"github:home-operations/flate" = "v0.5.0"

[hooks]
postinstall = "lefthook install"

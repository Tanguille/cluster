min_version = "2026.7.0"

[env]
FLATE_API_VERSIONS = "monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,grafana.integreatly.org/v1beta1/GrafanaDashboard"
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
oxfmt = "0.75.0"
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:zizmorcore/zizmor" = "1.31.1"
"aqua:google/go-containerregistry" = "0.22.1"
"aqua:cilium/cilium-cli" = "0.20.2"
"aqua:cli/cli" = "2.103.3"
"aqua:cloudflare/cloudflared" = "2026.10.5"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.10.0"
"aqua:getsops/sops" = "3.13.3"
"aqua:casey/just" = "1.59.0"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:jqlang/jq" = "1.8.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.3"
"aqua:kubernetes/kubectl" = "1.37.1"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:mitsuhiko/minijinja" = "3.0.4"
"aqua:siderolabs/talos" = "1.14.5"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:derailed/k9s" = "0.51.0"
"npm:markdownlint-cli2" = "0.24.0"
"aqua:kubescape/kubescape" = "4.0.17"
"github:home-operations/flate" = "v0.6.5"

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[hooks]
postinstall = "lefthook install"

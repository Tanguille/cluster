min_version = "2026.7.0"

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
oxfmt = "0.70.0"
"aqua:evilmartians/lefthook" = "2.1.14"
"aqua:zizmorcore/zizmor" = "1.30.1"
"aqua:google/go-containerregistry" = "0.22.1"
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:cli/cli" = "2.101.0"
"aqua:cloudflare/cloudflared" = "2026.9.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
"aqua:casey/just" = "1.58.0"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.8.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:kubernetes/kubectl" = "1.37.0"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:mitsuhiko/minijinja" = "2.24.0"
"aqua:siderolabs/talos" = "1.14.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:derailed/k9s" = "0.51.0"
"npm:markdownlint-cli2" = "0.23.3"
"aqua:kubescape/kubescape" = "4.0.14"
"github:home-operations/flate" = "v0.6.5"

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[hooks]
postinstall = "lefthook install"

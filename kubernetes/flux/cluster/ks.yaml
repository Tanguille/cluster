---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Synced by the FluxInstance. flate cannot read its sync patches (home-operations/flate#853),
# so child defaults live here, where both Flux and flate apply them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  # decryption.secretRef is omitted: kustomize-controller's --sops-age-secret is the fallback.
  decryption:
    provider: sops
  deletionPolicy: Orphan
  interval: 1h
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-settings
        kind: ConfigMap
        optional: true
      - name: cluster-secrets
        kind: Secret
        optional: true
  patches:
    # Child defaults. Each field below, the patches list included, replaces a child's own value, so
    # children omit them; sourceRef and instanceSelector are schema-required, so trimmed files fail
    # standalone validation.
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          sourceRef:
            kind: GitRepository
            name: flux-system
            namespace: flux-system
          decryption:
            provider: sops
          postBuild:
            substituteFrom:
              - name: cluster-settings
                kind: ConfigMap
                optional: false
              - name: cluster-secrets
                kind: Secret
                optional: false
          deletionPolicy: WaitForTermination
          timeout: 5m
          retryInterval: 2m
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  driftDetection:
                    mode: enabled
                  install:
                    crds: CreateReplace
                  rollback:
                    cleanupOnFail: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
            # Plain-manifest dashboards only (ResourceSet and chart-rendered ones keep their own). It
            # overrides a dashboard's own values, so one for another Grafana instance cannot be a plain manifest.
            - patch: |-
                apiVersion: grafana.integreatly.org/v1beta1
                kind: GrafanaDashboard
                metadata:
                  name: _
                spec:
                  allowCrossNamespaceImport: true
                  instanceSelector:
                    matchLabels:
                      grafana.internal/instance: grafana
              target:
                group: grafana.integreatly.org
                kind: GrafanaDashboard
            # Dry-run diff breaks on CephBlockPool/CephFilesystem (live spec.replicated.minSize
            # isn't in the installed CRD schema), leaving the release in a permanent StateError.
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  driftDetection:
                    mode: disabled
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                name: rook-ceph-cluster
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization

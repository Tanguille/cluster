---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-settings
        kind: ConfigMap
        optional: true
      - name: cluster-secrets
        kind: Secret
        optional: true
  patches:
    # Add Kustomization defaults for all child Kustomizations.
    # Replaces substituteFrom/timeout/retryInterval wholesale — setting them in a child is a no-op.
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          postBuild:
            substituteFrom:
              - name: cluster-settings
                kind: ConfigMap
                optional: false
              - name: cluster-secrets
                kind: Secret
                optional: false
          deletionPolicy: WaitForTermination
          timeout: 5m
          retryInterval: 2m
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  driftDetection:
                    mode: enabled
                  install:
                    crds: CreateReplace
                  rollback:
                    cleanupOnFail: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
            # The operator only picks a dashboard up with these two fields, and every dashboard
            # in the repo wants the same values, so a dashboard file carries only its own content.
            # Reaches the 33 GrafanaDashboard resources built by kustomize; the 5 declared inside
            # a ResourceSet are expanded by flux-operator, not kustomize, and keep theirs inline.
            - patch: |-
                apiVersion: grafana.integreatly.org/v1beta1
                kind: GrafanaDashboard
                metadata:
                  name: _
                spec:
                  allowCrossNamespaceImport: true
                  instanceSelector:
                    matchLabels:
                      grafana.internal/instance: grafana
              target:
                group: grafana.integreatly.org
                kind: GrafanaDashboard
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    # Kustomization-level patches replace the whole spec.patches list, so a rook-ceph-cluster
    # HelmRelease patch can't just add driftDetection.mode: disabled on top of the one above -
    # it must replace it wholesale, defaults included. That drops the GrafanaDashboard patch too,
    # which is harmless only because the ceph dashboards are built by the rook-ceph Kustomization
    # (path .../rook-ceph/app); a dashboard added under .../cluster would need it restated here.
    # Its dry-run diff can't handle
    # CephBlockPool/CephFilesystem, whose live spec.replicated.minSize isn't declared in the
    # installed CRD schema, which puts the release into a permanent StateError otherwise.
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  driftDetection:
                    mode: disabled
                  install:
                    crds: CreateReplace
                  rollback:
                    cleanupOnFail: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: rook-ceph-cluster
        namespace: rook-ceph

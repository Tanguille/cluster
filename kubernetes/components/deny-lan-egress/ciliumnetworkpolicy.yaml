---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Internet-exposed namespaces must not reach private ranges; a pure deny overlay, other egress stays default-allow.
# CIDR rules never match live pods or nodes (only stale IPs of deleted pods), and socketLB rewrites Service/LB IPs to backend pods first, so in-cluster traffic is unaffected except envoy-internal-tls below.
# Opt out with the pod label egress.home.arpa/lan: allow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-lan-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: egress.home.arpa/lan
        operator: NotIn
        values: [allow]
  enableDefaultDeny:
    egress: false
  egressDeny:
    - toCIDRSet:
        - cidr: 10.0.0.0/8
        - cidr: 172.16.0.0/12
        - cidr: 192.168.0.0/16
    # envoy-internal-tls only passes TLS through to the OPNsense, TrueNAS and IPMI UIs on the LAN.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal-tls

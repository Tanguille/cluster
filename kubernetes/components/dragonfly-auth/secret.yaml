---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/secret_v1.json
# Dragonfly requirepass for the server and its client namespaces, copied from cluster-secrets so
# reloader-watched clients roll only when this value changes, not on every cluster-secrets edit.
# An unset variable renders an empty password: the key must be in cluster-secrets before this lands.
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-auth
type: Opaque
stringData:
  password: ${DRAGONFLY_PASSWORD}

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/secret_v1.json
# Copied from cluster-secrets so reloader-watched clients roll only when this value changes.
# Keep it URL-safe (hex): notify-push, obico, searxng and renovate embed it in a redis URL.
# Rotation: dragonfly, vmcp unified, obico and renovate-operator need a manual rollout restart.
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-auth
type: Opaque
stringData:
  password: ${DRAGONFLY_PASSWORD}

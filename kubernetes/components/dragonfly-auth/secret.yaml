---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/secret_v1.json
# Copy of cluster-secrets' DRAGONFLY_PASSWORD so reloader-auto clients roll only when it changes; keep it URL-safe (hex).
# Rotation: dragonfly, vmcp unified, obico and renovate-operator need a manual rollout restart.
# `:=` default: cluster-secrets is applied by the same root Kustomization, so a strict unset var would deadlock it.
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-auth
type: Opaque
stringData:
  password: ${DRAGONFLY_PASSWORD:=}

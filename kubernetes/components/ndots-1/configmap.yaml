---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ndots-1
# Default ndots:5 search-expands any name with fewer than 5 dots against the pod's
# search path before trying it absolute. Two costs: a *.svc.cluster.local lookup burns
# three NXDOMAIN round-trips first, and an external name that collides with a local
# Service is hijacked outright (opencode.ai -> opencode.ai.svc.cluster.local).
data:
  values.yaml: |
    defaultPodOptions:
      dnsConfig:
        options:
          - name: ndots
            value: "1"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-media
  annotations:
    # Created by whichever consumer's Kustomization applies first; pruning is
    # disabled, so removing a consumer does not delete it — delete it by hand
    # when the last consumer goes.
    kustomize.toolkit.fluxcd.io/prune: disabled
    # Re-applies flipped the owner label and cancelled HR upgrades; delete this ConfigMap to change values.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
data:
  values.yaml: |
    persistence:
      media:
        type: nfs
        server: ${TRUENAS_IP}
        path: ${MEDIA_NFS_PATH}

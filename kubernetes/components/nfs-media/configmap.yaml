---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-media
  annotations:
    # Built by seven per-app Kustomizations (radarr, sonarr, bazarr, qbittorrent,
    # unpackerr, qui, fileflows), each of which consumes it via valuesFrom. Flux
    # gates prune/delete on the owner labels of whichever Kustomization applied
    # last, so any one of them pruning it deletes it for all seven until the next
    # owner re-applies -- the same guard the Namespace objects in components/common
    # carry. Delete manually if the last consumer ever goes away.
    kustomize.toolkit.fluxcd.io/prune: disabled
data:
  values.yaml: |
    persistence:
      media:
        type: nfs
        server: ${TRUENAS_IP}
        path: ${MEDIA_NFS_PATH}
        globalMounts:
          - path: /media
            readOnly: false

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Internet-exposed namespaces must not reach the kube-apiserver; a pure deny overlay, other egress stays default-allow.
# NotIn matches label-less pods too, so only kopiur movers and egress.home.arpa/kube-apiserver: allow pods are exempt.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-kube-apiserver-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/managed-by
        operator: NotIn
        values: [kopiur]
      - key: egress.home.arpa/kube-apiserver
        operator: NotIn
        values: [allow]
  enableDefaultDeny:
    egress: false
  egressDeny:
    - toEntities:
        - kube-apiserver

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  repository:
    kind: ClusterRepository
    name: kopia-nas
  sources:
    - pvc:
        name: ${APP}
      # The adopted history was recorded at /data; kopiur's /pvc/<name> default would start a new identity strand.
      sourcePathOverride: /data
  # Explicit uid, not inheritSecurityContextFrom: inheritance needs a live pod with a declared uid (many images drop privileges in an entrypoint) and never works for restore (app is scaled to 0).
  # KOPIUR_MOVER_CAPS_ADD (DAC_READ_SEARCH) is only for root: the mover drops all caps, and root alone can't read another uid's files.
  # The whole token is the list value: `${VAR}` braces break flow-sequence YAML parsing when nested in `[]`.
  mover:
    securityContext:
      runAsUser: ${KOPIUR_PUID:=568}
      runAsGroup: ${KOPIUR_PGID:=568}
      capabilities:
        add: ${KOPIUR_MOVER_CAPS_ADD:=[]}
  # Verification is opt-in, and an unrestorable repo reads like a healthy one until the restore.
  # Fixed hour + 3h jitter spreads the whole-repo quick verify wider than `H 3 * * 0`.
  verification:
    quick:
      schedule:
        cron: 0 3 * * 0
        jitter: 3h
  compression:
    compressor: zstd
  retention:
    keepHourly: 24
    keepDaily: 7
  # An explicit list replaces kopiur's default ignore set; /lost+found is the only default that matters on ceph-block PVCs.
  files:
    ignoreRules: ${KOPIUR_IGNORE_RULES:=[/lost+found]}
  volumeSnapshotClassName: ${BACKUP_SNAPSHOTCLASS:=csi-ceph-blockpool}
  credentialProjection:
    enabled: true

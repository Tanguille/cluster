---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}-restore
spec:
  source:
    fromPolicy:
      name: ${APP}
  # Explicit PASSIVE populator mode — claimed by the PVC's dataSourceRef below.
  target:
    populator: {}
  policy:
    # deploy-or-restore: fresh cluster + empty repo -> empty PVC, existing
    # repo -> restore the latest snapshot.
    onMissingSnapshot: Continue
  credentialProjection:
    enabled: true
  # Workload-based inheritSecurityContextFrom can't work: the cutover scales the app to 0 first, so there's no pod to inherit from.
  # Without an explicit uid the mover defaults to 65532 and restored files land 65532:568, which breaks owner-only (0600) files such as the *arr Data Protection keys.
  # No capabilities needed, unlike backup: restore creates fresh files owned by its own uid.
  mover:
    securityContext:
      runAsUser: ${KOPIUR_PUID:=568}
      runAsGroup: ${KOPIUR_PGID:=568}

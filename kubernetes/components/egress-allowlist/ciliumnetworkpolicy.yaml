---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Default-deny egress except DNS, the namespace itself and world; ingress untouched.
# Anything else needs an egress.home.arpa/* grant label (allow-* CCNPs in kube-system/cilium), or it is a silent "Policy denied" drop.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-allowlist
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - {}
    # world is everything outside the cluster, LAN included; pair with deny-lan-egress to fence RFC1918.
    - toEntities:
        - world

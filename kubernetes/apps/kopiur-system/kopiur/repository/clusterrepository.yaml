---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopia-nas
spec:
  concurrency:
    maxConcurrentJobs: 4
  allowedNamespaces:
    list:
      - ai
      - default
      - kopiur-system
      - media
      - security
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: "${TRUENAS_IP}"
          path: ${BACKUP_NFS_PATH}
  encryption:
    passwordSecretRef:
      name: kopia-nas-password
      # Must stay explicit: credentialProjection reads it to know which Secret to copy (absent defaults to kopiur-system since kopiur#232).
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  bootstrap:
    failurePolicy:
      # default 120s too short to bootstrap-verify the multi-GB repo over NFS
      activeDeadlineSeconds: 2700
  credentialProjection:
    allowed: true
  maintenance:
    mover:
      # Not on moverDefaults: there it overrides the per-app mover uid/gid in components/kopiur.
      securityContext:
        runAsUser: 568
        runAsGroup: 568
    schedule:
      # Quick hourly (default 6h) compacts closed epochs promptly; full stays daily, off the midnight peak.
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  # Requests keep movers out of BestEffort, the Talos OOM killer's first victims (exit 137).
  moverDefaults:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  parameters:
    epoch:
      # kopia default 24h; 1h bounds live index blob growth (onedr0p/home-ops#11650).
      minDuration: 1h
  scheduleDefaults:
    timezone: ${TIMEZONE}

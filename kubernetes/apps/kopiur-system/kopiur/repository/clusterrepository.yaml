---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopia-s3
spec:
  concurrency:
    maxConcurrentJobs: 4
  allowedNamespaces:
    list:
      - ai
      - default
      - kopiur-system
      - maker
      - media
      - security
  backend:
    s3:
      bucket: kopiur
      # Kopiur defaults to verified HTTPS; k8s-gateway resolves this directly to TrueNAS.
      endpoint: s3.${SECRET_DOMAIN}:9000
      region: us-east-1
  encryption:
    passwordSecretRef:
      name: kopia-s3-credentials
      # Must stay explicit: credentialProjection reads it to know which Secret to copy.
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  credentialProjection:
    allowed: true
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    podLabels:
      # S3 uses pod networking; default and media otherwise deny LAN egress.
      egress.home.arpa/lan: allow
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: ${TIMEZONE}

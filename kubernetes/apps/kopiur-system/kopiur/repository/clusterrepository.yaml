---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopia-s3
spec:
  concurrency:
    maxConcurrentJobs: 4
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: kopiur
      # Kopiur defaults to verified HTTPS; k8s-gateway resolves this directly to TrueNAS.
      endpoint: s3.${SECRET_DOMAIN}:9000
      region: us-east-1
  encryption:
    passwordSecretRef:
      name: kopia-s3-credentials
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  # Movers and their caches run in kopiur-system; needs the CrossNamespaceVolumeDataSource gate (talos + RBD provisioner).
  execution:
    mode: Central
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    cache:
      # Cache PVCs are 5Gi (KOPIUR_CAPACITY default); kopia's 5000 MiB per-budget defaults exceed that,
      # so the sweeper never runs and the cache fills the volume. The metadata budget applies twice:
      # kopia caps the index-blobs cache at the same size.
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: ${TIMEZONE}

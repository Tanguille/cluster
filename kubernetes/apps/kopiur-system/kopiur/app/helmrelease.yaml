---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    # Controller runs kopia in-process; Restore fails "/repo not mounted" without this (kopiur#137).
    extraVolumes:
      - name: repo
        nfs:
          server: "${TRUENAS_IP}"
          path: ${BACKUP_NFS_PATH}
    extraVolumeMounts:
      - name: repo
        mountPath: /repo
    podSecurityContext:
      # 568 not chart-default 65534: must read the uid-568 NFS repo
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
    features:
      credentialProjection:
        enabled: true # shared repo, movers in many namespaces
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        backupStaleAfterSeconds: 21600
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
    ui:
      enabled: true
      auth:
        anonymous:
          enabled: true
          user: kopiur-lan
      networkPolicy:
        enabled: true
        proxySelector:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: envoy-internal

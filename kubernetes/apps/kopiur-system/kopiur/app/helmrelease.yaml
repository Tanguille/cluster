---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.10.20
      url: oci://ghcr.io/home-operations/charts/kopiur
  interval: 1h
  values:
    features:
      credentialProjection:
        enabled: true # shared repo, movers in many namespaces
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        backupStaleAfterSeconds: 21600
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
    ui:
      enabled: true
      auth:
        anonymous:
          enabled: true
          user: &lanUser kopiur-lan
      rbac:
        bindings:
          - role: viewer
            users:
              - *lanUser
      networkPolicy:
        enabled: true
        proxySelector:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: envoy-internal

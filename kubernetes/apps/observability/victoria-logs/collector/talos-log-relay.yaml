---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Talos sends json_lines over TCP; VictoriaLogs ingests JSON over HTTP only. Vector bridges.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-log-relay
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      talos-log-relay:
        containers:
          app:
            image:
              repository: timberio/vector
              tag: 0.62.0-distroless-libc@sha256:22100806cedabab3768edd6ac919be1a3a026b1020c5b280174a54573572db9d
            env:
              # Default is one worker per node CPU (12); each idle one costs memory, a few lines/s needs 2.
              VECTOR_THREADS: "2"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    # No Reloader: the chart's checksum/configMaps pod annotation rolls the pod on changes.
    configMaps:
      config:
        data:
          vector.yaml: |
            data_dir: /var/lib/vector
            sources:
              # host is the sending node's IP.
              talos:
                type: socket
                mode: tcp
                address: 0.0.0.0:6050
                decoding:
                  codec: json
            transforms:
              # dns-resolve-cache logs two debug lines per host DNS query; the console dashboard polls machined every second.
              drop_noise:
                type: filter
                inputs:
                  - talos
                condition: |
                  svc = ."talos-service"
                  msg = string(.msg) ?? ""
                  svc != "dns-resolve-cache" && !(svc == "machined" && contains(msg, "match with service \"dashboard\""))
              # Kernel lines end in a newline; VictoriaLogs has level, not talos-level.
              tidy:
                type: remap
                inputs:
                  - drop_noise
                source: |
                  if is_string(.msg) { .msg = replace(string!(.msg), r'\n$', "") }
                  if exists(."talos-level") { .level = del(."talos-level") }
            sinks:
              victoria_logs:
                type: http
                inputs:
                  - tidy
                # Disk buffer so a VictoriaLogs restart does not drop lines; full buffer blocks, and Talos redials.
                buffer:
                  type: disk
                  max_size: 536870912
                  when_full: block
                uri: http://victoria-logs.observability.svc.cluster.local:9428/insert/jsonline?_stream_fields=host,talos-service&_msg_field=msg&_time_field=talos-time
                encoding:
                  codec: json
                  except_fields:
                    - port
                    - source_type
                    - timestamp
                # Default for json is one JSON array per request; /insert/jsonline wants one object per line.
                framing:
                  method: newline_delimited
                compression: gzip
    service:
      app:
        # Fixed so the Talos machine config can name it.
        clusterIP: ${TALOS_LOG_RELAY_IP}
        ports:
          talos:
            port: 6050
    persistence:
      data:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /var/lib/vector
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/vector/vector.yaml
            subPath: vector.yaml
            readOnly: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 11.26.2
      url: oci://ghcr.io/prometheus-community/charts/prometheus-blackbox-exporter
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter
    resources:
      requests:
        memory: 16Mi
    securityContext:
      capabilities: { add: ["NET_RAW"] }
    # The prober must survive the host it pings: control-1 is a VM on the TrueNAS host and goes dark with it.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: [control-1]
    config:
      modules:
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
        dns_a:
          prober: dns
          timeout: 5s
          dns:
            # k8s-gateway only answers its own zone; query its apex record.
            query_name: k8s-gateway.network.${SECRET_DOMAIN}
            query_type: A
            preferred_ip_protocol: ip4
        dns_a_public:
          prober: dns
          timeout: 5s
          dns:
            # Public name, not a local zone; checks the LAN resolver answers.
            query_name: example.com
            query_type: A
            preferred_ip_protocol: ip4
            # NOERROR with no answer would otherwise pass.
            validate_answer_rrs:
              fail_if_none_matches_regexp: ["\tIN\tA\t"]
    serviceMonitor:
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: TrueNASHostDown
          # Faster and separate from LanProbeFailed (15 m, one of many target alerts when the host drops).
          expr: |-
            probe_success{job="probe/observability/lan-icmp",instance="${TRUENAS_IP}"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: |-
              TrueNAS host {{ $labels.instance }} does not answer ping; control-1, Home Assistant and the NAS shares are off the network with it
        - alert: LanProbeFailed
          # Not LB IPs (LoadBalancerIPUnreachable) or the TrueNAS ping (TrueNASHostDown); `on(service)` because the probe and self-monitor series differ in job and instance
          expr: |-
            probe_success{service="blackbox-exporter",job!="probe/observability/loadbalancer-ips",instance!="${TRUENAS_IP}"} == 0
            and on(service)
            up{service="blackbox-exporter"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
        - alert: LanDnsDegraded
          # Intermittent drops keep resetting LanProbeFailed's `for`; a ratio catches a half-working resolver
          expr: avg_over_time(probe_success{job="probe/observability/lan-dns"}[15m]) < 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: |-
              The LAN resolver {{ $labels.instance }} failed more than 10% of DNS probes over 15 minutes

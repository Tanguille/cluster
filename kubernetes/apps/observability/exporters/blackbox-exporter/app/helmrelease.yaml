---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter
    securityContext:
      capabilities: { add: ["NET_RAW"] }
    config:
      modules:
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
        dns_a:
          prober: dns
          timeout: 5s
          dns:
            # k8s-gateway only answers its own zone; query its apex record.
            query_name: k8s-gateway.network.${SECRET_DOMAIN}
            query_type: A
            preferred_ip_protocol: ip4
    serviceMonitor:
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: LanProbeFailed
          # LB IPs are covered by LoadBalancerIPUnreachable; `on(service)` because the probe and self-monitor series differ in job and instance
          expr: |-
            probe_success{service="blackbox-exporter",job!="probe/observability/loadbalancer-ips"} == 0
            and on(service)
            up{service="blackbox-exporter"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues

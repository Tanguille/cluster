---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-exporter-rules
spec:
  groups:
    - name: node-exporter.rules
      rules:
        - alert: NodeMemoryAvailableLow
          # kubelet starved at ~444MB in a control-2 wedge; 2GiB leaves runway to intervene
          expr: |-
            node_memory_MemAvailable_bytes{kubernetes_node!=""} < 2147483648
          for: 10m
          annotations:
            summary: >-
              {{ $labels.kubernetes_node }} has under 2GiB memory available —
              kubelet starvation follows if this keeps falling
          labels:
            severity: critical
        - alert: NodeRebooted
          # No `for:` because uptime crosses 600s once; both clocks are the node's own, so NTP skew cannot bias it.
          expr: |-
            node_time_seconds{kubernetes_node!=""} - node_boot_time_seconds < 600
          annotations:
            summary: >-
              {{ $labels.kubernetes_node }} booted less than 10 minutes ago —
              confirm this reboot was intentional
          labels:
            severity: warning
        - alert: DgpuVramLow
          # Nothing enforces the LLM/transcode VRAM split (squat.ai/dri counts device nodes, not bytes); the LLM side is set by --gpu-headroom-mib in qwen38-27b-vllm.yaml.
          # Idle free is about 2 GiB with radiance loaded; under 1 GiB a 4K DV transcode (0.85 GB) has no margin.
          expr: |-
            node_drm_memory_vram_size_bytes{kubernetes_node="control-1"}
              - node_drm_memory_vram_used_bytes{kubernetes_node="control-1"}
              < 1073741824
          for: 10m
          annotations:
            summary: >-
              {{ $labels.kubernetes_node }} dGPU has under 1GiB VRAM free — the
              transcode reserve is breached; check concurrent transcodes before
              lowering radiance's --gpu-headroom-mib
          labels:
            severity: warning
        - alert: NodeDRMCollectorFailed
          # A dead DRM collector reads as "no VRAM problem" to DgpuVramLow.
          expr: |-
            max by (kubernetes_node) (
              node_scrape_collector_success{collector="drm", kubernetes_node="control-1"} == 0
            )
          for: 10m
          annotations:
            summary: >-
              DRM collector failed on {{ $labels.kubernetes_node }}; DgpuVramLow is
              blind until it recovers
          labels:
            severity: warning
        - alert: DgpuVramTelemetryMissing
          # DgpuVramLow is a subtraction and returns no sample if either metric vanishes; absent() on each covers both and keeps the node label.
          expr: |-
            absent(node_drm_memory_vram_used_bytes{kubernetes_node="control-1"})
            or absent(node_drm_memory_vram_size_bytes{kubernetes_node="control-1"})
            or node_drm_memory_vram_size_bytes{kubernetes_node="control-1"} <= 0
          for: 10m
          annotations:
            summary: >-
              dGPU VRAM telemetry is absent or non-positive on
              {{ $labels.kubernetes_node }} — DgpuVramLow is blind until it recovers
          labels:
            severity: warning
        - alert: TrueNASSSDPoolSpaceWarning
          # 100GiB leaves a day to delete snapshots before TrueNASSSDPoolSpaceLow (docs/drives.md).
          expr: |-
            node_filesystem_avail_bytes{job="node-exporter", fstype="zfs", mountpoint="/mnt/SSD_Pool"} < 107374182400
          for: 1h
          annotations:
            summary: >-
              TrueNAS SSD_Pool has under 100GiB free; free space before the sparse VM disks
              (control-1, haos, k8s_management) fail writes and pause
          labels:
            severity: warning
        - alert: TrueNASSSDPoolSpaceLow
          # control-1's disk is a sparse zvol on this pool, so a full pool fails guest writes and stops the VM; the kubernetes_node!="" scoping of the other node alerts excludes this external target.
          expr: |-
            node_filesystem_avail_bytes{job="node-exporter", fstype="zfs", mountpoint="/mnt/SSD_Pool"} < 21474836480
          # 15m rides out the 04:00 snapshot task that frees and re-pins tens of GB.
          for: 15m
          annotations:
            summary: >-
              TrueNAS SSD_Pool has under 20GiB free —
              control-1's thin-provisioned disk fails writes if this pool fills
          labels:
            severity: critical
        - alert: TrueNASPoolNotOnline
          # A planned disk swap fires this too, on purpose.
          expr: |-
            node_zfs_zpool_state{job="node-exporter", nodename="truenas", state!="online"} == 1
          for: 5m
          annotations:
            summary: >-
              TrueNAS pool {{ $labels.zpool }} is {{ $labels.state }}
          labels:
            severity: critical
        - alert: TrueNASPoolTelemetryMissing
          # TrueNASPoolNotOnline matches node_zfs_zpool_state, which only exists while the target exports the zfs collector.
          expr: |-
            absent(node_zfs_zpool_state{job="node-exporter", nodename="truenas"})
          for: 10m
          annotations:
            summary: >-
              TrueNAS zpool telemetry is absent — TrueNASPoolNotOnline is blind until it recovers
          labels:
            severity: warning
        - alert: OPNsenseCPUTemperatureHigh
          # 30-day peak is ~42C, so 80C is a cooling fault, not load; root disk fill is NodeFilesystemAlmostOutOfSpace.
          expr: |-
            max by (nodename) (node_cpu_temperature_celsius{nodename="opnsense"}) > 80
          for: 15m
          annotations:
            summary: >-
              OPNsense CPU is at {{ $value | humanize }}°C; check the router's fan and airflow
          labels:
            severity: warning

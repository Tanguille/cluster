---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-exporter-rules
spec:
  groups:
    - name: node-exporter.rules
      rules:
        - alert: NodeMemoryAvailableLow
          # kubelet starved at ~444MB in a control-2 wedge; 2GiB leaves runway to intervene
          expr: |-
            node_memory_MemAvailable_bytes{kubernetes_node!=""} < 2147483648
          for: 10m
          annotations:
            summary: >-
              {{ $labels.kubernetes_node }} has under 2GiB memory available —
              kubelet starvation follows if this keeps falling
          labels:
            severity: critical
        - alert: NodeRebooted
          # No `for:` because uptime crosses 600s once; both clocks are the node's own, so NTP skew cannot bias it.
          expr: |-
            node_time_seconds{kubernetes_node!=""} - node_boot_time_seconds < 600
          annotations:
            summary: >-
              {{ $labels.kubernetes_node }} booted less than 10 minutes ago —
              confirm this reboot was intentional
          labels:
            severity: warning
        - alert: NodeGTTMemoryHigh
          # Pinned iGPU memory the OOM killer cannot reclaim; normal embedder use is 1-2GB. Only the iGPU nodes expose GTT.
          expr: |-
            node_drm_memory_gtt_used_bytes{kubernetes_node=~"control-[23]"} > 4294967296
          for: 15m
          annotations:
            summary: >-
              {{ $labels.kubernetes_node }} has over 4GiB of pinned GTT GPU memory —
              likely the embedder leak; native max pod lifetime recycling should cap it
          labels:
            severity: warning
        - alert: DgpuVramLow
          # Nothing enforces the vLLM/transcode VRAM split (DRA claims count devices, not bytes); vLLM is set by --kv-cache-memory in qwen38-27b-vllm.yaml.
          # vLLM settles at 30.34 GiB after warm-up (fdinfo), leaving ~1.5 GiB; under 1 GiB a 4K DV transcode (0.85 GB) has no margin.
          expr: |-
            node_drm_memory_vram_size_bytes{kubernetes_node="control-1"}
              - node_drm_memory_vram_used_bytes{kubernetes_node="control-1"}
              < 1073741824
          for: 10m
          annotations:
            summary: >-
              {{ $labels.kubernetes_node }} dGPU has under 1GiB VRAM free — the
              transcode reserve is breached; check concurrent transcodes before
              raising vLLM's --kv-cache-memory
          labels:
            severity: warning
        - alert: NodeDRMCollectorFailed
          # A dead DRM collector reads as "no GTT problem"; control-1 is included because DgpuVramLow uses the same collector.
          expr: |-
            max by (kubernetes_node) (
              node_scrape_collector_success{collector="drm", kubernetes_node=~"control-[123]"} == 0
            )
          for: 10m
          annotations:
            summary: >-
              DRM collector failed on {{ $labels.kubernetes_node }} — its GPU memory
              alert (GTT on control-2/3, dGPU VRAM on control-1) is blind until it
              recovers
          labels:
            severity: warning
        - alert: DgpuVramTelemetryMissing
          # DgpuVramLow is a subtraction and returns no sample if either metric vanishes; absent() on each covers both and keeps the node label.
          expr: |-
            absent(node_drm_memory_vram_used_bytes{kubernetes_node="control-1"})
            or absent(node_drm_memory_vram_size_bytes{kubernetes_node="control-1"})
            or node_drm_memory_vram_size_bytes{kubernetes_node="control-1"} <= 0
          for: 10m
          annotations:
            summary: >-
              dGPU VRAM telemetry is absent or non-positive on
              {{ $labels.kubernetes_node }} — DgpuVramLow is blind until it recovers
          labels:
            severity: warning
        - alert: NodeGTTTelemetryMissing
          # One alert identity per control node, even when the metric is absent entirely.
          expr: |-
            max by (kubernetes_node) (
              node_drm_memory_gtt_size_bytes{kubernetes_node=~"control-[23]"}
            ) <= 0
            or (
              label_replace(vector(1), "kubernetes_node", "control-2", "", "")
              unless on(kubernetes_node)
              max by (kubernetes_node) (
                node_drm_memory_gtt_size_bytes{kubernetes_node="control-2"}
              )
            )
            or (
              label_replace(vector(1), "kubernetes_node", "control-3", "", "")
              unless on(kubernetes_node)
              max by (kubernetes_node) (
                node_drm_memory_gtt_size_bytes{kubernetes_node="control-3"}
              )
            )
          for: 10m
          annotations:
            summary: >-
              GTT telemetry is absent or non-positive on {{ $labels.kubernetes_node }} —
              NodeGTTMemoryHigh is blind until it recovers
          labels:
            severity: warning
        - alert: TrueNASSSDPoolSpaceLow
          # control-1's disk is a sparse zvol on this pool, so a full pool fails guest writes and stops the VM; the kubernetes_node!="" scoping of the other node alerts excludes this external target.
          expr: |-
            node_filesystem_avail_bytes{job="node-exporter", fstype="zfs", mountpoint="/mnt/SSD_Pool"} < 21474836480
          # 15m rides out the 04:00 snapshot task that frees and re-pins tens of GB.
          for: 15m
          annotations:
            summary: >-
              TrueNAS SSD_Pool has under 20GiB free —
              control-1's thin-provisioned disk fails writes if this pool fills
          labels:
            severity: critical

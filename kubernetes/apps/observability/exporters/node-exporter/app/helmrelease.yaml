---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app node-exporter
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      layerSelector:
        mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
        operation: copy
      ref:
        tag: 4.60.1
      url: oci://ghcr.io/prometheus-community/charts/prometheus-node-exporter
  interval: 1h
  values:
    fullnameOverride: *app
    extraArgs:
      # GTT/VRAM totals for NodeGTTMemoryHigh and DgpuVramLow; GTT is pinned RAM outside memcg, so the embedder leak wedged control-2
      - --collector.drm
    prometheus:
      monitor:
        enabled: true
        jobLabel: app.kubernetes.io/instance
        relabelings:
          - sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: kubernetes_node
          - sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: nodename
    resources:
      requests:
        cpu: 10m
        memory: 64M
      limits:
        memory: 64M

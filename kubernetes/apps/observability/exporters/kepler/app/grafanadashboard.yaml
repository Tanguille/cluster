---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
# Upstream compose dashboard (panel superset of the operator's dashboard, which was removed as redundant).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kepler-overview
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folder: hardware
  datasources:
    - datasourceName: prometheus
      inputName: datasource
  url: "https://raw.githubusercontent.com/sustainable-computing-io/kepler/v0.12.0/compose/default/grafana/dashboards/latest/dashboard.json"

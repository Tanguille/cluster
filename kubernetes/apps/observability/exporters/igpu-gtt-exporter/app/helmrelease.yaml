---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: igpu-gtt-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      igpu-gtt-exporter:
        type: daemonset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # host /proc: DRM clients' fdinfo and cgroup
          hostPID: true
          nodeSelector:
            amd.com/igpu: "true"
        containers:
          app:
            image:
              repository: python
              tag: 3.15-slim@sha256:f11aa5dc9fad216f005cf34262f3f7dedc2369f03bbbd916589c24346519ee3b
            command: [python3, /config/exporter.py]
            securityContext:
              # fdinfo of root processes with a wider cap set needs uid 0 plus SYS_PTRACE (ptrace read mode)
              runAsUser: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
                add: [SYS_PTRACE]
            # TCP, not /metrics: every GET reruns the DRM client scan on the single-threaded server
            probes:
              liveness: &probe
                enabled: true
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 8080
    serviceMonitor:
      app:
        endpoints:
          - port: http
            relabelings:
              - sourceLabels: [__meta_kubernetes_pod_node_name]
                targetLabel: kubernetes_node
    persistence:
      config:
        type: configMap
        name: igpu-gtt-exporter
        globalMounts:
          - readOnly: true
      # dri/*/clients names the DRM client pids, so the exporter skips the ~540k gVisor fds on control-2
      debugfs:
        type: hostPath
        hostPath: /sys/kernel/debug
        globalMounts:
          - readOnly: true

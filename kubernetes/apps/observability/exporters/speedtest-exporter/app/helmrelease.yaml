---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: speedtest-exporter

  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    podSecurityContext:
      runAsGroup: 1000
      runAsUser: 1000
      fsGroup: 1000
      runAsNonRoot: true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        # Speedtest cycle spikes ~254Mi at ~30min intervals (Go download
        # workers + checksumming); 1 core also saturates (998m), starving
        # download workers and skewing measured download speed.
        cpu: 2
        memory: 512Mi
    servicemonitor:
      enabled: true
      interval: 30m
      scrapeTimeout: 5m
    # Ingress only: metrics scrape from observability; egress stays open for Ookla.
    networkPolicy:
      enabled: true
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
          ports:
            - protocol: TCP
              port: metrics

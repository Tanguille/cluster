---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: speedtest-exporter

  values:
    # Chart defaults to dual-stack; this cluster is IPv4-only.
    service:
      ipFamilyPolicy: SingleStack
      ipFamilies: [IPv4]
    podSecurityContext:
      seccompProfile: { type: RuntimeDefault }
      runAsGroup: 1000
      runAsUser: 1000
      fsGroup: 1000
      runAsNonRoot: true
    securityContext:
      allowPrivilegeEscalation: false
      # The chart already mounts the writable cache PVC at /cache.
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        # Headroom from a transient episode (998m CPU, OOMKilled at 256Mi); normal runs peak ~24Mi.
        cpu: 2
        memory: 512Mi
    servicemonitor:
      enabled: true
      interval: 30m
      scrapeTimeout: 5m
    # Keep this additive chart policy as narrow as the namespace CNP.
    # The namespace policy separately permits Ookla egress.
    networkPolicy:
      enabled: true
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: vmagent
          ports:
            - protocol: TCP
              port: metrics

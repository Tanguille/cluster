---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafanadashboard.yaml
  - helmrelease.yaml

# grafana.com 22341 rev 1 trimmed to emitted metrics; `server` is job-scoped since unscoped label_values(url) picks a non-FRM url.
configMapGenerator:
  - name: satisfactory-frm-dashboards
    files:
      - dashboard/power.json
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: satisfactory-frm-exporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  valuesFrom:
    - kind: ConfigMap
      name: ndots-1

  values:
    defaultPodOptions:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
    controllers:
      satisfactory-frm-exporter:
        containers:
          app:
            # Companion for the FicsitRemoteMonitoring mod: polls the FRM JSON API
            # (satisfactory:8080) and re-exposes the same data in Prometheus format.
            # Static Go binary (FROM scratch); the digest pins the moving `latest` tag.
            image:
              repository: docker.io/featheredtoast/ficsit-remote-monitoring-companion
              tag: latest@sha256:6c003115f5b748687cdff1dea963d956a005fee6239265e357ea8b14c7bfb18b
            env:
              FRM_HOST: satisfactory.default.svc.cluster.local
              FRM_PORT: "8080"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      app:
        ports:
          metrics:
            port: 9000
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            interval: 30s

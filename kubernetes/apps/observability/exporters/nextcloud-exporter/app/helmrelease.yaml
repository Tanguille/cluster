---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-exporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      nextcloud-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/xperimental/nextcloud-exporter
              tag: 0.9.2@sha256:512ddd1f1e1ea0ea7b4f0821c9740bcefa5fc15deb57fb9cd05dfb68e7e8390d
            env:
              NEXTCLOUD_SERVER: http://nextcloud.default.svc.cluster.local:8080
            envFrom:
              - secretRef:
                  name: nextcloud-exporter-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
    service:
      app:
        ports:
          http:
            port: 9205
    serviceMonitor:
      app:
        endpoints:
          - port: http
            # each scrape triggers Nextcloud's DB-heavy serverinfo API; upstream examples use 5m
            interval: 5m

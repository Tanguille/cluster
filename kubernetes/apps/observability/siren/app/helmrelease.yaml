---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app siren
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      siren:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2
        strategy: RollingUpdate
        # app-template renders this as a PDB on the siren pods: keep one alert
        # dashboard alive through node drains (it already has hostname TSC below).
        podDisruptionBudget:
          minAvailable: 1
        containers:
          app:
            image:
              repository: ghcr.io/shamubernetes/siren
              tag: 1.4.40@sha256:b322bb92b4f0746266e9a73fa36820a16987d32026279d6e180c2ff1836e272c
            env:
              TZ: ${TIMEZONE}
              ALERTMANAGER_BASE_URL: http://127.0.0.1:8102
              PORT: &port 3000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  initialDelaySeconds: 10
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                cpu: 100m
                memory: 512Mi
          decisions:
            image:
              repository: python
              tag: 3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
            command: ["python", "/app/decision_gateway.py"]
            env:
              PYTHONDONTWRITEBYTECODE: "1"
              D3_NATIVE_URL: http://d3-nano.ai.svc.cluster.local:8100
              D3_ALERT_PORT: "8102"
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: &decisionsLive
                    command:
                      - python
                      - -c
                      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/healthz', timeout=3).read()"
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: *decisionsLive
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Siren
          gethomepage.dev/description: Alert dashboard
          gethomepage.dev/group: Status
          gethomepage.dev/icon: mdi-alarm-light
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      d3-gateway:
        type: configMap
        name: d3-gateway
        advancedMounts:
          siren:
            decisions:
              - path: /app
                readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp

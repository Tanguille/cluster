---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: truenas-memory-high-utilization
spec:
  matchers:
    - name: alertname
      value: NodeMemoryHighUtilization
    - name: instance
      value: ${TRUENAS_IP}:9100
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: keda-hpa-maxed-out
spec:
  matchers:
    - name: alertname
      value: KubeHpaMaxedOut
    - name: horizontalpodautoscaler
      value: keda-hpa-.*
      matchType: "=~"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  # Structural: control-1 (53Gi allocatable) dwarfs control-2/3 (21Gi); N-1 memory
  # capacity is unfixable by request tuning.
  name: kube-memory-overcommit-homelab
spec:
  matchers:
    - name: alertname
      value: KubeMemoryOvercommit
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  # Structural: at priority -1000 with a hard node pin, xmrig has nothing below it to
  # preempt and nowhere to move, so Pending on a full node is its resting state.
  name: xmrig-pending-on-full-node
spec:
  matchers:
    - name: alertname
      value: KubePodNotReady
    - name: namespace
      value: web3
    - name: pod
      value: xmrig-.*
      matchType: "=~"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  # Same cause as xmrig-pending-on-full-node, seen from the Deployment side.
  name: xmrig-replicas-mismatch-on-full-node
spec:
  matchers:
    - name: alertname
      value: KubeDeploymentReplicasMismatch
    - name: namespace
      value: web3
    - name: deployment
      value: xmrig-.*
      matchType: "=~"

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: keda-hpa-maxed-out
spec:
  matchers:
    - name: alertname
      value: KubeHpaMaxedOut
    - name: horizontalpodautoscaler
      value: keda-hpa-.*
      matchType: "=~"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  # Structural: control-1 (59Gi) dwarfs control-2/3 (26Gi), so N-1 capacity can't be fixed by request tuning.
  name: kube-memory-overcommit-homelab
spec:
  matchers:
    - name: alertname
      value: KubeMemoryOvercommit
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  # Structural: priority -1000 plus a hard node pin leaves xmrig Pending on a full node.
  name: xmrig-pending-on-full-node
spec:
  matchers:
    - name: alertname
      value: KubePodNotReady
    - name: namespace
      value: web3
    - name: pod
      value: xmrig-.*
      matchType: "=~"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  # Same cause, Deployment side: KEDA scales to 1 while the pod stays Pending.
  name: xmrig-replicas-mismatch-on-full-node
spec:
  matchers:
    - name: alertname
      value: KubeDeploymentReplicasMismatch
    - name: namespace
      value: web3
    - name: deployment
      value: xmrig-.*
      matchType: "=~"

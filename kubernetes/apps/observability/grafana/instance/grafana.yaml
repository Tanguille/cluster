---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
    grafana.internal/instance: grafana
spec:
  config:
    database:
      type: postgres
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    auth.anonymous:
      enabled: "true"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    # Upstream deb/rpm packages copy data/plugins-bundled under $DATA_DIR and
    # point paths.bundled_plugins there so the plugin auto-updater can replace
    # them in place. Same idea here: the initContainer below seeds the image's
    # bundled plugins into a writable emptyDir, keeping readOnlyRootFilesystem
    # AND working auto-updates (Grafana >=13.2 ships prometheus as standalone).
    paths:
      bundled_plugins: /var/lib/grafana/plugins-bundled
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.${SECRET_DOMAIN}
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          initContainers:
            - name: seed-bundled-plugins
              image: grafana/grafana:13.2.2
              command: ["sh", "-c", "cp -a /usr/share/grafana/data/plugins-bundled/. /bundled-plugins/"]
              volumeMounts:
                - name: bundled-plugins
                  mountPath: /bundled-plugins
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: bundled-plugins
              emptyDir: {}
          containers:
            - name: grafana
              image: grafana/grafana:13.2.2
              resources:
                requests:
                  cpu: 10m
                  memory: 256Mi
                limits:
                  # Throttled 13% of CFS periods at 100m despite a 34m p95.
                  cpu: "1"
                  memory: 2Gi
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
              envFrom:
                - secretRef:
                    name: grafana-db-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: bundled-plugins
                  mountPath: /var/lib/grafana/plugins-bundled
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
  disableDefaultSecurityContext: All

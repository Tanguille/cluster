---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: prometheus
    name: prometheus
    uid: prometheus
    access: proxy
    isDefault: true
    url: http://vmauth-victoria-metrics.observability.svc.cluster.local:8427
    jsonData:
      httpMethod: POST
      # Matches the VMAgent global scrapeInterval; a lower value makes Grafana pick a step
      # shorter than the scrape interval and rate() comes back gappy.
      queryTimeout: 60s
      timeInterval: 20s
      seriesLimit: 40000
    editable: true

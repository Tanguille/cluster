---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: victoria-metrics-dashboards
spec:
  # Renovate's grafana-dashboards manager needs this filename and a nested grafanaCom: id/revision.
  inputs:
    - name: node-exporter-full
      folder: hardware
      grafanaCom:
        id: 1860
        revision: 45
    - name: zfs
      folder: nas
      grafanaCom:
        id: 24987
        revision: 11
  resources:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaDashboard
      metadata:
        name: << inputs.name >>
        namespace: observability
      spec:
        allowCrossNamespaceImport: true
        instanceSelector:
          matchLabels:
            grafana.internal/instance: grafana
        folder: << inputs.folder >>
        datasources:
          - datasourceName: VictoriaMetrics
            inputName: DS_PROMETHEUS
        grafanaCom: << inputs.grafanaCom | toYaml | nindent 10 >>
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: victoria-metrics-dashboards-mixin
spec:
  inputs:
    - name: kubernetes-hpa
      asset: hpa
    - name: kubernetes-pdb
      asset: pdb
  resources:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaDashboard
      metadata:
        name: << inputs.name >>
        namespace: observability
      spec:
        allowCrossNamespaceImport: true
        instanceSelector:
          matchLabels:
            grafana.internal/instance: grafana
        folder: autoscaling
        url: https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/kubernetes-autoscaling/dashboards/kubernetes-autoscaling-mixin-<< inputs.asset >>.json

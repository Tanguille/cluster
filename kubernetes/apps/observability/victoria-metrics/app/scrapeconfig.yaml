---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &app node-exporter
spec:
  staticConfigs:
    - targets:
        - ${TRUENAS_IP}:9100
        - ${OPNSENSE_IP}:9100
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *app
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &app smartctl-exporter
spec:
  staticConfigs:
    - targets:
        - ${TRUENAS_IP}:9633
  relabelings:
    - targetLabel: job
      replacement: *app
---
# Kepler on TrueNAS (control-1 VM host). Scrapes host port 28284 (compose maps 28284:28282).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: kepler-truenas
spec:
  staticConfigs:
    - targets:
        - ${TRUENAS_IP}:28284
  relabelings:
    - targetLabel: job
      replacement: power-monitor
    - targetLabel: instance
      replacement: control-1
  metricRelabelings:
    - targetLabel: node_name
      replacement: control-1
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &app homeassistant
spec:
  staticConfigs:
    - targets:
        - ${HOME_ASSISTANT_IP}:8123
  metricsPath: /api/prometheus
  scrapeInterval: 60s
  authorization:
    credentials:
      name: homeassistant-prometheus-token
      key: token
  relabelings:
    - targetLabel: job
      replacement: *app
---
# prometheus-klipper-exporter multi-target `/probe` scrape (modules per upstream README).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: klipper
spec:
  metricsPath: /probe
  scrapeInterval: 30s
  scrapeTimeout: 10s
  params:
    modules:
      - process_stats
      - system_info
      - network_stats
      - directory_info
      - printer_objects
      - job_queue
      - history
  staticConfigs:
    - targets:
        - "${CENTAURI_CARBON_IP}:80"
      labels:
        printer: centauri_carbon
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: klipper-exporter.observability.svc.cluster.local:9101

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    fullnameOverride: *app
    global:
      image:
        registry: quay.io

    victoria-metrics-operator:
      crds:
        cleanup:
          enabled: false
      operator:
        enable_converter_ownership: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi

    defaultDashboards:
      grafanaOperator:
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
          allowCrossNamespaceImport: true
      # No AIX/Darwin/Windows nodes here; these bundle dashboards stay empty.
      dashboards:
        nodes-aix:
          enabled: false
        nodes-darwin:
          enabled: false
        k8s-resources-windows-cluster:
          enabled: false
        k8s-resources-windows-namespace:
          enabled: false
        k8s-resources-windows-pod:
          enabled: false
        k8s-windows-cluster-rsrc-use:
          enabled: false
        k8s-windows-node-rsrc-use:
          enabled: false

    defaultDatasources:
      grafanaOperator:
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
          allowCrossNamespaceImport: true
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            access: proxy
            isDefault: false
            jsonData:
              httpMethod: POST
              queryTimeout: 60s
              timeInterval: 20s
              seriesLimit: 40000
      alertmanager:
        datasources:
          - name: VictoriaMetrics Alertmanager
            uid: vmalertmanager
            access: proxy
            jsonData:
              implementation: prometheus

    defaultRules:
      rules:
        etcdMemberCommunicationSlow:
          create: false
        # Fires on two empty-by-design k8s.rules.pod_owner recordings (namespace_workload_pod:kube_pod_owner:relabel); key is the exact alert name.
        RecordingRulesNoData:
          enabled: false

    grafana:
      enabled: false
      forceDeployDatasource: true

    prometheus-node-exporter:
      enabled: false
    kube-state-metrics:
      enabled: false

    kubelet:
      vmScrapes:
        # /metrics/resource duplicates the container CPU/memory series cAdvisor already provides
        resources:
          enabled: false
      vmScrape:
        spec:
          interval: 60s
          scrapeTimeout: 50s
          relabelConfigs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet
            - action: labeldrop
              regex: (beta_kubernetes_io_.*|extensions_talos_dev_.*|feature_node_kubernetes_io_.*|amd_com_.*|openebs_io_.*|kepler_node)

    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            # chart default endpoint restated (list is wholesale-replaced);
            # /metrics outgrew vmagent's 16MiB default cap, and the dropped
            # histograms are used by no alert rule (only *_sli_* buckets are)
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              max_scrape_size: 64MiB
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: (apiserver_request_duration_seconds|etcd_request_duration_seconds|apiserver_request_body_size_bytes)_bucket
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - scheme: http
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    alertmanager:
      useManagedConfig: true
      config:
        route:
          group_by: ["alertname", "job"]
          group_interval: 15m
          group_wait: 3m
          receiver: discord
          repeat_interval: 12h
          routes:
            - receiver: blackhole
              matchers:
                - alertname = InfoInhibitor
            - receiver: discord-satisfactory
              matchers:
                - app = satisfactory
        inhibit_rules:
          - equal: ["alertname", "namespace"]
            source_matchers:
              - severity = "critical"
            target_matchers:
              - severity = "warning"
        receivers:
          - name: blackhole
          - name: discord
            discord_configs:
              - &discord
                webhook_url_secret:
                  name: alertmanager-secret
                  key: DISCORD_WEBHOOK_URL
                username: Alertmanager
                title: |-
                  {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} {{ with .CommonLabels.alertname }}{{ . }}{{ else }}Alert group{{ end }}
                message: |-

                  📊 **Severity:** `{{ with .CommonLabels.severity }}{{ . | toUpper }}{{ else }}UNKNOWN{{ end }}`

                  🔔 **State:** `{{ len .Alerts.Firing }} firing` • `{{ len .Alerts.Resolved }} resolved`

                  {{ with .CommonAnnotations.description }}📝 **Description**

                  ```text
                  {{ printf "%.1800s" . }}{{ if gt (len .) 1800 }}…{{ end }}
                  ```{{ else }}{{ with .CommonAnnotations.summary }}📋 **Summary**

                  ```text
                  {{ printf "%.1800s" . }}{{ if gt (len .) 1800 }}…{{ end }}
                  ```{{ else }}{{ with .CommonAnnotations.message }}💬 **Message**

                  ```text
                  {{ printf "%.1800s" . }}{{ if gt (len .) 1800 }}…{{ end }}
                  ```{{ else }}No description was provided.{{ end }}{{ end }}{{ end }}

                  🎯 **Affected targets**

                  {{ range $i, $alert := .Alerts }}{{ if lt $i 5 }}• {{ with $alert.Labels.namespace }}`{{ . }}`/{{ end }}{{ if $alert.Labels.pod }}`{{ $alert.Labels.pod }}`{{ else if $alert.Labels.instance }}`{{ $alert.Labels.instance }}`{{ else if $alert.Labels.node }}`{{ $alert.Labels.node }}`{{ else if $alert.Labels.job }}`{{ $alert.Labels.job }}`{{ else if $alert.Labels.source_ip }}`{{ $alert.Labels.source_ip }}`{{ else if $alert.Labels.alertname }}`{{ $alert.Labels.alertname }}`{{ else }}`unknown target`{{ end }}
                  ↳ {{ if eq $alert.Status "resolved" }}resolved <t:{{ $alert.EndsAt.Unix }}:R>{{ else }}firing since <t:{{ $alert.StartsAt.Unix }}:R>{{ end }}
                  {{ with $alert.GeneratorURL }}↳ [source]({{ . }}){{ end }}
                  {{ with $alert.Labels.scenario }}↳ `{{ . }}`{{ end }}
                  {{ with $alert.Annotations.origin }}↳ {{ . }}{{ end }}
                  {{ with $alert.Annotations.request }}↳ `{{ printf "%.400s" . }}`{{ end }}

                  {{ end }}{{ end }}{{ if gt (len .Alerts) 5 }}…and more alerts in this group.
                  {{ end }}
          # Same embed; the content line pings the Satisfactory role (not inside the embed, where mentions do not notify).
          - name: discord-satisfactory
            discord_configs:
              - <<: *discord
                content: '{{ if eq .Status "firing" }}<@&1561355798846906469>{{ end }}'
      monzoTemplate:
        enabled: false
      route:
        enabled: true
        hostnames:
          - vmalertmanager.${SECRET_DOMAIN}
        parentRefs: &internalParentRefs
          - name: envoy-internal
            namespace: network
      spec:
        externalURL: https://vmalertmanager.${SECRET_DOMAIN}
        image:
          repository: quay.io/prometheus/alertmanager
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: &blockStorageClass ceph-block
              resources:
                requests:
                  storage: 1Gi

    vmalert:
      route:
        enabled: true
        hostnames:
          - vmalert.${SECRET_DOMAIN}
        parentRefs: *internalParentRefs
      spec:
        # Observed usage, not the request below; pipeline went fully Pending in the 07-23 outage.
        priorityClassName: homelab-critical # 149Mi
        datasource:
          url: &vmqueryUrl http://vmauth-victoria-metrics.observability.svc.cluster.local:8427
        extraArgs:
          "external.url": https://vmalert.${SECRET_DOMAIN}
          "rule.evalDelay": 1m
        remoteRead:
          url: *vmqueryUrl
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

    vmagent:
      spec:
        priorityClassName: homelab-critical # 512Mi, sole scrape path
        # vllm:cache_config_info carries 43 labels, past vmsingle's 40-label cap, so every
        # 30s scrape is rejected and logged: it fired RowsRejectedOnIngestion and TooManyLogs
        # while never being stored.
        inlineRelabelConfig:
          - action: drop
            sourceLabels: [__name__]
            regex: vllm:cache_config_info
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1Gi

    vmauth:
      enabled: true
      spec:
        priorityClassName: homelab-critical # 89Mi, Grafana's query path
        # 28Mi cgroup peak over 30d against the chart's 100Mi default. config-reloader keeps its
        # 25Mi default, which its 39Mi peak already exceeds.
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        extraArgs:
          requestBufferSize: "65536"
        managedMetadata:
          labels:
            operated-prometheus: "true"
            self-monitor: "true"
        unauthorizedUserAccessSpec:
          url_map:
            - src_paths:
                - /api/v1/query.*
                - /api/v1/labels.*
                - /api/v1/series.*
                - /api/v1/metadata.*
                - /api/v1/label/.*
              url_prefix: http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428
            - src_paths:
                - /select/logsql/.*
              url_prefix: http://victoria-logs.observability.svc.cluster.local:9428

    vmsingle:
      route:
        enabled: true
        hostnames: ["vmsingle.${SECRET_DOMAIN}"]
        parentRefs: *internalParentRefs
      spec:
        # TSDB the other three write to/query; scheduling them without this buys nothing.
        priorityClassName: homelab-critical
        # 180d: 365d retention couldn't fit the 200Gi PVC at current 140GB usage
        retentionPeriod: 180d
        resources:
          requests:
            cpu: 250m
            # Live pod p99 2.90Gi over 7d, max 3.10Gi; limit covers the 14d 4015Mi peak.
            memory: 3Gi
          limits:
            cpu: 2
            memory: 6Gi
        storage:
          resources:
            requests:
              storage: 200Gi
          storageClassName: *blockStorageClass

    extraRules:
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                # namespace=ai is excluded: AiContainerOOMKilled (toolhive/app prometheusrule)
                # covers it with the vmcp-aware runbook. Both firing meant two Discord
                # pages for one event (critical here, warning there).
                expr: (kube_pod_container_status_restarts_total{namespace!="ai"} - kube_pod_container_status_restarts_total{namespace!="ai"} offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{namespace!="ai",reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
              - alert: OomStorm
                annotations:
                  summary: Node {{ $labels.instance }} had {{ $value }} Kubernetes container OOM events in the last 10 minutes.
                expr: sum by (instance) (increase(container_oom_events_total{container!="",namespace!="",pod!=""}[10m])) > 5
                for: 5m
                labels:
                  severity: critical
      cronjob-rules:
        groups:
          - name: cronjob
            rules:
              # concurrencyPolicy Forbid: a long run blocks schedules, so only an idle CronJob counts as missed.
              - alert: CronJobNotScheduled
                annotations:
                  summary: CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} is {{ $value | humanizeDuration }} past its scheduled run with no Job running
                expr: |-
                  time() - max by (namespace, cronjob) (kube_cronjob_next_schedule_time) > 1800
                  and on (namespace, cronjob) max by (namespace, cronjob) (kube_cronjob_status_active) == 0
                  and on (namespace, cronjob) max by (namespace, cronjob) (kube_cronjob_spec_suspend) == 0
                for: 5m
                labels:
                  severity: warning
      node-hardware-rules:
        groups:
          - name: node-hardware
            rules:
              - alert: NVMeCriticalWarning
                annotations:
                  summary: NVMe {{ $labels.device }} on {{ $labels.nodename }} reports a critical warning
                  description: smartctl_device_critical_warning is nonzero on {{ $labels.device }} ({{ $labels.nodename }}) — confirmed precursor to an XFS forced-shutdown crash.
                expr: smartctl_device_critical_warning > 0
                for: 5m
                labels:
                  severity: critical
              - alert: NVMeWear
                annotations:
                  summary: NVMe {{ $labels.device }} on {{ $labels.nodename }} is at {{ $value }}% of rated endurance
                  description: smartctl_device_percentage_used crossed 80% — the drive is near end-of-life. Plan replacement before it fails.
                expr: smartctl_device_percentage_used > 80 and smartctl_device_percentage_used <= 90
                for: 10m
                labels:
                  severity: warning
              - alert: NVMeWearCritical
                annotations:
                  summary: NVMe {{ $labels.device }} on {{ $labels.nodename }} exceeded 90% of rated endurance
                  description: smartctl_device_percentage_used crossed 90% — treat as end-of-life and replace.
                expr: smartctl_device_percentage_used > 90
                for: 5m
                labels:
                  severity: critical
              - alert: NVMeSpareLow
                annotations:
                  summary: NVMe {{ $labels.device }} on {{ $labels.nodename }} spare area at {{ $value }}%
                  description: Available spare capacity dropped below its vendor threshold — the device has exhausted most of its over-provisioning.
                expr: smartctl_device_available_spare < smartctl_device_available_spare_threshold
                for: 10m
                labels:
                  severity: warning
              - alert: NVMEMediaErrors
                annotations:
                  summary: NVMe {{ $labels.device }} on {{ $labels.nodename }} reported {{ $value }} new media errors
                  description: Media error counter increased over the last hour — data integrity risk on that device.
                expr: increase(smartctl_device_media_errors[1h]) > 0
                for: 1m
                labels:
                  severity: warning
              - alert: NVMeHot
                annotations:
                  summary: NVMe {{ $labels.device }} on {{ $labels.nodename }} running hot ({{ $value }}C)
                  description: Sustained temperature above 70C — sustained heat accelerates wear and precedes thermal shutdowns (see control-3 7450 history).
                expr: avg_over_time(smartctl_device_temperature{device=~"nvme.*",temperature_type="current"}[10m]) > 70
                for: 15m
                labels:
                  severity: warning
              # Keyed by serial: TrueNAS reshuffles sdX letters on reboot, so a per-device delta false-fires.
              - alert: DiskReallocatedSectorsIncreased
                annotations:
                  summary: Disk {{ $labels.model_name }} {{ $labels.serial_number }} remapped {{ $value }} more sectors in 24h
                  description: SMART attribute 5 rose. One step with 197/198 still at 0 is a one-off media event; if it keeps climbing or 197/198 go nonzero, the drive is failing.
                expr: |-
                  max by (model_name, serial_number) (
                    smartctl_device_attribute{attribute_id="5",attribute_value_type="raw"}
                    * on (instance, device) group_left (model_name, serial_number)
                    max by (instance, device, model_name, serial_number) (smartctl_device)
                  )
                  - max by (model_name, serial_number) (
                    smartctl_device_attribute{attribute_id="5",attribute_value_type="raw"} offset 1d
                    * on (instance, device) group_left (model_name, serial_number)
                    max by (instance, device, model_name, serial_number) (smartctl_device offset 1d)
                  )
                  > 0
                for: 15m
                labels:
                  severity: warning
              - alert: NodeCPUPressureSustained
                annotations:
                  summary: Sustained CPU pressure on {{ $labels.nodename }}
                  description: CPU PSI wait on {{ $labels.nodename }} has been above 0.5s/s for 15 minutes ({{ $value }}s/s) — precedes cold-reload storms and runner starvation.
                expr: rate(node_pressure_cpu_waiting_seconds_total[5m]) > 0.5
                for: 15m
                labels:
                  severity: warning
              - alert: NodeMemoryPressureSustained
                annotations:
                  summary: Sustained memory pressure on {{ $labels.nodename }}
                  description: Memory PSI wait on {{ $labels.nodename }} has been above 0.3s/s for 15 minutes ({{ $value }}s/s).
                expr: rate(node_pressure_memory_waiting_seconds_total[5m]) > 0.3
                for: 15m
                labels:
                  severity: warning
              - alert: NodeVarFillingUp
                annotations:
                  summary: /var on {{ $labels.nodename }} is filling up
                  description: "/var on {{ $labels.nodename }} has less than 15% free space ({{ $value | humanizePercentage }})." # plain threshold; predict_linear false-fires on fresh series
                expr: node_filesystem_avail_bytes{mountpoint="/var"} / node_filesystem_size_bytes{mountpoint="/var"} < 0.15
                for: 30m
                labels:
                  severity: warning

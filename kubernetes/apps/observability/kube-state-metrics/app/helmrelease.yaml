---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
  interval: 1h
  values:
    fullnameOverride: kube-state-metrics
    metricLabelsAllowlist:
      - pods=[app.kubernetes.io/component]
    prometheus:
      monitor:
        enabled: true
        honorLabels: true
    # Chart ships no requests: BestEffort made this the kubelet's first kill under
    # control-3 pressure; 150Mi steady, 678Mi peak
    resources:
      requests:
        memory: 256Mi
    rbac:
      extraRules:
        - apiGroups:
            - source.toolkit.fluxcd.io
            - kustomize.toolkit.fluxcd.io
            - helm.toolkit.fluxcd.io
          resources:
            - gitrepositories
            - buckets
            - helmrepositories
            - ocirepositories
            - kustomizations
            - helmreleases
          verbs:
            - list
            - watch
        - apiGroups:
            - toolhive.stacklok.dev
          resources:
            - virtualmcpservers
          verbs:
            - list
            - watch
        - apiGroups:
            - inference.llmkube.dev
          resources:
            - inferenceservices
            - modelpools
          verbs:
            - list
            - watch
    customResourceState:
      enabled: true
      config:
        spec:
          # Anchored: each kind's block shows only what differs from the shared shape.
          resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Kustomization resource.
                  each: &eachName
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace: &namespacePath
                      - metadata
                      - namespace
                    ready: &readyPath
                      - status
                      - conditions
                      - "[type=Ready]"
                      - status
                    suspended: &suspendPath
                      - spec
                      - suspend
                    revision:
                      - status
                      - lastAppliedRevision
                    source_name:
                      - spec
                      - sourceRef
                      - name
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmRelease resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    suspended: *suspendPath
                    revision:
                      - status
                      - history
                      - "0"
                      - chartVersion
                    chart_name:
                      - status
                      - history
                      - "0"
                      - chartName
                    chart_app_version:
                      - status
                      - history
                      - "0"
                      - appVersion
                    chart_ref_name:
                      - spec
                      - chartRef
                      - name
                    chart_source_name:
                      - spec
                      - chart
                      - spec
                      - sourceRef
                      - name
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux GitRepository resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    suspended: *suspendPath
                    revision: &artifactRevision
                      - status
                      - artifact
                      - revision
                    url: &urlPath
                      - spec
                      - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: Bucket
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Bucket resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    suspended: *suspendPath
                    revision: *artifactRevision
                    endpoint:
                      - spec
                      - endpoint
                    bucket_name:
                      - spec
                      - bucketName
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmRepository
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmRepository resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    suspended: *suspendPath
                    revision: *artifactRevision
                    url: *urlPath
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: OCIRepository
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux OCIRepository resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    suspended: *suspendPath
                    revision: *artifactRevision
                    url: *urlPath
            # vmcp readiness lives only in the CR: the gateway keeps serving on a
            # dead backend, so nothing else in the cluster reports it
            - groupVersionKind:
                group: toolhive.stacklok.dev
                version: v1beta1
                kind: VirtualMCPServer
              metricNamePrefix: toolhive
              metrics:
                - name: resource_info
                  help: The current state of a Toolhive VirtualMCPServer resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    phase:
                      - status
                      - phase
            # llmkube core CRDs: InferenceService and ModelPool status fields
            # exposed as Prometheus gauges so dashboards and alerts can query
            # readiness, phase, and replica counts without a custom exporter.
            - groupVersionKind:
                group: inference.llmkube.dev
                version: v1alpha1
                kind: InferenceService
              metricNamePrefix: llmkube_inferenceservice
              metrics:
                - name: resource_info
                  help: The current state of an llmkube InferenceService resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    phase:
                      - status
                      - phase
                    mode:
                      - status
                      - mode
                    runtime:
                      - spec
                      - runtime
                    model_ref:
                      - spec
                      - modelRef
                    scheduling_status:
                      - status
                      - schedulingStatus
                - name: ready_replicas
                  help: Number of ready InferenceService pods.
                  each:
                    type: Gauge
                    gauge:
                      path:
                        - status
                        - readyReplicas
                - name: desired_replicas
                  help: Desired number of InferenceService pods.
                  each:
                    type: Gauge
                    gauge:
                      path:
                        - status
                        - desiredReplicas
                - name: replicas
                  help: Current number of running InferenceService pods.
                  each:
                    type: Gauge
                    gauge:
                      path:
                        - status
                        - replicas
                - name: model_ready
                  help: Whether the referenced Model is in Ready state.
                  each:
                    type: Gauge
                    gauge:
                      path:
                        - status
                        - modelReady
                - name: queue_position
                  help: Position among pending InferenceServices cluster-wide.
                  each:
                    type: Gauge
                    gauge:
                      path:
                        - status
                        - queuePosition
            - groupVersionKind:
                group: inference.llmkube.dev
                version: v1alpha1
                kind: ModelPool
              metricNamePrefix: llmkube_modelpool
              metrics:
                - name: resource_info
                  help: The current state of an llmkube ModelPool resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    phase:
                      - status
                      - phase
                    resident_member:
                      - status
                      - residentMember
                    pending_member:
                      - status
                      - pendingMember

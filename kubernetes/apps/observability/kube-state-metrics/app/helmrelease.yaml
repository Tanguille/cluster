---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
  interval: 1h
  values:
    fullnameOverride: kube-state-metrics
    metricLabelsAllowlist:
      - pods=[app.kubernetes.io/component]
    prometheus:
      monitor:
        enabled: true
        honorLabels: true
    # Chart ships no requests: BestEffort made this the kubelet's first kill under
    # control-3 pressure; 150Mi steady, 678Mi peak
    resources:
      requests:
        memory: 256Mi
    rbac:
      extraRules:
        - apiGroups:
            - source.toolkit.fluxcd.io
            - kustomize.toolkit.fluxcd.io
            - helm.toolkit.fluxcd.io
          resources:
            - gitrepositories
            - buckets
            - helmrepositories
            - ocirepositories
            - kustomizations
            - helmreleases
          verbs:
            - list
            - watch
        - apiGroups:
            - toolhive.stacklok.dev
          resources:
            - virtualmcpservers
          verbs:
            - list
            - watch
    customResourceState:
      enabled: true
      config:
        spec:
          # Anchored: each kind's block shows only what differs from the shared shape.
          resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Kustomization resource.
                  each: &eachName
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace: &namespacePath
                      - metadata
                      - namespace
                    ready: &readyPath
                      - status
                      - conditions
                      - "[type=Ready]"
                      - status
                    suspended: &suspendPath
                      - spec
                      - suspend
                    revision:
                      - status
                      - lastAppliedRevision
                    source_name:
                      - spec
                      - sourceRef
                      - name
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmRelease resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    suspended: *suspendPath
                    revision:
                      - status
                      - history
                      - "0"
                      - chartVersion
                    chart_name:
                      - status
                      - history
                      - "0"
                      - chartName
                    chart_app_version:
                      - status
                      - history
                      - "0"
                      - appVersion
                    chart_ref_name:
                      - spec
                      - chartRef
                      - name
                    chart_source_name:
                      - spec
                      - chart
                      - spec
                      - sourceRef
                      - name
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux GitRepository resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    suspended: *suspendPath
                    revision: &artifactRevision
                      - status
                      - artifact
                      - revision
                    url: &urlPath
                      - spec
                      - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: Bucket
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Bucket resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    suspended: *suspendPath
                    revision: *artifactRevision
                    endpoint:
                      - spec
                      - endpoint
                    bucket_name:
                      - spec
                      - bucketName
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmRepository
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmRepository resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    suspended: *suspendPath
                    revision: *artifactRevision
                    url: *urlPath
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: OCIRepository
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux OCIRepository resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    suspended: *suspendPath
                    revision: *artifactRevision
                    url: *urlPath
            # vmcp readiness lives only in the CR: the gateway keeps serving on a
            # dead backend, so nothing else in the cluster reports it
            - groupVersionKind:
                group: toolhive.stacklok.dev
                version: v1beta1
                kind: VirtualMCPServer
              metricNamePrefix: toolhive
              metrics:
                - name: resource_info
                  help: The current state of a Toolhive VirtualMCPServer resource.
                  each: *eachName
                  labelsFromPath:
                    exported_namespace: *namespacePath
                    ready: *readyPath
                    phase:
                      - status
                      - phase

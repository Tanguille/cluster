---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      layerSelector:
        mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
        operation: copy
      ref:
        tag: 0.5.5
      url: oci://ghcr.io/home-operations/charts/gatus-sidecar
  interval: 1h
  values:
    fullnameOverride: gatus

    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    gatus:
      env:
        TZ: ${TIMEZONE}
      envFrom:
        - secretRef:
            name: "{{ .Release.Name }}-secret"
      livenessProbe:
        initialDelaySeconds: 0
        periodSeconds: 10
      readinessProbe:
        initialDelaySeconds: 0
      securityContext:
        capabilities: { add: ["NET_RAW"] }

    # pod-level: the chart ignores gatus.resources and sidecar.resources; peak working set ~73MB across both
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

    sidecar:
      gatewayNames:
        # envoy-external serves public traffic; the isolated probe only covers the
        # tunnel and its own gateway.
        - envoy-external
        - envoy-internal
        - envoy-internal-tls
      kinds:
        httproute:
          enable: true
        service:
          enable: false

    config:
      existingConfigMap: gatus-configmap
      items:
        - key: config.yaml
          path: config.yaml

    monitoring:
      serviceMonitor:
        enabled: true

    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: "false"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Gatus
        gethomepage.dev/description: Endpoint status monitoring
        gethomepage.dev/group: Status
        gethomepage.dev/icon: gatus.png
        gethomepage.dev/pod-selector: app.kubernetes.io/instance=gatus
        gethomepage.dev/widget.type: gatus
        gethomepage.dev/widget.url: http://gatus.observability.svc.cluster.local:8080
      hostnames:
        - "status.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-internal
          namespace: network

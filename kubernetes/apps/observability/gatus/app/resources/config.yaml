---
web:
  port: $${GATUS_WEB_PORT}
storage:
  type: postgres
  path: postgres://$${INIT_POSTGRES_USER}:$${INIT_POSTGRES_PASS}@$${INIT_POSTGRES_HOST}:5432/$${INIT_POSTGRES_DBNAME}?sslmode=disable
  caching: true
metrics: true
ui:
  title: Status | Gatus
  header: Status
  link: https://github.com/tanguille/cluster
  buttons:
    - name: Github
      link: https://github.com/tanguille

alerting:
  discord:
    webhook-url: $${DISCORD_WEBHOOK_URL}
    # Merged into each endpoint's discord alert where the field is unset
    default-alert:
      send-on-resolved: true
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  - name: Gatus external probe
    group: external
    url: https://gatus-probe.${SECRET_DOMAIN}/health
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord

  # MCP initialize probe: /health and VirtualMCPServer Ready stay green while POST /mcp is unusable (optimizer embedding path exceeds the write deadline).
  # The optimizer re-embeds every tool per new session: the 30s threshold only catches regression toward the old 32s+ hang, and the 15m interval keeps TEI from re-embedding on every probe.
  - name: vmcp-unified
    group: ai
    url: http://vmcp-unified.ai.svc.cluster.local:4483/mcp
    method: POST
    headers:
      Content-Type: application/json
      Accept: application/json, text/event-stream
    body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"gatus","version":"0"}}}'
    interval: 15m
    client:
      timeout: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 30000"
    alerts:
      - type: discord

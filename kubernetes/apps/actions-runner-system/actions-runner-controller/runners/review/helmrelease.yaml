---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app review-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/tanguille/cluster
    githubConfigSecret: cluster-runner-secret
    # Serves agent-pr-review. Ceiling 3 + cluster-runner's 2 keeps the cluster at 5 concurrent
    # runners, matching the pre-split ceiling (10 OOM-cascaded the apiserver).
    minRunners: 1
    maxRunners: 3
    # No containerMode: no workflow declares `container:`, so the k8s hooks never fire and _work
    # falls back to emptyDir instead of a 25Gi PVC per pod. Also makes the chart create its own
    # zero-permission ServiceAccount, so no talos.dev ServiceAccount exists for this scale set.
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
            command: ["/home/runner/run.sh"]
            # Matches cluster-runner: peak observed usage ~0.32Gi.
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi
        # This runner holds no credentials, so it has no use for an API token either.
        automountServiceAccountToken: false
        # Same rationale as cluster-runner.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: *app

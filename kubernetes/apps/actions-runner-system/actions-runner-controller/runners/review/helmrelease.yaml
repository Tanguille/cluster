---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app review-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/tanguille/cluster
    githubConfigSecret: cluster-runner-secret
    # No workflow targets this scale set until the follow-up PR switches agent-pr-review over,
    # so idle at 0 until then. Ceiling is 3, not 5: combined with cluster-runner that caps the
    # cluster at 5 concurrent runners, matching today's ceiling (10 OOM-cascaded the apiserver).
    minRunners: 0
    maxRunners: 3
    # No containerMode: REQUIRE_JOB_CONTAINER is false and no workflow declares `container:`,
    # so the k8s hooks never fire. _work falls back to emptyDir instead of a 25Gi PVC per pod.
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.336.0@sha256:281a9a090522fafbf4967f158b8c97d03552b1978b688893c5f7cb1944bc5fe5
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            # Matches cluster-runner: peak observed usage ~0.32Gi.
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi
        serviceAccountName: *app
        # Same rationale as cluster-runner: best-effort spread, ScheduleAnyway so CI still runs
        # when a node is down.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: *app

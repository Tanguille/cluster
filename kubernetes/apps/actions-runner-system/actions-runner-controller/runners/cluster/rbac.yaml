---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-runner
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/talos.dev/serviceaccount_v1alpha1.json
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: cluster-runner
spec:
  # Only use is 'talosctl image pull'; ImagePull needs more than os:reader, and the
  # kubernetesTalosAPIAccess allowlist (talos/controlplane.yaml.j2) permits only os:admin/os:reader.
  roles: ["os:admin"]

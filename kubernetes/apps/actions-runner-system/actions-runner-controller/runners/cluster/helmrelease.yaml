---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cluster-runner
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.15.1
      url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/tanguille/cluster
    githubConfigSecret: cluster-runner-secret
    minRunners: 1
    maxRunners: 10
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.338.1@sha256:9011bec82009308072bb8677229181791f96bada721df8a91108290ad4a3fdc5
            command: ["/home/runner/run.sh"]
            env:
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            # Without requests the scheduler packed runners onto one memory-tight node and starved kubelet; peak usage is ~0.32Gi.
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi
            volumeMounts:
              - mountPath: /var/run/secrets/talos.dev
                name: talos
                readOnly: true
              - mountPath: /tool-cache
                name: tool-cache
        # runner is uid/gid 1001; without fsGroup the CephFS mount lands root-owned
        securityContext:
          fsGroup: 1001
        # Best-effort spread so one node blip can't kill a whole batch.
        # ScheduleAnyway (not DoNotSchedule) so CI still runs when a node is down.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: *app
        volumes:
          - name: talos
            secret:
              secretName: *app
          - name: tool-cache
            persistentVolumeClaim:
              claimName: runner-tool-cache

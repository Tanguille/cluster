---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cluster-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/tanguille/cluster
    githubConfigSecret: cluster-runner-secret
    # Talos os:admin is mounted here, so only flate's image-pull job runs on this scale set.
    # Idle at 0: flate fires only on kubernetes/** changes and tolerates a cold start.
    minRunners: 0
    maxRunners: 2
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes: ["ReadWriteOnce"]
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 25Gi
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            # Runners had no requests, so the scheduler packed all 3 onto one memory-tight node;
            # each batch of concurrent reviews then starved kubelet (MemAvailable 1.2Gi → 0.22Gi,
            # 2026-07-02 batch-kills). Peak observed usage is ~0.32Gi; limits stop any runaway from
            # taking the node down again.
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi
            volumeMounts:
              - mountPath: /var/run/secrets/talos.dev
                name: talos
                readOnly: true
              - mountPath: /tool-cache
                name: tool-cache
        serviceAccountName: *app
        # runner is uid/gid 1001; without fsGroup the CephFS mount lands root-owned
        securityContext:
          fsGroup: 1001
        # Best-effort spread so one node blip can't kill a whole review batch (3× on 2026-07-02).
        # ScheduleAnyway (not DoNotSchedule) so CI still runs when a node is down.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: *app
        volumes:
          - name: talos
            secret:
              secretName: *app
          - name: tool-cache
            persistentVolumeClaim:
              claimName: runner-tool-cache

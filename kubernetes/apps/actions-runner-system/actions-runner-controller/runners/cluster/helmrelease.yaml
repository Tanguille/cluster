---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cluster-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/tanguille/cluster
    githubConfigSecret: cluster-runner-secret
    # Talos os:admin is mounted here, so only flate's image-pull job runs on this scale set.
    # Idle at 0: flate fires only on kubernetes/** changes and tolerates a cold start.
    minRunners: 0
    maxRunners: 2
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.338.0@sha256:c867ecdf82d4e8537ea8a41acc6addae09f069daec137e5614b87e4678a953e8
            command: ["/home/runner/run.sh"]
            env:
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            # Without requests the scheduler packed all 3 runners onto one memory-tight node and batches starved kubelet; peak usage is ~0.32Gi.
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi
            volumeMounts:
              - mountPath: /var/run/secrets/talos.dev
                name: talos
                readOnly: true
              - mountPath: /tool-cache
                name: tool-cache
        # runner is uid/gid 1001; without fsGroup the CephFS mount lands root-owned
        securityContext:
          fsGroup: 1001
        # Best-effort spread so one node blip can't kill a whole batch.
        # ScheduleAnyway (not DoNotSchedule) so CI still runs when a node is down.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: *app
        volumes:
          - name: talos
            secret:
              secretName: *app
          - name: tool-cache
            persistentVolumeClaim:
              claimName: runner-tool-cache

---
# RWX talosctl cache shared by all runner pods; .github/workflows/flate.yaml verifies and prunes it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-tool-cache
spec:
  storageClassName: ceph-filesystem
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 2Gi

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-controller
  namespace: &namespace actions-runner-system
spec:
  interval: 1h
  path: ./kubernetes/apps/actions-runner-system/actions-runner-controller/app
  prune: true
  targetNamespace: *namespace
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-controller-runners
  namespace: &namespace actions-runner-system
spec:
  dependsOn:
    - name: actions-runner-controller
  interval: 1h
  path: ./kubernetes/apps/actions-runner-system/actions-runner-controller/runners/cluster
  prune: true
  targetNamespace: *namespace
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-controller-rsume-runners
  namespace: &namespace actions-runner-system
spec:
  dependsOn:
    # Creates cluster-runner-secret, which rsume-runner borrows.
    - name: actions-runner-controller-runners
  interval: 1h
  path: ./kubernetes/apps/actions-runner-system/actions-runner-controller/runners/rsume
  prune: true
  targetNamespace: *namespace

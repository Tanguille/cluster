---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kritika-ingress-allowlist
  namespace: kritika
specs:
  - endpointSelector: {}
    enableDefaultDeny:
      ingress: true
      egress: true
    ingress:
      # Rev-NAT'd DNS replies target ephemeral client ports.
      - fromEndpoints:
          - matchLabels: &dns
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: kritika
        app.kubernetes.io/instance: kritika
        app.kubernetes.io/component: server
    ingress:
      - fromEntities: [host] # Only the server has kubelet probes; runners stay closed.
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: network
            matchExpressions:
              - key: gateway.networking.k8s.io/gateway-name
                operator: In
                values: [envoy-internal, envoy-external]
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: observability
              app.kubernetes.io/name: vmagent
        toPorts:
          - ports:
              - port: "8081"
                protocol: TCP
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kritika
              kritika.home-operations.com/role: runner
        toPorts:
          - ports:
              - port: "8082"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels: *dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      - toEntities: [kube-apiserver]
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
              - port: "6443"
                protocol: TCP
      # The server mediates runners' GitHub, source, package and model requests.
      - toEntities: [world]
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: ai
              app.kubernetes.io/name: agentgateway
        toPorts:
          - ports:
              - port: "4000"
                protocol: TCP
      # PgBouncer rejects this release's startup parameters, so kritika connects to postgres16-rw directly.
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: database
              cnpg.io/cluster: postgres16
              cnpg.io/podRole: instance
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Keep runner L7 validation separate: rejecting it must not remove the server allowlist.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kritika-runner-allowlist
  namespace: kritika
spec:
  endpointSelector:
    matchLabels:
      kritika.home-operations.com/role: runner
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # Preserve the chart's service-only DNS rule; no unrestricted DNS union.
          rules:
            dns:
              - matchPattern: "*.*.svc.cluster.local"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres16
            cnpg.io/podRole: instance
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/instance: kritika
            app.kubernetes.io/component: server
            io.kubernetes.pod.namespace: kritika
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
# Retain the chart's fail-closed fallback if Cilium rejects the L7 DNS policy.
# No DNS here: an unconfined runner must never replace a failed review.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kritika-runner-fallback
  namespace: kritika
spec:
  podSelector:
    matchLabels:
      kritika.home-operations.com/role: runner
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres16
              cnpg.io/podRole: instance
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kritika
              app.kubernetes.io/instance: kritika
              app.kubernetes.io/component: server
      ports:
        - port: 8082
          protocol: TCP

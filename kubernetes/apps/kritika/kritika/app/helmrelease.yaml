---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 30m
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    # Postgres client grant for database-ingress-allowlist's label gate (runners: runner.podTemplate).
    podLabels:
      egress.home.arpa/postgres: allow
    # Direct to postgres16-rw: kritika sets startup params pgbouncer rejects.
    database:
      owner:
        existingSecret: &secret kritika-secret
        key: owner-uri
      app:
        existingSecret: *secret
        key: app-uri
        role: kritik_app
      runner:
        existingSecret: *secret
        key: runner-uri
        role: kritik_runner
    # Runner Jobs parse untrusted PR content and run model-directed code.
    # Keys live under podTemplate.spec; top-level runtimeClassName and resources are ignored silently and runner pods lose gVisor.
    runner:
      podTemplate:
        metadata:
          labels:
            egress.home.arpa/postgres: allow
        spec:
          runtimeClassName: gvisor
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              # Full reviews of #5879 were OOMKilled at 1Gi.
              memory: 2Gi
    # Aqua tool downloads cached on a per-pod emptyDir; S3 would survive rollouts but adds a storage dependency for one replica.
    gatewayCache:
      enabled: true
    # Internal only: public dashboard with local admin is too exposed.
    httpRoute:
      enabled: true
      hostnames: ["kritika.${SECRET_DOMAIN}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
    # Server egress; runners use the chart's separate policy.
    networkPolicy:
      # 4000 for the LLM gateway (agentgateway's http listener):
      # Cilium matches the pod port after service DNAT.
      egressPorts:
        - 443
        - 4000
      # Instance pods only, not poolers: runners connect to the primary directly.
      postgres:
        namespace: database
        podSelector:
          cnpg.io/cluster: postgres16
          cnpg.io/podRole: instance
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          folder: ai
          matchLabels:
            grafana.internal/instance: grafana
    env:
      LLM_API_KEY:
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: LLM_API_KEY
      GITHUB_APP_PRIVATE_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: github-private-key
      GITHUB_APP_WEBHOOK_SECRET:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: github-webhook-secret
      ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: admin-password
    config:
      # PRs reviewed at once; 6 drained the free omniroute tiers (Logfare 20/min, 3 concurrent) in bursts.
      reviewWorkers: 4
      limits:
        # Model calls in flight, split-review parts included; matches reviewWorkers so bursts stay off the free tiers.
        concurrency: 4
      # Review-comment badges embed this, so it is the public webhook host; sign-in callbacks derive from it too, so auth.signIns would need /auth/ routed there.
      webUrl: "https://kritika-webhook.${SECRET_DOMAIN}"
      # Index TTL; 1h (default 720h) re-onboards a re-enabled repo fast.
      indexGrace: 1h
      apps:
        github:
          accounts: [tanguille]
          clientId: Iv23liEpcPGN5z8KRBta
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        llm:
          type: openai
          baseUrl: "http://agentgateway.ai.svc.cluster.local:4000/v1"
          apiKey: { env: LLM_API_KEY }
      review:
        model: llm/omniroute
        # agentgateway retries qwen-3.8 only for bodies <=64 KiB, reviews are ~490 KB; drop once agentgateway#4140 ships.
        fallback: llm/qwen-3.8
        # Every finding carries a suggested fix; repositories cannot lift it.
        fixes: true
        # A clean review approves the head; a later finding withdraws it.
        approve: true
      # Keep default step/token limits: 1M tokens stopped a 98-file PR with 42 files unread.
      agent:
        parts: 16
        # 60 default steps at omniroute's ~80s p95 per call need over an hour; 45m canceled 98- and 28-file reviews.
        timeout: 90m
      rules:
        - id: verify-effective-behavior
          rule: >-
            Verify suspected regressions against the reviewed head, callers
            and pinned dependency defaults; for Helm, inspect templates or
            rendered output. Cite evidence of changed behavior, not just a
            removed explicit value. Put unverified concerns in the summary as
            checks, and report concrete defects even when tests pass.
        - id: renovate
          when:
            - expr: pr.headRef.startsWith("renovate/")
          rule: >-
            This is a Renovate dependency update. Read what changed from the
            release notes in the PR body, or from upstream's release notes or
            compare view with gh (one call per release, never the releases
            list). Then search this repository for uses of the package,
            including the comments in those files, and report each breaking
            change, deprecation, rename or changed default that affects it,
            and any version it must stay in lockstep with. Start with a
            verdict, safe to merge or not, and name the sources you read.
        - id: radiance-bump
          when:
            - expr: pr.headRef.startsWith("renovate/radiance")
          rule: >-
            radiance engine bump for the gfx1201 Qwen3.8 stack (W4A16 AWQ .rad,
            fp8_v4 KV, host prefix tier): config
            kubernetes/apps/ai/llmkube/models/qwen38-27b-vllm.yaml, whose Job
            reconverts the .rad on every image change. The body has digests
            only, so read the commits and tags between the previous and new
            version at codeberg.org/StillDeadcode/radiance (its API with curl;
            gh does not reach Codeberg), one path per call. Check every flag in
            extraArgs against renamed, removed or re-defaulted options (a gone
            flag fails the boot), the .rad container or recipe format
            (q38-27b-w4a16.recipe), prefix cache, checkpoint policy and KV
            dtype changes, and the vllm:* and radiance:* metrics read by
            kubernetes/apps/ai/llmkube/models/prometheusrule.yaml. Start with a verdict: nothing
            relevant, needs a clone test, or needs a config change. Then list
            each relevant commit as sha, title, why it matters here, and what
            to measure (boot KV cache token count, gsm8k, tools and stream
            gates, prodshape). Never call it safe to roll untested.
      # Offer specialist skills on demand; path scopes otherwise inject their full text on every match.
      skills:
        scope:
          k8s-at-home-research:
            paths: ["kubernetes/**", "talos/**"]
            load: false
          debug-cluster:
            paths: ["kubernetes/**", "talos/**"]
            load: false
          add-app-to-cluster:
            paths: ["kubernetes/apps/**"]
            load: false
          prometheus-cluster-health:
            load: false
            paths:
              [
                "**/prometheusrule.yaml",
                "**/servicemonitor.yaml",
                "**/grafana*"
              ]
          backup-restore:
            paths: ["**/backup*", "**/restore*", "**/kopia*"]
            load: false
      # Benchmark output the default globs miss.
      ignore:
        - "**/*.out"
      embedding:
        model: llm/embeddinggemma-2
        dims: 768
        # 200000-char default batches of long chunks ran past the 1 min embed timeout on the iGPU.
        maxBatchChars: 50000
        # With these prompts a hunk's best match scores 0.82-0.88, an off-topic hunk's 0.78-0.81; 0.7 kept both. Retune after any prompt change.
        similarFloor: 0.82
        # One prompt for both sides, as the model card has it. A change rebuilds the index: recheck similarFloor.
        queryPrompt: &embeddingPrompt "task: sentence similarity | query: "
        documentPrompt: *embeddingPrompt
      # Read-only public hosts runners were refused ("egress refused" in VictoriaLogs).
      # github.com and api.github.com are implicit; cafe.github.com (gh telemetry) stays refused.
      egress:
        allow:
          # GitHub source archives, registry and release assets (redirects/fallbacks).
          - raw.githubusercontent.com
          - release-assets.githubusercontent.com
          - objects.githubusercontent.com
          - pkg-containers.githubusercontent.com
          - codeload.github.com
          # GHCR registry endpoint (blobs use pkg-containers above).
          - ghcr.io
          # Docker registry/auth and blob CDN hosts.
          - "*.docker.io"
          - "*.docker.com"
          # Agentgateway OCI chart registry.
          - cr.agentgateway.dev
          # Other registries this repo pulls from, plus the CDN hosts their blobs redirect to.
          - quay.io
          - "*.quay.io"
          - registry.k8s.io
          - cdn.registry.k8s.io
          - "*.pkg.dev"
          - gcr.io
          - mirror.gcr.io
          - gsoci.azurecr.io
          - registry.erwanleboucher.dev
          # Rust package index and downloads.
          - crates.io
          - static.crates.io
          # Historical review documentation and source hosts.
          - codeberg.org
          - grafana.com
          - huggingface.co
          - cloudnative-pg.io
          - nginx.org
          - rook.github.io
          - "*.kernel.org"
          - rocm.github.io
          - doc.rust-lang.org
          - pypi.org
          # SQLite documentation, shadcn docs/assets, and Flathub metadata.
          - www.sqlite.org
          - shadcn-svelte.com
          - "*.shadcn-svelte.com"
          - api.flathub.com
      # Local admin until GitHub or OIDC is set up.
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD

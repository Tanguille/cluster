---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 30m
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    # All DSNs hit postgres16-rw directly: kritika LISTENs and sets startup params, which pgbouncer rejects.
    database:
      owner:
        existingSecret: &secret kritika-secret
        key: owner-uri
      app:
        existingSecret: *secret
        key: app-uri
        role: kritik_app
      runner:
        existingSecret: *secret
        key: runner-uri
        role: kritik_runner
    config:
      webUrl: "https://kritika.${SECRET_DOMAIN}"
      # Drop a turned-off repo's index after 1h instead of 720h; re-enabling onboards a fresh one.
      indexGrace: 1h
    # Internal only: public dashboard plus local admin and unsandboxed runners is too exposed.
    # GitHub webhooks can't reach it, so events arrive via polling.
    httpRoute:
      enabled: true
      hostnames: ["kritika.${SECRET_DOMAIN}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
    # Server egress; runners use the chart's separate DNS/Postgres/gateway policy.
    networkPolicy:
      enabled: true
      # Cilium matches the pod port after service DNAT, so litellm needs 4000, not 80.
      egressPorts:
        - 443
        - 4000
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          folder: ai
          matchLabels:
            grafana.internal/instance: grafana
    env:
      LITELLM_API_KEY:
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: LITELLM_API_KEY
      GITHUB_APP_PRIVATE_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: github-private-key
      GITHUB_APP_WEBHOOK_SECRET:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: github-webhook-secret
      ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: admin-password
    configFile:
      apps:
        github:
          accounts: [tanguille]
          clientId: Iv23liEpcPGN5z8KRBta
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        litellm:
          type: openai
          baseUrl: "http://litellm.ai.svc.cluster.local/v1"
          apiKey: { env: LITELLM_API_KEY }
      defaults:
        # Mirrors CI agent-review: omniroute primary, qwen-3.8 fallback.
        models:
          review: litellm/omniroute
          fallback: litellm/qwen-3.8
        # Every finding carries a suggested fix; repositories cannot lift it.
        requireSuggestedFix: true
        # A review with nothing blocking or important approves the head; a later one that finds something withdraws it.
        approve: true
        # gh's run-scoped token is read-only, and rg, fd, jq and yq only read the checkout; no curl, so PR text can't steer raw requests.
        agent:
          commands: [gh, rg, fd, jq, yq]
          # Each step resends the whole history, so a review that keeps reading grows to ~200K tokens and
          # hits the timeout. maxSteps is the limit that should bind (it forces a submit); maxTokens
          # is only a backstop, since one late step can jump past its 90% forced-submit line.
          maxSteps: 20
          maxToolOutputBytes: 12288
          maxTokens: 1000000
          # A step that writes ~10K tokens at ~25 tok/s takes ~6 minutes, so 20m cut off reviews that were still progressing.
          timeout: 30m
        # Adapted from onedr0p/home-ops' kritika entry.
        rules:
          - id: renovate
            whenExpr: pr.headRef.startsWith("renovate/")
            rule: >-
              This is a Renovate dependency update. Read what changed from the release notes in the PR body, or from upstream's release notes or compare view with gh (one call per release, never the releases list). Then use rg to see how this repository uses the package, including the comments in those files, and report each breaking change, deprecation, rename or changed default that affects it, and any version it must stay in lockstep with. Start with a verdict, safe to merge or not, and name the sources you read.
      embedding:
        model: litellm/qwen3-embedding
        dims: 1024
        # Nearly every chunk of this mostly-YAML repo scores above the 0.5 default; weak matches sit below ~0.7.
        similarFloor: 0.7
      # Local admin is the way into a fresh instance; drop it once GitHub or OIDC is set up.
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD

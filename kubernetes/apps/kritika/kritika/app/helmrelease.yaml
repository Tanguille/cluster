---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  interval: 30m
  chart:
    spec:
      chart: ./charts/kritika
      # The pin is a commit, not a chart version, so a new commit must move the artifact.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: kritika
  values:
    # repository+tag@digest so Renovate tracks it; the chart renders repository:tag when digest is unset.
    image:
      repository: ghcr.io/home-operations/kritika
      tag: main@sha256:d3cfcaf4173f11f5f4e2221fd1a03eed8ce853255fc43bf45036819b57b50af6
    runner:
      # -tools adds curl, fd, gh, jq, rg and yq for agent.commands.
      image: ghcr.io/home-operations/kritika:main-tools@sha256:2a0663afc0dd627db58633decc821c581956ab0ad2f3ab2d9834f724aa365984
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    web:
      url: "https://kritika.${SECRET_DOMAIN}"
    # All DSNs hit postgres16-rw directly: kritika LISTENs and sets startup params, which pgbouncer rejects.
    database:
      owner:
        existingSecret: &secret kritika-secret
        uriKey: owner-uri
      app:
        existingSecret: *secret
        uriKey: app-uri
        role: kritik_app
      runner:
        existingSecret: *secret
        uriKey: runner-uri
        role: kritik_runner
    config:
      apps:
        github:
          accounts: [tanguille]
          clientId: Iv23liEpcPGN5z8KRBta
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        litellm:
          type: openai
          baseUrl: "http://litellm.ai.svc.cluster.local/v1"
          apiKey: { env: LITELLM_API_KEY }
      defaults:
        # Mirrors CI agent-review: omniroute primary, qwen-3.8 fallback.
        models:
          review: litellm/omniroute
          fallback: litellm/qwen-3.8
        # Every finding carries a suggested fix; repositories cannot lift it.
        requireSuggestedFix: true
        # A review with nothing blocking or important approves the head; a later one that finds something withdraws it.
        approve: true
        # gh's run-scoped token is read-only, and rg, fd, jq and yq only read the checkout; no curl, so PR text can't steer raw requests.
        agent:
          commands: [gh, rg, fd, jq, yq]
        # Adapted from onedr0p/home-ops' kritika entry.
        rules:
          - id: renovate
            whenExpr: pr.headRef.startsWith("renovate/")
            rule: >-
              This is a Renovate dependency update. Find what changed between the old and new versions from upstream's release notes, changelog or compare view. Use the notes Renovate embedded under "Release Notes" in the body when present; otherwise fetch them with gh (gh api repos/OWNER/REPO/releases/tags/TAG, one call per release, never the releases list). Then check how this repository uses the package, with rg over its manifests, values, overrides, CRDs and the comments in those files, and report each breaking change, deprecation, removed or renamed value, or changed default that affects it, and any version it must stay in lockstep with. Start the summary with a verdict, safe to merge or not, and name the sources you read.
      embedding:
        model: litellm/qwen3-embedding
        dims: 1024
        # Nearly every chunk of this mostly-YAML repo scores above the 0.5 default; weak matches sit below ~0.7.
        similarFloor: 0.7
      # Local admin is the way into a fresh instance; drop it once GitHub or OIDC is set up.
      auth:
        admin:
          user: admin
          password:
            env: ADMIN_PASSWORD
    # Internal only: public dashboard plus local admin and unsandboxed runners is too exposed.
    # GitHub webhooks can't reach it, so events arrive via polling.
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
    # Server egress; runners use the chart's separate DNS/Postgres/gateway policy.
    networkPolicy:
      enabled: true
      # Cilium matches the pod port after service DNAT, so litellm needs 4000, not 80.
      egressPorts:
        - 443
        - 4000
    monitoring:
      serviceMonitor:
        enabled: true
    env:
      LITELLM_API_KEY:
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: LITELLM_API_KEY
      GITHUB_APP_PRIVATE_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: github-private-key
      GITHUB_APP_WEBHOOK_SECRET:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: github-webhook-secret
      ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: admin-password
      # Drop a turned-off repo's index after 1h instead of 720h; re-enabling onboards a fresh one.
      KRITIKA_INDEX_GRACE: 1h

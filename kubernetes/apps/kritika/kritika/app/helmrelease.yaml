---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 30m
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    # database-ingress-allowlist only admits 5432 from pods with this label (runners: runner.podTemplate).
    podLabels:
      egress.home.arpa/postgres: allow
    # Direct to postgres16-rw: kritika sets startup params pgbouncer rejects.
    database:
      owner:
        existingSecret: &secret kritika-secret
        key: owner-uri
      app:
        existingSecret: *secret
        key: app-uri
        role: kritik_app
      runner:
        existingSecret: *secret
        key: runner-uri
        role: kritik_runner
    # Runner Jobs parse untrusted PR content and run model-directed code.
    # Keys live under podTemplate.spec; top-level runtimeClassName and resources are ignored silently and runner pods lose gVisor.
    runner:
      podTemplate:
        metadata:
          labels:
            egress.home.arpa/postgres: allow
        spec:
          runtimeClassName: gvisor
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1Gi
    # Aqua tool downloads cached on a per-pod emptyDir; S3 would survive rollouts but adds a storage dependency for one replica.
    gatewayCache:
      enabled: true
    # Internal only: public dashboard with local admin is too exposed.
    httpRoute:
      enabled: true
      hostnames: ["kritika.${SECRET_DOMAIN}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
    # Server egress; runners use the chart's separate policy.
    networkPolicy:
      enabled: true
      # 4000 for the LLM gateway (agentgateway's http listener):
      # Cilium matches the pod port after service DNAT.
      egressPorts:
        - 443
        - 4000
      # Instance pods only, not poolers: runners connect to the primary directly.
      postgres:
        namespace: database
        podSelector:
          cnpg.io/cluster: postgres16
          cnpg.io/podRole: instance
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          folder: ai
          matchLabels:
            grafana.internal/instance: grafana
    env:
      LLM_API_KEY:
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: LLM_API_KEY
      GITHUB_APP_PRIVATE_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: github-private-key
      GITHUB_APP_WEBHOOK_SECRET:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: github-webhook-secret
      ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: admin-password
    config:
      reviewWorkers: 4
      limits:
        concurrency: 4
      webUrl: "https://kritika.${SECRET_DOMAIN}"
      # Index TTL; 1h (default 720h) re-onboards a re-enabled repo fast.
      indexGrace: 1h
      apps:
        github:
          accounts: [tanguille]
          clientId: Iv23liEpcPGN5z8KRBta
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        llm:
          type: openai
          baseUrl: "http://agentgateway.ai.svc.cluster.local:4000/v1"
          apiKey: { env: LLM_API_KEY }
      review:
        # The gateway falls back omniroute -> qwen-3.8 (own GPU); a second fallback here only repeats it.
        model: llm/omniroute
        # Every finding carries a suggested fix; repositories cannot lift it.
        fixes: true
        # A clean review approves the head; a later finding withdraws it.
        approve: true
      # Keep default step/token limits: 1M tokens stopped a 98-file PR with 42 files unread.
      agent:
        parts: 16
        # 60 default steps at omniroute's ~80s p95 per call need over an hour; 45m canceled 98- and 28-file reviews.
        timeout: 90m
      rules:
        - id: verify-effective-behavior
          rule: >-
            Verify suspected regressions against the reviewed head, callers
            and pinned dependency defaults; for Helm, inspect templates or
            rendered output. Cite evidence of changed behavior, not just a
            removed explicit value. Put unverified concerns in the summary as
            checks, and report concrete defects even when tests pass.
        - id: renovate
          when:
            - expr: pr.headRef.startsWith("renovate/")
          rule: >-
            This is a Renovate dependency update. Read what changed from the
            release notes in the PR body, or from upstream's release notes or
            compare view with gh (one call per release, never the releases
            list). Then search this repository for uses of the package,
            including the comments in those files, and report each breaking
            change, deprecation, rename or changed default that affects it,
            and any version it must stay in lockstep with. Start with a
            verdict, safe to merge or not, and name the sources you read.
        - id: vllm-nightly
          when:
            - expr: pr.headRef == "renovate/vllm-vllm-openai-rocm-nightly"
          rule: >-
            vLLM nightly bump for the gfx1201 Qwen3.8 stack (W4A16 AWQ, KV
            offload, hybrid GDN): config
            kubernetes/apps/ai/llmkube/models/qwen38-27b-vllm.yaml, import hook
            kubernetes/apps/ai/llmkube/models/resources/zz_lds_gate_impl.py.
            The body has digests only, so take the vllm-project/vllm main
            commits from 6 h before the previous vllm-openai-rocm PR was opened
            (gh pr list --state all --search 'vllm-openai-rocm in:title') to
            this PR's creation, and name that window. Query one path per call
            with gh api 'repos/vllm-project/vllm/commits?since=..&until=..&path=P',
            never the whole list: vllm/v1/attention,
            vllm/model_executor/kernels/linear/mixed_precision,
            vllm/v1/kv_offload,
            vllm/distributed/kv_transfer/kv_connector/v1/offloading,
            vllm/model_executor/layers/mamba, vllm/v1/core, vllm/v1/worker,
            vllm/platforms/rocm.py, vllm/config, docker/Dockerfile.rocm,
            docker/Dockerfile.rocm_base. Read the patch of each hit with gh api
            repos/vllm-project/vllm/commits/SHA; skip XPU, CUDA-only, DeepSeek,
            GLM and Kimi changes. Check each hit against every symbol the hook
            patches and every flag in the config: a moved symbol fails the
            boot, a new default can undo a flag. The hook also calls upstream
            functions and Triton kernels itself (kernel[grid](...), orig(...)):
            for each, diff the full parameter list at the previous and new
            commit and check the hook's call still binds. An added, removed
            or reordered parameter is a P1 finding, even if the hook's
            feature check passes. Any change to a file the hook patches is at
            least a P1 needs-clone-test finding. Also flag KV pool sizing or
            page size changes, Qwen3.5 or Qwen3-Next config imports, a ROCm
            base or torch bump, and anything that makes a hook patch
            redundant. Start with a verdict: nothing relevant, needs a clone
            test, or needs a hook change. Then list each relevant commit as sha,
            title, why it matters here, and what to measure (boot KV cache
            size, agreement, NLL and needle checks, prodshape). Never call it
            safe to roll untested.
      # Offer specialist skills on demand; path scopes otherwise inject their full text on every match.
      skills:
        scope:
          k8s-at-home-research:
            paths: ["kubernetes/**", "talos/**"]
            load: false
          debug-cluster:
            paths: ["kubernetes/**", "talos/**"]
            load: false
          add-app-to-cluster:
            paths: ["kubernetes/apps/**"]
            load: false
          prometheus-cluster-health:
            load: false
            paths:
              [
                "**/prometheusrule.yaml",
                "**/servicemonitor.yaml",
                "**/grafana*"
              ]
          backup-restore:
            paths: ["**/backup*", "**/restore*", "**/kopia*"]
            load: false
      # Benchmark output the default globs miss.
      ignore:
        - "**/*.out"
      embedding:
        model: llm/embeddinggemma-2
        dims: 768
        # 200000-char default batches of long chunks ran past the 1 min embed timeout on the iGPU.
        maxBatchChars: 50000
        # With these prompts a hunk's best match scores 0.82-0.88, an off-topic hunk's 0.78-0.81; 0.7 kept both. Retune after any prompt change.
        similarFloor: 0.82
        # One prompt for both sides, as the model card has it. A change rebuilds the index: recheck similarFloor.
        queryPrompt: &embeddingPrompt "task: sentence similarity | query: "
        documentPrompt: *embeddingPrompt
      # Read-only public hosts runners were refused ("egress refused" in VictoriaLogs).
      # github.com and api.github.com are implicit; cafe.github.com (gh telemetry) stays refused.
      egress:
        allow:
          # GitHub source archives, registry and release assets (redirects/fallbacks).
          - raw.githubusercontent.com
          - release-assets.githubusercontent.com
          - objects.githubusercontent.com
          - pkg-containers.githubusercontent.com
          - codeload.github.com
          # GHCR registry endpoint (blobs use pkg-containers above).
          - ghcr.io
          # Docker registry/auth and blob CDN hosts.
          - "*.docker.io"
          - "*.docker.com"
          # Agentgateway OCI chart registry.
          - cr.agentgateway.dev
          # Other registries this repo pulls from; registry.k8s.io redirects manifests to *.pkg.dev.
          - quay.io
          - registry.k8s.io
          - "*.pkg.dev"
          - gcr.io
          - mirror.gcr.io
          - gsoci.azurecr.io
          - registry.erwanleboucher.dev
          # Rust package index and downloads.
          - crates.io
          - static.crates.io
          # Historical review documentation and source hosts.
          - codeberg.org
          - grafana.com
          - huggingface.co
          - cloudnative-pg.io
          - nginx.org
          - rook.github.io
          - "*.kernel.org"
          - rocm.github.io
          - doc.rust-lang.org
          - pypi.org
          # SQLite documentation, shadcn docs/assets, and Flathub metadata.
          - www.sqlite.org
          - shadcn-svelte.com
          - "*.shadcn-svelte.com"
          - api.flathub.com
      # Local admin until GitHub or OIDC is set up.
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD

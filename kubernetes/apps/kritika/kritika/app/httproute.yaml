---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Public for GitHub deliveries and the static badge SVGs review comments embed (read off-network); the dashboard and API stay on envoy-internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kritika-webhook
  annotations:
    # "/" redirects to the dashboard; an unsigned POST to a known connection returns 401.
    gatus.home-operations.com/endpoint: |-
      url: https://kritika-webhook.${SECRET_DOMAIN}/hooks/github
      method: POST
      conditions: ["[STATUS] == 401"]
spec:
  hostnames: ["kritika-webhook.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: kritika
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /hooks/
        - path:
            type: PathPrefix
            value: /badges/
    # Review comments link to webUrl/#/..., which would 404 here; the redirect keeps the fragment.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: kritika.${SECRET_DOMAIN}
            statusCode: 302

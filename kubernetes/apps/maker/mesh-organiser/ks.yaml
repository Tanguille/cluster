---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mesh-organiser
  namespace: &namespace maker
spec:
  path: ./kubernetes/apps/maker/mesh-organiser/app
  targetNamespace: *namespace
  prune: true
  interval: 30m
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 20Gi

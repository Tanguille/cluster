---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: moonraker-obico
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      hostNetwork: true # janus WebRTC streams on host UDP ports
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      moonraker-obico:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          render-config:
            image:
              repository: busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command:
              - /bin/sh
              - -ec
              - |
                config_file=/opt/printer_data/config/moonraker-obico.cfg
                token=""
                if [ -e "$config_file" ] || [ -L "$config_file" ]; then
                  token="`awk '
                    /^\[server\]/ { in_server=1; next }
                    /^\[/ { in_server=0 }
                    in_server {
                      line=$0
                      sub(/^[[:space:]]*/, "", line)
                      if (line ~ /^auth_token[[:space:]]*=/) {
                        sub(/^auth_token[[:space:]]*=[[:space:]]*/, "", line)
                        print line
                        exit
                      }
                    }
                  ' "$config_file"`"
                fi

                awk -v token="$token" '
                  { print }
                  /^\[server\]/ && token != "" && !done {
                    print "auth_token = " token
                    done=1
                  }
                ' /config-template/moonraker-obico.cfg > "$config_file.tmp"
                mv "$config_file.tmp" "$config_file"

                if [ -n "$token" ]; then
                  echo "Rendered config and preserved auth_token"
                else
                  echo "Rendered config without auth_token; run link flow"
                fi
            securityContext: &sc
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: ghcr.io/thespaghettidetective/moonraker-obico
              tag: v2.2.7@sha256:0867f7124cda1a8dfb39c6515f0a553a2afe046c946d5da2ca2ee64b7edf5d89
            command:
              - /opt/venv/bin/python
            args:
              - -m
              - moonraker_obico.app
              - -c
              - /opt/printer_data/config/moonraker-obico.cfg
            securityContext: *sc
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 512Mi
          moonraker-proxy:
            image:
              repository: nginx
              tag: 1.31.10-alpine@sha256:7fc0fb4af7bf006aeb31aea88069976060f8f0a0a86b667126742cc17f4e31ae
            command:
              - nginx
            args:
              - -c
              - /config/nginx.conf
              - -g
              - daemon off;
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 64Mi

    persistence:
      config:
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          moonraker-obico:
            render-config:
              - path: /opt/printer_data/config
            app:
              - path: /opt/printer_data/config
      logs:
        type: emptyDir
        advancedMounts:
          moonraker-obico:
            app:
              - path: /opt/printer_data/logs
      janus-runtime:
        type: emptyDir
        advancedMounts:
          moonraker-obico:
            app:
              - path: /opt/moonraker-obico/moonraker_obico/bin/janus/runtime
      tmp:
        type: emptyDir
      config-template:
        type: configMap
        name: moonraker-obico-config
        advancedMounts:
          moonraker-obico:
            render-config:
              - path: /config-template/moonraker-obico.cfg
                subPath: moonraker-obico.cfg
            moonraker-proxy:
              - path: /config/nginx.conf
                subPath: nginx.conf
                readOnly: true

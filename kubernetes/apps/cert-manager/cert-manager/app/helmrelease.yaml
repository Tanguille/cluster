---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      layerSelector:
        mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
        operation: copy
      ref:
        tag: v1.21.3
      url: oci://quay.io/jetstack/charts/cert-manager
  interval: 1h
  values:
    crds:
      enabled: true
    dns01RecursiveNameservers: https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      servicemonitor:
        enabled: true
    networkPolicy:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
    cainjector:
      networkPolicy:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
    webhook:
      replicaCount: 2
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
      podDisruptionBudget:
        enabled: true
      networkPolicy:
        enabled: true

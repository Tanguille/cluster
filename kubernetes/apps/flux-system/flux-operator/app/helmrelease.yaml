---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      layerSelector:
        mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
        operation: copy
      ref:
        tag: 0.62.0
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  interval: 1h
  values:
    serviceMonitor:
      create: true
    web:
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
              - flux-admin
      httpRoute:
        enabled: true
        hostnames:
          - flux.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
      networkPolicy:
        create: false

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    serviceMonitor:
      create: true
    web:
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
              - flux-admin
      httpRoute:
        enabled: true
        hostnames:
          - flux.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
      # Chart default is true. Caps pod ingress to 9080 (web) and 8080 (metrics, kept
      # because serviceMonitor.create is on); `from` is namespaceSelector:{}, so reach
      # to the anonymous UI is unchanged — the read-only roleRef is what limits it.
      networkPolicy:
        create: true

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
components:
  - ../../components/common
  - ../../components/deny-lan-egress
resources:
  # The only SOPS key Flux reads (kustomize-controller --sops-age-secret); never remove it.
  - ./sops-age.sops.yaml
  - ./flux-instance/ks.yaml
  - ./flux-operator/ks.yaml
  - ./konflate/ks.yaml

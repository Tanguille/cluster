---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 1h
  values:
    instance:
      distribution:
        artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.61.0
      cluster:
        networkPolicy: false
      sync:
        url: https://github.com/tanguille/cluster.git
        ref: refs/heads/main
        path: kubernetes/apps
        interval: 1h
      kustomize:
        patches:
          - # Sync Kustomization defaults (replaces the former cluster-apps ks.yaml).
            # The operator generates only a minimal flux-system Kustomization
            # (interval 10m, prune true, no decryption/postBuild/timeout/patches);
            # this strategic-merge patch restores the former cluster-apps settings.
            # Generated name defaults to the FluxInstance namespace (flux-system)
            # per the FluxInstance CRD (.spec.sync.name default) and the
            # flux-instance chart templates/instance.yaml + operator
            # internal/builder/templates.go syncTmpl.
            patch: |-
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: flux-system
              spec:
                decryption:
                  provider: sops
                  secretRef:
                    name: sops-age
                deletionPolicy: Orphan
                interval: 1h
                prune: true
                postBuild:
                  substituteFrom:
                    - name: cluster-settings
                      kind: ConfigMap
                      optional: true
                    - name: cluster-secrets
                      kind: Secret
                      optional: true
                timeout: 5m
                retryInterval: 2m
            target:
              group: kustomize.toolkit.fluxcd.io
              kind: Kustomization
              name: flux-system
          - # Child Kustomization defaults (onedr0p pattern: JSON6902 add of
            # /spec/patches on the generated sync Kustomization). Both entries
            # carried over verbatim from the former cluster-apps ks.yaml.
            patch: |-
              - op: add
                path: /spec/patches
                value:
                  # Replaces substituteFrom/timeout/retryInterval wholesale — setting them in a child is a no-op.
                  - patch: |-
                      apiVersion: kustomize.toolkit.fluxcd.io/v1
                      kind: Kustomization
                      metadata:
                        name: not-used
                      spec:
                        decryption:
                          provider: sops
                          secretRef:
                            name: sops-age
                        postBuild:
                          substituteFrom:
                            - name: cluster-settings
                              kind: ConfigMap
                              optional: false
                            - name: cluster-secrets
                              kind: Secret
                              optional: false
                        deletionPolicy: WaitForTermination
                        timeout: 5m
                        retryInterval: 2m
                        patches:
                          - patch: |-
                              apiVersion: helm.toolkit.fluxcd.io/v2
                              kind: HelmRelease
                              metadata:
                                name: _
                              spec:
                                driftDetection:
                                  mode: enabled
                                install:
                                  crds: CreateReplace
                                rollback:
                                  cleanupOnFail: true
                                upgrade:
                                  cleanupOnFail: true
                                  crds: CreateReplace
                                  strategy:
                                    name: RemediateOnFailure
                                  remediation:
                                    retries: 2
                            target:
                              group: helm.toolkit.fluxcd.io
                              kind: HelmRelease
                    target:
                      group: kustomize.toolkit.fluxcd.io
                      kind: Kustomization
                  # Kustomization-level patches replace the whole spec.patches list, so a rook-ceph-cluster
                  # HelmRelease patch can't just add driftDetection.mode: disabled on top of the one above -
                  # it must replace it wholesale, defaults included. Its dry-run diff can't handle
                  # CephBlockPool/CephFilesystem, whose live spec.replicated.minSize isn't declared in the
                  # installed CRD schema, which puts the release into a permanent StateError otherwise.
                  - patch: |-
                      apiVersion: kustomize.toolkit.fluxcd.io/v1
                      kind: Kustomization
                      metadata:
                        name: not-used
                      spec:
                        patches:
                          - patch: |-
                              apiVersion: helm.toolkit.fluxcd.io/v2
                              kind: HelmRelease
                              metadata:
                                name: _
                              spec:
                                driftDetection:
                                  mode: disabled
                                install:
                                  crds: CreateReplace
                                rollback:
                                  cleanupOnFail: true
                                upgrade:
                                  cleanupOnFail: true
                                  crds: CreateReplace
                                  strategy:
                                    name: RemediateOnFailure
                                  remediation:
                                    retries: 2
                            target:
                              group: helm.toolkit.fluxcd.io
                              kind: HelmRelease
                    target:
                      group: kustomize.toolkit.fluxcd.io
                      kind: Kustomization
                      name: rook-ceph-cluster
                      namespace: rook-ceph
            target:
              group: kustomize.toolkit.fluxcd.io
              kind: Kustomization
              name: flux-system
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
            target:
              kind: Deployment
              name: (helm-controller|source-controller)
          # metadata.name is ignored; target.name selects
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 512Mi
            target:
              kind: Deployment
              name: (helm|kustomize)-controller
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 256Mi
            target:
              kind: Deployment
              name: (source|notification)-controller
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=20
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --sops-age-secret=sops-age
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CancelHealthCheckOnNewRevision=true
            target:
              kind: Deployment
              name: kustomize-controller
          # In-memory builds. Merged by volume name
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    volumes:
                      - name: temp
                        emptyDir:
                          medium: Memory
            target:
              kind: Deployment
              name: kustomize-controller
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-max-size=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-ttl=60m
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-purge-interval=5m
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CacheSecretsAndConfigMaps=true
            target:
              kind: Deployment
              name: source-controller
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=OOMWatch=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-memory-threshold=95
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-interval=500ms
              # DefaultToRetryOnFailure: retry failed installs instead of stalling. Upgrades keep the cluster ks patch's
              # explicit RemediateOnFailure, which overrides this gate.
              # DisableChartDigestTracking: prevents helm-controller from pinning OCI chart digests in HelmRelease
              # status, which otherwise causes spurious drift when registries reassign digests (e.g. after re-push).
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=DefaultToRetryOnFailure=true,DisableChartDigestTracking=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
            target:
              kind: Deployment
              name: helm-controller

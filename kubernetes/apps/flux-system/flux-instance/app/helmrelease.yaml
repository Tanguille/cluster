---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.62.1
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
  interval: 1h
  values:
    instance:
      distribution:
        # Pinned: the chart renders "" as null, which the FluxInstance CRD rejects; its default is :latest.
        artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.62.1
      cluster:
        networkPolicy: false
      sync:
        url: https://github.com/tanguille/cluster.git
        ref: refs/heads/main
        path: kubernetes/flux/cluster
        interval: 1h
      kustomize:
        patches:
          # flux-system only applies kubernetes/flux/cluster; cluster-apps there carries the defaults.
          - patch: |-
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: flux-system
              spec:
                # The operator generates 10m; sync.interval only sets the GitRepository.
                interval: 1h
                # It owns only cluster-apps. Pruning on the switch from kubernetes/apps deletes every child before cluster-apps adopts it.
                prune: false
            target:
              group: kustomize.toolkit.fluxcd.io
              kind: Kustomization
              name: flux-system
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
            target:
              kind: Deployment
              name: (helm-controller|source-controller)
          # metadata.name is ignored; target.name selects
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 512Mi
            target:
              kind: Deployment
              name: (helm|kustomize)-controller
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 256Mi
            target:
              kind: Deployment
              name: (source|notification)-controller
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=20
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --sops-age-secret=sops-age
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CancelHealthCheckOnNewRevision=true
            target:
              kind: Deployment
              name: kustomize-controller
          # In-memory builds. Merged by volume name
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    volumes:
                      - name: temp
                        emptyDir:
                          medium: Memory
            target:
              kind: Deployment
              name: kustomize-controller
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CacheSecretsAndConfigMaps=true
            target:
              kind: Deployment
              name: source-controller
          - patch: |
              # DefaultToRetryOnFailure: retry failed installs instead of stalling. Upgrades keep the cluster-apps patch's
              # explicit RemediateOnFailure, which overrides this gate.
              # DisableChartDigestTracking: prevents helm-controller from pinning OCI chart digests in HelmRelease
              # status, which otherwise causes spurious drift when registries reassign digests (e.g. after re-push).
              # CancelHealthCheckOnNewRevision: any new reconcile request (chart revision, valuesFrom object change,
              # `flux reconcile hr`) interrupts a pending health check; apply, hooks and tests are not canceled. A cancel
              # counts as an upgrade failure, so with unchanged chart and values the RemediateOnFailure patch rolls back
              # and re-upgrades; `flux reconcile hr --reset` clears the count instead.
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=OOMWatch=true,DefaultToRetryOnFailure=true,DisableChartDigestTracking=true,CancelHealthCheckOnNewRevision=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
            target:
              kind: Deployment
              name: helm-controller

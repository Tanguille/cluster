---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 1h
  values:
    instance:
      distribution:
        # Pinned: the chart renders "" as null, which the FluxInstance CRD rejects; its default is :latest.
        artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.62.0
      cluster:
        networkPolicy: false
      sync:
        url: https://github.com/tanguille/cluster.git
        ref: refs/heads/main
        path: kubernetes/apps
        interval: 1h
      kustomize:
        patches:
          # Configure the generated flux-system sync and its child Kustomizations in one patch.
          - patch: |-
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: flux-system
              spec:
                # decryption.secretRef is omitted: kustomize-controller's --sops-age-secret is the fallback.
                decryption:
                  provider: sops
                deletionPolicy: Orphan
                interval: 1h
                postBuild:
                  substituteFrom:
                    - name: cluster-settings
                      kind: ConfigMap
                      optional: true
                    - name: cluster-secrets
                      kind: Secret
                      optional: true
                patches:
                  # Replaces substituteFrom/timeout/retryInterval wholesale — setting them in a child is a no-op.
                  - patch: |-
                      apiVersion: kustomize.toolkit.fluxcd.io/v1
                      kind: Kustomization
                      metadata:
                        name: not-used
                      spec:
                        decryption:
                          provider: sops
                        postBuild:
                          substituteFrom:
                            - name: cluster-settings
                              kind: ConfigMap
                              optional: false
                            - name: cluster-secrets
                              kind: Secret
                              optional: false
                        deletionPolicy: WaitForTermination
                        timeout: 5m
                        retryInterval: 2m
                        patches:
                          - patch: |-
                              apiVersion: helm.toolkit.fluxcd.io/v2
                              kind: HelmRelease
                              metadata:
                                name: _
                              spec:
                                driftDetection:
                                  mode: enabled
                                install:
                                  crds: CreateReplace
                                rollback:
                                  cleanupOnFail: true
                                upgrade:
                                  cleanupOnFail: true
                                  crds: CreateReplace
                                  strategy:
                                    name: RemediateOnFailure
                                  remediation:
                                    retries: 2
                            target:
                              group: helm.toolkit.fluxcd.io
                              kind: HelmRelease
                          # Dry-run diff breaks on CephBlockPool/CephFilesystem (live spec.replicated.minSize
                          # isn't in the installed CRD schema), leaving the release in a permanent StateError.
                          - patch: |-
                              apiVersion: helm.toolkit.fluxcd.io/v2
                              kind: HelmRelease
                              metadata:
                                name: _
                              spec:
                                driftDetection:
                                  mode: disabled
                            target:
                              group: helm.toolkit.fluxcd.io
                              kind: HelmRelease
                              name: rook-ceph-cluster
                    target:
                      group: kustomize.toolkit.fluxcd.io
                      kind: Kustomization
            target:
              group: kustomize.toolkit.fluxcd.io
              kind: Kustomization
              name: flux-system
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
            target:
              kind: Deployment
              name: (helm-controller|source-controller)
          # metadata.name is ignored; target.name selects
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 512Mi
            target:
              kind: Deployment
              name: (helm|kustomize)-controller
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 256Mi
            target:
              kind: Deployment
              name: (source|notification)-controller
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=20
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --sops-age-secret=sops-age
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CancelHealthCheckOnNewRevision=true
            target:
              kind: Deployment
              name: kustomize-controller
          # In-memory builds. Merged by volume name
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    volumes:
                      - name: temp
                        emptyDir:
                          medium: Memory
            target:
              kind: Deployment
              name: kustomize-controller
          - patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CacheSecretsAndConfigMaps=true
            target:
              kind: Deployment
              name: source-controller
          - patch: |
              # DefaultToRetryOnFailure: retry failed installs instead of stalling. Upgrades keep the flux-system patch's
              # explicit RemediateOnFailure, which overrides this gate.
              # DisableChartDigestTracking: prevents helm-controller from pinning OCI chart digests in HelmRelease
              # status, which otherwise causes spurious drift when registries reassign digests (e.g. after re-push).
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=OOMWatch=true,DefaultToRetryOnFailure=true,DisableChartDigestTracking=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
            target:
              kind: Deployment
              name: helm-controller

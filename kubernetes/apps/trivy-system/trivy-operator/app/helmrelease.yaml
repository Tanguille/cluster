---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trivy-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: trivy-operator
  values:
    fullnameOverride: *app
    # Fully on-prem: Standalone mode (in-cluster scanner jobs), no ARMO/external
    # backend. rbac/serviceAccount are created by the chart (both default true).
    operator:
      replicas: 1
    image:
      # Pin to the aqua registry so the operator image is available without a GCR mirror.
      registry: ghcr.io
      repository: aquasec/trivy-operator
    trivy:
      image:
        registry: ghcr.io
        repository: aquasec/trivy
      # Slow mode: gentler on CPU/RAM at the cost of slower scans — right size for a homelab.
      slow: true
      severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
    # Expose the /metrics endpoint to Prometheus via a ServiceMonitor.
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

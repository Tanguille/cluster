---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/policy/poddisruptionbudget_v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: k8s-gateway
spec:
  # Not the chart value: its PDB would collide with this existing object on adoption.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-gateway

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      layerSelector:
        mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
        operation: copy
      ref:
        tag: 4.0.1
      url: oci://codeberg.org/k8s-gateway/charts/k8s-gateway
  interval: 1h
  values:
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: k8s-gateway
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
    # Image defaults to root.
    securityContext:
      runAsUser: 1000
    service:
      annotations:
        lbipam.cilium.io/ips: ${K8S_GATEWAY_IP}
    prometheus:
      service:
        enabled: true
      monitor:
        enabled: true
    servers:
      - zones:
          - zone: ${SECRET_DOMAIN}
            use_tcp: true
        port: 53
        plugins:
          - name: k8s_gateway
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources HTTPRoute TLSRoute Service
          - name: log
            configBlock: |-
              class denial error
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: loadbalance

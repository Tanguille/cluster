---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - certificate.yaml
  - crowdsec-wasm-probe.yaml
  - eep.yaml
  - envoy.yaml
  - grafanadashboard.yaml
  - helmrelease.yaml
  - observability.yaml

# The listener policy takes precedence over the gateway-wide error page.
replacements:
  - source:
      kind: EnvoyExtensionPolicy
      name: eep
      fieldPath: spec.wasm.[name=eep]
    targets:
      - select:
          kind: EnvoyExtensionPolicy
          name: crowdsec-wasm-probe
        fieldPaths:
          - spec.wasm.[name=eep]

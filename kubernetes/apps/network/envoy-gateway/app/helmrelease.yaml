---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  values:
    global:
      imageRegistry: mirror.gcr.io
    deployment:
      # xDS control plane; avoid config-push stalls when the sole replica's node is disrupted
      replicas: 2
      pod:
        # Hard spread: both controller replicas on one node means one node failure
        # stalls xDS pushes to every gateway while the deployment reschedules.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                control-plane: envoy-gateway
    # Chart only renders a PDB when this is set (default minAvailable: 0 = none)
    podDisruptionBudget:
      minAvailable: 1
    config:
      envoyGateway:
        provider:
          kubernetes:
            deploy:
              type: GatewayNamespace

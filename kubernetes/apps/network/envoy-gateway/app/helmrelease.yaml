---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      layerSelector:
        mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
        operation: copy
      ref:
        tag: 1.9.3
      url: oci://mirror.gcr.io/envoyproxy/gateway-helm
  interval: 1h
  values:
    global:
      imageRegistry: mirror.gcr.io
    deployment:
      replicas: 2
      pod:
        # Hard spread: co-located replicas let one node failure stall xDS pushes to every gateway.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                control-plane: envoy-gateway
    # Chart only renders a PDB when this is set (default minAvailable: 0 = none)
    podDisruptionBudget:
      minAvailable: 1
    config:
      envoyGateway:
        provider:
          kubernetes:
            deploy:
              type: GatewayNamespace

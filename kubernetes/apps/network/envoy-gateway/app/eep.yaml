---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: eep
spec:
  targetSelectors:
    - kind: Gateway
  wasm:
    - name: eep
      rootID: eep
      code:
        type: Image
        image:
          url: oci://ghcr.io/ishioni/eep:0.3.1@sha256:388844b98bf2447625693a0dbda9d591961290707619b2cbad527a5c47730717
      config:
        # never echo request metadata on the public gateway
        showDetails: false
        filterCodes: [404, "500-599"]
      failOpen: true

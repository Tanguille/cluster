---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: eep
spec:
  targetSelectors:
    - kind: Gateway
  wasm:
    - name: eep
      rootID: eep
      code:
        type: Image
        image:
          url: oci://ghcr.io/ishioni/eep:0.4.1@sha256:242c9b2d377f62be3216edb5794a716ca89b2c04ade9afde50f4e30768d7f78a
      config:
        # never echo request metadata on the public gateway
        showDetails: false
        filterCodes: [404, "500-599"]
        # API hosts whose clients parse error bodies (Matrix errcodes, MCP JSON-RPC, OpenAI errors)
        excludeDomains:
          - "(?i)^(matrix|mcp|llm)\\.${SECRET_DOMAIN}(:[0-9]+)?$"
      failOpen: true

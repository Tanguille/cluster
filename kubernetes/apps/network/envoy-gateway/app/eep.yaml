---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: eep
spec:
  targetSelectors:
    - kind: Gateway
  wasm:
    - name: eep
      rootID: eep
      code:
        type: Image
        image:
          url: oci://ghcr.io/ishioni/eep:0.4.0@sha256:179ead8646cf8832d6bf141852d00e9c1ebfdc43c8d85aa55600ea1031116beb
      config:
        # never echo request metadata on the public gateway
        showDetails: false
        filterCodes: [404, "500-599"]
      failOpen: true

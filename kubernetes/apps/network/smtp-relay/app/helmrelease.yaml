---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smtp-relay
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      smtp-relay:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: boky/postfix
              tag: 5.2.1-alpine
            env:
              RELAYHOST: smtp.gmail.com:587
              POSTFIX_mynetworks: "${POD_CIDR}"
              POSTFIX_myhostname: "smtp-relay.network.svc.cluster.local"
              POSTFIX_message_size_limit: "52428800"
              # The default "may" exposes the Gmail credentials to a STARTTLS strip; "encrypt" skips the cert check.
              POSTFIX_smtp_tls_security_level: secure
              ALLOW_EMPTY_SENDER_DOMAINS: "true"
              RELAYHOST_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: smtp-relay-secret
                    key: RELAY_USERNAME
              RELAYHOST_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: smtp-relay-secret
                    key: RELAY_PASSWORD
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                spec:
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 500m
                memory: 128Mi

    service:
      app:
        ports:
          smtp:
            port: 25

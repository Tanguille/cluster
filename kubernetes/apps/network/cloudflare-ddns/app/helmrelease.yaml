---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-ddns
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      cloudflare-ddns:
        containers:
          app:
            image:
              repository: ghcr.io/favonia/cloudflare-ddns
              tag: 1.17.1
            env:
              DOMAINS: satisfactory.${SECRET_DOMAIN}
              # DNS-only: Cloudflare's proxy can't carry the game's UDP/TCP traffic.
              PROXIED: "false"
              # The game is port-forwarded over IPv4 only.
              IP6_PROVIDER: none
              CLOUDFLARE_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: external-dns-secret
                    key: api-token
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }

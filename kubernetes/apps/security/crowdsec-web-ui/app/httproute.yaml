---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crowdsec-web-ui
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: CrowdSec Web UI
    gethomepage.dev/description: CrowdSec alerts, decisions, and bouncer overview
    gethomepage.dev/group: Security
    gethomepage.dev/icon: mdi-shield-account
spec:
  hostnames:
    - crowdsec-web-ui.${SECRET_DOMAIN}
  parentRefs:
    # Internal gateway, like kguardian; move to envoy-external if it should leave the LAN
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: crowdsec-web-ui
          port: 3000

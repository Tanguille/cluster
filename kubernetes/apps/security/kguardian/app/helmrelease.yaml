---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 1h
  values:
    # LLM via in-cluster LiteLLM gateway; key from cluster-secrets.
    ai:
      mcp:
        # /mcp for kubectl port-forward telemetry; token required.
        enabled: true
        auth:
          existingSecret: kguardian-mcp-token

    # Skip daily version check-in.
    telemetry:
      enabled: false

    # 10s sampling, 3d/12h history for homelab scale.
    compute:
      enabled: true
      sampleInterval: 10
      history:
        retentionDays: 3
        minuteResolutionHours: 12

    # 30s denial drain; still inside 5m alert window.
    seccomp:
      denials:
        intervalSeconds: 30

    # Stateless bridge; 1 replica saves 256Mi req on tight nodes.
    # OPENAI_* passthrough points at LiteLLM instead of api.openai.com.
    llmBridge:
      enabled: true
      replicaCount: 1
      podAnnotations:
        reloader.stakater.com/auto: "true"
      env:
        - name: OPENAI_BASE_URL
          value: http://litellm.ai.svc.cluster.local/v1
        - name: OPENAI_MODEL
          value: qwen-3.8
        # From cluster-secrets via substituteFrom; stays literal in git.
        - name: OPENAI_API_KEY
          value: ${LITELLM_API_KEY}

    # Direct CNPG primary, not pgbouncer-rw: r2d2 opens 16 eager conns
    # and pgbouncer paces new server conns (16xSSL+auth >30s → Error(None)
    # panic at src/main.rs:247; live pg_stat_activity showed sessions stuck
    # at SET statement_timeout). Direct answers 16 concurrent in ~0.1s.
    # Matches oscaromeu peer (direct primary + prefer). 2x16=32 direct
    # conns stay well under PG max_connections 150.
    database:
      enabled: false
      user: kguardian
      databaseName: kguardian
      existingSecret: kguardian-db-credentials
      external:
        host: postgres16-rw.database.svc.cluster.local
        port: 5432
        sslMode: prefer

    broker:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      # Trimmed requests per peers; limits pinned to chart defaults
      # (Helm merges maps, but explicit avoids any replace-vs-merge doubt).
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 1Gi
      # hostNetwork controller needs node CIDR; /metrics needs vmagent.
      networkPolicy:
        enabled: true
        allowedNodeCIDRs:
          - 192.168.0.0/24
        allowMetricsFrom:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
            podSelector:
              matchLabels:
                app.kubernetes.io/name: vmagent
      metrics:
        serviceMonitor:
          enabled: true

      # 16 = 8+8 floor (inflightPermits+8); fits 25/30 pooler,
      # covers 2x16 rollout burst.
      dbPoolMaxSize: 16
      audit:
        inflightPermits: 8
        retention:
          days: 14
      seccomp:
        denials:
          retention:
            days: 14

    # Lighter scheduling requests per peers (oscaromeu/mrdynamo);
    # limits stay at defaults for eBPF headroom. Saves 150m + 384Mi
    # across the 3-node DaemonSet on tight control-1 (91% req).
    controller:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 1h
  values:
    # LLM via in-cluster LiteLLM gateway; key from cluster-secrets.
    ai:
      mcp:
        # /mcp for kubectl port-forward telemetry; token required.
        enabled: true
        auth:
          existingSecret: kguardian-mcp-token

    # Skip daily version check-in.
    telemetry:
      enabled: false

    # 10s sampling, 3d/12h history for homelab scale.
    compute:
      enabled: true
      sampleInterval: 10
      history:
        retentionDays: 3
        minuteResolutionHours: 12

    # 30s denial drain; still inside 5m alert window.
    seccomp:
      denials:
        intervalSeconds: 30

    # Stateless bridge; 1 replica saves 256Mi req on tight nodes.
    # OPENAI_* passthrough points at LiteLLM instead of api.openai.com.
    llmBridge:
      enabled: true
      replicaCount: 1
      env:
        - name: OPENAI_BASE_URL
          value: http://litellm.ai.svc.cluster.local/v1
        - name: OPENAI_MODEL
          value: qwen-3.8
        # From cluster-secrets via substituteFrom; stays literal in git.
        - name: OPENAI_API_KEY
          value: ${LITELLM_API_KEY}

    # External CNPG via pgbouncer-rw; pooler has no TLS to primary.
    database:
      enabled: false
      user: kguardian
      databaseName: kguardian
      existingSecret: kguardian-db-credentials
      external:
        host: pgbouncer-rw.database.svc.cluster.local
        port: 5432
        sslMode: disable

    broker:
      # hostNetwork controller needs node CIDR; /metrics needs vmagent.
      networkPolicy:
        enabled: true
        allowedNodeCIDRs:
          - 192.168.0.0/24
        allowMetricsFrom:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
            podSelector:
              matchLabels:
                app.kubernetes.io/name: vmagent
      metrics:
        serviceMonitor:
          enabled: true

      # 16 = permits+8 floor; fits 25/30 pooler, covers 2x16 rollout burst.
      dbPoolMaxSize: 16
      audit:
        inflightPermits: 8
        retention:
          days: 14
      seccomp:
        denials:
          retention:
            days: 14

    # Leave controller at chart defaults (privileged eBPF DaemonSet).

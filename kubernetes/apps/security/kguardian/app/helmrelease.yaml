---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 1h
  # Chart omits app.kubernetes.io/name on the broker Service that its ServiceMonitor selects (0 targets); add it back.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: kguardian-broker
            patch: |-
              apiVersion: v1
              kind: Service
              metadata:
                name: not-used
                labels:
                  app.kubernetes.io/name: kguardian-broker
  values:
    ai:
      mcp:
        # /mcp for kubectl port-forward telemetry; token required.
        enabled: true
        auth:
          existingSecret: kguardian-mcp-token

    telemetry:
      enabled: false

    compute:
      sampleInterval: 10
      history:
        retentionDays: 3
        minuteResolutionHours: 12

    # 30s denial drain; still inside 5m alert window.
    seccomp:
      denials:
        intervalSeconds: 30

    # Stateless bridge; 1 replica saves 256Mi req on tight nodes.
    # OPENAI_* passthrough points at LiteLLM instead of api.openai.com.
    llmBridge:
      enabled: true
      replicaCount: 1
      podAnnotations:
        reloader.stakater.com/auto: "true"
      # Lean requests (actual use ~60Mi); limits stay at defaults.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
      env:
        - name: OPENAI_BASE_URL
          value: http://litellm.ai.svc.cluster.local/v1
        - name: OPENAI_MODEL
          value: qwen-3.8
        # From cluster-secrets via substituteFrom; stays literal in git.
        - name: OPENAI_API_KEY
          value: ${LITELLM_API_KEY}

    # Via pgbouncer-rw (no TLS): labeled pods on the primary's node blackhole to the postgres16-rw VIP (control-3 Cilium), the pgbouncer VIP works from all nodes.
    database:
      enabled: false
      user: kguardian
      databaseName: kguardian
      existingSecret: kguardian-db-credentials
      external:
        host: pgbouncer-rw.database.svc.cluster.local
        sslMode: disable

    broker:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      # Trimmed requests; limits inherit chart defaults.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
      # No networkPolicy: the rendered ingress-only policy blackholes the broker's egress to ClusterIPs on Cilium (nc to the pgbouncer/postgres VIPs times out until it is deleted).
      metrics:
        serviceMonitor:
          enabled: true

      # 16 = inflightPermits + 8 floor; fits the 25/30 pooler and a 2x16 rollout burst.
      dbPoolMaxSize: 16
      # Per-connection SET statement_timeout parks pool creation behind transaction-mode pgbouncer (16 direct dials take ~0.1s); migrations stay exempt.
      statementTimeoutMs: 0
      audit:
        inflightPermits: 8
        retention:
          days: 14
      seccomp:
        denials:
          retention:
            days: 14

    frontend:
      resources:
        requests:
          memory: 64Mi

    # Trimmed requests save 150m + 384Mi across the DaemonSet on tight control-1 (91% req); limits stay at chart defaults for eBPF headroom.
    controller:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi

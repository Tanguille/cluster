---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 1.29.2
      url: oci://ghcr.io/kguardian-dev/charts/kguardian
  interval: 1h
  # Chart omits app.kubernetes.io/name on the broker Service that its ServiceMonitor selects (0 targets); add it back.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: kguardian-broker
            patch: |-
              apiVersion: v1
              kind: Service
              metadata:
                name: not-used
                labels:
                  app.kubernetes.io/name: kguardian-broker
          # Snapshotter has no chart value: one 256 batch per 300s tick, live workloads first (default swept every workload ever seen each tick).
          # Broker pod label patched here: global.labels would hit every kguardian pod.
          - target:
              kind: Deployment
              name: kguardian-broker
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  metadata:
                    labels:
                      egress.home.arpa/postgres: allow
                  spec:
                    containers:
                      - name: broker
                        env:
                          - name: PROFILE_SNAPSHOT_TICK_BUDGET_SECS
                            value: "0"
                          - name: PROFILE_SNAPSHOT_BATCH
                            value: "256"
  values:
    ai:
      mcp:
        # /mcp backs the toolhive kguardian MCPServerEntry (ai/toolhive/mcp/kguardian.yaml); token required.
        enabled: true
        auth:
          existingSecret: kguardian-mcp-token

    telemetry:
      enabled: false

    # Per-pod gauges duplicate cAdvisor and cost ~85 writes/s (pod_compute_latest + history).
    compute:
      enabled: false
    # 30s denial drain; still inside 5m alert window.
    seccomp:
      denials:
        intervalSeconds: 30
    # No AuditNetworkPolicies exist.
    evaluator:
      enabled: false

    # Stateless bridge; 1 replica saves 256Mi req on tight nodes.
    # OPENAI_* passthrough points at the LLM gateway (agentgateway) instead of api.openai.com.
    llmBridge:
      enabled: true
      replicaCount: 1
      podAnnotations:
        reloader.stakater.com/auto: "true"
      # Lean requests (actual use ~60Mi); limits stay at defaults.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
      env:
        - name: OPENAI_BASE_URL
          value: http://agentgateway.ai.svc.cluster.local:4000/v1
        - name: OPENAI_MODEL
          value: qwen-3.8
        # From cluster-secrets via substituteFrom; stays literal in git.
        - name: OPENAI_API_KEY
          value: ${LLM_API_KEY}

    # Via pgbouncer-rw: labeled pods on the primary's node blackhole to the postgres16-rw VIP (control-3 Cilium), the pgbouncer VIP works from all nodes.
    database:
      enabled: false
      user: kguardian
      databaseName: kguardian
      external:
        host: pgbouncer-rw.database.svc.cluster.local
        sslMode: require

    broker:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      # Trimmed requests; limits inherit chart defaults.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
      # No networkPolicy: the rendered ingress-only policy blackholes the broker's egress to ClusterIPs on Cilium (nc to the pgbouncer/postgres VIPs times out until it is deleted).
      metrics:
        serviceMonitor:
          enabled: true
        # Chart's seccomp denial alerts (observed, enforcing, abnormal rate).
        prometheusRule:
          enabled: true

      # 16 = inflightPermits + 8 floor; fits the 25/30 pooler and a 2x16 rollout burst.
      dbPoolMaxSize: 16
      audit:
        inflightPermits: 8
      # Per-connection SET statement_timeout parks pool creation behind transaction-mode pgbouncer (16 direct dials take ~0.1s); migrations stay exempt.
      statementTimeoutMs: 0
      # bitmagnet's DHT crawler and qbittorrent logged ~1M external-peer rows/day (95% of pod_traffic).
      # The cap trims only identity-less peers; monerod, the busiest other pod, holds ~5k.
      traffic:
        retention:
          maxRowsPerPod: 10000
      # Rescanned ~13k unresolved DHT-peer rows every ~76s and resolved 1 in 16 passes; ingest still resolves.
      peerResolution:
        lateResolveWindowSeconds: 0
      # Its own window; it followed the audit retention (14 -> chart 30) when unset.
      podInventory:
        retention:
          deadPodDays: 3
      seccomp:
        denials:
          retention:
            days: 14
      # Every finished Job instance stays a workload row until pruned (~1.3k/day); at 30d the in-use coverage recompute took ~200s.
      imageInventory:
        retention:
          days: 3
      # Each pass rewrites all of runtime_in_use_coverage (default every 300s) for vuln tables that stay empty.
      supplychain:
        retention:
          intervalSeconds: 86400

    frontend:
      resources:
        requests:
          memory: 64Mi

    # Memory covers the 368Mi 30d peak (grows with pod age); CPU trim saves 150m across the DaemonSet.
    controller:
      resources:
        requests:
          cpu: 50m
          memory: 512Mi

# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ocirepository.yaml
  - helmrelease.yaml
  - httproute.yaml
  - grafanadashboard.yaml
  - prometheusrule.yaml
  - secret.sops.yaml
configMapGenerator:
  - name: kguardian-dashboard
    files:
      - dashboard/kguardian.json
    options:
      annotations:
        # Dashboard JSON uses ${DS_PROMETHEUS}; flux envsubst would blank it.
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true

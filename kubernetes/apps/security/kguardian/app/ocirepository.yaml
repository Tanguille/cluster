---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kguardian
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # Third-party chart, sourced from upstream (not the home-operations charts-mirror,
  # which only mirrors first-party charts). The chart/vX.Y.Z tag is what Renovate tracks.
  ref:
    tag: 1.24.0
  url: oci://ghcr.io/kguardian-dev/charts/kguardian

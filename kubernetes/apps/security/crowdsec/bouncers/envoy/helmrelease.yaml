---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec-envoy-bouncer
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec-envoy-bouncer
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: *app
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
                annotations:
                  reloader.stakater.com/auto: "true"
  values:
    # fullnameOverride pins the Service/Deployment name consumed by
    # kubernetes/apps/network/envoy-gateway/app/envoy.yaml's extAuth backendRef
    fullnameOverride: *app
    image:
      tag: v0.7.0@sha256:994783a3b93a01eae23a3ba28ef272471725510aeec25e406414551d95643fae
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
    config:
      trustedProxies:
        - "${LAN_CIDR}"
        - "${POD_CIDR}"
      bouncer:
        lapiURL: https://crowdsec-service.security.svc.cluster.local:8080
        metrics: true
        banStatusCode: 418
        tls:
          enabled: true
        tlsSecretRef:
          name: crowdsec-bouncer-tls
      waf:
        enabled: true
        appSecURL: http://crowdsec-appsec-service.security.svc.cluster.local:7422
        apiKeySecretRef:
          name: crowdsec-envoy-bouncer-secret
          key: ENVOY_BOUNCER_WAF_APIKEY
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 1m
      templates:
        deniedTemplatePath: /ban.html
    referenceGrant:
      create: true
      fromNamespaces: ["network"]
    volumes:
      - name: ban-html
        configMap:
          name: crowdsec-envoy-bouncer-configmap
    volumeMounts:
      - name: ban-html
        mountPath: /ban.html
        subPath: ban.html
        readOnly: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  interval: 1h
  values:
    container_runtime: containerd
    config:
      parsers:
        s01-parse:
          envoy-logs.yaml: |-
            filter: "evt.Parsed.program startsWith 'envoy' && evt.Parsed.message contains ':authority'"
            onsuccess: next_stage
            name: hydaz/envoy-logs
            description: "Parse Envoy access logs to match nginx parser outputs"
            statics:
              - parsed: json
                expression: UnmarshalJSON(evt.Parsed.message, evt.Unmarshaled, "envoy")
              - parsed: time_local
                expression: evt.Unmarshaled.envoy["start_time"]
              - parsed: remote_addr
                expression: Split(evt.Unmarshaled.envoy["x-forwarded-for"], ",")[0]
              - parsed: verb
                expression: evt.Unmarshaled.envoy["method"]
              - parsed: request
                expression: evt.Unmarshaled.envoy["x-envoy-origin-path"]
              - parsed: http_version
                expression: TrimPrefix(evt.Unmarshaled.envoy["protocol"], "HTTP/")
              # %v not %.0f: the envoy access-log schema is Envoy Gateway's implicit default,
              # so a future release emitting these as strings would silently corrupt status
              - parsed: status
                expression: Sprintf('%v', evt.Unmarshaled.envoy["response_code"])
              - parsed: body_bytes_sent
                expression: Sprintf('%v', evt.Unmarshaled.envoy["bytes_sent"])
              - parsed: http_user_agent
                expression: evt.Unmarshaled.envoy["user-agent"]
              - parsed: target_fqdn
                expression: evt.Unmarshaled.envoy[":authority"]
              - meta: service
                value: http
              - meta: log_type
                value: http_access-log
              - meta: source_ip
                expression: evt.Parsed.remote_addr
              - meta: http_status
                expression: evt.Parsed.status
              - meta: http_path
                expression: evt.Parsed.request
              - meta: http_verb
                expression: evt.Parsed.verb
              - meta: http_user_agent
                expression: evt.Parsed.http_user_agent
              - meta: target_fqdn
                expression: evt.Parsed.target_fqdn
        s02-enrich:
          envoy-418-whitelist.yaml: |-
            name: hydaz/envoy-418-whitelist
            description: "Whitelist 418 responses from the envoy bouncer to prevent processing already banned IPs"
            filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
            whitelist:
              reason: "envoy bouncer response to already banned ips"
              expression:
                - "evt.Meta.http_status == '418'"
          pseudo-ipv4-whitelist.yaml: |-
            name: hydaz/pseudo-ipv4-whitelist
            description: "Cloudflare Pseudo IPv4 rewrites IPv6 clients to class E; a ban on one synthetic address blocks every IPv6 client sharing it"
            # Dormant guard: Pseudo IPv4 is off as of 2026-09-02 (XFF carries real IPv6).
            # While it was on, the cost of this whitelist was that no IPv6 client was policed at all.
            filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
            whitelist:
              reason: "synthetic address, not a real client"
              cidr:
                - "240.0.0.0/4"
          # s02-enrich runs in filename order; this must sort after http-logs.yaml
          spa-api-requests.yaml: |-
            name: hydaz/spa-api-requests
            description: "One Jellyfin home screen is 46 distinct extensionless API calls in 10s; http-crawl-non_statics caps at 40 per 20s and bans the client"
            # 2xx only: these endpoints 401 without a token, and enumeration shows up as 4xx for http-probing
            filter: "evt.Meta.target_fqdn in ['jellyfin.${SECRET_DOMAIN}', 'jellyseerr.${SECRET_DOMAIN}'] && evt.Meta.http_verb in ['GET', 'HEAD'] && evt.Meta.http_status startsWith '2'"
            statics:
              - parsed: static_ressource
                value: "true"
      notifications:
        alertmanager.yaml: |-
          type: http
          name: alertmanager
          # Alertmanager already groups before anything reaches discord, so no plugin-side
          # batching; max_retry stays because a dropped ban notification is a lost signal
          max_retry: 3
          # Every value goes through toJson: the URL and user-agent are attacker-controlled
          format: |
            [{{range $i, $a := .}}{{if $i}},{{end}}{
              "labels": {
                "alertname": "CrowdsecDecision",
                "severity": "warning",
                "scenario": {{$a.GetScenario | toJson}},
                "source_ip": {{$a.Source.IP | toJson}}
              },
              "annotations": {
                "summary": {{$a.GetScenario | toJson}},
                "client": {{printf "%s (%s / %s)" $a.Source.IP $a.Source.Cn $a.Source.AsName | toJson}},
                "request": {{if $a.Events}}{{$e := index $a.Events 0}}{{printf "%s %s%s %s (%s)" ($e.GetMeta "http_verb") ($e.GetMeta "target_fqdn") ($e.GetMeta "http_path") ($e.GetMeta "http_status") ($e.GetMeta "http_user_agent") | toJson}}{{else}}"none"{{end}}
              },
              "startsAt": {{$a.StartAt | toJson}}
            }{{end}}]
          url: http://vmalertmanager-victoria-metrics.observability.svc.cluster.local:9093/api/v2/alerts
          method: POST
          headers:
            Content-Type: application/json
      config.yaml.local: |-
        api:
          server:
            auto_registration:
              enabled: true
              token: $${REGISTRATION_TOKEN}
              allowed_ranges:
                - ${POD_CIDR}
        db_config:
          type: postgresql
          user: $${DB_USERNAME}
          password: $${DB_PASSWORD}
          db_name: $${DB_NAME}
          host: $${DB_HOST}
          port: 5432
      profiles.yaml: |-
        name: default_ip_remediation
        debug: false
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
          - type: ban
            duration: 24h
        # Only locally-generated alerts reach profiles; CAPI blocklist pulls (15k IPs every 2h) do not
        notifications:
          - alertmanager
        on_success: break
    tls:
      enabled: true
      certManager:
        # appsec-certificate.yaml emits secretTemplate.annotations unconditionally;
        # empty renders as null and cert-manager rejects it, so keep one entry here
        secretTemplate:
          annotations:
            app.kubernetes.io/managed-by: crowdsec
    lapi:
      # Reloader reads workload metadata, not pod-template annotations
      deployAnnotations:
        reloader.stakater.com/auto: "true"
      # CPU only: chart default 500m vs ~13m observed; memory left at chart default
      resources:
        requests:
          cpu: 100m
      strategy:
        type: RollingUpdate
      env:
        - name: TZ
          value: ${TIMEZONE}
        # LAPI defaults to agent-ou only; the appsec client cert carries appsec-ou
        - name: AGENTS_ALLOWED_OU
          value: agent-ou,appsec-ou
        - name: ENROLL_INSTANCE_NAME
          value: cluster
        - name: DB_TYPE
          value: postgresql
        - name: DB_PORT
          value: "5432"
      envFrom:
        - secretRef:
            name: crowdsec-secret
      persistentVolume:
        data:
          enabled: false
        config:
          enabled: false
      metrics:
        serviceMonitor:
          enabled: true
    agent:
      daemonsetAnnotations:
        reloader.stakater.com/auto: "true"
      startupProbe:
        initialDelaySeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: 100m
      acquisition:
        # Only the gateway the SecurityPolicy enforces on; envoy-internal/-tls have no
        # bouncer, so their alerts would ban at the external gateway only
        - namespace: network
          podName: envoy-external-*
          program: envoy
          poll_without_inotify: true
      env:
        - name: COLLECTIONS
          value: >-
            crowdsecurity/base-http-scenarios
            crowdsecurity/http-cve
        - name: PARSERS
          value: crowdsecurity/cri-logs
        - name: TZ
          value: ${TIMEZONE}
      metrics:
        serviceMonitor:
          enabled: true
    appsec:
      enabled: true
      deployAnnotations:
        reloader.stakater.com/auto: "true"
      # CPU only, as for lapi/agent: chart default 500m vs 3m observed
      resources:
        requests:
          cpu: 100m
      # Serves the envoy bouncer's WAF calls on crowdsec-appsec-service:7422
      acquisitions:
        - source: appsec
          listen_addr: 0.0.0.0:7422
          path: /
          appsec_config: crowdsecurity/appsec-default
          labels:
            type: appsec
      env:
        - name: COLLECTIONS
          value: crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      metrics:
        serviceMonitor:
          enabled: true

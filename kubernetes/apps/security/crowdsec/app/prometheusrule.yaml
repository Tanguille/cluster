---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crowdsec-rules
spec:
  groups:
    - name: crowdsec.rules
      rules:
        # The envoy parser reads Envoy Gateway's implicit default JSON access-log schema.
        # A release that renames a field parses nothing while every liveness probe stays green.
        - alert: CrowdsecEnvoyParserYieldZero
          expr: |-
            sum(rate(cs_node_hits_ok_total{name="crowdsecurity/cri-logs"}[15m])) > 0.05
            and
            (sum(rate(cs_node_hits_ok_total{name="hydaz/envoy-logs"}[15m])) or vector(0)) == 0
          for: 15m
          annotations:
            summary: >-
              Crowdsec is reading envoy container logs but parsing none of them — detection is blind
              while the agent, lapi and bouncer all report healthy
          labels:
            severity: critical
        - alert: CrowdsecAppsecAbsent
          expr: |-
            absent(up{job="crowdsec-appsec-service"})
          for: 10m
          annotations:
            summary: >-
              Crowdsec appsec engine is down — the bouncer's WAF calls fail open (requests pass uninspected)
          labels:
            severity: warning
        # Central API auth failures (401/403) stop the 2h blocklist pull silently; the ~23k community
        # decisions then expire and this series drops to zero
        - alert: CrowdsecCommunityBlocklistEmpty
          expr: |-
            (sum(cs_active_decisions{origin="CAPI"}) or vector(0)) < 1000
          for: 30m
          annotations:
            summary: >-
              Crowdsec community blocklist is nearly empty — Central API pulls are failing,
              check `cscli capi status` and the lapi logs for 401/403
          labels:
            severity: warning

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crowdsec-rules
spec:
  groups:
    - name: crowdsec.rules
      rules:
        # The envoy parser reads Envoy Gateway's implicit default JSON access-log schema.
        # A release that renames a field parses nothing while every liveness probe stays green.
        - alert: CrowdsecEnvoyParserYieldZero
          expr: |-
            sum(rate(cs_kubernetessource_hits_total{job="crowdsec-agent-service"}[15m])) > 0.05
            and
            (sum(rate(cs_node_hits_ok_total{job="crowdsec-agent-service",name="hydaz/envoy-logs"}[15m])) or vector(0)) == 0
          for: 15m
          annotations:
            summary: >-
              Crowdsec is reading envoy container logs but parsing none of them — detection is blind
              while the agent, lapi and bouncer all report healthy
          labels:
            severity: critical
        # The parser yield alert requires input. Sum the native Kubernetes sources to catch
        # acquisition going quiet across the DaemonSet.
        - alert: CrowdsecAcquisitionSilent
          expr: |-
            (sum(rate(cs_kubernetessource_hits_total{job="crowdsec-agent-service"}[15m])) or vector(0)) < 0.01
          for: 30m
          annotations:
            summary: >-
              Crowdsec acquisition for envoy-external has stayed below 0.01 lines/s for 30m
          labels:
            severity: critical
        # Each Envoy pod polls LAPI independently. The owner metric also covers pods that never synced.
        - alert: CrowdsecBouncerLAPIDisconnected
          expr: |-
            group by (pod) (kube_pod_owner{namespace="network",owner_kind="DaemonSet",owner_name="envoy-external"})
            unless on (pod)
            (increase(envoy_cluster_upstream_rq{namespace="network",envoy_cluster_name="envoyextensionpolicy/network/crowdsec-wasm/backend/lapi/gateway/network/envoy-external/0",envoy_response_code="200"}[5m]) > 0)
          for: 10m
          annotations:
            summary: >-
              External Envoy pod {{ $labels.pod }} has stopped receiving successful CrowdSec LAPI responses
              or its metrics are missing. Cached bans may still apply.
          labels:
            severity: critical
        # AppSec allows with 200 and denies with 403. Transport counters have no response-code label.
        # Cluster names are generated by Envoy Gateway; keep them in sync with extensions.yaml.
        - alert: CrowdsecWAFFailingOpen
          expr: |-
            sum by (pod) (increase({
              __name__=~"envoy_cluster_upstream_(rq|rq_timeout|rq_rx_reset|cx_connect_fail)",
              namespace="network",
              envoy_cluster_name="envoyextensionpolicy/network/crowdsec-wasm/backend/appsec/gateway/network/envoy-external/0",
              envoy_response_code!~"200|403"
            }[5m])) > 0
          for: 10m
          annotations:
            summary: >-
              External Envoy pod {{ $labels.pod }} is failing CrowdSec AppSec calls and allowing requests without inspection.
          labels:
            severity: warning
        - alert: CrowdsecAppsecAbsent
          expr: |-
            absent(up{job="crowdsec-appsec-service"})
          for: 10m
          annotations:
            summary: >-
              Crowdsec appsec engine is down — the bouncer's WAF calls fail open (requests pass uninspected)
          labels:
            severity: warning
        - alert: CrowdsecLapiDown
          expr: |-
            absent(up{job="crowdsec-service"} == 1)
          for: 10m
          annotations:
            summary: >-
              Crowdsec LAPI is not scraped as up — decisions and the community blocklist metric are unavailable
          labels:
            severity: warning
        # Central API auth failures (401/403) stop the 2h blocklist pull silently; the community
        # decisions then expire and this series drops to zero. The zero fallback only applies while LAPI
        # is scraped up, so a scrape outage does not read as an empty blocklist (CrowdsecLapiDown covers it).
        - alert: CrowdsecCommunityBlocklistEmpty
          expr: |-
            (sum(cs_active_decisions{origin="CAPI"}) or (vector(0) and on() (max(up{job="crowdsec-service"}) == 1))) < 1000
          for: 30m
          annotations:
            summary: >-
              Crowdsec community blocklist is nearly empty — Central API pulls are failing,
              check `cscli capi status` and the lapi logs for 401/403
          labels:
            severity: warning
        # The importer has no metrics: a dead run only shows once its 24h bans expire.
        - alert: CrowdsecBlocklistImportEmpty
          expr: |-
            (sum(cs_active_decisions{origin="blocklist-import"}) or (vector(0) and on() (max(up{job="crowdsec-service"}) == 1))) < 1000
          for: 1h
          annotations:
            summary: >-
              Crowdsec blocklist-import bans have lapsed: the hourly importer is failing,
              check the crowdsec-blocklist-import logs
          labels:
            severity: warning

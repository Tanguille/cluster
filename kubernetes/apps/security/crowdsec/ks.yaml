---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
  namespace: &namespace security
spec:
  dependsOn:
    - name: cloudnative-pg-databases
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/security/crowdsec/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-bouncers
  namespace: &namespace security
spec:
  dependsOn:
    - name: crowdsec
  interval: 1h
  path: ./kubernetes/apps/security/crowdsec/bouncers/envoy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app crowdsec-web-ui
  namespace: &namespace security
spec:
  dependsOn:
    - name: crowdsec
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/security/crowdsec/web-ui
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 1Gi
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-blocklist-import
  namespace: &namespace security
spec:
  dependsOn:
    - name: crowdsec
  interval: 1h
  path: ./kubernetes/apps/security/crowdsec/blocklist-import
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true

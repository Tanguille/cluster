---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trivy-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: trivy-operator
  values:
    fullnameOverride: *app
    operator:
      # Node collector can't run on Talos (read-only rootfs: mkdir /etc/systemd
      # fails), so disable infra assessment. Keeps image vuln, config audit
      # (workload), RBAC and secret scanning. Loses node CIS InfraAssessmentReports.
      infraAssessmentScannerEnabled: false
      # Chart default 24h re-creates every report each cycle; workload changes still rescan.
      scannerReportTTL: "48h"
      # ~570KiB SbomReports, never TTL-pruned, re-created ~860x/day fragmented etcd; nothing reads them.
      sbomGenerationEnabled: false
    # Expose the /metrics endpoint to Prometheus via a ServiceMonitor.
    serviceMonitor:
      enabled: true
    # Scan Jobs throttle at the chart-default 500m limit (kguardian
    # cpu-throttled, 100% sustained across scans); raise the ceiling so
    # scans finish faster. Requests stay at defaults; Jobs are short-lived.
    trivy:
      resources:
        limits:
          cpu: 1000m
      # Full reports exceeded the 2MB gRPC limit and looped the operator into
      # OOM (aquasecurity/trivy-operator#757). LOW/MEDIUM findings are not stored.
      severity: HIGH,CRITICAL
      # Chart default true scans single-threaded, leaving the 1000m limit idle.
      slow: false
    # Per-run runner pods and AI jobs are scanned then discarded. Also skips
    # persistent AI workloads, which get no image scanning elsewhere.
    excludeNamespaces: "actions-runner-system,ai"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        # ~800Mi steady during scan storms.
        memory: 2Gi

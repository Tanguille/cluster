---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trivy-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: trivy-operator
  values:
    fullnameOverride: *app
    operator:
      # Node collector can't run on Talos (read-only rootfs: mkdir /etc/systemd
      # fails), so disable infra assessment. Keeps image vuln, config audit
      # (workload), RBAC and secret scanning. Loses node CIS InfraAssessmentReports.
      infraAssessmentScannerEnabled: false
    # Expose the /metrics endpoint to Prometheus via a ServiceMonitor.
    serviceMonitor:
      enabled: true
    # Scan Jobs throttle at the chart-default 500m limit (kguardian
    # cpu-throttled, 100% sustained across scans); raise the ceiling so
    # scans finish faster. Requests stay at defaults; Jobs are short-lived.
    trivy:
      resources:
        limits:
          cpu: 1000m
      # A single Hermes cron-job report (145 vulns, mostly LOW/MEDIUM) reached
      # 2.8MB and broke the Job reconciler (gRPC "message larger than max",
      # upstream aquasecurity/trivy-operator#757); the resulting failed
      # reconcile loop pinned the operator near its memory limit until it was
      # OOMKilled. Filter to HIGH/CRITICAL so report size stays bounded;
      # LOW/MEDIUM image findings are no longer stored as VulnerabilityReport
      # entries (trade-off accepted 2026-09-24).
      severity: HIGH,CRITICAL
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        # Raised 1Gi -> 2Gi: operator ran at ~800Mi steady state during
        # scan storms and OOMKilled on 2026-09-24 while retrying oversized
        # reports.
        memory: 2Gi
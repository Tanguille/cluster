---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: trivy-operator
  values:
    operator:
      # Node collector fails on Talos (read-only rootfs: mkdir /etc/systemd); node and control-plane CIS reports are lost.
      infraAssessmentScannerEnabled: false
      # Chart default 24h re-creates every report each cycle; workload changes still rescan.
      scannerReportTTL: "48h"
      # ~570KiB SbomReports, never TTL-pruned, re-created ~860x/day fragmented etcd; nothing reads them.
      sbomGenerationEnabled: false
      # Standalone scan Jobs each download the vuln DB (~1.6GiB/scan); one server keeps one copy.
      builtInTrivyServer: true
      # Default 10 bursts writes on the scanning node; 2 spreads the queue out.
      scanJobsConcurrentLimit: 2
    # Each Job run is a new scan target (~1500/day); CronJobs still report from their job template.
    targetWorkloads: "pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob"
    serviceMonitor:
      enabled: true
    # Scan Jobs sat 100% CPU-throttled at the chart-default 500m limit (kguardian).
    trivy:
      resources:
        limits:
          cpu: 1000m
      image:
        # Spelled out so Renovate tracks the digest.
        registry: mirror.gcr.io
        repository: aquasec/trivy
        tag: 0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      # Full reports exceeded the 2MB gRPC limit and looped the operator into
      # OOM (aquasecurity/trivy-operator#757). LOW/MEDIUM findings are not stored.
      severity: HIGH,CRITICAL
      # Chart default true scans single-threaded, leaving the 1000m limit idle.
      slow: false
      # Server DB is a re-downloadable cache; emptyDir avoids a Ceph PVC.
      storageClassEnabled: false
      server:
        resources:
          requests:
            memory: 256Mi
    # Per-run runner pods and AI jobs are scanned then discarded. Also skips
    # persistent AI workloads, which get no image scanning elsewhere.
    excludeNamespaces: "actions-runner-system,ai"
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        # Working set peaks at 511Mi over 30d.
        memory: 2Gi

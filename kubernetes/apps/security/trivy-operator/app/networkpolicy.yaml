---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-server-ingress-allowlist
spec:
  # Unauthenticated server whose cache clients write to: only scan Jobs may reach it.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: security
            app.kubernetes.io/managed-by: trivy-operator
    # Rev-NAT'd DNS replies hit ingress; the server resolves the DB registry.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
    # kubelet probes.
    - fromEntities:
        - host

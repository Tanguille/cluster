---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-blocklist-import
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      # The image's USER is the name "blocklist", which runAsNonRoot can't verify
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      crowdsec-blocklist-import:
        containers:
          app:
            image:
              repository: ghcr.io/wolffcatskyy/crowdsec-blocklist-import
              tag: 3.9.0
            env:
              CROWDSEC_LAPI_URL: https://crowdsec-service.security.svc.cluster.local:8080
              # Chart-issued client certs: agent-ou writes decisions, bouncer-ou reads them for dedup
              CROWDSEC_LAPI_CA_CERT_PATH: /certs/agent/ca.crt
              CROWDSEC_LAPI_AGENT_CERT_PATH: /certs/agent/tls.crt
              CROWDSEC_LAPI_AGENT_KEY_PATH: /certs/agent/tls.key
              CROWDSEC_LAPI_BOUNCER_CERT_PATH: /certs/bouncer/tls.crt
              CROWDSEC_LAPI_BOUNCER_KEY_PATH: /certs/bouncer/tls.key
              INTERVAL: 3600
              # Drops the feeds with false-positive history (Firehol level3, VXVault, Tor)
              PRESET: server
              # kritika and renovate take GitHub webhook deliveries on envoy-external
              ALLOWLIST_GITHUB: true
              # Both default on: telemetry pings a third-party endpoint, metrics push to a nonexistent Pushgateway
              TELEMETRY_ENABLED: false
              METRICS_ENABLED: false
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    persistence:
      agent-tls:
        type: secret
        name: crowdsec-agent-tls
        globalMounts:
          - path: /certs/agent
      bouncer-tls:
        type: secret
        name: crowdsec-bouncer-tls
        globalMounts:
          - path: /certs/bouncer

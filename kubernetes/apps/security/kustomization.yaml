# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security

components:
  - ../../components/common
  - ../../components/psa-privileged

resources:
  - ./crowdsec/ks.yaml

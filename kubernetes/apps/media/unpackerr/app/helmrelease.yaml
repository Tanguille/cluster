---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  valuesFrom:
    - kind: ConfigMap
      name: affinity-control-1
    - kind: ConfigMap
      name: nfs-media

  values:
    controllers:
      unpackerr:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: v1.0.1@sha256:22b4693fbeaae4bd927905d63b59b8f67b4a1446682d965ac876c61a48976658
            env:
              TZ: ${TIMEZONE}
              UN_WEBSERVER_METRICS: true
              UN_WEBSERVER_API_KEYS_0_NAME: prometheus
              UN_WEBSERVER_API_KEYS_0_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-secret
                    key: metrics-key
              UN_WEBSERVER_API_KEYS_0_ROLES_0: prometheus
              UN_WEBSERVER_ROLES_prometheus_PERMISSIONS_0: system:metrics:read
              UN_WEBSERVER_UI_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-secret
                    key: ui-password
              UN_ACTIVITY: true
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local
              UN_SONARR_0_PATHS_0: /media/Downloads/tv-sonarr
              # Default 1m start delay + ~1-2m extraction time gave Sonarr's own
              # completed-download scan a window to import a bundled Sample/ file
              # before the real episode was extracted. Shrinking the delay narrows it.
              UN_SONARR_0_START_DELAY: 10s
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local
              UN_RADARR_0_PATHS_0: /media/Downloads/radarr
              UN_RADARR_0_START_DELAY: 10s
              UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
              UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
            probes:
              startup:
                enabled: true
                spec:
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 20
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Unpackerr
          gethomepage.dev/description: Archive extraction daemon
          gethomepage.dev/group: Processing
          gethomepage.dev/icon: unpackerr.png
          gethomepage.dev/href: https://unpackerr.${SECRET_DOMAIN}
          gethomepage.dev/widget.type: unpackerr
          gethomepage.dev/widget.url: http://unpackerr.media.svc.cluster.local:5656
        ports:
          http:
            port: 5656

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    serviceMonitor:
      app:
        endpoints:
          - port: http
            interval: 1m
            authorization:
              credentials:
                name: unpackerr-secret
                key: metrics-key

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unpackerr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  valuesFrom:
    - kind: ConfigMap
      name: affinity-control-1
    - kind: ConfigMap
      name: nfs-media

  values:
    controllers:
      unpackerr:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: v0.16.1@sha256:406586865431b40b29353d899fb75a788f5384743f7f381444db5fe55d206914
            env:
              TZ: ${TIMEZONE}
              UN_WEBSERVER_METRICS: true
              UN_WEBSERVER_LOG_FILE: /logs/webserver.log
              UN_ACTIVITY: true
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local
              UN_SONARR_0_PATHS_0: /media/Downloads/tv-sonarr
              # Default 1m start delay + ~1-2m extraction time gave Sonarr's own
              # completed-download scan a window to import a bundled Sample/ file
              # before the real episode was extracted. Shrinking the delay narrows it.
              UN_SONARR_0_START_DELAY: 10s
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local
              UN_RADARR_0_PATHS_0: /media/Downloads/radarr
              UN_RADARR_0_START_DELAY: 10s
              UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
              UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 5656
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 20
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                cpu: 100m
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: *app
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Unpackerr
          gethomepage.dev/description: Archive extraction daemon
          gethomepage.dev/group: Processing
          gethomepage.dev/icon: unpackerr.png
          gethomepage.dev/widget.type: unpackerr
          gethomepage.dev/widget.url: http://unpackerr.media.svc.cluster.local:5656
        ports:
          http:
            port: 5656

    serviceMonitor:
      app:
        endpoints:
          - port: http
            interval: 1m
            scrapeTimeout: 10s

    persistence:
      logs:
        type: emptyDir

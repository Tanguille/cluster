---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: bitmagnet-postgres
spec:
  repository:
    kind: ClusterRepository
    name: kopia-nas
  copyMethod: Snapshot
  sources:
    - pvc:
        name: bitmagnet-pgdata
  mover:
    securityContext:
      runAsUser: 70
      runAsGroup: 70
  hooks:
    beforeSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: bitmagnet
              app.kubernetes.io/controller: postgres
          container: postgres
          timeout: 15m
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              mkdir -p /var/lib/postgresql/backup
              pg_dump -U postgres -d bitmagnet -Fc -f /var/lib/postgresql/backup/bitmagnet.dump.tmp
              mv /var/lib/postgresql/backup/bitmagnet.dump.tmp /var/lib/postgresql/backup/bitmagnet.dump
  # CSI snapshots preserve the entire PGDATA + WAL; the atomic logical dump
  # supplies a second recovery path without unsafe online filesystem copying.
  volumeSnapshotClassName: csi-ceph-blockpool
  credentialProjection:
    enabled: true
  compression:
    compressor: zstd
  retention:
    keepHourly: 24
    keepDaily: 7
  files:
    ignoreRules: [/lost+found, /backup/bitmagnet.dump.tmp]
  verification:
    quick:
      schedule:
        cron: 0 3 * * 0
        jitter: 3h
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: bitmagnet-postgres
spec:
  policyRef:
    name: bitmagnet-postgres
  schedule:
    cron: H * * * *
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: armiger-connector
spec:
  repository:
    kind: ClusterRepository
    name: kopia-nas
  copyMethod: Snapshot
  sources:
    - pvc:
        name: armiger-connector-data
  mover:
    securityContext:
      runAsUser: 568
      runAsGroup: 568
  volumeSnapshotClassName: csi-ceph-blockpool
  credentialProjection:
    enabled: true
  compression:
    compressor: zstd
  retention:
    keepHourly: 24
    keepDaily: 7
  files:
    ignoreRules: [/lost+found]
  verification:
    quick:
      schedule:
        cron: 0 3 * * 0
        jitter: 3h
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: armiger-connector
spec:
  policyRef:
    name: armiger-connector
  schedule:
    cron: H * * * *

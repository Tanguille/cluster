---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bitmagnet
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      bitmagnet:
        forceRename: *app
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/bitmagnet-io/bitmagnet
              tag: v0.10.1@sha256:b6373349a30193b436ce6b05e21f91aa4934074268105dded1f3b065b8c86f19
            args:
              [
                worker,
                run,
                --keys=http_server,
                --keys=queue_server,
                --keys=dht_crawler
              ]
            env:
              POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
              HOME: /tmp
              POSTGRES_NAME: bitmagnet
              POSTGRES_USER: bitmagnet
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bitmagnet-postgres
                    key: POSTGRES_PASSWORD
              # Personal key (shared with Jellyfin Enhanced) lifts bitmagnet's 1 req/s default-key throttle.
              TMDB_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bitmagnet-postgres
                    key: TMDB_API_KEY
            # No hostPort: media enforces PSA baseline. DHT crawls outbound through NAT; inbound would need an LB IP.
            probes:
              # Chart default handler: TCP on the primary service port (http 3333).
              readiness: &bitmagnet-probe
                enabled: true
                spec:
                  periodSeconds: 15
                  timeoutSeconds: 5
              liveness: *bitmagnet-probe
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  timeoutSeconds: 5
            resources:
              requests: { cpu: 250m, memory: 512Mi }
              limits: { memory: 2Gi }
            securityContext: &container-security
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
      connector:
        forceRename: armiger-connector
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          bootstrap:
            image: &python-image
              repository: docker.io/library/python
              tag: 3.14-slim@sha256:35caba83af2fe6da9a5d922f9b0156f21d1246a48278c58a08bd253303ba42e8
            command: [python3, /bootstrap/bootstrap.py]
            env:
              HOME: /tmp
              HF_HOME: /tmp/huggingface
              # Bump either version suffix to reinstall; old dirs are kept for rollback.
              ARMIGER_RUNTIME_DIR: &runtime-dir /data/armiger/runtime-v2
              ARMIGER_MODEL_DIR: &model-dir /data/armiger/model-cdf7036c45a0d9751d18e738c7abfde485552964
            securityContext: *container-security
        containers:
          app:
            image: *python-image
            command:
              [
                $(ARMIGER_RUNTIME_DIR)/venv/bin/python3,
                $(ARMIGER_RUNTIME_DIR)/bitmagnet_connector.py
              ]
            env:
              HOME: /tmp
              PYTHONDONTWRITEBYTECODE: "1"
              ARMIGER_RUNTIME_DIR: *runtime-dir
              ARMIGER_MODEL_DIR: *model-dir
              # Init downloads a fixed revision; never execute a floating HF bundle.
              ARMIGER_AUTO_DOWNLOAD: "false"
              # Unset ARMIGER_* tuning (mode both, malware pruning on, 5s poll) uses the pinned connector's defaults.
              ARMIGER_CONNECTOR_PORT: "8096"
              ARMIGER_PROXY_PORT: "8097"
              BITMAGNET_GRAPHQL_URL: http://bitmagnet:3333/graphql
              UPSTREAM_TORZNAB_URL: http://bitmagnet:3333/torznab
            probes:
              readiness: &connector-probe
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: 8096 }
                  periodSeconds: 15
                  timeoutSeconds: 5
              liveness: *connector-probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: 8096 }
                  failureThreshold: 90
                  timeoutSeconds: 5
            resources:
              requests: { cpu: 250m, memory: 1Gi }
              limits: { memory: 3Gi }
            securityContext: *container-security
    service:
      app:
        forceRename: *app
        controller: bitmagnet
        ports:
          http: { port: 3333 }
      connector:
        forceRename: armiger-connector
        controller: connector
        ports:
          bridge: { port: 8096 }
          torznab-proxy: { port: 8097 }
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      connector-data:
        type: persistentVolumeClaim
        forceRename: armiger-connector-data
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ceph-block
        retain: true
        advancedMounts:
          connector:
            bootstrap:
              - path: /data/armiger
            app:
              - path: /data/armiger
      bootstrap:
        type: configMap
        name: armiger-bootstrap
        advancedMounts:
          connector:
            bootstrap:
              - path: /bootstrap
                readOnly: true
      tmp:
        type: emptyDir

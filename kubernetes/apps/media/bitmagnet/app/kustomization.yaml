---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - secret.sops.yaml
configMapGenerator:
  - name: bitmagnet-config
    files:
      - classifier.yml
  - name: armiger-bootstrap
    files:
      - bootstrap.py
      - requirements.txt
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled

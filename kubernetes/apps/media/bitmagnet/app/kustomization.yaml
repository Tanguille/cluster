---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - pvc.yaml
  - backup.yaml
  - networkpolicy.yaml
  - secret.sops.yaml
configMapGenerator:
  - name: armiger-bootstrap
    files:
      - bootstrap.py
      - requirements.txt
generatorOptions:
  disableNameSuffixHash: true

---
# Only Bitmagnet's DHT listener accepts peers outside the media ingress allowlist.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bitmagnet-dht
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: bitmagnet
      app.kubernetes.io/controller: bitmagnet
  ingress:
    - fromEntities: [world]
      toPorts:
        - ports:
            - port: "3334"
              protocol: TCP
            - port: "3334"
              protocol: UDP

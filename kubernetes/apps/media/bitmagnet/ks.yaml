---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bitmagnet
  namespace: &namespace media
spec:
  path: ./kubernetes/apps/media/bitmagnet/app
  targetNamespace: *namespace
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m

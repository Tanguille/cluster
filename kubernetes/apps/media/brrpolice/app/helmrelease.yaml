---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: brrpolice
spec:
  chartRef:
    kind: OCIRepository
    name: brrpolice
  interval: 1h
  values:
    config:
      qbittorrent:
        base_url: http://qbittorrent.media.svc.cluster.local
      http:
        port: 80
    extraEnv:
      - name: TZ
        value: ${TIMEZONE}
    # Keep uid/gid 1000 so the existing PVC (written as 1000 by the
    # previous deployment and by the kopiur backups) stays readable.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      existingClaim: brrpolice
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
    service:
      port: 80
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        namespace: observability

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: brrpolice
spec:
  chartRef:
    kind: OCIRepository
    name: brrpolice
  interval: 1h
  # The chart can't set datasources; without it the dashboard's DS_PROMETHEUS input falls back to the default datasource.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: GrafanaDashboard
              name: brrpolice-dashboard
            patch: |-
              apiVersion: grafana.integreatly.org/v1beta1
              kind: GrafanaDashboard
              metadata:
                name: brrpolice-dashboard
              spec:
                datasources:
                  - datasourceName: prometheus
                    inputName: DS_PROMETHEUS
  values:
    config:
      qbittorrent:
        base_url: http://qbittorrent.media.svc.cluster.local
      logging:
        level: warn
    persistence:
      existingClaim: brrpolice
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana

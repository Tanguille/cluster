---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: brrpolice
spec:
  chartRef:
    kind: OCIRepository
    name: brrpolice
  interval: 1h
  # Pins DS_PROMETHEUS like the hand-written dashboards; the chart can't, so it would ride on prometheus being the default.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: GrafanaDashboard
              name: brrpolice-dashboard
            patch: |-
              - op: add
                path: /spec/datasources
                value:
                  - datasourceName: prometheus
                    inputName: DS_PROMETHEUS
  values:
    config:
      qbittorrent:
        base_url: http://qbittorrent.media.svc.cluster.local
      logging:
        level: warn
    persistence:
      existingClaim: brrpolice
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana

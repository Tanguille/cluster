---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: brrpolice
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.16.4
      url: oci://ghcr.io/zariel/charts/brrpolice
  interval: 1h
  values:
    config:
      qbittorrent:
        base_url: http://qbittorrent.media.svc.cluster.local
      logging:
        level: warn
    persistence:
      existingClaim: brrpolice
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true

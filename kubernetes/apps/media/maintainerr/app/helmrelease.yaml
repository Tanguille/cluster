---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app maintainerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      maintainerr:
        containers:
          app:
            image:
              repository: ghcr.io/maintainerr/maintainerr
              tag: 3.32.0@sha256:144b59149ab9c64752e7f7428b6eb54c7f6faf5c987ec4025fe699b47b669d34
            env:
              TZ: ${TIMEZONE}
              # The app also sends an anonymous weekly usage report by default.
              TELEMETRY: "off"
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: &port 6246
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: *port
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 100Mi
              limits:
                cpu: 500m
                memory: 512Mi
    # The image bakes User: node (uid 1000); run as the same user so /opt/data lands 1000:1000.
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Maintainerr
          gethomepage.dev/description: Media stack maintenance
          gethomepage.dev/group: Management
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /opt/data

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-ingress-allowlist
spec:
  # Default-deny ingress for every media pod; per-pod allowlists (flaresolverr) union with it, egress stays open.
  endpointSelector: {}
  ingress:
    # Callers: homepage widgets (default), vmagent + *arr exporters (observability), envoy gateways (network), *arr tooling (media).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media
        - matchLabels:
            io.kubernetes.pod.namespace: default
        - matchLabels:
            io.kubernetes.pod.namespace: observability
        - matchLabels:
            io.kubernetes.pod.namespace: network
    # Router ICMP errors miss conntrack (their source isn't the peer); without them DHT waits out dead-peer timeouts.
    - icmps:
        - fields:
            - type: DestinationUnreachable
            - type: TimeExceeded
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-ingress-hermes
spec:
  # Hermes media triage: only the three apps it queries, only their API ports (allows union with the list above).
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - sonarr
          - qbittorrent
          - unpackerr
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "5656"
              protocol: TCP

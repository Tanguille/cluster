---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr-cleanup
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }

    controllers:
      seerr-cleanup:
        type: cronjob
        cronjob:
          timeZone: ${TIMEZONE}
          schedule: "@weekly"
          backoffLimit: 1
          # A kept failed Job holds KubeJobFailed until it is deleted (same as etcd-defrag).
          ttlSecondsAfterFinished: 3600
          activeDeadlineSeconds: 600
        containers:
          app:
            image:
              repository: python
              tag: 3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
            env:
              SEERR_API_KEY: ${SEERR_API_KEY}
              # Requests still pending approval after this many days are deleted.
              MAX_AGE_DAYS: "182"
              # Report only; flip to "false" once a run's list looks right.
              DRY_RUN: "true"
            command:
              - python3
              - -c
              - |
                import datetime, json, os, urllib.request

                base = "http://seerr.media.svc.cluster.local:5055/api/v1"
                dry = os.environ["DRY_RUN"] == "true"
                cutoff = datetime.datetime.now(datetime.UTC) - datetime.timedelta(days=int(os.environ["MAX_AGE_DAYS"]))

                def call(method, path):
                    req = urllib.request.Request(base + path, method=method,
                                                 headers={"X-Api-Key": os.environ["SEERR_API_KEY"], "Accept": "application/json"})
                    with urllib.request.urlopen(req, timeout=30) as resp:
                        body = resp.read()
                    return json.loads(body) if body else None

                stale, skip = [], 0
                while True:
                    page = call("GET", f"/request?filter=pending&sort=added&sortDirection=asc&take=100&skip={skip}")
                    for req in page["results"]:
                        # status 1 = pending approval; filter=pending also covers approved-but-not-available media.
                        if req["status"] == 1 and datetime.datetime.fromisoformat(req["createdAt"]) < cutoff:
                            stale.append(req)
                    skip += len(page["results"])
                    if not page["results"] or skip >= page["pageInfo"]["results"]:
                        break

                for req in stale:
                    media = req.get("media") or {}
                    who = (req.get("requestedBy") or {}).get("displayName")
                    print(f"{'would delete' if dry else 'deleting'} request {req['id']}: {req['createdAt'][:10]} by {who}, {media.get('mediaType')} tmdb {media.get('tmdbId')}")
                    if not dry:
                        call("DELETE", f"/request/{req['id']}")
                print(f"{len(stale)} pending requests older than {os.environ['MAX_AGE_DAYS']} days{' (dry run)' if dry else ' deleted'}")
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }

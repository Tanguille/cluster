---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr-cleanup
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }

    controllers:
      seerr-cleanup:
        type: cronjob
        cronjob:
          timeZone: ${TIMEZONE}
          schedule: "@weekly"
          backoffLimit: 1
          # A kept failed Job holds KubeJobFailed until it is deleted (same as etcd-defrag).
          ttlSecondsAfterFinished: 3600
          activeDeadlineSeconds: 600
        containers:
          app:
            image:
              repository: python
              tag: 3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
            env:
              SEERR_API_KEY: ${SEERR_API_KEY}
              # Requests still pending approval after this many days are deleted.
              MAX_AGE_DAYS: "182"
              # Report only; flip to "false" once a run's list looks right.
              DRY_RUN: "true"
            command:
              - python3
              - -c
              - |
                import datetime, json, os, urllib.error, urllib.request

                base = "http://seerr.media.svc.cluster.local:5055/api/v1"
                dry = os.environ.get("DRY_RUN") != "false"
                cutoff = datetime.datetime.now(datetime.UTC) - datetime.timedelta(days=int(os.environ["MAX_AGE_DAYS"]))

                def call(method, path):
                    req = urllib.request.Request(base + path, method=method,
                                                 headers={"X-Api-Key": os.environ["SEERR_API_KEY"], "Accept": "application/json"})
                    with urllib.request.urlopen(req, timeout=30) as resp:
                        body = resp.read()
                    return json.loads(body) if body else None

                stale, skip = [], 0
                while True:
                    page = call("GET", f"/request?filter=pending&sort=added&sortDirection=asc&take=100&skip={skip}")
                    for req in page["results"]:
                        # filter=pending already returns only status 1 (pending approval); the check guards the delete.
                        if req["status"] == 1 and datetime.datetime.fromisoformat(req["createdAt"]) < cutoff:
                            stale.append(req)
                    skip += len(page["results"])
                    if not page["results"] or skip >= page["pageInfo"]["results"]:
                        break

                deleted = skipped = failed = 0
                for req in stale:
                    media = req.get("media") or {}
                    who = (req.get("requestedBy") or {}).get("displayName")
                    label = f"request {req['id']}: {req['createdAt'][:10]} by {who}, {media.get('mediaType')} tmdb {media.get('tmdbId')}"
                    if dry:
                        print(f"would delete {label}", flush=True)
                        continue
                    try:
                        # DELETE does not require the request to still be pending: re-read it so one
                        # approved or declined since the listing is kept.
                        if call("GET", f"/request/{req['id']}")["status"] != 1:
                            print(f"skip {label}: no longer pending", flush=True)
                            skipped += 1
                            continue
                        call("DELETE", f"/request/{req['id']}")
                        print(f"deleted {label}", flush=True)
                        deleted += 1
                    except urllib.error.HTTPError as err:
                        # Another client may have removed the request since listing.
                        if err.code == 404:
                            print(f"skip {label}: already absent", flush=True)
                            skipped += 1
                            continue
                        print(f"failed {label}: HTTP {err.code}", flush=True)
                        failed += 1
                summary = "(dry run)" if dry else f"deleted {deleted}, skipped {skipped}, failed {failed}"
                print(f"{len(stale)} pending requests older than {os.environ['MAX_AGE_DAYS']} days: {summary}", flush=True)
                raise SystemExit(bool(failed))
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }

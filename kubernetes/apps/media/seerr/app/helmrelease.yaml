---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 3.11.0
      url: oci://ghcr.io/seerr-team/seerr/seerr-chart
  values:
    fullnameOverride: seerr
    # Chart 3.11.0 still defaults to appVersion v3.5.1; v3.5.2 fixes three security issues.
    image:
      tag: v3.5.2
      sha: aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    serviceAccount:
      # Seerr has no Kubernetes API integration.
      automount: false
    # ndots:5 search-expands names with under 5 dots before trying them absolute.
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    podSecurityContext:
      runAsNonRoot: true
      fsGroup: 568
      seccompProfile: { type: RuntimeDefault }
    # Chart defaults this container securityContext to uid/gid 1000; the PVC is owned by 568.
    securityContext:
      runAsUser: 568
      runAsGroup: 568
    resources:
      requests:
        cpu: 10m
        memory: 250Mi
      limits:
        cpu: 2
        memory: 1Gi
    extraEnv:
      - name: TZ
        value: ${TIMEZONE}
      - name: LOG_LEVEL
        value: info
    probes:
      livenessProbe:
        failureThreshold: 10
      readinessProbe:
        failureThreshold: 10
      startupProbe:
        httpGet:
          path: /api/v1/settings/public
          port: http
        failureThreshold: 30
        periodSeconds: 5
    service:
      port: 5055
    config:
      persistence:
        existingClaim: seerr
    volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir:
          medium: Memory
    volumeMounts:
      - name: logs
        mountPath: /app/config/logs
      - name: tmp
        mountPath: /tmp
    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Jellyseerr
          gethomepage.dev/description: Media requests
          gethomepage.dev/group: Requests
          gethomepage.dev/icon: jellyseerr.png
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=seerr
          gethomepage.dev/widget.type: jellyseerr
          gethomepage.dev/widget.url: http://seerr.media.svc.cluster.local:5055
          gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_JELLYSEERR_API_KEY}}"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
          - "jellyseerr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: seerr

  values:
    fullnameOverride: seerr
    podAnnotations:
      reloader.stakater.com/auto: "true"
    # ndots:5 search-expands names with under 5 dots before trying them absolute.
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      supplementalGroups: [10000]
      seccompProfile: { type: RuntimeDefault }
    # Chart defaults this container securityContext to uid/gid 1000, which
    # would silently override the pod-level 568 above (PVC is owned by 568).
    securityContext:
      runAsUser: 568
      runAsGroup: 568
    resources:
      requests:
        cpu: 10m
        memory: 250Mi
      limits:
        cpu: 2
        memory: 1Gi
    extraEnv:
      - name: TZ
        value: ${TIMEZONE}
      - name: LOG_LEVEL
        value: info
    probes:
      livenessProbe:
        failureThreshold: 10
      readinessProbe:
        failureThreshold: 10
      startupProbe:
        httpGet:
          path: /api/v1/settings/public
          port: http
        failureThreshold: 30
        periodSeconds: 5
    service:
      port: 5055
    config:
      persistence:
        existingClaim: seerr
    volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir:
          medium: Memory
    volumeMounts:
      - name: logs
        mountPath: /app/config/logs
      - name: tmp
        mountPath: /tmp
    route:
      main:
        enabled: true
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Jellyseerr
          gethomepage.dev/description: Media requests
          gethomepage.dev/group: Requests
          gethomepage.dev/icon: jellyseerr.png
          gethomepage.dev/widget.type: jellyseerr
          gethomepage.dev/widget.url: http://seerr.media.svc.cluster.local:5055
          gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_JELLYSEERR_API_KEY}}"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
          - "jellyseerr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network

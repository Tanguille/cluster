---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app fileflows
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  valuesFrom:
    # No affinity-control-1: the amd.com/gpu requirement below already pins this
    # to control-1, the only node carrying that label.
    - kind: ConfigMap
      name: nfs-media

  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: amd.com/gpu
                    operator: In
                    values: ["true"]
      securityContext:
        # revenz/fileflows entrypoint must start as root (apt/groupadd on boot),
        # then drops to PUID/PGID=568 itself. #3569 wrongly "simplified" this to 568.
        runAsUser: 0
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # 44=video, 226=render for VAAPI on /dev/dri
        supplementalGroups: [10000, 44, 226]
        seccompProfile: { type: RuntimeDefault }
      resourceClaims:
        - name: gpu
          resourceClaimName: shared-dgpu

    controllers:
      fileflows:
        initContainers:
          init-dirs:
            image:
              repository: busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command:
              - sh
              - -c
              - |
                mkdir -p /app/Data /app/Logs /app/ManuallyAdded /temp
                chown -R 0:0 /app /temp
            securityContext:
              runAsUser: 0

        containers:
          app:
            image:
              repository: revenz/fileflows
              tag: 26.10@sha256:76500dc4d3084871a31c6cecb191435895d9306c449f6f66f64cea7bad651135
            env:
              TZ: ${TIMEZONE}
              PUID: "568"
              PGID: "568"
            # tcp, not http: the .NET app answers / with a redirect to the
            # login flow, which is a weaker signal than the listener itself.
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5000
              readiness: *probe
              # The image apt-installs intel-media-va-driver-non-free on every boot before the app
              # listens (any /dev/dri triggers it); liveness alone killed it at ~30s.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5000
                  failureThreshold: 60
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
                # Transcode scratch lives on the container filesystem, ~1.3GiB
                # steady. With no request, usage-over-request ranking made this
                # the first pod kubelet evicted when control-1 brushed its
                # ephemeral-storage threshold (2026-08-20 19:40, exit 137).
                # No limit on purpose: a limit evicts the pod itself mid-transcode.
                ephemeral-storage: 2Gi
              limits:
                cpu: 2
                memory: 5Gi
              claims:
                - name: gpu

    service:
      fileflows:
        ports:
          http:
            port: 5000

    route:
      fileflows:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: FileFlows
          gethomepage.dev/description: Media transcoding pipeline
          gethomepage.dev/group: Processing
          gethomepage.dev/icon: fileflows.png
          gethomepage.dev/widget.type: fileflows
          gethomepage.dev/widget.version: "2"
          gethomepage.dev/widget.url: http://fileflows.media.svc.cluster.local:5000
          # v2 reads the Fenrus Dashboard Endpoint token (FileFlows > Settings > General).
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_FILEFLOWS_KEY}}`}}"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/Data

      temp:
        type: emptyDir

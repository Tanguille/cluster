---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recyclarr
  namespace: &namespace media
spec:
  path: ./kubernetes/apps/media/recyclarr/app
  targetNamespace: *namespace
  components:
    # backup only, not ../../../../components/kopiur: the PVC is chart-created
    # and already bound, so the restore component's PVC (dataSourceRef ->
    # passive Restore) would hit immutable-spec apply errors. uid is the
    # cluster-default 568, no override needed.
    - ../../../../components/kopiur/backup
  wait: false
  dependsOn:
    - name: sonarr
    - name: radarr
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  postBuild:
    substitute:
      APP: recyclarr

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
sonarr:
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series

    media_management:
      propers_and_repacks: do_not_prefer

    quality_profiles:
      - name: Any
        reset_unmatched_scores:
          enabled: true
        # 2160p TV Bluray is rare and huge: never grab it and stop upgrading at WEB 2160p,
        # like TRaSH's WEB-2160p profile. It stays listed so existing files rank above WEB 2160p.
        upgrade:
          allowed: true
          until_quality: WEB 2160p
        qualities:
          - name: Bluray-2160p
            enabled: false
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: Bluray-720p
          - name: HDTV-1080p
          - name: HDTV-720p
          - name: SDTV
          - name: DVD
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f # Anime
        reset_unmatched_scores:
          enabled: true

    custom_formats:
      - trash_ids:
          - 07a32f77690263bb9fda1842db7e273f # VOSTFR
        assign_scores_to:
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f
            score: -10000

    include:
      - config: Sonarr_Standard_Custom_Formats.yaml

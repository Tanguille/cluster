---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 9.0.0
      url: oci://ghcr.io/recyclarr/charts/recyclarr
  interval: 30m
  values:
    apiKey:
      value: ${RECYCLARR_API_KEY}
    # Generated by kustomize; the chart only rolls the pod for configmaps it renders itself.
    configs:
      existingConfigMap: recyclarr-configs
    includes:
      existingConfigMap: recyclarr-includes
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    env:
      - name: TZ
        value: ${TIMEZONE}
      - name: RADARR_API_KEY
        value: ${RADARR_API_KEY}
      - name: SONARR_API_KEY
        value: ${SONARR_API_KEY}
    persistence:
      state:
        storageClass: ceph-block
    serviceMonitor:
      enabled: true
      # State changes about once a day.
      interval: 5m
    # Upstream's server suggestion; resize from measured idle usage. v8 syncs broke 512Mi, hence the limit.
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 1Gi

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 9.0.0
      url: oci://ghcr.io/recyclarr/charts/recyclarr
  interval: 30m
  values:
    apiKey:
      existingSecret: recyclarr-api-key
    # The chart renders this into a configmap and rolls the pod when it changes.
    configs:
      files:
        recyclarr.yaml: |
          radarr:
            radarr:
              base_url: http://radarr.media.svc.cluster.local
              api_key: !env_var RADARR_API_KEY

              quality_definition:
                type: movie

              # The custom formats score repacks; preferring them would override release-group tiers.
              media_management:
                propers_and_repacks: do_not_prefer

              quality_profiles:
                # The guide profile is 2160p-only; 1080p is a fallback that still upgrades to Bluray-2160p.
                - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
                  reset_unmatched_scores:
                    enabled: true
                  qualities: &radarr_qualities
                    - name: Bluray-2160p
                    - name: WEB 2160p
                      qualities:
                        - WEBDL-2160p
                        - WEBRip-2160p
                    - name: Remux-1080p
                    - name: Bluray-1080p
                    - name: WEB 1080p
                      qualities:
                        - WEBDL-1080p
                        - WEBRip-1080p
                - name: 3D
                  upgrade:
                    allowed: true
                    until_quality: Bluray-2160p
                  qualities: *radarr_qualities

              custom_format_groups:
                add:
                  - trash_id: ff204bbcecdd487d1cefcefdbf0c278d # [Optional] Golden Rule UHD
                    select:
                      - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
                  - trash_id: f4f1474b963b24cf983455743aa9906c # [Optional] Movie Versions
                    select_all: true
                    assign_scores_to:
                      - trash_id: 64fb5f9858489bdac2af690e27c8f42f
                      - name: 3D
                  - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
                    select:
                      - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
                      - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
                      - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
                      - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
                      - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
                      - f537cf427b64c38c8e36298f657e4828 # Scene
                    assign_scores_to:
                      - trash_id: 64fb5f9858489bdac2af690e27c8f42f
                      - name: 3D

              custom_formats:
                - trash_ids:
                    - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
                  assign_scores_to:
                    - trash_id: 64fb5f9858489bdac2af690e27c8f42f
                      score: 0
                - trash_ids:
                    - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
                  assign_scores_to:
                    - name: 3D
                      score: 10000
                # With do_not_prefer, repacks only upgrade through these scores (guide defaults 5/6/7).
                - trash_ids:
                    - e7718d7a3ce595f289bfee26adc178f5 # Repack/Proper
                    - ae43b294509409a6a13919dedd4764c4 # Repack2
                    - 5caaaa1c08c1742aa4342d8c4cc463f2 # Repack3
                  assign_scores_to:
                    - name: 3D

          sonarr:
            sonarr:
              base_url: http://sonarr.media.svc.cluster.local
              api_key: !env_var SONARR_API_KEY

              quality_definition:
                type: series

              media_management:
                propers_and_repacks: do_not_prefer

              quality_profiles:
                - name: Any
                  reset_unmatched_scores:
                    enabled: true
                  # 2160p TV Bluray is rare and huge: never grab it and stop upgrading at WEB 2160p,
                  # like TRaSH's WEB-2160p profile. It stays listed so existing files rank above WEB 2160p.
                  upgrade:
                    allowed: true
                    until_quality: WEB 2160p
                  qualities:
                    - name: Bluray-2160p
                      enabled: false
                    - name: WEB 2160p
                      qualities:
                        - WEBDL-2160p
                        - WEBRip-2160p
                    - name: Bluray-1080p
                    - name: WEB 1080p
                      qualities:
                        - WEBDL-1080p
                        - WEBRip-1080p
                    - name: WEB 720p
                      qualities:
                        - WEBDL-720p
                        - WEBRip-720p
                    - name: Bluray-720p
                    - name: HDTV-1080p
                    - name: HDTV-720p
                    - name: SDTV
                    - name: DVD
                - trash_id: 20e0fc959f1f1704bed501f23bdae76f # Anime
                  reset_unmatched_scores:
                    enabled: true

              custom_formats:
                - trash_ids:
                    - 07a32f77690263bb9fda1842db7e273f # VOSTFR
                  assign_scores_to:
                    - trash_id: 20e0fc959f1f1704bed501f23bdae76f
                      score: -10000

                # High-Quality Audio Formats (Dolby Atmos / DTS-X compatible)
                - trash_ids:
                    - 0d7824bb924701997f874e7ff7d4844a # TrueHD ATMOS
                    - 9d00418ba386a083fbf4d58235fc37ef # DTS X
                    - b6fbafa7942952a13e17e2b1152b539a # ATMOS (undefined)
                    - 4232a509ce60c4e208d13825b7c06264 # DD+ ATMOS
                  assign_scores_to:
                    - name: Any
                      score: 1000

                # Lossless audio, and HDR (Required for HDR-capable equipment)
                - trash_ids:
                    - 1808e4b9cee74e064dfae3f1db99dbfe # TrueHD
                    - c429417a57ea8c41d57e6990a8b0033f # DTS-HD MA
                    - 505d871304820ba7106b693be6fe4a9e # HDR
                  assign_scores_to:
                    - name: Any
                      score: 500

                # Blocked: multi-episode (Optional), DV without HDR fallback, low quality and unwanted (Required), bad groups (Optional)
                - trash_ids:
                    - 7ba05c6e0e14e793538174c679126996 # Multi
                    - 9b27ab6498ec0f31a3353992e19434ca # DV (w/o HDR fallback)
                    - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
                    - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
                    - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
                    - fbcb31d8dabd2a319072b84fc0b7249c # Extras
                    - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
                    - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
                    - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
                    - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
                  assign_scores_to:
                    - name: Any
                      score: -10000

                - trash_ids:
                    - 7c3a61a9c6cb04f52f1544be6d44a026 # DV Boost
                  assign_scores_to:
                    - name: Any
                      score: 2000

                - trash_ids:
                    - 0c4b99df9206d2cfac3c05ab897dd62a # HDR10+ Boost
                  assign_scores_to:
                    - name: Any
                      score: 100

                # Miscellaneous (Required - prioritizes repack/proper releases); no score keeps the guide's 5/6/7
                - trash_ids:
                    - ec8fa7296b64e8cd390a1600981f3923 # Repack/Proper
                    - eb3d5cc0a2be0db205fb823640db6a3c # Repack v2
                    - 44e7c4de10ae50265753082e5dc76047 # Repack v3
                  assign_scores_to:
                    - name: Any

                # Streaming services (UHD) and the Streaming Boosts that must accompany them (Required)
                - trash_ids:
                    - d660701077794679fd59e8bdf4ce3a29 # AMZN
                    - f67c9ca88f463a48346062e8ad07713f # ATVP
                    - 77a7b25585c18af08f60b1547bb9b4fb # CC
                    - 36b72f59f4ea20aad9316f475f2d9fbb # DCU
                    - 89358767a60cc28783cdc3d0be9388a4 # DSNP
                    - a880d6abc21e7c16884f3ae393f84179 # HMAX
                    - 7a235133c87f7da4c8cccceca7e3c7a6 # HBO
                    - f6cce30f1733d5c8194222a7507909bb # HULU
                    - 0ac24a2a68a9700bcb7eeca8e5cd644c # iT
                    - 81d1fbf600e2540cee87f3a23f9d3c1c # MAX
                    - d34870697c9db575f17700212167be23 # NF
                    - c67a75ae4a1715f2bb4d492755ba4195 # PMTP
                    - 1656adc6d7bb2c8cca6acfb6592db421 # PCOK
                    - ae58039e1319178e6be73caab5c42166 # SHO
                    - 1efe8da11bfd74fbbcd4d8117ddb9213 # STAN
                    - 9623c5c9cac8e939c1b9aedd32f640bf # SYFY
                    - 43b3cf48cb385cd3eac608ee6bca7f09 # UHD Streaming Boost
                    - 218e93e5702f44a68ad9e3c6ba87d2f0 # HD Streaming Boost
                  assign_scores_to:
                    - name: Any
                      score: 75

                # WEB Tiers (Required - prioritizes quality WEB releases)
                - trash_ids:
                    - e6258996055b9fbab7e9cb2f75819294 # WEB Tier 01
                  assign_scores_to:
                    - name: Any
                      score: 1700

                - trash_ids:
                    - 58790d4e2fdcd9733aa7ae68ba2bb503 # WEB Tier 02
                  assign_scores_to:
                    - name: Any
                      score: 1650

                - trash_ids:
                    - d84935abd3f8556dcd51d4f27e22d0a6 # WEB Tier 03
                    - d0c516558625b04b363fa6c5c2c7cfd4 # WEB Scene
                  assign_scores_to:
                    - name: Any
                      score: 1600

                # Miscellaneous UHD (Optional - blocks SDR and x265 without HDR/DV)
                - trash_ids:
                    - 2016d1676f5ee13a5b7257ff86ac9a93 # SDR
                    - 83304f261cf516bb208c18c54c0adf97 # SDR (no WEBDL)
                    - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
                  assign_scores_to:
                    - name: Any
                      score: -100
    env:
      - name: TZ
        value: ${TIMEZONE}
      - name: RADARR_API_KEY
        value: ${RADARR_API_KEY}
      - name: SONARR_API_KEY
        value: ${SONARR_API_KEY}
    serviceMonitor:
      enabled: true
      # State changes about once a day.
      interval: 5m
    # Upstream's server suggestion; resize from measured idle usage. v8 syncs broke 512Mi, hence the limit.
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 1Gi

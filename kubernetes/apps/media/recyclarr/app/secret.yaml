---
# Kept out of Helm values: the chart's schema wants 32+ characters, which offline renders of the
# unsubstituted variable fail.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/secret_v1.json
apiVersion: v1
kind: Secret
metadata:
  name: recyclarr-api-key
type: Opaque
stringData:
  api-key: "${RECYCLARR_API_KEY}"

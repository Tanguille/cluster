---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wizarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      wizarr:
        containers:
          app:
            image:
              repository: ghcr.io/wizarrrr/wizarr
              tag: v2026.10.0@sha256:6ffcaa64f17c7c2fa9fc11b0b53b86c8309ebe081fc8ab4c9f31ae2c8d143bdd
            env:
              TZ: ${TIMEZONE}
              UV_CACHE_DIR: /tmp/.uv-cache
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 15m
                memory: 180Mi
              limits:
                cpu: 500m
                memory: 500Mi
    service:
      app:
        ports:
          http:
            port: 5690

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Wizarr
          gethomepage.dev/description: Jellyfin invitations
          gethomepage.dev/group: Requests
          gethomepage.dev/icon: wizarr.png
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data/database

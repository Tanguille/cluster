---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media

components:
  - ../../components/common
  - ../../components/deny-apiserver-egress
  - ../../components/ndots-1
  - ../../components/affinity-control-1
  - ../../components/psa-privileged
  - ../../components/kopiur/privileged-movers
# DRA requires resource.kubernetes.io/admin-access: "true" on the namespace so
# pods here can allocate the shared-dgpu ResourceClaim (media/jellyfin +
# fileflows). Same "not-used" placeholder trick as kube-system: Kustomize's
# namespace transformer renames it to "media" AFTER patches are applied.
patches:
  - target:
      kind: Namespace
      name: not-used
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          resource.kubernetes.io/admin-access: "true"
resources:
  - ./shared-dgpu-claim.yaml
  - ./bazarr/ks.yaml
  - ./brrpolice/ks.yaml
  - ./cleanrr/ks.yaml
  - ./deduparr/ks.yaml
  - ./fileflows/ks.yaml
  - ./flaresolverr/ks.yaml
  - ./jellyfin/ks.yaml
  - ./seerr/ks.yaml
  - ./jellystat/ks.yaml
  - ./prowlarr/ks.yaml
  - ./qbittorrent/ks.yaml
  - ./qbittorrent/tools/qbitrr/ks.yaml
  - ./qui/ks.yaml
  - ./radarr/ks.yaml
  - ./recyclarr/ks.yaml
  - ./sonarr/ks.yaml
  - ./unpackerr/ks.yaml
  - ./wizarr/ks.yaml

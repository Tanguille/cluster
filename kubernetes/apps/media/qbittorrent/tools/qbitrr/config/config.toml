# Minimal qBitrr config — only required and non-default values

[Settings]
# ConfigVersion: qBitrr schema version, Renovate-synced to the image tag without its -N suffix
ConfigVersion = "5.14.6"
# Self-updater (>=5.13) off: the image tag is GitOps-owned.
AutoUpdateEnabled = false
CompletedDownloadFolder = "/completed_downloads"
FreeSpaceFolder = "/completed_downloads"
# Desired free space in download dir (K/M/G/T, -1 = disable)
FreeSpace = "500G"
# Grace period for recheck/failed handling (seconds; default 180). Runtime stalled handling has a separate 15-minute grace.
IgnoreTorrentsYoungerThan = 600

[WebUI]
Host = "0.0.0.0"
Port = 6969

[qBit]
Host = "qbittorrent.media.svc.cluster.local"
Port = 80

[Sonarr-TV]
Managed = true
URI = "http://sonarr.media.svc.cluster.local"
# Doubled dollar on purpose: Flux postBuild unescapes it to a placeholder the envsubst init fills from qbitrr-secrets.
APIKey = "$${SONARR_API_KEY}"
Category = "tv-sonarr"
ReSearch = true
# Minutes; 0 = disable
RssSyncTimer = 5
RefreshDownloadsTimer = 5
# Treat only upgrade failures as blocklist-worthy: qBitrr removes files and reports failure to Arr.
# Exclude "Unable to determine if file is a sample": false positives on irregular-runtime
# content (e.g. reality TV) can remove good files and blocklist them.
ArrErrorCodesToBlocklist = [
  "Not an upgrade for existing episode file(s)",
  "Not a preferred word upgrade for existing episode file(s)"
]

[Sonarr-TV.EntrySearch]
# Off: each 15-min loop re-searched every missing/unmet item (~30k Prowlarr queries/day); Arr RSS grabs releases and upgrades.
SearchMissing = false
SearchLimit = 2
# Seconds between checking for new Overseerr/Ombi requests (default 300)
SearchRequestsEvery = 600
DoUpgradeSearch = false
QualityUnmetSearch = false
# Disabled: CustomFormatUnmetSearch still gates automatic deletion and Arr
# blocklisting when a torrent's custom-format score is below the library file,
# including manual overrides (confirmed through qBitrr v5.14.6-1).
# Arr RSS still grabs unmet and upgrade releases.
CustomFormatUnmetSearch = false
# true | false | "smart" (series vs episode search)
SearchBySeries = "smart"

[Sonarr-TV.EntrySearch.Overseerr]
SearchOverseerrRequests = true
OverseerrURI = "http://seerr.media.svc.cluster.local:5055"
OverseerrAPIKey = "${JELLYSEERR_API_KEY}"
# 4K instance
Is4K = true

[Sonarr-TV.Torrent]
FolderExclusionRegex = [
  "\\bextras?\\b",
  "\\bfeaturettes?\\b",
  "\\bsamples?\\b",
  "\\bscreens?\\b",
  "\\bnc(ed|op)?(\\\\d+)?\\b"
]
FileNameExclusionRegex = [
  "\\bncop\\\\d+?\\b",
  "\\bnced\\\\d+?\\b",
  "\\bsample\\b",
  "brarbg.com\\b",
  "\\btrailer\\b",
  "music video",
  "comandotorrents.com"
]
# No FileExtensionAllowlist: narrowing extensions made qBitrr treat RAR-multipart
# (.rar, .r00…, .nfo, .sfv), .avi/.mpg XviD, and similar releases as "all files
# excluded," deleting them and marking them failed in Sonarr (blocklist).
# FolderExclusionRegex/FileNameExclusionRegex still exclude samples and extras.
# Max remaining ETA in seconds before removal (604800 = 7 days)
MaximumETA = 604800
# Don't delete torrents above this completion % (0.99 = 99%)
MaximumDeletablePercentage = 0.99
DoNotRemoveSlow = true

[Radarr]
Managed = true
URI = "http://radarr.media.svc.cluster.local"
APIKey = "${RADARR_API_KEY}"
Category = "radarr"
ReSearch = true
# Minutes; 0 = disable
RssSyncTimer = 5
RefreshDownloadsTimer = 5
# Treat only upgrade failures as blocklist-worthy: qBitrr removes files and reports failure to Arr.
# Exclude "Unable to determine if file is a sample": false positives on short or
# irregular-runtime content can remove good files and blocklist them.
ArrErrorCodesToBlocklist = [
  "Not an upgrade for existing movie file(s)",
  "Not a preferred word upgrade for existing movie file(s)"
]

[Radarr.EntrySearch]
# Off: each 15-min loop re-searched every missing/unmet item (~30k Prowlarr queries/day); Arr RSS grabs releases and upgrades.
SearchMissing = false
SearchLimit = 2
# Seconds between checking for new Overseerr/Ombi requests (default 300)
SearchRequestsEvery = 600
QualityUnmetSearch = false
# Disabled: see Sonarr-TV above. Custom-format score deletion and Arr blocklisting
# remain coupled to this setting (confirmed through qBitrr v5.14.6-1).
# Arr RSS still grabs unmet releases.
CustomFormatUnmetSearch = false

[Radarr.EntrySearch.Overseerr]
SearchOverseerrRequests = true
OverseerrURI = "http://seerr.media.svc.cluster.local:5055"
OverseerrAPIKey = "${JELLYSEERR_API_KEY}"
Is4K = true

[Radarr.Torrent]
FolderExclusionRegex = [
  "\\bfeaturettes?\\b",
  "\\bsamples?\\b",
  "\\bscreens?\\b",
  "\\bspecials?\\b",
  "\\bova\\b",
  "\\bnc(ed|op)?(\\\\d+)?\\b"
]
FileNameExclusionRegex = [
  "\\bncop\\\\d+?\\b",
  "\\bnced\\\\d+?\\b",
  "\\bsample\\b",
  "brarbg.com\\b",
  "\\btrailer\\b",
  "music video",
  "comandotorrents.com"
]
# No FileExtensionAllowlist: see the Sonarr-TV.Torrent note above. The allowlist
# made qBitrr delete RAR-multipart and .avi/.mpg releases as "all files excluded"
# and mark them failed in Radarr (blocklist).
# Max remaining ETA in seconds before removal (604800 = 7 days)
MaximumETA = 604800
# Don't delete torrents above this completion % (0.99 = 99%)
MaximumDeletablePercentage = 0.99
DoNotRemoveSlow = true

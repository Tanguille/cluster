# Minimal qBitrr config — only required and non-default values

[Settings]
# ConfigVersion: qBitrr schema version (Renovate-synced with feramance/qbitrr image tag;
# the schema tracks major.minor.patch, so image v5.14.6-1 expects "5.14.6")
ConfigVersion = "5.14.6"
# qBitrr >=5.13 ships a self-updater; keep it disabled so the image tag stays GitOps-owned.
AutoUpdateEnabled = false
CompletedDownloadFolder = "/completed_downloads"
FreeSpaceFolder = "/completed_downloads"
# Desired free space in download dir (K/M/G/T, -1 = disable)
FreeSpace = "500G"
# Don't touch torrents younger than this (seconds); recheck/failed only. Default 180; we use 10 min.
IgnoreTorrentsYoungerThan = 600

[WebUI]
Host = "0.0.0.0"
Port = 6969

[qBit]
Host = "qbittorrent.media.svc.cluster.local"
Port = 80

[Sonarr-TV]
Managed = true
URI = "http://sonarr.media.svc.cluster.local"
APIKey = "${SONARR_API_KEY}"
Category = "tv-sonarr"
ReSearch = true
# Minutes; 0 = disable
RssSyncTimer = 5
RefreshDownloadsTimer = 5
# Arr messages treated as failure; qBitrr removes files and reports failed to Arr
# "Unable to determine if file is a sample" excluded: false-positives on irregular-runtime
# content (e.g. reality TV), causing good files to be blocklisted
ArrErrorCodesToBlocklist = [
  "Not an upgrade for existing episode file(s)",
  "Not a preferred word upgrade for existing episode file(s)"
]

[Sonarr-TV.EntrySearch]
SearchMissing = true
SearchLimit = 2
# Seconds between checking for new Overseerr/Ombi requests (default 300)
SearchRequestsEvery = 600
DoUpgradeSearch = true
QualityUnmetSearch = true
# Disabled: in qBitrr v5.12.12 CustomFormatUnmetSearch also gates automatic
# deletion + Arr blocklisting of any torrent whose custom-format score is below
# the existing library file ("CF unmet deletion"), including manual overrides.
# QualityUnmetSearch/DoUpgradeSearch still search for unmet and upgrade
# releases; only the CF-driven delete/blocklist behaviour is turned off.
CustomFormatUnmetSearch = false
# true | false | "smart" (series vs episode search)
SearchBySeries = "smart"

[Sonarr-TV.EntrySearch.Overseerr]
SearchOverseerrRequests = true
OverseerrURI = "http://seerr.media.svc.cluster.local:5055"
OverseerrAPIKey = "${JELLYSEERR_API_KEY}"
# 4K instance
Is4K = true

[Sonarr-TV.Torrent]
FolderExclusionRegex = [
  "\\bextras?\\b",
  "\\bfeaturettes?\\b",
  "\\bsamples?\\b",
  "\\bscreens?\\b",
  "\\bnc(ed|op)?(\\\\d+)?\\b"
]
FileNameExclusionRegex = [
  "\\bncop\\\\d+?\\b",
  "\\bnced\\\\d+?\\b",
  "\\bsample\\b",
  "brarbg.com\\b",
  "\\btrailer\\b",
  "music video",
  "comandotorrents.com"
]
# No FileExtensionAllowlist: an allowlist of .mkv/.mp4/.srt only made qBitrr treat
# RAR-multipart scene releases (.rar, .r00…, .nfo, .sfv), .avi/.mpg XviD releases
# and similar as "all files excluded" -> delete torrent + mark release failed in
# Sonarr (blocklist). Sample/extras folders and files are still excluded by
# FolderExclusionRegex/FileNameExclusionRegex above.
# Max remaining ETA in seconds before removal (604800 = 7 days)
MaximumETA = 604800
# Don't delete torrents above this completion % (0.99 = 99%)
MaximumDeletablePercentage = 0.99
DoNotRemoveSlow = true

[Radarr]
Managed = true
URI = "http://radarr.media.svc.cluster.local"
APIKey = "${RADARR_API_KEY}"
Category = "radarr"
ReSearch = true
# Minutes; 0 = disable
RssSyncTimer = 5
RefreshDownloadsTimer = 5
# Arr messages treated as failure; qBitrr removes files and reports failed to Arr
# "Unable to determine if file is a sample" excluded: false-positives on short/irregular
# runtime content, causing good files to be blocklisted
ArrErrorCodesToBlocklist = [
  "Not an upgrade for existing movie file(s)",
  "Not a preferred word upgrade for existing movie file(s)"
]

[Radarr.EntrySearch]
SearchMissing = true
SearchLimit = 2
# Seconds between checking for new Overseerr/Ombi requests (default 300)
SearchRequestsEvery = 600
QualityUnmetSearch = true
# Disabled: in qBitrr v5.12.12 CustomFormatUnmetSearch also gates automatic
# deletion + Arr blocklisting of any torrent whose custom-format score is below
# the existing library file ("CF unmet deletion"), including manual overrides.
# QualityUnmetSearch still searches for unmet releases; only the CF-driven
# delete/blocklist behaviour is turned off.
CustomFormatUnmetSearch = false

[Radarr.EntrySearch.Overseerr]
SearchOverseerrRequests = true
OverseerrURI = "http://seerr.media.svc.cluster.local:5055"
OverseerrAPIKey = "${JELLYSEERR_API_KEY}"
Is4K = true

[Radarr.Torrent]
FolderExclusionRegex = [
  "\\bfeaturettes?\\b",
  "\\bsamples?\\b",
  "\\bscreens?\\b",
  "\\bspecials?\\b",
  "\\bova\\b",
  "\\bnc(ed|op)?(\\\\d+)?\\b"
]
FileNameExclusionRegex = [
  "\\bncop\\\\d+?\\b",
  "\\bnced\\\\d+?\\b",
  "\\bsample\\b",
  "brarbg.com\\b",
  "\\btrailer\\b",
  "music video",
  "comandotorrents.com"
]
# No FileExtensionAllowlist: see the Sonarr-TV.Torrent note above. The allowlist
# made qBitrr delete RAR-multipart and .avi/.mpg releases as "all files excluded"
# and mark them failed in Radarr (blocklist).
# Max remaining ETA in seconds before removal (604800 = 7 days)
MaximumETA = 604800
# Don't delete torrents above this completion % (0.99 = 99%)
MaximumDeletablePercentage = 0.99
DoNotRemoveSlow = true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qbitrr
  namespace: &namespace media
spec:
  components:
    - ../../../../../components/nfs-scaler
    # backup only, not ../../../../../components/kopiur: the PVC is
    # chart-created and already bound, so the restore component's PVC
    # (dataSourceRef -> passive Restore) would hit immutable-spec apply
    # errors. uid is the cluster-default 568, no override needed.
    - ../../../../../components/kopiur/backup
  path: ./kubernetes/apps/media/qbittorrent/tools/qbitrr
  targetNamespace: *namespace
  dependsOn:
    - name: qbittorrent
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  postBuild:
    substitute:
      APP: *app

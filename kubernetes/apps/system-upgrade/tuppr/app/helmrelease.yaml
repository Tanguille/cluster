---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.5.10
      url: oci://ghcr.io/home-operations/charts/tuppr
  interval: 1h
  timeout: 10m
  values:
    replicaCount: 2
    resources:
      requests:
        memory: 512Mi
    # One replica per node, else both can share the drained node and the PDB deadlocks the drain.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: tuppr
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana

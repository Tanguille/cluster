---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/policy/poddisruptionbudget_v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tuppr
spec:
  # Chart has no PDB values; one controller must survive a drain or the rolling upgrade stalls.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tuppr

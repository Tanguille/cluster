---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # Bumped by the two regex managers in .renovaterc.json5, one per half.
    # No other literal -k<digits> in this file: the kernel manager is unanchored, so each one
    # becomes its own dep.
    version: v1.14.0-k7.2.3
  talosctl:
    image:
      # Plain tag: a -k<kernel> talosctl is unpublished and ImagePullBackOffs (control-2, 2026-08-21).
      # renovate: datasource=github-releases depName=siderolabs/talos
      tag: v1.14.0
  # Hold a node back with a nodeSelector, e.g. kubernetes.io/hostname NotIn [control-1];
  # excluded nodes are never enumerated, so they take no outdated taint either.
  policy:
    rebootMode: powercycle
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: |-
        status.conditions.exists(c, c.type == "Ready" && c.status == "True")
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      expr: |-
        status.phase in ['Cluster in healthy state']
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      expr: |-
        status.phase in ['Ready']
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.phase != 'Running'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])

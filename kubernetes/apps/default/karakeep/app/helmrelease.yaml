---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app karakeep
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      karakeep:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
            env:
              BROWSER_WEB_URL: http://karakeep-chrome.default.svc.cluster.local:9222
              DATA_DIR: /data
              DISABLE_SIGNUPS: true
              MEILI_ADDR: http://karakeep-meilisearch.default.svc.cluster.local:7700
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: meilisearch_master_key
              NEXTAUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: encryption_key
              NEXTAUTH_URL: https://karakeep.${SECRET_DOMAIN}
              DISABLE_NEW_RELEASE_CHECK: true
              COREPACK_INTEGRITY_KEYS: 0
              # OpenAI-compatible endpoint (via litellm); must match /v1/models ids.
              OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local/v1
              OPENAI_API_KEY: ${LITELLM_API_KEY}
              # Text tasks (auto-tags, summaries) run on the 2B iGPU model to
              # spare the 27B; image tagging/OCR stay on the 27B (vision) because
              # the qwen35-2b GGUF is text-only. qwen35-2b is llmkube-managed, so
              # its LiteLLMModel is auto-registered (litellm-operator autoRegister)
              # under the InferenceService's name, not a hand-written alias.
              INFERENCE_TEXT_MODEL: qwen35-2b
              INFERENCE_IMAGE_MODEL: qwen-3.8-fast
              INFERENCE_NUM_WORKERS: "2"
              INFERENCE_OUTPUT_SCHEMA: "plain"
              INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
              # Leaves headroom under the 2B's 16K-per-slot budget (see qwen35-2b.yaml).
              INFERENCE_CONTEXT_LENGTH: "12000"
              INFERENCE_JOB_TIMEOUT_SEC: "300"
              OCR_USE_LLM: "true"
              # enableAutoIndexing defaults to off whenever OPENAI_BASE_URL is set (v0.33.1
              # packages/shared/config.ts), so it must be explicit here. The embedding client
              # falls back to OPENAI_BASE_URL/OPENAI_API_KEY when EMBEDDING_OPENAI_* isn't set
              # (packages/shared/inference.ts), so no separate EMBEDDING_OPENAI_BASE_URL is needed.
              EMBEDDING_ENABLE_AUTO_INDEXING: "true"
              EMBEDDING_TEXT_MODEL: qwen3-embedding
              EMBEDDING_DIMENSIONS: "1024"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 1Gi

      chrome:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: gcr.io/zenika-hub/alpine-chrome
              tag: "124@sha256:1a0046448e0bb6c275c88f86e01faf0de62b02ec8572901256ada0a8c08be23f"
            command:
              - chromium-browser
            args:
              - --headless
              - --no-sandbox
              - --disable-gpu
              - --disable-dev-shm-usage
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --hide-scrollbars
            securityContext:
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                cpu: 1
                memory: 1Gi

      meilisearch:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - karakeep
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - karakeep
                  topologyKey: kubernetes.io/hostname
        containers:
          app:
            image:
              repository: getmeili/meilisearch
              tag: v1.53.1@sha256:8d6643d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431
            args:
              - /bin/meilisearch
              # v1.51 renamed --experimental-dumpless-upgrade to this; without it
              # the engine refuses to open a database written by the prior version.
              - --upgrade-db
            env:
              MEILI_NO_ANALYTICS: true
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: meilisearch_master_key
            resources:
              requests:
                cpu: 10m
                # 91Mi cgroup peak over 30d; recheck after a meilisearch version bump
                memory: 128Mi
              limits:
                cpu: 1
                memory: 4Gi

    service:
      app:
        forceRename: karakeep
        primary: true
        controller: karakeep
        ports:
          http:
            port: 3000
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700

    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          karakeep:
            app:
              - path: /data
                subPath: karakeep
          meilisearch:
            app:
              - path: /meili_data
                subPath: meilisearch

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Karakeep
          gethomepage.dev/description: Bookmarks & notes
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: karakeep.png
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http

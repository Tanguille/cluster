---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress-allowlist
spec:
  # Default-deny ingress (egress open). hostNetwork moonraker-obico has no Cilium endpoint, so no CNP applies to it.
  # Per-pod allowlists (changedetection, karakeep, satisfactory, searxng) stay and union with this one.
  endpointSelector: {}
  ingress:
    # ai: ToolHive MCP backends; observability: nextcloud-exporter, satisfactory-frm-exporter; network: envoy gateways; default: intra-namespace.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
        - matchLabels:
            io.kubernetes.pod.namespace: ai
        - matchLabels:
            io.kubernetes.pod.namespace: observability
        - matchLabels:
            io.kubernetes.pod.namespace: network
        # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is
        # ephemeral not 53.
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
    - fromEntities:
        # kubelet probes.
        - host

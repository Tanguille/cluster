---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress-allowlist
  namespace: default
spec:
  # Default-deny ingress (egress open), except hostNetwork moonraker-obico: nginx binds loopback, janus host UDP can't be expressed.
  # Per-pod allowlists (changedetection, karakeep, satisfactory, searxng) stay and union with this one.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - moonraker-obico
  ingress:
    # ai: ToolHive MCP backends; observability: nextcloud-exporter; network: envoy gateways; default: intra-namespace.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
        - matchLabels:
            io.kubernetes.pod.namespace: ai
        - matchLabels:
            io.kubernetes.pod.namespace: observability
        - matchLabels:
            io.kubernetes.pod.namespace: network
        # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is
        # ephemeral not 53.
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
    - fromEntities:
        # kubelet probes.
        - host

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress-allowlist
spec:
  # Default-deny ingress (egress open). hostNetwork moonraker-obico has no Cilium endpoint, so no CNP applies to it.
  # Allows union, so a per-pod CNP only adds sources not listed here: forgejo (flux-system), satisfactory (world).
  endpointSelector: {}
  ingress:
    # ai: ToolHive MCP backends; observability: nextcloud-exporter, satisfactory-frm-exporter; network: envoy gateways; default: intra-namespace.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
        - matchLabels:
            io.kubernetes.pod.namespace: ai
        - matchLabels:
            io.kubernetes.pod.namespace: observability
        - matchLabels:
            io.kubernetes.pod.namespace: network

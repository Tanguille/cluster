---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app satisfactory
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  valuesFrom:
    # control-1's Ryzen 7 5800X has the best single-thread speed for the simulation.
    - kind: ConfigMap
      name: affinity-control-1
  values:
    controllers:
      satisfactory:
        annotations:
          # The scripts ConfigMap has a fixed name, so edits to mods.sh would not otherwise re-run the init container.
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/robtme/satisfactory-server
              tag: v1.9.11
            env:
              MAXTICKRATE: "120"
              TIMEOUT: "300"
            securityContext: &sc
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            probes:
              # The image's healthcheck calls the game's own HealthCheck API, not just a port check.
              liveness: &probe
                enabled: true
                command: ["/home/steam/healthcheck.sh"]
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 30
                  failureThreshold: 4
              readiness: *probe
              # First start downloads the game via steamcmd.
              startup:
                enabled: true
                command: ["/home/steam/healthcheck.sh"]
                spec:
                  timeoutSeconds: 30
                  failureThreshold: 120
            resources:
              requests:
                cpu: 1
                memory: 2Gi
              limits:
                memory: 8Gi
        initContainers:
          mods:
            image: *image
            env:
              # All players need the same mods. SML and dependencies are resolved by ficsit-cli.
              MODS: InfiniteZoop SS_Mod LoadBalancers InfiniteNudge EfficiencyCheckerMod FicsitRemoteMonitoring
              FICSIT_VERSION: v0.7.1
              FICSIT_SHA256: 2af0f8815af93b097c7a97968569575b21cf451b7c345fbb62fae29096ee4a31
              HOME: /tmp/ficsit
            command: [/bin/bash, /scripts/mods.sh]
            securityContext: *sc
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      # Evicted after unclassified pods, before llmkube models.
      priorityClassName: homelab-important
      # init.sh skips its root-only uid remap when started as the image's steam user (1000:1000).
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      satisfactory:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: ${SATISFACTORY_IP}
        ports:
          game-tcp:
            port: 7777
          game-udp:
            port: 7777
            protocol: UDP
          messaging:
            port: 8888
          # FRM web server + REST API: routes and exporter only, not in the CNP world rule.
          frm:
            port: 8080
    route:
      app:
        hostnames:
          # Not satisfactory.${SECRET_DOMAIN}: cloudflare-ddns publishes that name for the game, which trips GatusEndpointExposed.
          - satisfactory-frm.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
      # Public view-only copy: FRM's write endpoints (setSwitches, ...) are POSTs, dropped here even if the token leaks.
      external:
        hostnames:
          - frm.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - method: GET
              - method: HEAD
            backendRefs:
              - identifier: satisfactory
                port: frm
    persistence:
      scripts:
        type: configMap
        name: satisfactory-scripts
        advancedMounts:
          satisfactory:
            mods:
              - path: /scripts
                readOnly: true
      config:
        existingClaim: *app

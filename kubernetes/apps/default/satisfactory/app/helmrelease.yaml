---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app satisfactory
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      satisfactory:
        strategy: Recreate
        containers:
          app:
            image: &image
              repository: ghcr.io/robtme/satisfactory-server
              tag: v1.9.11
            env:
              PUID: "1000"
              PGID: "1000"
            probes:
              # The image's healthcheck calls the game's own HealthCheck API, not just a port check.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/home/steam/healthcheck.sh"]
                  periodSeconds: 30
                  timeoutSeconds: 30
                  failureThreshold: 4
              readiness: *probe
              # First start downloads the game via steamcmd.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/home/steam/healthcheck.sh"]
                  periodSeconds: 10
                  timeoutSeconds: 30
                  failureThreshold: 120
            resources:
              requests:
                cpu: 500m
                memory: 8Gi
              limits:
                memory: 16Gi
        initContainers:
          mods:
            image: *image
            env:
              # All players need the same mods. SML and dependencies are resolved by ficsit-cli.
              MODS: SmartFoundations InfiniteZoop InfiniteNudge EfficiencyCheckerMod LoadBalancers RefinedPower
              FICSIT_VERSION: v0.7.1
              FICSIT_SHA256: 2af0f8815af93b097c7a97968569575b21cf451b7c345fbb62fae29096ee4a31
              HOME: /tmp/ficsit
            command: [/bin/bash, /scripts/mods.sh]
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      satisfactory:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: ${SATISFACTORY_IP}
        ports:
          game-tcp:
            port: 7777
          game-udp:
            port: 7777
            protocol: UDP
          messaging:
            port: 8888
    persistence:
      scripts:
        type: configMap
        name: satisfactory-scripts
        advancedMounts:
          satisfactory:
            mods:
              - path: /scripts
                readOnly: true
      config:
        existingClaim: *app
        globalMounts:
          - path: /config

---
# FG.ServerRestartTimeSlot=360 reloads the session in-process at 06:00 UTC, which can leave FRM's web
# server bound to the destroyed world ("Blocked API call: World not ready", porisius/FicsitRemoteMonitoring#313).
# Only a process restart recovers it, so restart once the game is back up. Delete once #313 is fixed.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/serviceaccount_v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: satisfactory-restart
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: satisfactory-restart
rules:
  # `kubectl rollout restart` is a get + patch of the pod template; scoped to the one
  # deployment so the token cannot touch anything else in the namespace.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["satisfactory"]
    verbs: ["get", "patch"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: satisfactory-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: satisfactory-restart
subjects:
  - kind: ServiceAccount
    name: satisfactory-restart
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: satisfactory-restart
spec:
  # UTC like the game container, not ${TIMEZONE}: a local-time schedule would drift an hour at DST.
  schedule: "10 6 * * *"
  timeZone: UTC
  # A late run would restart a server people are already playing on.
  startingDeadlineSeconds: 1800
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            # kubectl needs the apiserver, which default's deny-kube-apiserver-egress blocks.
            egress.home.arpa/kube-apiserver: allow
        spec:
          serviceAccountName: satisfactory-restart
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              # Skew-matched to the 1.37 server; Renovate bumps it.
              image: registry.k8s.io/kubectl:v1.37.2
              args:
                - rollout
                - restart
                - deployment/satisfactory
                - -n
                - default
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi

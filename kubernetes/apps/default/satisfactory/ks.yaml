---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app satisfactory
  namespace: &namespace default
spec:
  path: ./kubernetes/apps/default/satisfactory/app
  targetNamespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  interval: 30m
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      APP: *app
      # Saves are small; gamefiles are re-downloaded by steamcmd on start, so they stay out of the backup.
      PVC_CAPACITY: 32Gi
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
      KOPIUR_IGNORE_RULES: "[/lost+found, /gamefiles/*]"

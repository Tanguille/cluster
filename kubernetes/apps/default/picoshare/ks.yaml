---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: picoshare
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  path: ./kubernetes/apps/default/picoshare/app
  components:
    # backup only, not ../../../../components/kopiur: the PVC is chart-created
    # and already bound, so the restore component's PVC (dataSourceRef ->
    # passive Restore) would hit immutable-spec apply errors. Adopting the
    # full pattern needs a deliberate delete + restore cutover instead.
    - ../../../../components/kopiur/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  postBuild:
    substitute:
      APP: picoshare
      # picoshare runs 1000:100, not the cluster-default 568.
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "100"

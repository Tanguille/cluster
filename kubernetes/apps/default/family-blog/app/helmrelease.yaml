---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: family-blog
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      family-blog:
        # Bootstrap only. First remove seed and wait for volume release; then activate.
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: nginxinc/nginx-unprivileged
              tag: 1.30.6-alpine-slim
            command: [nginx]
            args: ["-g", "daemon off;"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
            probes:
              liveness: &health
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
              startup: *health
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /index.html
                    port: *port

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        # Activate only after successful import, seed removal and privacy checks.
        # Required despite deadvalues' redundant finding: omission enables the route.
        enabled: false
        annotations:
          gatus.home-operations.com/enabled: "false"
          gethomepage.dev/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      site:
        existingClaim: family-blog
        globalMounts:
          - path: /srv
            readOnly: true
      config:
        type: configMap
        name: family-blog-configmap
        globalMounts:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 16Mi

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: family-blog
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      family-blog:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        # Temporary: remove after verifying the repaired links on the retained PVC.
        initContainers:
          repair-month-links:
            image:
              repository: python
              tag: 3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
            command:
              [
                python,
                -B,
                /repair/repair-month-links.py,
                --site,
                /srv/site,
                --apply
              ]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: "1"
                memory: 256Mi
        containers:
          app:
            image:
              repository: nginxinc/nginx-unprivileged
              tag: 1.31.7-alpine-slim
            command: [nginx]
            args: ["-g", "daemon off;"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
            probes:
              liveness: &health
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
              startup: *health
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /index.html
                    port: *port

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
          gethomepage.dev/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      site:
        existingClaim: family-blog
        advancedMounts:
          family-blog:
            app:
              - path: /srv
                readOnly: true
            repair-month-links:
              - path: /srv
      repair-script:
        type: configMap
        name: family-blog-month-link-repair
        advancedMounts:
          family-blog:
            repair-month-links:
              - path: /repair
                readOnly: true
      config:
        type: configMap
        name: family-blog-configmap
        globalMounts:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 16Mi

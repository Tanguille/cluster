---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - pvc.yaml
# Bootstrap only: remove the seed Component and wait for volume release before activation.
components:
  - ../seed
configMapGenerator:
  - name: family-blog-configmap
    files:
      - ./config/nginx.conf
generatorOptions:
  disableNameSuffixHash: true

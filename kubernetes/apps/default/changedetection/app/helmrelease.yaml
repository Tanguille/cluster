---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app changedetection
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      # Fetches and parses untrusted pages.
      runtimeClassName: gvisor

    controllers:
      changedetection:
        containers:
          app:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.70.2@sha256:36ebb3586e9a6b14af6fb488c6e29b60eceb79ee414ecdb6ac2b91dd25b1c7ba
            env:
              # Needed by {{diff_url}} in notifications.
              BASE_URL: https://changedetection.${SECRET_DOMAIN}
              # INFO logs full Apprise URLs, secrets included.
              LOGGER_LEVEL: WARNING
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                cpu: 100m
                memory: 256Mi

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      app:
        ports:
          http:
            port: 5000

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Change Detection
          gethomepage.dev/description: Website change monitor
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: changedetection.png
          gethomepage.dev/widget.type: changedetectionio
          gethomepage.dev/widget.url: https://changedetection.${SECRET_DOMAIN}
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_CHANGEDETECTION_API_KEY}}`}}"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      datastore:
        existingClaim: *app

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: changedetection-ingress-allowlist
spec:
  # Ingress only; egress stays open.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: changedetection
  ingress:
    - fromEndpoints:
        # Gateway API label envoy-gateway stamps on proxy pods; same key as the vmcp-unified policy.
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP

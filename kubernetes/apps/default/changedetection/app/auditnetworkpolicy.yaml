---
# Audit-only network policy (kguardian): reports what a default-deny would
# break WITHOUT enforcing anything. Observed baseline 2026-09-16 via
# kguardian pod_traffic: egress 443 to assorted externals + kube-dns only,
# ingress :5000 from envoy-internal only.
# Promote to kind: NetworkPolicy only after verdicts stay empty.
apiVersion: kguardian.dev/v1alpha1
kind: AuditNetworkPolicy
metadata:
  name: changedetection-baseline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: changedetection
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Gateway traffic from envoy-internal
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - protocol: TCP
          port: 5000
    # kubelet probes originate from node IPs
    - from:
        - ipBlock:
            cidr: 192.168.0.0/24
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # Cluster DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Website polling (upstream hosts vary, observed 2026-09-16)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

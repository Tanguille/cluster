---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      app:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: codeberg.org/forgejo/forgejo
              tag: 17.0.1-rootless
            env:
              TZ: ${TIMEZONE}
              FORGEJO__server__ROOT_URL: https://forgejo.${SECRET_DOMAIN}/
              FORGEJO__server__DISABLE_SSH: "true"
              FORGEJO__server__LFS_START_SERVER: "false"
              FORGEJO__database__DB_TYPE: sqlite3
              FORGEJO__security__INSTALL_LOCK: "true"
              FORGEJO__security__SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: forgejo-secret
                    key: SECRET_KEY
              FORGEJO__service__DISABLE_REGISTRATION: "true"
              FORGEJO__repository__DEFAULT_PRIVATE: "private"
              FORGEJO__actions__ENABLED: "false"
              FORGEJO__federation__ENABLED: "false"
            probes:
              liveness:
                enabled: true
              readiness: &health
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /api/healthz
                    port: 3000
              startup:
                <<: *health
                spec:
                  httpGet: *httpGet
                  failureThreshold: 60
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
      sync:
        type: cronjob
        cronjob:
          schedule: "*/5 * * * *"
          # Enable only after the normal repository and scoped write token exist.
          suspend: true
          backoffLimit: 0
          activeDeadlineSeconds: 240
          ttlSecondsAfterFinished: 3600
        containers:
          app:
            image: *image
            command: [/bin/bash, /scripts/sync.sh]
            env:
              SOURCE_URL: https://github.com/Tanguille/cluster.git
              TARGET_URL: http://forgejo.default.svc.cluster.local:3000/tanguille/cluster.git
              CACHE_DIR: /cache/cluster.git
              FORGEJO_USER: tanguille
              FORGEJO_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: forgejo-sync-secret
                    key: token
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: app
        ports:
          http:
            port: 3000
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Forgejo
          gethomepage.dev/description: GitHub outage fallback
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: forgejo.png
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          app:
            app:
              - path: /var/lib/gitea
      cache:
        suffix: sync-cache
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          sync:
            app:
              - path: /cache
      scripts:
        type: configMap
        name: forgejo-scripts
        advancedMounts:
          sync:
            app:
              - path: /scripts
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          sync:
            app:
              - path: /tmp

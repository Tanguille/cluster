---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - networkpolicy.yaml
  - secret.sops.yaml
configMapGenerator:
  - name: forgejo-themes
    files:
      - ./themes/theme-anthracite.css
      - ./themes/theme-anthracite-dark.css
      - ./themes/theme-anthracite-light.css
generatorOptions:
  disableNameSuffixHash: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obico
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  dependsOn:
    - name: dragonfly-cluster
      namespace: database
  path: ./kubernetes/apps/default/obico/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: moonraker-obico
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  dependsOn:
    - name: obico
  path: ./kubernetes/apps/default/obico/moonraker-obico
  components:
    # backup only, not ../../../../components/kopiur: the PVC is chart-created
    # and already bound, so the restore component's PVC (dataSourceRef ->
    # passive Restore) would hit immutable-spec apply errors.
    - ../../../../components/kopiur/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  postBuild:
    substitute:
      APP: moonraker-obico
      # moonraker-obico runs 1000:1000, not the cluster-default 568.
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"

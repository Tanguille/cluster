---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obico
spec:
  chartRef:
    kind: OCIRepository
    name: obico
  interval: 30m
  timeout: 15m

  values:
    server:
      image:
        repository: ghcr.io/gabe565/obico/web
        tag: release@sha256:6acb4a5903ebeffb0ec37e2ddbb94fe15d09e3153008c96098cfe33e932369e6
      env:
        ACCOUNT_ALLOW_SIGN_UP: "True"
        CSRF_TRUSTED_ORIGINS: '["https://obico.${SECRET_DOMAIN}"]'
        REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379"
        SITE_USES_HTTPS: "True"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi # measured 163Mi steady
        limits:
          memory: 1Gi
      additionalContainers:
        tasks:
          resources:
            requests:
              cpu: 100m
              memory: 512Mi # measured 316Mi steady
            limits:
              memory: 1Gi
      persistence:
        data:
          enabled: true
          storageClass: ceph-block
          accessMode: ReadWriteOnce
          size: 10Gi
        media:
          enabled: true
          storageClass: ceph-block
          accessMode: ReadWriteOnce
          size: 20Gi

    ml-api:
      image:
        repository: ghcr.io/gabe565/obico/ml-api
        tag: release@sha256:8f7cca121dfdb91b04f619ffb550d78a062c9c98b8bf8b4da29c9707b23e7af6
      env:
        DEBUG: "False"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    redis:
      enabled: false

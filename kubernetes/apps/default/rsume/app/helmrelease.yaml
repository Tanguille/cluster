---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rsume
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      rsume:
        containers:
          app:
            image:
              repository: ghcr.io/tanguille/rsume
              tag: 0.1.534@sha256:62355c93f2c01c9b37035c6e37702c970581bc8b8b5d58fcbe2e79bf959a9f07
            env:
              SITE_URL: https://${SECRET_DOMAIN}
              CONTACT_EMAIL: ${SECRET_CONTACT_EMAIL}
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
              readiness: *probe
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: rsume-ghcr
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        annotations:
          # The apex resolves publicly by design (cloudflared tunnel owns it), so envoy-internal's
          # inherited `guarded: true` DNS canary can never pass. Probe the route as HTTP instead,
          # against the internal gateway's own hostname, keeping the route's Host so it still matches.
          gatus.home-operations.com/endpoint: |-
            guarded: false
            url: https://internal.${SECRET_DOMAIN}/
            headers:
              Host: ${SECRET_DOMAIN}
        hostnames:
          - "${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

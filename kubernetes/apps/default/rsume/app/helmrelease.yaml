---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rsume
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      rsume:
        # Chart default is Recreate; rolling keeps the single replica serving during a rollout.
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/tanguille/rsume
              tag: 0.1.208@sha256:a81733ca3b6782f29d55bd914641ae4e4095b6b45a9e6758231b48d31e306f0a
            env:
              SITE_URL: https://${SECRET_DOMAIN}
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
              readiness: *probe
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          # The cloudflared DNSEndpoint already owns the apex CNAME.
          external-dns.kubernetes.io/controller: none
        hostnames: ["${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network

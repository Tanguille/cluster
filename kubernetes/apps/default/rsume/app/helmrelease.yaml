---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rsume
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      rsume:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/tanguille/rsume
              tag: 0.1.366@sha256:fa1434bb59f9cdfa6915b4357a22ceb1a91093d7447fc2e711f7a76b849a0a7a
            env:
              SITE_URL: https://${SECRET_DOMAIN}
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
              readiness: *probe
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

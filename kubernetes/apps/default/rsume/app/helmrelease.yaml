---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rsume
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      rsume:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/tanguille/rsume
              tag: 0.1.524@sha256:54c6ac0eb9866f032d1a7b02f70f4461f30a54a4a4a53be6108a1d63569d372e
            env:
              SITE_URL: https://${SECRET_DOMAIN}
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
              readiness: *probe
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      # The GHCR package is private; the token is read:packages only.
      imagePullSecrets:
        - name: rsume-ghcr
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rsume
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      rsume:
        # The chart default is Recreate; with 1 replica the Kubernetes defaults
        # (maxUnavailable 0, maxSurge 1) keep the site up during a rollout.
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/tanguille/rsume
              # set to the first published tag@digest once rsume CI pushes it
              tag: 0.1.0
            env:
              SITE_URL: https://${SECRET_DOMAIN}
              # Not Flux-substituted: the repo and image are public, so the address
              # stays in the Secret. Absent key = the footer omits the Email link.
              CONTACT_EMAIL:
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: SECRET_CONTACT_EMAIL
                    optional: true
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
              readiness: *probe
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        annotations:
          # The cloudflared DNSEndpoint already owns the apex CNAME.
          external-dns.kubernetes.io/controller: none
        hostnames: ["${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network

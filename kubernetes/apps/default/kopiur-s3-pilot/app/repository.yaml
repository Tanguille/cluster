---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/repository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: kopiur-s3-pilot
spec:
  backend:
    s3:
      bucket: kopiur-s3-pilot
      # Kopiur defaults to verified HTTPS; k8s-gateway resolves this directly to TrueNAS.
      endpoint: s3.${SECRET_DOMAIN}:9000
      region: us-east-1
      auth:
        secretRef:
          name: kopiur-s3-pilot
  encryption:
    passwordSecretRef:
      name: kopiur-s3-pilot
      key: KOPIA_PASSWORD
  create:
    enabled: true
  concurrency:
    maxConcurrentJobs: 4
  moverDefaults:
    podLabels:
      # S3 uses pod networking; the default namespace otherwise denies LAN egress.
      egress.home.arpa/lan: allow
    securityContext:
      # dumbassets' uid; restore and maintenance read this layer, not the policy's mover.
      runAsUser: 65532
      runAsGroup: 65532
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  scheduleDefaults:
    timezone: ${TIMEZONE}

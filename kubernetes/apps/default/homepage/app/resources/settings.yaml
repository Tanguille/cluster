---
title: Cluster
favicon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/kubernetes.png
theme: dark
color: zinc
headerStyle: boxedWidgets
hideVersion: true
# Upstream failures still show via the status dots; the raw API error dump is noise.
hideErrors: true
statusStyle: dot
fullWidth: true
useEqualHeights: true
layout:
  # Home tab — cluster status at a glance, then bookmark groups
  Status: { tab: Home, style: row, columns: 4 }
  Documentation: { tab: Home, style: row, columns: 4 }
  Repositories: { tab: Home, style: row, columns: 3 }
  Observability Docs: { tab: Home, style: row, columns: 3 }

  Requests: { tab: Media, style: row, columns: 2 }
  Library: { tab: Media, style: row, columns: 3 }
  Downloaders: { tab: Media, style: row, columns: 2 }
  Management: { tab: Media, style: row, columns: 4 }
  Processing: { tab: Media, style: row, columns: 3 }

  Agents: { tab: AI, style: row, columns: 3 }

  Portals: { tab: Apps, style: row, columns: 4 }
  Utilities: { tab: Apps, style: row, columns: 4 }
  Web3: { tab: Apps, style: row, columns: 3 }

  Metrics: { tab: Observability, style: row, columns: 4 }
  Logs: { tab: Observability, style: row, columns: 3 }

  External: { tab: Infra, style: row, columns: 3 }
  # A group missing here renders on every tab.
  Security: { tab: Infra, style: row, columns: 3 }

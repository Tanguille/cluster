---
title: Cluster
favicon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/kubernetes.png
theme: dark
color: zinc
headerStyle: boxedWidgets
hideVersion: true
# Upstream failures still show via the status dots; the raw API error dump is noise.
hideErrors: true
statusStyle: dot
fullWidth: true
useEqualHeights: true
# Every group uses 4 columns so tiles line up across groups.
layout:
  Status: { tab: Home, style: row, columns: 4 }
  Docs: { tab: Home, style: row, columns: 4 }
  Repositories: { tab: Home, style: row, columns: 4 }

  Requests: { tab: Media, style: row, columns: 4 }
  Library: { tab: Media, style: row, columns: 4 }
  Downloaders: { tab: Media, style: row, columns: 4 }
  Management: { tab: Media, style: row, columns: 4 }
  Processing: { tab: Media, style: row, columns: 4 }

  Portals: { tab: Apps, style: row, columns: 4 }
  Utilities: { tab: Apps, style: row, columns: 4 }
  Agents: { tab: Apps, style: row, columns: 4 }
  Web3: { tab: Apps, style: row, columns: 4 }

  Metrics: { tab: Infra, style: row, columns: 4 }
  Logs: { tab: Infra, style: row, columns: 4 }
  External: { tab: Infra, style: row, columns: 4 }
  # A group missing here renders on every tab.
  Security: { tab: Infra, style: row, columns: 4 }

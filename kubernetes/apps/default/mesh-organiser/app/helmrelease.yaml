---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mesh-organiser
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      mesh-organiser:
        # SQLite allows one writer, and the trash purge runs in-process: one replica, no overlap.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tanguille/mesh-organiser
              tag: v5.0.2@sha256:93d1baf0f9be4a1e8c9e6237d341c6c6382c11609b685caa052c621ba19fcd47
            env:
              # config.json, db.sqlite and the model files all live next to the config file.
              APP_CONFIG_PATH: /cfg/config.json
              ENABLE_MCP: "true"
              # Admin (local@noemail.com) password; unset, it is random per start and never shown,
              # which locks out the only account that can create users.
              LOCAL_ACCOUNT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: mesh-organiser-secret
                    key: LOCAL_ACCOUNT_PASSWORD
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Mesh Organiser
          gethomepage.dev/description: 3D model library
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: mdi-printer-3d
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /cfg
      tmp:
        type: emptyDir

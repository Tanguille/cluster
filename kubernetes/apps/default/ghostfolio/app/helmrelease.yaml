# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ghostfolio
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      labels:
        egress.home.arpa/dragonfly: allow
        egress.home.arpa/postgres: allow
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      ghostfolio:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghostfolio/ghostfolio
              tag: 3.96.0@sha256:97b9dd2e8b07610bfa383480b911065f7497070f53c302c037ab8a1b596ccae5
            env:
              REDIS_HOST: dragonfly.database.svc.cluster.local
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: dragonfly-auth
                    key: password
              # node-postgres TLS without verifying the CNPG cert; applies only while the sops URLs carry no sslmode.
              PGSSLMODE: no-verify
            # DIRECT_URL bypasses pgbouncer-rw (transaction mode): Prisma migrations need session-level advisory locks.
            envFrom:
              - secretRef:
                  name: ghostfolio-secret
            probes:
              # /api/v1/health 503s when Postgres or dragonfly is down: gates readiness and
              # startup, never liveness (a pooler blip would restart a healthy pod).
              liveness:
                enabled: true
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /api/v1/health
                    port: 3333
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        ports:
          http:
            port: 3333

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Ghostfolio
          gethomepage.dev/description: Wealth management
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: ghostfolio.png
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

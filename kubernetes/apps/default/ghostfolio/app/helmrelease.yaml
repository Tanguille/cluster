# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ghostfolio
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      ghostfolio:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/ghostfolio/ghostfolio
              tag: 3.75.0@sha256:dd6c6a95d5b726e9ae2954f177eff9bfd6df52942a2ae2baad1fb8710ccfc5c8
            env:
              REDIS_HOST: dragonfly.database.svc.cluster.local
            # DIRECT_URL bypasses pgbouncer-rw (transaction mode): Prisma migrations need session-level advisory locks.
            envFrom:
              - secretRef:
                  name: ghostfolio-secret
            probes:
              # /api/v1/health 503s when Postgres or dragonfly is down: gates readiness and
              # startup, never liveness (a pooler blip would restart a healthy pod).
              liveness:
                enabled: true
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3333
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3333
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        ports:
          http:
            port: 3333

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Ghostfolio
          gethomepage.dev/description: Wealth management
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: ghostfolio.png
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

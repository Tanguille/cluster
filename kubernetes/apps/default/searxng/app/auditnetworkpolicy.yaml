---
# Audit-only network policy (kguardian): reports what a default-deny would
# break WITHOUT enforcing anything. Observed baseline 2026-09-16 via
# kguardian pod_traffic: ingress :8080 from envoy-internal, the ai-namespace
# ToolHive searxng MCP consumer, and ephemeral CI runners; egress 443 + DNS.
# NOTE: review-runner pods (actions-runner-system, ephemeral names) health-check
# :8080 during CI — expect verdicts for them; carve out before enforcing.
# Promote to kind: NetworkPolicy only after verdicts stay empty.
apiVersion: kguardian.dev/v1alpha1
kind: AuditNetworkPolicy
metadata:
  name: searxng-baseline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Gateway traffic from envoy-internal
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - protocol: TCP
          port: 8080
    # ToolHive searxng MCP consumer in ai (observed 2026-09-15/16)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              toolhive-name: searxng
      ports:
        - protocol: TCP
          port: 8080
    # kubelet probes (/healthz) originate from node IPs
    - from:
        - ipBlock:
            cidr: 192.168.0.0/24
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Cluster DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Upstream search engines (hosts vary, observed 2026-09-16)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

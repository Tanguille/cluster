# See: https://docs.searxng.org/admin/searx.limiter.html

[botdetection]
# Same trust as Envoy's xForwardedFor.trustedCIDRs (the pod network). Trusting LAN
# ranges lets a LAN client forge X-Forwarded-For: the forged hop becomes its client IP.
trusted_proxies = ["127.0.0.0/8", "::1", "${POD_CIDR}"]

[botdetection.ip_lists]
# Allow trusted private clients to bypass header/link-token bot checks while the
# limiter remains active for public clients.
pass_ip = ["${POD_CIDR}", "${LAN_CIDR}"]

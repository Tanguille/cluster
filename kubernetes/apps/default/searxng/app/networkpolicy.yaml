---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-ingress-allowlist
spec:
  # Promoted from the kguardian AuditNetworkPolicy baseline (2026-09-16 to
  # 2026-09-18). Its ingress WouldDeny verdicts were kubelet probes (host
  # entity, not a node ipBlock) and ephemeral review runners. Ingress only;
  # egress stays open (searxng speaks QUIC/UDP 443 to engines).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  ingress:
    # kubelet probes on :8080.
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
        # ToolHive searxng MCP backend (the proxy never talks to searxng itself).
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app: searxng
            toolhive: "true"
        # agent-pr-review search_url.
        - matchLabels:
            io.kubernetes.pod.namespace: actions-runner-system
            app.kubernetes.io/name: review-runner
            app.kubernetes.io/component: runner
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is
    # ephemeral not 53.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-ingress-allowlist
spec:
  # Ingress only; egress stays open (searxng speaks QUIC/UDP 443 to engines).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  ingress:
    - fromEndpoints:
        # Gateway API label envoy-gateway stamps on proxy pods; same key as the vmcp-unified policy.
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
        # ToolHive searxng MCP backend (the proxy never talks to searxng itself).
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app: searxng
            toolhive: "true"
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

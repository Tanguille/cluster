---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-ingress-allowlist
spec:
  # Ingress only here; the namespace policy permits engine HTTP(S), including QUIC/UDP 443.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  ingress:
    # kubelet probes on :8080.
    - fromEntities:
        - host
    - fromEndpoints:
        # Gateway API label envoy-gateway stamps on proxy pods; same key as the vmcp-unified policy.
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
        # ToolHive searxng MCP backend (the proxy never talks to searxng itself).
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app: searxng
            toolhive: "true"
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is
    # ephemeral not 53.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns

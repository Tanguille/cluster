---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: notify-push
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      notify-push:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # No official image; using icewind1991/notify_push (Nextcloud contributor).
            # Track https://github.com/nextcloud/notify_push for an official image.
            image:
              repository: icewind1991/notify_push
              tag: 1.4.1@sha256:1883c5635c7cf6de4a07a4561ed7242227c473fd8e16224082af7111eb4a730f
            ports:
              - name: http
                containerPort: 7867
                protocol: TCP
            env:
              - name: NEXTCLOUD_URL
                value: "http://nextcloud.default.svc.cluster.local:8080"
              - name: REDIS_URL
                value: "redis://dragonfly.database.svc.cluster.local:6379"
              - name: POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secret
                    key: INIT_POSTGRES_USER
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secret
                    key: INIT_POSTGRES_PASS
              - name: DATABASE_URL
                value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@pgbouncer-rw.database.svc.cluster.local:5432/nextcloud"
              - name: LOG
                value: "info"
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                cpu: 50m
                memory: 96Mi
            # /push/test/cookie returns 400 until Nextcloud notify_push is fully configured; TCP
            # checks that the daemon is listening (see github.com/nextcloud/notify_push/issues/324).
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7867
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7867
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 5
    service:
      app:
        controller: notify-push
        ports:
          http:
            port: 7867
    # The nextcloud chart pins every HTTPRoute rule to its own service, so the
    # /push/ prefix is routed from here; longest-prefix match beats its `/` rule.
    route:
      app:
        hostnames: ["nextcloud.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /push/
            backendRefs:
              - identifier: app
                port: http

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nextcloud
spec:
  timeout: 15m
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 9.4.3
      url: oci://ghcr.io/nextcloud/helm/nextcloud
  # Chart has no fromAddressKey in existingSecret, so inject the secret value here.
  valuesFrom:
    - kind: Secret
      name: nextcloud-secret
      valuesKey: FROM_ADDRESS
      targetPath: nextcloud.mail.fromAddress

  # Chart has no automountServiceAccountToken value, and this internet-exposed pod needs no SA token.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: nextcloud
            patch: |-
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
          - target:
              kind: CronJob
              name: nextcloud-cron
            patch: |-
              - op: add
                path: /spec/jobTemplate/spec/template/spec/automountServiceAccountToken
                value: false
              # Chart has no TTL value; a failed run otherwise keeps KubeJobFailed firing until the next failure.
              - op: add
                path: /spec/jobTemplate/spec/ttlSecondsAfterFinished
                value: 3600

  values:
    prometheus:
      rules:
        enabled: true
        defaults:
          # The exporter runs in observability, not next to the chart.
          filter: 'namespace="observability",job="nextcloud-exporter"'

    # Preferred, not required: control-1 solo-resets ~16x/90d, and a hard pin made every one of those an outage.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - control-1
    image:
      repository: nextcloud
      tag: 35.0.2-fpm@sha256:187e41745c65a2c5e136fbc92137979d6b62d1bf8844f9ebd7681677ad361d63

    lifecycle:
      postStartCommand:
        - "/bin/bash"
        - "/scripts/post-start.sh"

    nginx:
      enabled: true
      image:
        repository: nginxinc/nginx-unprivileged
        tag: 1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
      # containerd allows unprivileged ports, so the chart's listen 80 still binds.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      config:
        headers:
          "Strict-Transport-Security": "max-age=15552000; includeSubDomains"
        serverBlockCustom: |
          client_max_body_size 10G;
          client_body_timeout 300s;
          fastcgi_buffers 64 4K;
          fastcgi_read_timeout 3600s;
          # Nothing scrapes the native /metrics, and any pod can spoof X-Forwarded-For into its loopback allowlist, so PHP never sees it.
          location ~ ^/(?:index\.php/)?metrics(?:/|$) { return 404; }
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 2
          # 7d scraped peak 32Mi; upload spikes fall between scrapes, and a 256Mi limit OOMKilled the nightly HA backup (08-23, 09-04, 09-05).
          memory: 512Mi

    nextcloud:
      datadir: /var/www/data
      extraEnv:
        # libpq: covers the replica connections too, which pgsql_ssl does not reach.
        - name: PGSSLMODE
          value: require
        # No client certs: libpq fails fatally when $HOME is unreadable (/root under `su -p`, e.g. occ upgrade); the fpm HOME pin below covers workers only.
        - name: PGSSLCERTMODE
          value: disable

      existingSecret:
        enabled: true
        secretName: nextcloud-secret
        usernameKey: NEXTCLOUD_USERNAME
        passwordKey: NEXTCLOUD_PASSWORD
        smtpUsernameKey: SMTP_USERNAME
        smtpPasswordKey: SMTP_PASSWORD
        smtpHostKey: SMTP_HOST

      host: nextcloud.${SECRET_DOMAIN}

      # Nothing scrapes the native /metrics; an empty list makes the chart omit OPENMETRICS_ALLOWED_CLIENTS, so Nextcloud's loopback-only default (127.0.0.0/16, ::1/128) applies.
      openmetrics:
        allowedClients: []

      mail:
        enabled: true
        domain: gmail.com
        smtp:
          secure: starttls

      # Root only for post-start.sh's apt-get; the entrypoint drops to www-data itself
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      podSecurityContext:
        fsGroup: 33

      # Runs after `occ upgrade`; a non-zero exit aborts startup, hence `|| true`.
      hooks:
        post-upgrade: |
          #!/bin/sh
          for c in db:add-missing-indices db:add-missing-primary-keys db:add-missing-columns "maintenance:repair --include-expensive"; do
            php /var/www/html/occ $c || true
          done

      extraVolumes:
        - name: scripts
          configMap:
            name: nextcloud-scripts
        - name: replica-config
          secret:
            secretName: nextcloud-secret
            items:
              - key: replica.config.php
                path: replica.config.php

      extraVolumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: replica-config
          mountPath: /var/www/html/config/replica.config.php
          subPath: replica.config.php
          readOnly: true

      phpConfigs:
        www.conf: |
          [www]
          user = www-data
          group = www-data
          listen = 127.0.0.1:9000
          ; The container runtime gives the fpm master - and thus the www-data workers -
          ; HOME=/root. With PGSSLMODE=require, libpq's default client-cert lookup
          ; ($HOME/.postgresql/postgresql.crt) then fails fatally (EACCES on the 0700 /root)
          ; and every DB connection errors, 503-ing all web requests (seen after the
          ; 35.0.2-fpm image re-release of 2026-11-04). Pin the workers' HOME to a
          ; directory they can stat; verified connect OK from www-data with HOME=/var/www.
          env[HOME] = /var/www
          pm = dynamic
          ; php-fpm ini: only ';' comments are valid here, '#' fails the parser
          ; 4 workers starved /status.php past the 5s probe under a thumbnail burst; ~175MB RSS/worker measured
          pm.max_children = 6
          pm.start_servers = 4
          pm.min_spare_servers = 2
          pm.max_spare_servers = 6
          pm.max_requests = 800
          request_terminate_timeout = 600
          ; Kept after the CVE-2026-109619 fix (PHP 8.5.12), per the advisory; Nextcloud uses neither
          php_admin_value[session.upload_progress.enabled] = 0
          php_admin_value[fatal_error_backtraces] = 0

      configs:
        # Pod network only (cloudflared, Envoy); trusting LAN ranges made Nextcloud see Envoy, not the LAN client, in logs and brute-force throttling.
        proxy.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_proxies' => array(
              0 => '127.0.0.1',
              1 => '${POD_CIDR}',
            ),
            'trusted_domains' => array(
              0 => 'nextcloud.${SECRET_DOMAIN}',
              1 => 'localhost',
              2 => '127.0.0.1',
            ),
          );
        misc.config.php: |-
          <?php
          $CONFIG = array (
            'overwrite.cli.url' => 'https://nextcloud.${SECRET_DOMAIN}',
            'default_phone_region' => 'BE',
            'maintenance_window_start' => 2,
            'loglevel' => 1,
            'logdateformat' => 'F d, Y H:i:s',
            'allow_local_remote_servers' => true,
          );
        performance.config.php: |-
          <?php
          $CONFIG = array (
            'enabledPreviewProviders' => array(
              'OC\Preview\PNG',
              'OC\Preview\JPEG',
              'OC\Preview\GIF',
              'OC\Preview\BMP',
              'OC\Preview\XBitmap',
              'OC\Preview\MP3',
              'OC\Preview\TXT',
              'OC\Preview\MarkDown',
              'OC\Preview\OpenDocument',
              'OC\Preview\Krita',
              'OC\Preview\HEIC',
              'OC\Preview\PDF',
              'OC\Preview\TIFF',
              'OC\Preview\SVG',
              'OC\Preview\MP4',
              'OC\Preview\Movie',
            ),
            'preview_max_x' => 2048,
            'preview_max_y' => 2048,
            'preview_max_scale_factor' => 1,
            'preview_concurrency_all' => 4,
            'jpeg_quality' => 60,
          );

    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    # App and cron pods both get these: client grants for the database and dragonfly label gates.
    podLabels:
      egress.home.arpa/dragonfly: allow
      egress.home.arpa/postgres: allow

    internalDatabase:
      enabled: false

    externalDatabase:
      type: postgresql
      host: pgbouncer-rw.database.svc.cluster.local:5432
      existingSecret:
        secretName: nextcloud-secret
        usernameKey: INIT_POSTGRES_USER
        passwordKey: INIT_POSTGRES_PASS

    # REDIS_HOST, REDIS_HOST_PORT and REDIS_HOST_PASSWORD for app and cron; the image wires them into config.php and the session handler.
    externalRedis:
      enabled: true
      host: dragonfly.database.svc.cluster.local
      existingSecret:
        enabled: true
        secretName: dragonfly-auth
        passwordKey: password

    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: "false"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Nextcloud
        gethomepage.dev/description: Files, calendar, contacts
        gethomepage.dev/group: Portals
        gethomepage.dev/icon: nextcloud.png
        gethomepage.dev/href: https://nextcloud.${SECRET_DOMAIN}
        gethomepage.dev/widget.type: nextcloud
        gethomepage.dev/widget.url: https://nextcloud.${SECRET_DOMAIN}
        gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_NEXTCLOUD_TOKEN}}"
      hostnames:
        - "nextcloud.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-external
          namespace: network
      # /push/ is routed by notify-push (this chart pins every rule to nextcloud).
      # The four rewritten rules stay here because nginx's /.well-known fallback 301s to $host:80 without X-Forwarded-Port from Envoy.
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /.well-known/webfinger
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /index.php/.well-known/webfinger
        - matches:
            - path:
                type: PathPrefix
                value: /.well-known/nodeinfo
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /index.php/.well-known/nodeinfo
        - matches:
            - path:
                type: Exact
                value: /.well-known/host-meta
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplaceFullPath
                  replaceFullPath: /public.php?service=host-meta
        - matches:
            - path:
                type: Exact
                value: /.well-known/host-meta.json
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplaceFullPath
                  replaceFullPath: /public.php?service=host-meta-json
        - matches:
            - path:
                type: PathPrefix
                value: /

    persistence:
      enabled: true
      existingClaim: *app
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-pvc

    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        failedJobsHistoryLimit: 1
        successfulJobsHistoryLimit: 2
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nextcloud
                    app.kubernetes.io/instance: nextcloud
                    app.kubernetes.io/component: app
                topologyKey: kubernetes.io/hostname
        command:
          - /bin/bash
          - /scripts/cron.sh
        securityContext:
          # cron.sh runs as www-data, not via the root entrypoint.
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsUser: 33
          runAsGroup: 33
          runAsNonRoot: true
        resources:
          requests:
            cpu: 100m
            # Affinity pins it to the app pod's node; a large request there went Pending.
            memory: 256Mi
          limits:
            cpu: "2"
            # 2Gi was hit (cron OOMKilled); 30d max 2.71GiB
            memory: 4Gi

    # nginx's probes hit /status.php via fpm, so a saturated pool restarted nginx; readiness still gates traffic.
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 6

    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 10

    resources:
      requests:
        cpu: 10m
        memory: 192Mi
      limits:
        cpu: 4
        # 30d max WSS 1.22GiB, 0 OOM; imagick previews allocate outside memory_limit (preview_max_memory 1024)
        memory: 4Gi

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nextcloud
spec:
  timeout: 15m
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: nextcloud

  # Chart 9.2.x has no fromAddressKey in existingSecret, so inject the secret value here.
  valuesFrom:
    - kind: Secret
      name: nextcloud-secret
      valuesKey: FROM_ADDRESS
      targetPath: nextcloud.mail.fromAddress

  # Chart has no automountServiceAccountToken value; nextcloud is the only
  # internet-exposed app still auto-mounting its default SA token.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: nextcloud
            patch: |-
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
          - target:
              kind: CronJob
              name: nextcloud-cron
            patch: |-
              - op: add
                path: /spec/jobTemplate/spec/template/spec/automountServiceAccountToken
                value: false

  values:
    prometheus:
      rules:
        enabled: true

    # Preferred, not required: control-1 solo-resets ~16x/90d, and a hard pin made every one of those an outage.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - control-1
    image:
      # repository is the chart default, spelled out so Renovate tracks the digest.
      repository: nextcloud
      flavor: fpm
      # Pinned past chart appVersion (34.0.3) to pull Debian trixie security
      # rebuilds (deb13u* fixed versions per Trivy).
      tag: 35.0.0-fpm@sha256:20902c779b72e761b8b9b2f5c955bb53a8f5916278e3d4cc19d643e9b4a5a670

    lifecycle:
      postStartCommand:
        - "/bin/bash"
        - "/scripts/post-start.sh"

    nginx:
      enabled: true
      config:
        headers:
          "Strict-Transport-Security": "max-age=15552000; includeSubDomains"
        serverBlockCustom: |
          client_max_body_size 10G;
          client_body_timeout 300s;
          fastcgi_buffers 64 4K;
          fastcgi_read_timeout 3600s;
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 2
          memory: 256Mi

    nextcloud:
      datadir: /var/www/data
      extraEnv:
        - name: REDIS_HOST
          value: dragonfly.database.svc.cluster.local
        - name: REDIS_HOST_PORT
          value: "6379"

      existingSecret:
        enabled: true
        secretName: nextcloud-secret
        usernameKey: NEXTCLOUD_USERNAME
        passwordKey: NEXTCLOUD_PASSWORD
        smtpUsernameKey: SMTP_USERNAME
        smtpPasswordKey: SMTP_PASSWORD
        smtpHostKey: SMTP_HOST

      host: nextcloud.${SECRET_DOMAIN}

      mail:
        enabled: true
        domain: gmail.com
        smtp:
          secure: starttls

      # Root only for post-start.sh's apt-get; the entrypoint drops to www-data itself
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      podSecurityContext:
        fsGroup: 33

      # One-shot post-upgrade repairs; the image runs this after `occ upgrade` and
      # aborts startup on a non-zero exit, hence the `|| true`.
      hooks:
        post-upgrade: |
          #!/bin/sh
          for c in db:add-missing-indices db:add-missing-primary-keys db:add-missing-columns "maintenance:repair --include-expensive"; do
            php /var/www/html/occ $c || true
          done

      extraVolumes:
        - name: scripts
          configMap:
            name: nextcloud-scripts
            defaultMode: 0755
        - name: replica-config
          secret:
            secretName: nextcloud-secret
            items:
              - key: replica.config.php
                path: replica.config.php

      extraVolumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: replica-config
          mountPath: /var/www/html/config/replica.config.php
          subPath: replica.config.php
          readOnly: true

      phpConfigs:
        www.conf: |
          [www]
          user = www-data
          group = www-data
          listen = 127.0.0.1:9000
          pm = dynamic
          ; php-fpm ini: only ';' comments are valid here, '#' fails the parser
          ; 4 workers starved /status.php past the 5s probe under a thumbnail burst; ~175MB RSS/worker measured
          pm.max_children = 6
          pm.start_servers = 4
          pm.min_spare_servers = 2
          pm.max_spare_servers = 6
          pm.max_requests = 800
          request_terminate_timeout = 600

      configs:
        proxy.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_proxies' => array(
              0 => '127.0.0.1',
              1 => '10.0.0.0/8',
              2 => '172.16.0.0/12',
              3 => '192.168.0.0/16',
            ),
            'trusted_domains' => array(
              0 => 'nextcloud.${SECRET_DOMAIN}',
              1 => 'localhost',
              2 => '127.0.0.1',
            ),
          );
        misc.config.php: |-
          <?php
          $CONFIG = array (
            'overwrite.cli.url' => 'https://nextcloud.${SECRET_DOMAIN}',
            'default_phone_region' => 'BE',
            'maintenance_window_start' => 2,
            'loglevel' => 1,
            'logdateformat' => 'F d, Y H:i:s',
            'allow_local_remote_servers' => true,
          );
        performance.config.php: |-
          <?php
          $CONFIG = array (
            'enabledPreviewProviders' => array(
              'OC\Preview\PNG',
              'OC\Preview\JPEG',
              'OC\Preview\GIF',
              'OC\Preview\BMP',
              'OC\Preview\XBitmap',
              'OC\Preview\MP3',
              'OC\Preview\TXT',
              'OC\Preview\MarkDown',
              'OC\Preview\OpenDocument',
              'OC\Preview\Krita',
              'OC\Preview\HEIC',
              'OC\Preview\PDF',
              'OC\Preview\TIFF',
              'OC\Preview\SVG',
              'OC\Preview\MP4',
              'OC\Preview\Movie',
            ),
            'preview_max_x' => 2048,
            'preview_max_y' => 2048,
            'preview_max_scale_factor' => 1,
            'preview_concurrency_all' => 4,
            'jpeg_quality' => 60,
          );

    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    internalDatabase:
      enabled: false

    externalDatabase:
      enabled: true
      type: postgresql
      host: pgbouncer-rw.database.svc.cluster.local:5432
      database: *app
      existingSecret:
        enabled: true
        secretName: nextcloud-secret
        usernameKey: INIT_POSTGRES_USER
        passwordKey: INIT_POSTGRES_PASS

    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: "false"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Nextcloud
        gethomepage.dev/description: Files, calendar, contacts
        gethomepage.dev/group: Portals
        gethomepage.dev/icon: nextcloud.png
        gethomepage.dev/href: https://nextcloud.${SECRET_DOMAIN}
        gethomepage.dev/widget.type: nextcloud
        gethomepage.dev/widget.url: https://nextcloud.${SECRET_DOMAIN}
        gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_NEXTCLOUD_TOKEN}}"
      hostnames:
        - "nextcloud.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-external
          namespace: network
      # /push/ lives in notify-push/helmrelease.yaml: this chart pins every rule's
      # backendRef to the nextcloud service (filters are honoured). nginx already
      # 404s /config, /occ, etc. Its /.well-known fallback 301s to $host:80 (no
      # X-Forwarded-Port from Envoy), so these four stay rewritten at the edge.
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /.well-known/webfinger
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /index.php/.well-known/webfinger
        - matches:
            - path:
                type: PathPrefix
                value: /.well-known/nodeinfo
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /index.php/.well-known/nodeinfo
        - matches:
            - path:
                type: Exact
                value: /.well-known/host-meta
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplaceFullPath
                  replaceFullPath: /public.php?service=host-meta
        - matches:
            - path:
                type: Exact
                value: /.well-known/host-meta.json
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplaceFullPath
                  replaceFullPath: /public.php?service=host-meta-json
        - matches:
            - path:
                type: PathPrefix
                value: /

    persistence:
      enabled: true
      existingClaim: *app
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-pvc

    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        failedJobsHistoryLimit: 1
        successfulJobsHistoryLimit: 2
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nextcloud
                    app.kubernetes.io/instance: nextcloud
                    app.kubernetes.io/component: app
                topologyKey: kubernetes.io/hostname
        command:
          - /bin/bash
          - /scripts/cron.sh
        securityContext:
          runAsUser: 33
          runAsGroup: 33
          runAsNonRoot: true
        resources:
          requests:
            cpu: 100m
            memory: 500Mi
          limits:
            cpu: "1"
            # 2Gi was hit (OOMKilled 2026-09-15, nextcloud-cron-29825165); 7d max 2.78GiB
            memory: 4Gi

    # Probes only exist on the nginx sidecar and all hit /status.php through fpm, so a
    # saturated pool restarted nginx; readiness (default 5s x3) still pulls it from rotation.
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 6

    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 10

    resources:
      requests:
        cpu: 100m
        memory: 500Mi
      limits:
        cpu: 4
        # 30d max WSS 1.57GiB, 0 OOM; imagick previews allocate outside memory_limit (preview_max_memory 1024)
        memory: 4Gi

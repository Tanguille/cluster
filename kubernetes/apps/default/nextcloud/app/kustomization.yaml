---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafanadashboard.yaml
  - helmrelease.yaml
  - secret.sops.yaml
  - nfs-pvc.yaml
configMapGenerator:
  - name: nextcloud-scripts
    files:
      - scripts/cron.sh
      - scripts/post-start.sh
    options:
      annotations:
        # Shell scripts, not flux templates: keep postBuild envsubst off them.
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/objectbucket.io/objectbucketclaim_v1alpha1.json
# Rook writes the bucket's keys to a Secret of the same name in this namespace.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: plane-uploads
spec:
  bucketName: plane-uploads
  storageClassName: ceph-bucket

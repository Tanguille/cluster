---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritik
spec:
  interval: 30m
  chart:
    spec:
      chart: ./charts/kritik
      # The pin is a commit, not a chart version, so a new commit must move the artifact.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: kritik
  values:
    # repository+tag@digest so Renovate tracks it; the chart renders repository:tag when digest is unset.
    image:
      repository: ghcr.io/home-operations/kritik
      tag: main@sha256:b665e86e51378cefd234bcaed893b910ba7bb01f8b03a8042ceec51b7b43030f
    runner:
      # -tools adds curl, fd, gh and rg for agent.commands.
      image: ghcr.io/home-operations/kritik:main-tools@sha256:39efc940f6ee3d62bc556cd33682d466e9cd933b356acc3825297f16b8ff137d
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    web:
      url: "https://kritik.${SECRET_DOMAIN}"
    auth:
      # Local admin is the way into a fresh instance; drop it once GitHub or OIDC is set up.
      admin:
        user: admin
        passwordSecret:
          name: &secret kritik-secret
          key: admin-password
    # All DSNs hit postgres16-rw directly: kritik LISTENs and sets startup params, which pgbouncer rejects.
    database:
      owner:
        existingSecret: *secret
        key: owner-uri
      app:
        existingSecret: *secret
        key: app-uri
        role: kritik_app
      runner:
        existingSecret: *secret
        key: runner-uri
        role: kritik_runner
    config:
      # Drop a turned-off repo's index after 1h instead of 720h; re-enabling onboards a fresh one.
      indexGrace: 1h
      file:
        apps:
          - name: github
            accounts: [tanguille]
            clientId: Iv23liEpcPGN5z8KRBta
            privateKey: { env: GITHUB_APP_PRIVATE_KEY }
            webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
        providers:
          litellm:
            type: openai
            baseUrl: "http://litellm.ai.svc.cluster.local/v1"
            apiKey: { env: LITELLM_API_KEY }
        defaults:
          # Mirrors CI agent-review: omniroute primary, qwen-3.8 fallback.
          models:
            review: litellm/omniroute
            fallback: litellm/qwen-3.8
          # gh only: its run-scoped token is read-only; no curl, so PR text can't steer raw requests.
          agent:
            commands: [gh]
          # Adapted from onedr0p/home-ops' kritik entry.
          rules:
            - id: renovate
              whenExpr: pr.headRef.startsWith("renovate/")
              rule: >-
                This is a Renovate dependency update. Find what changed between the old and new
                versions from upstream's release notes, changelog or compare view. Use the notes
                Renovate embedded under "Release Notes" in the body when present; otherwise fetch
                them with gh (gh api repos/OWNER/REPO/releases/tags/TAG, one call per release,
                never the releases list). Report breaking changes,
                removed or renamed config keys and new defaults that affect how this repository
                uses the dependency, and point at the lines they touch. Say so plainly when the
                notes show nothing that affects this repository.
        embedding:
          model: litellm/qwen3-embedding
          dims: 1024
    secretEnv:
      - name: LITELLM_API_KEY
        secretName: cluster-secrets
        key: LITELLM_API_KEY
      - name: GITHUB_APP_PRIVATE_KEY
        secretName: *secret
        key: github-private-key
      - name: GITHUB_APP_WEBHOOK_SECRET
        secretName: *secret
        key: github-webhook-secret
    # Internal only: public dashboard plus local admin and unsandboxed runners is too exposed.
    # GitHub webhooks can't reach it, so events arrive via polling.
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
    # Server egress; runners use the chart's separate DNS/Postgres/gateway policy.
    networkPolicy:
      enabled: true
      # Cilium matches the pod port after service DNAT, so litellm needs 4000, not 80.
      egressPorts:
        - 443
        - 4000
    monitoring:
      serviceMonitor:
        enabled: true

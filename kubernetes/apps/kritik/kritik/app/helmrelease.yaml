---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritik
spec:
  interval: 30m
  chart:
    spec:
      chart: ./charts/kritik
      # The pin is a commit, not a chart version, so a new commit must move the artifact.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: kritik
  values:
    # No release exists, so the chart's appVersion is 0.0.0 and `main` is the only published tag.
    # Digests are pinned to the same commit as gitrepository.yaml.
    image:
      tag: main
      digest: sha256:4c63833aa76d49b5a53b474455daf8e493abe8e1eb8068b6a169930e8252d802
    runner:
      # The -tools variant adds curl, fd, gh and rg for an agentic review's agent.commands.
      image: ghcr.io/home-operations/kritik:main-tools@sha256:208181a1583030fda04941bb114c7756a55ce69556cd16dc85f62d1bb9a3ee85
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    # The one public URL: the dashboard at it, GitHub's webhooks under it at /hooks/<app>.
    # TLS terminates on the gateway with the wildcard certificate.
    web:
      url: "https://kritik.${SECRET_DOMAIN}"
    auth:
      # Local admin is the way into a fresh instance; drop it once GitHub or OIDC is set up.
      admin:
        user: admin
        passwordSecret:
          name: kritik-secret
          key: admin-password
    # Three roles on the shared postgres16. The owner runs migrations and must not be a
    # superuser, so its DSN points at postgres16-rw rather than the transaction-mode pooler.
    database:
      owner:
        existingSecret: kritik-db-owner
        key: uri
      app:
        existingSecret: kritik-db-app
        key: uri
        role: kritik_app
      runner:
        existingSecret: kritik-db-runner
        key: uri
        role: kritik_runner
    config:
      # The embedder: the same qwen3-embedding through LiteLLM that memini indexes with, so
      # no external embedding key and no egress to a third party. Secrets stay in secretEnv
      # (set from existing Secrets, dropped from the environment after reading) instead of
      # extraEnv values, so the key never lands in the HelmRelease, Deployment or Helm history.
      file:
        providers:
          litellm:
            type: openai
            baseUrl: "http://litellm.ai.svc.cluster.local/v1"
            apiKey: { env: LITELLM_API_KEY }
        embedding:
          model: litellm/qwen3-embedding
          dims: 1024
    secretEnv:
      # cluster-secrets is rendered into this namespace by the common component; referencing
      # it avoids duplicating LITELLM_API_KEY into kritik-secret with manual rotation.
      - name: LITELLM_API_KEY
        secretName: cluster-secrets
        key: LITELLM_API_KEY
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
    # Runner pods reach nothing but DNS, Postgres and the gateway: the forward proxy they get
    # as HTTPS_PROXY and the per-run model endpoint. 80 is LiteLLM for the embedder.
    networkPolicy:
      enabled: true
      egressPorts:
        - 80
        - 443
    monitoring:
      serviceMonitor:
        enabled: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
# Upstream publishes no chart and has no release, so the chart is read from the repository at a
# pinned commit. Bump the SHA to move: nothing is released, so there is no tag to track, and the
# README warns there is no upgrade path from one commit to the next. Re-read the values below
# against that commit's charts/kritik/values.yaml when bumping.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kritik
spec:
  interval: 1h
  url: https://github.com/home-operations/kritik
  ref:
    commit: 6c9ea16dbd907ae7af93e9603b283d7564b19aa9
  # Only the chart is wanted; without this the source vendors the whole Go tree.
  ignore: |-
    /*
    !/charts/kritik

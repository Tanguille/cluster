---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
# No chart release; the chart is read at a pinned commit. Re-read values.yaml on bump.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kritik
spec:
  interval: 1h
  url: https://github.com/home-operations/kritik
  ref:
    commit: e4bb79f665f2258b1b6c335e781c263e84c150f1
  # Only the chart; without this the whole Go tree is vendored.
  ignore: |-
    /*
    !/charts/kritik

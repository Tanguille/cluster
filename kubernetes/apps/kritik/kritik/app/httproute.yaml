---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Public for GitHub deliveries only; the dashboard and API stay on envoy-internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kritik-webhook
spec:
  hostnames: ["kritik-webhook.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: kritik
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /hooks/

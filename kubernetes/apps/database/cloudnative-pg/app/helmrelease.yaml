---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 0.29.1
      url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
  values:
    monitoring:
      grafanaDashboard:
        create: true
    resources:
      requests:
        memory: 256Mi

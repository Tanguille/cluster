---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: SlowQuery
          annotations:
            description: Query on pod {{ $labels.pod }} has been running for more than 30 seconds
            summary: A query is taking longer than 30 seconds to execute
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 30
          for: 1m
          labels:
            severity: info
        - alert: VerySlowQuery
          annotations:
            description: Query on pod {{ $labels.pod }} has been running for more than 60 seconds
            summary: A query is taking longer than 60 seconds to execute
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 60
          for: 1m
          labels:
            severity: warning
        - alert: SlowQueryHighFrequency
          annotations:
            description: Pod {{ $labels.pod }} has multiple slow queries (avg duration > 5s) occurring frequently
            summary: Multiple slow queries detected on this pod
          expr: |-
            rate(cnpg_backends_max_tx_duration_seconds[5m]) > 5
          for: 5m
          labels:
            severity: warning
        - alert: CNPGInstanceRestartLoop
          annotations:
            description: Pod {{ $labels.pod }} is restarting repeatedly.
            summary: A CloudNativePG instance is stuck in a restart loop.
          # kube-state-metrics doesn't expose the cnpg.io/cluster pod label, match by pod name prefix instead
          expr: |-
            rate(kube_pod_container_status_restarts_total{namespace="database", pod=~"postgres16-.*"}[30m]) > 0
          for: 30m
          labels:
            severity: warning
        - alert: CNPGClusterNotReady
          annotations:
            description: Instance {{ $labels.pod }} of cluster {{ $labels.cluster }} has been down for more than 15 minutes.
            summary: A CloudNativePG instance is not ready.
          expr: |-
            cnpg_collector_up == 0
          for: 15m
          labels:
            severity: critical
        # Backup observability is partial with the barman plugin: the collector's
        # last_available/first_recoverability timestamps stay 0 (never populated for
        # method: plugin), so "no recent success" is not directly queryable. The two
        # signals that ARE observable: the last-failed timestamp moves when an attempt
        # fails, and WAL archiving (archive_timeout: 300s) stalls when the R2 path
        # breaks. 23 backups failed silently between 2025-11 and 2026-08 before anyone
        # noticed; these two would have paged on the first failure.
        - alert: CNPGBackupFailed
          annotations:
            description: The last-failed timestamp moved within the last 2h, so a backup attempt failed. Check `kubectl get backups -n database` for the newest failed Backup, and the barman-cloud plugin logs if it recurs.
            summary: A CNPG backup attempt failed recently in {{ $labels.namespace }}
          expr: |-
            time() - max by (namespace) (cnpg_collector_last_failed_backup_timestamp) < 7200
          for: 5m
          labels:
            severity: warning
        - alert: CNPGWalArchiveStalled
          annotations:
            description: No WAL archived for over 30m while archive_timeout is 300s, i.e. ~6 missed timeouts. PITR is frozen and the 7d R2 window is shrinking while base backups age.
            summary: WAL archiving from {{ $labels.pod }} has been stalled for {{ $value | humanizeDuration }}
          expr: |-
            max by (namespace, pod) (cnpg_pg_stat_archiver_seconds_since_last_archival) > 1800
          for: 15m
          labels:
            severity: warning

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/pooler_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pgbouncer-rw
spec:
  cluster:
    name: postgres16
  instances: 3
  type: rw
  # Requests (kept out of BestEffort: losing replicas funnels every client onto the survivor) and priority class come from the Pooler patch in kustomization.yaml.
  template:
    spec:
      # Hard spread (one per node): soft ScheduleAnyway let all 3 rw pods pile onto one node after a flap.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Skew per ReplicaSet: old replicas on two nodes otherwise pin the surge pod to the third.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: pgbouncer-rw
  pgbouncer:
    poolMode: transaction
    parameters:
      client_tls_sslmode: require
      max_client_conn: "1000"
      # Per database and user: 3 pods x 20 = 60 worst case, 40 with a node down (peak observed: 20).
      default_pool_size: "20"
      server_idle_timeout: "120"
      server_login_retry: "5"
      query_wait_timeout: "15"

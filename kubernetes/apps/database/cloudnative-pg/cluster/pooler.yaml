---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/pooler_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pgbouncer-rw
spec:
  cluster:
    name: postgres16
  instances: 3
  type: rw
  # Requests keep it out of BestEffort: losing replicas funnels every client onto the survivor's wait queue.
  template:
    spec:
      priorityClassName: homelab-critical
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      # Hard spread (one per node): soft ScheduleAnyway let all 3 rw pods pile onto one node after a flap.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: pgbouncer-rw
  pgbouncer:
    poolMode: transaction
    parameters:
      client_tls_sslmode: require
      max_client_conn: "1000"
      # Per database and user: 3 pods x 15 = 45 worst case, 30 with a node down (peak observed: 20).
      default_pool_size: "15"
      server_idle_timeout: "120"
      server_login_retry: "5"
      query_wait_timeout: "15"

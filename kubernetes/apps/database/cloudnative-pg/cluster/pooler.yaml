---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/pooler_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pgbouncer-rw
spec:
  cluster:
    name: postgres16
  instances: 3
  type: rw
  # Requests keep it out of BestEffort: losing replicas funnels every client onto the survivor's wait queue.
  template:
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      # Hard spread (one per node): soft ScheduleAnyway let all 3 rw pods pile onto one node after a flap.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: pgbouncer-rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      max_db_connections: "30"
      reserve_pool_size: "8"
      reserve_pool_timeout: "3"
      server_idle_timeout: "120"
      server_login_retry: "5"
      query_wait_timeout: "15"

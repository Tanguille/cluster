---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/policy/poddisruptionbudget_v1.json
# CNPG makes no PDBs for Poolers (no disruption field); these keep connections up through drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-rw
spec:
  # One per node: two must stay or traffic queues on the survivors; maxUnavailable so scale-down never bricks drains.
  maxUnavailable: 1
  selector:
    matchLabels:
      cnpg.io/poolerName: pgbouncer-rw
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/policy/poddisruptionbudget_v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-ro
spec:
  minAvailable: 1
  selector:
    matchLabels:
      cnpg.io/poolerName: pgbouncer-ro
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/policy/poddisruptionbudget_v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-session
spec:
  minAvailable: 1
  selector:
    matchLabels:
      cnpg.io/poolerName: pgbouncer-session

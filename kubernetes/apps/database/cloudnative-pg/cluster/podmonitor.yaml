---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
# Replaces the deprecated Cluster monitoring.enablePodMonitor; same selector the operator generated.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres16-instances
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres16
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
# Pooler metrics (cl_waiting, maxwait) to size the pools from data instead of guesses.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pgbouncer
spec:
  selector:
    matchExpressions:
      - key: cnpg.io/poolerName
        operator: Exists
  podMetricsEndpoints:
    - port: metrics

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:2dec999a31ecd2d13ec1a7e292370a9001c17f572d4a2cf2ee46b2761930ad40
  instances: 3
  primaryUpdateMethod: switchover
  storage:
    size: 30Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  # CNPG enforces the basic-auth Secret password, so the app's DATABASE_URL must match; nothing re-syncs them, so rotation is off.
  managed:
    roles:
      - name: litellm
        login: true
        passwordSecret:
          name: litellm-db
      - name: jellystat
        login: true
        passwordSecret:
          name: jellystat-db
      - name: radarr
        login: true
        passwordSecret:
          name: radarr-db
      - name: bazarr
        login: true
        passwordSecret:
          name: bazarr-db
      - name: sonarr
        login: true
        passwordSecret:
          name: sonarr-db
      - name: prowlarr
        login: true
        passwordSecret:
          name: prowlarr-db
      - name: memini
        login: true
        passwordSecret:
          name: memini-db
      - name: spoolman
        login: true
        passwordSecret:
          name: spoolman-db
      - name: gatus
        login: true
        passwordSecret:
          name: gatus-db
      - name: nextcloud
        login: true
        # Preserve the role's existing CREATEDB privilege; CNPG reconciles every
        # unspecified attribute to its default (NOCREATEDB) when adopting a role.
        createdb: true
        passwordSecret:
          name: nextcloud-db
      - name: grafana
        login: true
        passwordSecret:
          name: grafana-db
      - name: crowdsec
        login: true
        passwordSecret:
          name: crowdsec-db
      - name: ghostfolio
        login: true
        passwordSecret:
          name: ghostfolio-db
      - name: kguardian
        login: true
        passwordSecret:
          name: kguardian-db
      # kritika's three roles (the database and roles keep the old kritik name). It refuses to start unless they are separated: the
      # owner runs migrations and must not be a superuser, the app role owns no
      # table so row-level security applies to it, and the runner role is handed
      # to runner Jobs which may only write their own run.
      - name: kritik
        login: true
        # Same as nextcloud: CNPG creates the declarative database as the owner,
        # which needs CREATEDB, and reconciles the attribute back to its default
        # (NOCREATEDB) when it is left unspecified on an adopted role.
        createdb: true
        passwordSecret:
          name: kritik-db
      - name: kritik_app
        login: true
        passwordSecret:
          name: kritik-app-db
      - name: kritik_runner
        login: true
        passwordSecret:
          name: kritik-runner-db
  postgresql:
    parameters:
      wal_level: replica
      # Cluster-wide cap: backends stack per database + overlap if one DB uses both rw poolers.
      # Keep above Σ(pooler instances × max_db_connections) for worst-case same-DB paths + replication/autovacuum/admin.
      max_connections: "150"
      # nextcloud hot set is ~3GB (oc_filecache alone 2GB); at 1GB the daily hit ratio sat at 99.1-99.4%, ~19GiB/day misses
      shared_buffers: 2GB
      # off, not the try default: no hugepages are reserved on any node, so try would log an allocation failure every start.
      huge_pages: "off"
      # io_method: "io_uring" # Blocked by default K8s/containerd seccomp profile (see cloudnative-pg/cloudnative-pg#9948). worker = safe default.
      work_mem: 16MB
      # End idle-in-xact sessions so xmin can advance (ORM leaks, forgotten BEGIN).
      idle_in_transaction_session_timeout: "600000"
      # Peak maintenance memory ≈ maintenance_work_mem × max_parallel_maintenance_workers (here ~1GB).
      maintenance_work_mem: 512MB
      max_parallel_workers: "4"
      max_parallel_workers_per_gather: "4"
      min_wal_size: 2GB
      max_wal_size: 8GB
      checkpoint_timeout: 15min
      checkpoint_warning: "60"
      wal_compression: "zstd"
      wal_buffers: 32MB
      # Many small DBs: more aggressive autovacuum + freeze than defaults.
      autovacuum_vacuum_scale_factor: "0.02"
      autovacuum_analyze_scale_factor: "0.01"
      autovacuum_analyze_threshold: "25"
      autovacuum_vacuum_insert_scale_factor: "0.05"
      # Higher limit / lower delay than defaults to finish autovacuum sooner on NVMe.
      autovacuum_vacuum_cost_limit: "2000"
      autovacuum_vacuum_cost_delay: "1ms"
      autovacuum_freeze_max_age: "100000000"
      vacuum_freeze_table_age: "75000000"
      default_statistics_target: "200"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      maintenance_io_concurrency: "200"
      # Listed in shared_preload_libraries below; first enable rolls the cluster.
      pg_stat_statements.max: "7500"
    # vchord.so required for vchord; pg_stat_statements matches parameters above.
    shared_preload_libraries:
      - "vchord.so"
      - "pg_stat_statements"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        # vchord-scratch mirrors the base image's real install tree (usr/lib/postgresql/18/lib,
        # usr/share/postgresql/18/extension) instead of CNPG's default extension-image layout
        # (lib/, share/ at the image root), so the default search path never finds vchord.so.
        # These paths are resolved relative to this extension's own mount.
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18
      - name: vector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4
      # primary working set peaked 1.85GiB at 1GB shared_buffers (now 2GB, not remeasured)
      memory: 4Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: &plugin barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &barmanParameters
        barmanObjectName: r2
        # Bump when restoring from an existing CNPG cluster (new logical server id for backups).
        serverName: postgres18
  # Recovery from prior cluster: set previousCluster, uncomment bootstrap + externalClusters, align serverName.
  # bootstrap:
  #   recovery:
  #     source: &previousCluster postgres18
  # externalClusters:
  #   - name: *previousCluster
  #     plugin:
  #       enabled: true
  #       isWALArchiver: false
  #       name: *plugin
  #       parameters: *barmanParameters

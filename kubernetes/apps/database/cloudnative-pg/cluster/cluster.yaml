---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-standard-trixie@sha256:e845b0146b37f13d912461b63b1a25ef4bbc6992e19fa2447f6ec001f4ee06e8
  instances: 3
  primaryUpdateMethod: switchover
  # Hostpath PVs pin each instance; a preempted one never returns and deadlocks drains.
  priorityClassName: homelab-critical
  storage:
    size: 30Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  # CNPG enforces the basic-auth Secret password, so the app's DATABASE_URL must match; nothing re-syncs them, so rotation is off.
  managed:
    roles:
      - name: bitmagnet
        login: true
        passwordSecret:
          name: bitmagnet-db
      - name: radarr
        login: true
        passwordSecret:
          name: radarr-db
      - name: bazarr
        login: true
        passwordSecret:
          name: bazarr-db
      - name: sonarr
        login: true
        passwordSecret:
          name: sonarr-db
      - name: prowlarr
        login: true
        passwordSecret:
          name: prowlarr-db
      - name: memini
        login: true
        passwordSecret:
          name: memini-db
      - name: spoolman
        login: true
        passwordSecret:
          name: spoolman-db
      - name: gatus
        login: true
        passwordSecret:
          name: gatus-db
      - name: nextcloud
        login: true
        # Preserve the role's existing CREATEDB privilege; CNPG reconciles every
        # unspecified attribute to its default (NOCREATEDB) when adopting a role.
        createdb: true
        passwordSecret:
          name: nextcloud-db
      - name: grafana
        login: true
        passwordSecret:
          name: grafana-db
      - name: crowdsec
        login: true
        passwordSecret:
          name: crowdsec-db
      - name: ghostfolio
        login: true
        passwordSecret:
          name: ghostfolio-db
      - name: kguardian
        login: true
        passwordSecret:
          name: kguardian-db
      # kritika refuses to start unless owner (migrations, not superuser), app (owns no table, so RLS
      # applies) and runner are separate roles; names keep the old kritik prefix.
      - name: kritik
        login: true
        # CREATEDB kept as an unneeded legacy grant; CNPG creates the Database CR over the superuser connection.
        createdb: true
        passwordSecret:
          name: kritik-db
      - name: kritik_app
        login: true
        passwordSecret:
          name: kritik-app-db
      - name: kritik_runner
        login: true
        passwordSecret:
          name: kritik-runner-db
      - name: mealie
        login: true
        passwordSecret:
          name: mealie-db
      - name: tracearr
        login: true
        passwordSecret:
          name: tracearr-db
  postgresql:
    parameters:
      # CNPG defaults to logical; nothing here uses logical replication and replica writes less WAL.
      wal_level: replica
      # Pool ceilings are per database and user (rw 3x20, session 2x20 each), so they sum above this across ~19 databases; demand bounds it (30d peak 104 backends).
      max_connections: "150"
      # nextcloud hot set is ~3GB; at 1GB the hit ratio sat at 99.1-99.4%.
      shared_buffers: 2GB
      # off: no hugepages are reserved, so try would log a failure every start.
      huge_pages: "off"
      # io_method io_uring: RuntimeDefault seccomp returns EPERM (cloudnative-pg#10446); not worth it at a 99.5% hit ratio.
      work_mem: 16MB
      # End idle-in-xact sessions so xmin can advance (ORM leaks, forgotten BEGIN).
      idle_in_transaction_session_timeout: "600000"
      # Peak maintenance memory ≈ maintenance_work_mem × max_parallel_maintenance_workers (here ~1GB).
      maintenance_work_mem: 512MB
      # Default -1 lets each of the 3 autovacuum workers take maintenance_work_mem; 128MB covers these small DBs.
      autovacuum_work_mem: 128MB
      # CNPG defaults to 32. Per-gather stays at the default 2: each parallel worker builds its own relcache and work_mem; tracearr's chunk relcache is ~0.7GiB per backend.
      max_parallel_workers: "4"
      min_wal_size: 2GB
      max_wal_size: 8GB
      # None is WAL-driven (10 days of logs); requested ones come from promotions, shutdowns and replica joins. Each checkpoint restarts full-page images in the WAL shipped to R2.
      checkpoint_timeout: 1h
      checkpoint_warning: "60"
      # on would also pick zstd in this image; explicit avoids a silent fallback on a build without zstd.
      wal_compression: "zstd"
      wal_buffers: 32MB
      # Many small DBs: more aggressive autovacuum + freeze than defaults.
      autovacuum_vacuum_scale_factor: "0.02"
      autovacuum_analyze_scale_factor: "0.01"
      autovacuum_analyze_threshold: "25"
      autovacuum_vacuum_insert_scale_factor: "0.05"
      # Higher limit / lower delay than defaults to finish autovacuum sooner on NVMe.
      autovacuum_vacuum_cost_limit: "2000"
      autovacuum_vacuum_cost_delay: "1ms"
      autovacuum_freeze_max_age: "100000000"
      vacuum_freeze_table_age: "75000000"
      default_statistics_target: "200"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      maintenance_io_concurrency: "200"
      # ~5,400 distinct statements tracked; the 5000 default would evict.
      pg_stat_statements.max: "7500"
      # pg_stat_io and pg_stat_wal timings were 0, so IO and fsync stalls were invisible.
      track_io_timing: "on"
      track_wal_io_timing: "on"
      # log_lock_waits (default on since 19) covers slow lock waits; not log_min_duration_statement, it ships literals into logs.
      # tracearr's TimescaleDB; values from the official README.
      timescaledb.telemetry_level: "off"
      # TimescaleDB needs more lock slots than the default; 19 halved what a slot holds, so 256 equals 128 on 18.
      max_locks_per_transaction: "256"
    shared_preload_libraries:
      - "vchord.so"
      - "pg_stat_statements"
      - "timescaledb"
    # pgvector is bundled in the image; a mounted copy would be shadowed ($system leads extension_control_path).
    extensions:
      - name: vchord
        image:
          # Move to a pg19 build before merge; none is published yet.
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        # vchord-scratch mirrors the base image's install tree, not CNPG's lib/ share/ layout, which never finds vchord.so.
        dynamic_library_path:
          - /usr/lib/postgresql/19/lib
        extension_control_path:
          - /usr/share/postgresql/19
      # Community TSL build: the Apache-2.0 edition lacks the continuous aggregates and compression tracearr needs.
      - name: timescaledb
        image:
          # Move to a PG19 build before merge; none is published yet.
          reference: ghcr.io/adampetrovic/timescaledb-cnpg:2.32.0-18-trixie
  resources:
    requests:
      cpu: 500m
      # 7d p95 2.8GiB; 3Gi x3 instances does not fit the nodes.
      memory: 2Gi
    limits:
      cpu: 4
      # Temporary: tracearr's 4,339 one-day chunks load ~0.7GiB of relcache per backend; 4Gi OOM-killed 3 times on 2026-11-17. Back to 4Gi after the chunk drop.
      memory: 6Gi
  monitoring:
    enablePodMonitor: true
    customQueriesConfigMap:
      - name: cnpg-custom-queries
        key: queries.yaml
  plugins:
    - name: &plugin barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &barmanParameters
        barmanObjectName: r2
        # Bump on a major upgrade or when restoring from an existing CNPG cluster (new logical server id for backups).
        serverName: postgres19
  # Recovery from prior cluster: set previousCluster, uncomment bootstrap + externalClusters, align serverName.
  # bootstrap:
  #   recovery:
  #     source: &previousCluster postgres18
  # externalClusters:
  #   - name: *previousCluster
  #     plugin:
  #       enabled: true
  #       isWALArchiver: false
  #       name: *plugin
  #       parameters: *barmanParameters

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/pooler_v1.json
# Session-mode RW pooler (prepared statements, advisory locks) → same primary as pgbouncer-rw.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pgbouncer-session
spec:
  cluster:
    name: postgres16
  instances: 2
  type: rw
  # Same as pgbouncer-rw: requests (Talos OOM kills request-less pods first) and a hard spread across nodes.
  template:
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: pgbouncer-session
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "800"
      default_pool_size: "12"
      min_pool_size: "0"
      max_db_connections: "14"
      server_idle_timeout: "300"
      server_login_retry: "5"
      query_wait_timeout: "15"
      application_name_add_host: "1"

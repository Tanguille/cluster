---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-custom-queries
data:
  queries.yaml: |
    pgvector:
      # drifted = 1 when a database's vector extension differs from the image's version.
      query: >-
        SELECT pg_catalog.current_database() AS datname, count(*) AS drifted FROM pg_available_extensions
        WHERE name = 'vector' AND installed_version IS NOT NULL AND installed_version <> default_version
      target_databases: ["*"]
      # Extension versions replicate; standbys would only repeat the primary.
      primary: true
      metrics:
        - datname:
            usage: LABEL
            description: Database name
        - drifted:
            usage: GAUGE
            description: 1 if the installed vector extension differs from the image's default version
    pg_stat_lock:
      # PostgreSQL 19+. Waits count only past deadlock_timeout; fastpath_exceeded sizes max_locks_per_transaction.
      query: >-
        SELECT locktype, waits, wait_time / 1000 AS wait_seconds, fastpath_exceeded FROM pg_catalog.pg_stat_lock
      metrics:
        - locktype:
            usage: LABEL
            description: Lock type
        - waits:
            usage: COUNTER
            description: Lock acquisitions that waited longer than deadlock_timeout
        - wait_seconds:
            usage: COUNTER
            description: Seconds spent in those waits
        - fastpath_exceeded:
            usage: COUNTER
            description: Locks that missed the fast path because its slots were full

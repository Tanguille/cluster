---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cloudnative-pg-databases
spec:
  # ResourceSet.spec.wait defaults to false.
  wait: true
  # db: only when the physical database name differs from the app name.
  inputs:
    - name: bazarr
    - name: crowdsec
      extensions:
        - name: vector
    - name: gatus
    - name: ghostfolio
      extensions:
        - name: vector
    - name: grafana
    - name: jellystat
      db: jfstat
    - name: kguardian
      extensions:
        - name: vector
    - name: kritik
      extensions:
        # Both must exist before kritika's first start; vchord is already in shared_preload_libraries.
        - &vchord
          name: vchord
          version: "1.1.1"
        - name: vector
    - name: litellm
      extensions:
        - name: vector
    - name: memini
      extensions:
        # Keep vchord and vector paired; Memini's live vchordrq indexes require both.
        - *vchord
        - name: vector
    - name: nextcloud
    - name: prowlarr
    - name: radarr
    - name: sonarr
    - name: spoolman
  resources:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      metadata:
        name: << inputs.name >>
        namespace: database
      spec:
        cluster:
          name: postgres16
        name: << dig "db" inputs.name inputs >>
        owner: << inputs.name >>
        # Adopted live DBs; never drop on prune.
        databaseReclaimPolicy: retain
        extensions: << dig "extensions" list inputs | toYaml | nindent 10 >>

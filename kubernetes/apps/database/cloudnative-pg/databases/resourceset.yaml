---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cloudnative-pg-databases
spec:
  # ResourceSet.spec.wait defaults to false.
  wait: true
  # db: only when the physical database name differs from the app name.
  inputs:
    - name: bazarr
    - name: crowdsec
      extensions:
        # pgvector ships in the base CNPG postgresql image, not vchord-scratch, so Renovate does
        # not track it; bump manually when that image bumps. A wrong pin fails visibly via the
        # Database CR going not-Ready. Check with:
        #   img=$(yq '.spec.imageName' kubernetes/apps/database/cloudnative-pg/cluster/cluster.yaml)
        #   docker run --rm --entrypoint cat "$img" /usr/share/postgresql/18/extension/vector.control
        - &vector
          name: vector
          version: "0.8.6"
    - name: gatus
    - name: ghostfolio
      extensions:
        - *vector
    - name: grafana
    - name: jellystat
      db: jfstat
    - name: litellm
      extensions:
        - *vector
    - name: memini
      extensions:
        # Keep vchord and vector paired; Memini's live vchordrq indexes require both.
        # vchord is Renovate-tracked with the cluster's vchord-scratch image.
        - name: vchord
          version: "1.1.1"
        - *vector
    - name: nextcloud
    - name: prowlarr
    - name: radarr
    - name: sonarr
    - name: spoolman
  resources:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      metadata:
        name: << inputs.name >>
        namespace: database
      spec:
        cluster:
          name: postgres16
        name: << dig "db" inputs.name inputs >>
        owner: << inputs.name >>
        # Adopted live DBs; never drop on prune.
        databaseReclaimPolicy: retain
        extensions: << dig "extensions" list inputs | toYaml | nindent 10 >>

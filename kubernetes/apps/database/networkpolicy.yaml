---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: database-ingress-allowlist
spec:
  # Default-deny ingress for every pod in the namespace (postgres, poolers, cnpg
  # + dragonfly operators) except the dragonfly instances: Cilium policies are
  # additive, so this all-ports allow would void the 9999 fence in
  # dragonfly/cluster/networkpolicy.yaml. Egress stays default-allow (backups
  # to NFS/S3, operator->apiserver keep working).
  endpointSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [dragonfly]
  ingress:
    # Postgres/pgbouncer consumers per cnpg databases/ CRs, plus vmagent (observability) and intra-ns (database).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
        - matchLabels:
            io.kubernetes.pod.namespace: default
        - matchLabels:
            # kritika: all three roles go straight to postgres16-rw (pgbouncer rejects its startup params).
            io.kubernetes.pod.namespace: kritika
        - matchLabels:
            io.kubernetes.pod.namespace: media
        - matchLabels:
            io.kubernetes.pod.namespace: observability
        - matchLabels:
            io.kubernetes.pod.namespace: security
        - matchLabels:
            io.kubernetes.pod.namespace: database
    # cnpg serves validating/mutating webhooks the apiserver must reach.
    - fromEntities:
        - kube-apiserver

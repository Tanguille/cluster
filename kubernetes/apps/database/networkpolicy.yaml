---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: database-ingress-allowlist
  namespace: database
spec:
  # Default-deny ingress for every pod in the namespace (postgres, poolers, cnpg
  # + dragonfly operators) except the dragonfly instances: Cilium policies are
  # additive, so this all-ports allow would void the 9999 fence in
  # dragonfly/cluster/networkpolicy.yaml. Egress stays default-allow (backups
  # to NFS/S3, operator->apiserver keep working).
  endpointSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [dragonfly]
  ingress:
    # Namespaces that actually consume postgres/pgbouncer/dragonfly, discovered
    # from cnpg databases/ CRs + dragonfly host refs (renovate = operator cache). observability = vmagent
    # scraping the exporters; database = intra-ns (operator, poolers, replicas).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
        - matchLabels:
            io.kubernetes.pod.namespace: default
        - matchLabels:
            # kritik: the app and runner roles reach the pooler, the owner role's
            # migrations reach postgres16-rw.
            io.kubernetes.pod.namespace: kritik
        - matchLabels:
            io.kubernetes.pod.namespace: media
        - matchLabels:
            io.kubernetes.pod.namespace: observability
        - matchLabels:
            io.kubernetes.pod.namespace: renovate
        - matchLabels:
            io.kubernetes.pod.namespace: security
        - matchLabels:
            io.kubernetes.pod.namespace: database
        # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is ephemeral not 53.
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
    # cnpg serves validating/mutating webhooks the apiserver must reach.
    - fromEntities:
        - kube-apiserver

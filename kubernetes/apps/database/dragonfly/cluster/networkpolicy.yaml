---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly-ingress-allowlist
spec:
  # Sole ingress policy for dragonfly pods (excluded from database-ingress-allowlist); the operator ships none.
  endpointSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
  ingress:
    # 6379 (redis): labeled clients from any namespace; without the Exists term the selector stays inside database. Replication uses 9999.
    - fromEndpoints:
        - matchLabels:
            egress.home.arpa/dragonfly: allow
          matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # 9999 (admin, --admin_nopass): operator only (probes/replication setup),
    # the instance's own peers (role changes), and vmagent (PodMonitor admin
    # port scrape).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            control-plane: controller-manager
        - matchLabels:
            app: dragonfly
            app.kubernetes.io/name: dragonfly
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
    # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is ephemeral not 53.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns

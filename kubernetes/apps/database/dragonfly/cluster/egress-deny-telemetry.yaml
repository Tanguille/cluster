---
# Blocks DragonflyDB's periodic version check / telemetry to version.dragonflydb.io.
# The DSAL license explicitly permits outbound traffic filtering as a telemetry
# suppression method (unlike software-level disable flags).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly-egress-deny-telemetry
spec:
  endpointSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
  egress:
    # Deny the telemetry endpoint specifically; all other egress is governed
    # by the cluster-wide default-allow (or default-deny if one exists).
    - toEndpoints:
        - matchLabels:
            io.cilium.k8s.namespace: _all
      toFQDNs:
        - matchPattern: "version.dragonflydb.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
      action: Drop

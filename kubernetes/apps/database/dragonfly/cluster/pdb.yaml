---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/policy/poddisruptionbudget_v1.json
# The Dragonfly CRD has no disruption field; same reasoning as cloudnative-pg/cluster/pdb.yaml pgbouncer-rw.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dragonfly
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dragonfly

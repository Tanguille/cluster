---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/scheduling.k8s.io/priorityclass_v1.json
# At ~98% memory requests a drain's evictees preempt priority-0 pods; a preempted PDB sibling deadlocks the drain.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-critical
value: 500000
description: "Must survive drains: monitoring, PDB-guarded, node-pinned or drain-driving pods"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/scheduling.k8s.io/priorityclass_v1.json
# Deliberately below llmkube-normal (10000) so these preempt unclassified refugees but never the LLM stack.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-important
value: 5000
description: "User-facing apps pinned to a single node, where an eviction means an outage rather than a reschedule"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/scheduling.k8s.io/priorityclass_v1.json
# Below the unclassified default (0), so batch jobs (backups, etcd-defrag, cron, runners) evict these on a
# full cluster; above low-priority-chain (-500), so these come back by displacing the monero chain.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-optional
value: -100
description: "Apps that can wait: evicted first after the monero chain and miners"

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd-defrag
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      # Must use host network and PID namespace to access Talos etcd on localhost:2379.
      hostNetwork: true
      hostPID: true
      securityContext:
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    controllers:
      etcd-defrag:
        type: cronjob
        cronjob:
          # Auto-compaction holds in-use flat (137-160MB over 20d) but cannot
          # shrink the file; free space ramps ~8MB/day. A 3-member pass costs ~95s.
          timeZone: ${TIMEZONE}
          schedule: "0 3 * * 0"
          backoffLimit: 1
        containers:
          app:
            image:
              repository: ghcr.io/ahrtr/etcd-defrag
              tag: v0.44.0@sha256:0b345057de8a5915031e656546ef490b44f8bc85e68df26688147f9f0da2c4ff
            args:
              - --endpoints=https://127.0.0.1:2379
              - --cluster
              - --cacert=/certs/ca.crt
              - --cert=/certs/server.crt
              - --key=/certs/server.key
              - --defrag-rule=dbQuotaUsage > 0.5 || dbSizeFree > 50*1024*1024
              - --move-leader
              # --cluster defragments all three control-plane etcd members.
              - --wait-between-defrags=30s
              # Talos uses etcd's default --quota-backend-bytes value (2 GiB).
              - --etcd-storage-quota-bytes=2147483648
              - --auto-disalarm
              - --disalarm-threshold=0.8
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 100m
                memory: 128Mi
            securityContext:
              # Talos etcd's client key is root-readable only on the host.
              privileged: true

    persistence:
      certs:
        type: hostPath
        # Talos EtcdPKIPath.
        hostPath: /system/secrets/etcd
        globalMounts:
          - path: /certs
            readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          etcd-defrag:
            app:
              - path: /tmp
                subPath: tmp

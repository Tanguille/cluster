---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd-defrag
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      # Must use host network and PID namespace to access Talos etcd on localhost:2379.
      hostNetwork: true
      hostPID: true
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    controllers:
      etcd-defrag:
        type: cronjob
        cronjob:
          # Hourly check; --defrag-rule only defrags a member once >50MiB is free.
          schedule: "0 * * * *"
          backoffLimit: 1
        containers:
          app:
            image:
              repository: ghcr.io/ahrtr/etcd-defrag
              tag: v0.46.0@sha256:bdfa3a1b110fce58f5bac9de2b5054da3ff7de388598a8b9230de0246ff6643a
            args:
              - --endpoints=https://127.0.0.1:2379
              # Defragments all three control-plane etcd members.
              - --cluster
              - --cacert=/certs/ca.crt
              - --cert=/certs/server.crt
              - --key=/certs/server.key
              - --defrag-rule=dbQuotaUsage > 0.5 || dbSizeFree > 50*1024*1024
              - --move-leader
              - --wait-between-defrags=30s
              - --auto-disalarm
              - --disalarm-threshold=0.8
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 100m
                memory: 128Mi
            securityContext:
              # Talos etcd's client key is root-readable only on the host.
              privileged: true

    persistence:
      certs:
        type: hostPath
        # Talos EtcdPKIPath.
        hostPath: /system/secrets/etcd
        globalMounts:
          - path: /certs
            readOnly: true

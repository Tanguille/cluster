---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd-defrag
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      # Host network reaches Talos etcd on localhost:2379.
      hostNetwork: true
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    controllers:
      etcd-defrag:
        type: cronjob
        cronjob:
          # Hourly check; --defrag-rule only defrags a member once >50MiB is free or quota usage >50%.
          schedule: "0 * * * *"
          backoffLimit: 1
          # A kept failed Job held KubeJobFailed ~10h; the next hourly run retries anyway.
          ttlSecondsAfterFinished: 3600
        containers:
          app:
            image:
              repository: ghcr.io/ahrtr/etcd-defrag
              tag: v0.47.0@sha256:58e8e0bd8fbe1c3c3dd454ab76098d521917921bacfc76a401228445aa951bb7
            args:
              - --endpoints=https://127.0.0.1:2379
              # Defragments all three control-plane etcd members.
              - --cluster
              - --cacert=/certs/ca.crt
              - --cert=/certs/server.crt
              - --key=/certs/server.key
              - --defrag-rule=dbQuotaUsage > 0.5 || dbSizeFree > 50*1024*1024
              - --move-leader
              - --wait-between-defrags=30s
              - --auto-disalarm
              - --disalarm-threshold=0.8
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 100m
                memory: 128Mi
            securityContext:
              # Talos etcd's client key is root-readable only on the host.
              privileged: true

    persistence:
      certs:
        type: hostPath
        # Talos EtcdPKIPath.
        hostPath: /system/secrets/etcd
        globalMounts:
          - path: /certs
            readOnly: true

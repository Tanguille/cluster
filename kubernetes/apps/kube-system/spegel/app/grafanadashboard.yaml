---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: spegel
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folder: kubernetes
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  # From the chart's own ConfigMap, so the JSON can never drift from the chart
  # version. 16 panels hardcode ${DS_PROMETHEUS}, so the datasources mapping
  # above is load-bearing - without it they resolve to nothing.
  configMapRef:
    name: spegel-dashboard
    key: spegel.json

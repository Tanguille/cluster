---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  chartRef:
    kind: OCIRepository
    name: spegel
  interval: 1h
  values:
    service:
      registry:
        hostPort: 29999
        topologyAwareHintsEnabled: false
    serviceMonitor:
      enabled: true
    spegel:
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
    grafanaDashboard:
      enabled: true
      # Sidecar just emits the ConfigMap; grafanadashboard.yaml consumes it via
      # configMapRef so it can also carry the DS_PROMETHEUS datasource mapping,
      # which the chart's GrafanaOperator mode cannot express.
      mode: Sidecar

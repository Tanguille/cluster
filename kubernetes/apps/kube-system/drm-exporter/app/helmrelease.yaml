---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  interval: 1h
  values:
    dra:
      enabled: true
      deviceClassName: gpu.amd.com
    securityContext:
      capabilities:
        add:
          - PERFMON
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            # dGPU only: with dra.enabled the pod requests a gpu.amd.com
            # ResourceClaim, which only the k8s-gpu-dra-driver (kubelet
            # plugin) on amd.com/gpu=true nodes can allocate. iGPU-only nodes
            # run the squat.ai/dri generic-device-plugin (no DRA), so an
            # iGPU term would leave those exporter pods stuck Pending.
            - matchExpressions:
                - key: amd.com/gpu
                  operator: In
                  values: ["true"]
    monitoring:
      serviceMonitor:
        enabled: true
        # kubernetes_node/nodename are not intrinsic to the metrics; the
        # GpuFanStalled rule and the dashboards group by kubernetes_node.
        relabelings:
          - action: replace
            regex: (.*)
            replacement: $1
            sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: kubernetes_node
          - action: replace
            regex: (.*)
            replacement: $1
            sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: nodename
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          folder: hardware
          matchLabels:
            grafana.internal/instance: grafana
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi

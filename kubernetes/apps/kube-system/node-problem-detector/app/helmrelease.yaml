---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-problem-detector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-problem-detector
  values:
    image:
      # Spelled out so Renovate tracks the digest.
      repository: registry.k8s.io/node-problem-detector/node-problem-detector
      tag: v1.37.0@sha256:a222c1bc31efe64a5698e8ba4ac7acf7f09f065eb2fbfb5c436488439decd69a
    settings:
      # Talos has no dockerd/journald — only the kmsg-based monitors apply.
      log_monitors:
        - /config/kernel-monitor.json
        - /config/readonly-monitor.json
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

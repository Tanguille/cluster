---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/daemonset_v1.json
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-undervolt
  labels:
    app.kubernetes.io/name: nvidia-undervolt
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-undervolt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-undervolt
    spec:
      priorityClassName: system-node-critical
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: app
          image: docker.io/library/python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
          env:
            # 2026-11-22 sweep on the 2070: with the cap at 1400 MHz, +400 was clean, +500 gave Xid 31 and crashed the
            # miner; +300 with the cap lifted to 1560 also faulted, so the offset only holds together with the cap.
            # +200/+300 ran 30 loops of the embedder, reranker and d3-nano with identical outputs and no Xid.
            - name: CLOCK_MAX_MHZ
              value: "1400"
            - name: VF_OFFSET_MHZ
              value: "200"
            - name: EXPECT_NAME
              value: RTX 2070
            # Not a GPU request: the time-sliced replicas belong to the workloads.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          command:
            - python3
            - /scripts/nvidia-undervolt.py
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: nvidia-undervolt-scripts

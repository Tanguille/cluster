---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/daemonset_v1.json
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amdgpu-undervolt
  labels:
    app.kubernetes.io/name: amdgpu-undervolt
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amdgpu-undervolt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amdgpu-undervolt
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        amd.com/gpu: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: app
          image: ghcr.io/home-operations/busybox:1.38.0@sha256:ff88728f0d5fe50a9984f6cc04d7d1185590b628f29ef4e6a3ec8cae7169e0c8
          env:
            # Efficiency is the default and the fallback. Each profile is a power cap plus the deepest
            # offset that passed the greedy quality gate at that cap: -100 passed at 250W and was
            # bit-identical to -82, -120 silently changed greedy tokens.
            # Decode is bandwidth-bound (flat ~23 TG from 210W to 330W); 250W buys +15% PP over 210W.
            - name: EFFICIENCY_PROFILE
              value: "210 -100"
            - name: BALANCED_PROFILE
              value: "250 -100"
            # Auto-mode scalars, NOT fan_curve (driver 0x2E vs PMFW 0x32 mismatch on this SKU); a 70C target cost +36% rpm for ~3C mem.
            # 82C held ~3500rpm at 250W (junction up to 102C); 76C lets it pass 4000rpm. Not edge-gated: edge 66C still ramped.
            - name: FAN_TARGET_TEMP_C
              value: "76"
            - name: ACOUSTIC_TARGET_RPM
              value: "4000"
            # Noise cap above the target (default 5500 = fan1_max); stock settings peaked at ~4500.
            - name: ACOUSTIC_LIMIT_RPM
              value: "4500"
          command:
            - /bin/sh
            - /scripts/amdgpu-undervolt.sh
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: sys
              mountPath: /host-sys
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: amdgpu-undervolt-scripts
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: sys
          hostPath:
            path: /sys
            type: Directory

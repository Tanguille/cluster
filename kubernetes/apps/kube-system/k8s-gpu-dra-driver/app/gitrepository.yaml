---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: k8s-gpu-dra-driver
spec:
  interval: 1h
  # ghcr.io/buroa/helm/k8s-gpu-dra-driver (this HelmRelease's original chart source) is gone —
  # the repo behind it was deleted upstream. ROCm now ships its own chart in-tree instead of
  # publishing it as an OCI package, so this tracks the chart directly out of their source repo.
  url: https://github.com/ROCm/k8s-gpu-dra-driver
  ref:
    tag: v1.0.1

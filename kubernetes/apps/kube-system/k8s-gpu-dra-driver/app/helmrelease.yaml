---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gpu-dra-driver
spec:
  # No OCI chart is published upstream (see gitrepository.yaml) — sourced straight from
  # ROCm's in-tree helm-charts-k8s instead of chartRef, which only takes OCIRepository/HelmChart.
  chart:
    spec:
      chart: ./helm-charts-k8s
      version: v0.2.0
      sourceRef:
        kind: GitRepository
        name: k8s-gpu-dra-driver
  interval: 1h
  values:
    image:
      # Chart.yaml's appVersion (v0.1.0) predates the gitrepository.yaml tag pin; the image
      # actually shipped at v1.0.1 is this, not the chart's baked-in default.
      tag: v1.0.1
    kubeletPlugin:
      # dGPU (control-1) only — iGPU nodes stay on generic-device-plugin's
      # squat.ai/dri (see kube-system/generic-device-plugin): the AMD DRA driver
      # has no timeslicing/consumable-capacity support, so it can't serve the
      # iGPU's multi-tenant embedding-model sharing the way squat.ai/dri does.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: amd.com/gpu
                    operator: In
                    values: ["true"]

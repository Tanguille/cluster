---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gpu-dra-driver
spec:
  # No OCI chart is published upstream (see helmrepository.yaml); chartRef only takes
  # OCIRepository/HelmChart, so this pulls from ROCm's GitHub Pages Helm repo.
  chart:
    spec:
      chart: k8s-gpu-dra-driver
      version: v1.0.1
      sourceRef:
        kind: HelmRepository
        name: k8s-gpu-dra-driver
  interval: 1h
  values:
    kubeletPlugin:
      # dGPU only; the iGPU nodes stay on squat.ai/dri (kube-system/generic-device-plugin).
      nodeSelector:
        amd.com/gpu: "true"

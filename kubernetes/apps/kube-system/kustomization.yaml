---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
components:
  - ../../components/common
  - ../../components/psa-privileged
resources:
  - ./amdgpu-undervolt.yaml
  - ./priorityclass.yaml
  - ./runtimeclass.yaml
  - ./cilium/ks.yaml
  - ./coredns/ks.yaml
  - ./descheduler/ks.yaml
  - ./etcd-defrag/ks.yaml
  - ./generic-device-plugin/ks.yaml
  - ./metrics-server/ks.yaml
  - ./node-problem-detector/ks.yaml
  - ./reloader/ks.yaml
  - ./snapshot-controller/ks.yaml
  - ./spegel/ks.yaml
configMapGenerator:
  - name: amdgpu-undervolt-scripts
    files:
      - amdgpu-undervolt.sh
    options:
      annotations:
        # Shell script, not a flux template: keep postBuild envsubst off it.
        kustomize.toolkit.fluxcd.io/substitute: disabled

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  # Pinned LB IPs only: with the whole LAN an unpinned Service took the router's .1; now it stays pending
  blocks:
    - start: ${LB_POOL_START}
      stop: ${LB_POOL_STOP}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  interfaces:
    - ^ens[0-9]+
    - ^eno[0-9]+
    - ^enp[0-9]+s[0-9]+ # control-1 NIC is enp1s0 (q35 chipset); without it control-1 cannot answer ARP for VIPs it holds

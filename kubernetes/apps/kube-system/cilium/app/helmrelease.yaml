---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h

  values:
    autoDirectNodeRoutes: true
    bpf:
      datapathMode: netkit-l2
      # ~2.3x the 688K measured live CT entries; per-CPU LRU + 3% RAM sizing cost 3.6GB agent RSS.
      ctTcpMax: 1572864
      ctAnyMax: 786432
      masquerade: true
    # Use jiffies for CT map (tuning guide)
    bpfClockProbe: true
    cgroup:
      hostRoot: /sys/fs/cgroup
      # Talos already mounts cgroupv2 at /sys/fs/cgroup.
      autoMount:
        enabled: false
    dashboards:
      enabled: true
    enableIPv4BIGTCP: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    hubble:
      enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: ${POD_CIDR}
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
      leaseDuration: 5s
      leaseRenewDeadline: 2s
      leaseRetryPeriod: 1s
    loadBalancer:
      algorithm: maglev
      mode: dsr
    localRedirectPolicies:
      enabled: true
    operator:
      rollOutPods: true
      dashboards:
        enabled: true
      prometheus:
        serviceMonitor:
          enabled: true
    pmtuDiscovery:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        # Required for offline renders (Flate, deadvalues CI): without it the
        # chart's pre-install validate fails outside a cluster that serves
        # monitoring.coreos.com/v1. In-cluster the guard never fires.
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    # No hostNamespaceOnly: its per-packet ClusterIP NAT gets same-node replies dropped by every ingress allowlist.
    socketLB:
      enabled: true

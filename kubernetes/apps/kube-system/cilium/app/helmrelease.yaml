---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h

  values:
    autoDirectNodeRoutes: true
    bpf:
      datapathMode: netkit-l2
      # Fixed CT sizes (~2.3x the measured 688K live entries from p2pool churn)
      # instead of per-CPU LRU + 3% RAM ratio, which cost 3.6GB agent RSS on
      # the 40GB node; watch cilium_drop_count_total for CT exhaustion.
      ctTcpMax: 1572864
      ctAnyMax: 786432
      masquerade: true
    # Use jiffies for CT map (tuning guide)
    bpfClockProbe: true
    cgroup:
      hostRoot: /sys/fs/cgroup
      # Talos 1.14: cgroupv2 and bpffs are provided by the OS,
      # do not let the agent try to mount them.
      autoMount:
        enabled: false
    dashboards:
      enabled: true
    enableIPv4BIGTCP: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    hubble:
      enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: ${POD_CIDR}
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
      leaseDuration: 5s
      leaseRenewDeadline: 2s
      leaseRetryPeriod: 1s
    loadBalancer:
      algorithm: maglev
      mode: dsr
    localRedirectPolicies:
      enabled: true
    operator:
      rollOutPods: true
      dashboards:
        enabled: true
      prometheus:
        serviceMonitor:
          enabled: true
    pmtuDiscovery:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    # No hostNamespaceOnly: it forces per-packet ClusterIP NAT in bpf_lxc, and
    # same-node replies then hit ingress policy un-rev-NAT'd (src = ClusterIP,
    # identity = backend pod) and get dropped by every ingress allowlist.
    socketLB:
      enabled: true

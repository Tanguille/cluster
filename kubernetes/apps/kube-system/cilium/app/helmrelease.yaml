---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
 chartRef:
    kind: OCIRepository
    name: cilium
  values:
    autoDirectNodeRoutes: true
    bpf:
      datapathMode: netkit-l2
      # Fixed CT sizes (~2.3x the measured 688K live entries from p2pool churn)
      # instead of per-CPU LRU + 3% RAM ratio, which cost 3.6GB agent RSS on
      # the 40GB node; watch cilium_drop_count_total for CT exhaustion.
      ctTcpMax: 1572864
      ctAnyMax: 786432
      masquerade: true
    # Use jiffies for CT map (tuning guide)
    bpfClockProbe: true
    cgroup:
      hostRoot: /sys/fs/cgroup
      # Talos 1.14 provides cgroupv2 and bpffs; let the agent use the OS-provided
      # mounts instead of managing its own (Talos 1.14 Cilium guide).
      autoMount:
        enabled: false
    enableIPv4: true
    enableIPv6: false
    hubble:
      enabled: false
    kubernetes:
      service:
        enabled: true
    kubeProxyReplacement: true
    kpr:
      externalIPs:
        enabled: true
    loadBalancer:
      mode: dsr
      algorithm: maglev
    l2announcements:
      enabled: true
      nodeSelector:
        kubernetes.io/os: linux
    socketLB:
      enabled: true
      hostNamespaceOnly: true
    tunnel:
      enabled: false
    routingMode: native
    ipv4NativeRoutingCIDR: 10.42.0.0/16
    pmtuDiscovery: true
    enableIPv4BIGTCP: true

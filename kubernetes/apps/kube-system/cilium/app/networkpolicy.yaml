---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Same-node CoreDNS replies are rev-NAT'd into new ingress on an ephemeral port; allow-only.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-kube-dns-replies
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Apiserver grant for egress-allowlist namespaces (the label also opts out of deny-apiserver-egress); allow-only.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-kube-apiserver-egress
spec:
  endpointSelector:
    matchLabels:
      egress.home.arpa/kube-apiserver: allow
  enableDefaultDeny:
    egress: false
  egress:
    - toEntities:
        - kube-apiserver
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Redis port only; dragonfly-ingress-allowlist is the server-side gate; allow-only.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-dragonfly-egress
spec:
  endpointSelector:
    matchLabels:
      egress.home.arpa/dragonfly: allow
  enableDefaultDeny:
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

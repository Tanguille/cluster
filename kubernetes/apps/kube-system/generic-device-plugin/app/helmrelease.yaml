---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      priorityClassName: system-node-critical

    controllers:
      generic-device-plugin:
        type: daemonset
        pod:
          nodeSelector:
            amd.com/gpu: "true"
        containers:
          app:
            image:
              repository: ghcr.io/squat/generic-device-plugin
              tag: latest@sha256:6fd8023741b24c0302a97153605ff77f4d55535a4b5a8b0c8502b208e8310525
            args:
              - --domain=squat.ai
              - --device
              - |
                name: dri
                groups:
                  # Only inkling2-mini (Recreate) holds one: media and drm-exporter claim the dGPU via DRA
                  - count: 1
                    paths:
                      - path: /dev/dri
                      - path: /dev/kfd
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

    persistence:
      dev:
        type: hostPath
        hostPath: /dev
      device-plugin:
        type: hostPath
        hostPath: /var/lib/kubelet/device-plugins

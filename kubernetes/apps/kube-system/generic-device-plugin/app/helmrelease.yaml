---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      priorityClassName: system-node-critical

    controllers:
      generic-device-plugin:
        type: daemonset
        pod:
          nodeSelector:
            amd.com/gpu: "true"
        containers:
          app:
            image: &devicePluginImage
              repository: ghcr.io/squat/generic-device-plugin
              tag: latest@sha256:44e7c3c7164fc224d6cbc479bc57484080eb4fbefc6c1a18673810ab86d6684d
            args:
              - --domain=squat.ai
              - --device
              - |
                name: dri
                groups:
                  # vllm, jellyfin, fileflows and drm-exporter hold 4; the 5th is spare
                  - count: 5
                    paths:
                      - path: /dev/dri
                      - path: /dev/kfd
            securityContext: &devicePluginSecurityContext
              privileged: true
            resources: &devicePluginResources
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
      # iGPU nodes: 2 slots (one iGPU model per node plus the co-located reranker); count only gates scheduling.
      generic-device-plugin-igpu:
        type: daemonset
        pod:
          nodeSelector:
            amd.com/igpu: "true"
        containers:
          app:
            image: *devicePluginImage
            args:
              - --domain=squat.ai
              - --device
              - |
                name: dri
                groups:
                  - count: 2
                    paths:
                      - path: /dev/dri
            securityContext: *devicePluginSecurityContext
            resources: *devicePluginResources

    persistence:
      dev:
        type: hostPath
        hostPath: /dev
      device-plugin:
        type: hostPath
        hostPath: /var/lib/kubelet/device-plugins
        globalMounts:
          - path: /var/lib/kubelet/device-plugins

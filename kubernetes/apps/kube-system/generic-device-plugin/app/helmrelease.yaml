---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      priorityClassName: system-node-critical

    controllers:
      # dGPU (control-1) is on DRA (kube-system/k8s-gpu-dra-driver). The iGPU stays on
      # squat.ai/dri: the AMD DRA driver has no timeslicing/consumable capacity.
      # 2 slots: one iGPU model per node plus the co-located reranker; count only gates scheduling.
      generic-device-plugin:
        type: daemonset
        pod:
          nodeSelector:
            amd.com/igpu: "true"
        containers:
          app:
            image:
              repository: ghcr.io/squat/generic-device-plugin
              tag: latest@sha256:5c48f7a16cfb37c4e07731bfa384b9dba6e12d2b0fb4350d8a321d49f12ac494
            args:
              - --domain=squat.ai
              - --device
              - |
                name: dri
                groups:
                  - count: 2
                    paths:
                      - path: /dev/dri
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

    persistence:
      dev:
        type: hostPath
        hostPath: /dev
      device-plugin:
        type: hostPath
        hostPath: /var/lib/kubelet/device-plugins

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: &name metrics-server

  values:
    replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: *name
    args:
      - --kubelet-insecure-tls
      - --metric-resolution=10s
      - --kubelet-request-timeout=2s
    # 79Mi cgroup peak over 30d against the chart's 200Mi default.
    resources:
      requests:
        memory: 128Mi
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

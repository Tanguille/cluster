---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Internet-exposed app namespaces must not reach the kube-apiserver. Namespace membership
# is a coarse proxy for exposure: not every pod in these namespaces is externally routed.
# enableDefaultDeny egress:false keeps this a pure deny overlay — DNS/internet/cluster
# egress stay default-allow. kopiur movers (managed-by=kopiur) legitimately need the
# apiserver, so they are excluded via NotIn (also matches label-absent app pods => they ARE
# denied). Workloads that need the apiserver opt out with the pod label
# egress.home.arpa/kube-apiserver: allow, declared in their own HelmRelease.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-kube-apiserver-egress
  namespace: media
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/managed-by
        operator: NotIn
        values: [kopiur]
      - key: egress.home.arpa/kube-apiserver
        operator: NotIn
        values: [allow]
  enableDefaultDeny:
    egress: false
  egressDeny:
    - toEntities:
        - kube-apiserver
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json

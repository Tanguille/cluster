---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: cluster
spec:
  discoveryFilters:
    - Tanguille/8-ball
    - Tanguille/cluster
    - Tanguille/mesh-organiser
    - Tanguille/rsume
  # App creds mirror actions-runner-system/.../runners/cluster/secrets.sops.yaml; rotate both.
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: github_app_id
    installationIdSecretKey: github_app_installation_id
    pemSecretKey: github_app_private_key
  # mise lock resolves release assets via mise-versions.jdx.dev, which 404s fresh releases and leaves URL-less entries CI can't install; query GitHub (Renovate passes its token).
  extraEnv:
    - name: RENOVATE_CUSTOM_ENV_VARIABLES
      value: '{"MISE_USE_VERSIONS_HOST":"false"}'
    # Private ghcr.io/tanguille/rsume: same read:packages PAT as default/rsume-ghcr (rotate both).
    - name: RENOVATE_HOST_RULES
      valueFrom:
        secretKeyRef:
          name: renovate-github-app
          key: ghcr_host_rules
  image: ghcr.io/renovatebot/renovate:44.235.0@sha256:c36391712d77f9912943d8922d04d4fd1ee393dbde330b9565cb0e763ac7764c
  parallelism: 1
  provider:
    name: github
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  schedule: "*/30 * * * *"
  webhook:
    enabled: true
    # GitHub signs deliveries with this token (X-Hub-Signature-256).
    authentication:
      enabled: true
      secretRef:
        name: renovate-github-app
        key: webhook_token
    # Creates the repo hook itself; the app needs "Repository webhooks: RW".
    sync:
      enabled: true

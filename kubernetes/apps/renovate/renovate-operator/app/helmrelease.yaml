---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  # Template-mode CRDs are release resources; keep them so an uninstall doesn't cascade-delete
  # RenovateProject run state and the template CRs, which git doesn't recreate.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |-
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
  values:
    fullnameOverride: *app
    # Helm applies the CRDs itself. The default hook Job carries no labels, so it can't get the apiserver grant.
    crd:
      mode: template
    # Egress grants under the namespace egress-allowlist; without them the operator loses its apiserver watches and cache.
    deployment:
      podLabels:
        egress.home.arpa/kube-apiserver: allow
        egress.home.arpa/dragonfly: allow
    config:
      # TTL for every finished Job; in practice only orphans reach it, as each run replaces its project's previous Job.
      jobTTLSecondsAfterFinished: 86400
      # Job pods never call the apiserver (they still get the default SA token), so the package cache is their only non-internet egress.
      podLabelTemplates:
        egress.home.arpa/dragonfly: allow
    rbac:
      ownNamespaceOnly: true
    # Reuse the shared Dragonfly; operator takes dbs 0-2, Renovate's package cache lands in db 1.
    # Job pods get the password inside the cache URL the operator forwards to them.
    externalKeyValueStore:
      host: dragonfly.database.svc.cluster.local
      existingSecret:
        name: dragonfly-auth
        passwordKey: password
    # Default allowedHosts/allowedImages already cover github.com and ghcr.io/renovatebot/renovate;
    # the chart appends the webhook host.
    policy:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    # UI can trigger runs and has no auth; internal gateway only.
    route:
      enabled: true
      hostnames: ["renovate.${SECRET_DOMAIN}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
    webhook:
      enabled: true
      # GitHub delivers here; the chart derives WEBHOOK_BASE_URL from hostnames[0].
      route:
        enabled: true
        # "/" 404s like an unrouted host; an empty POST reaching the operator returns 400.
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://renovate-webhook.${SECRET_DOMAIN}/webhook/v1/github
            method: POST
            conditions: ["[STATUS] == 400"]
        hostnames: ["renovate-webhook.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
    metrics:
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          allowCrossNamespaceImport: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  values:
    fullnameOverride: *app
    config:
      # Reaps succeeded and failed jobs alike; logs stay readable for a day.
      jobTTLSecondsAfterFinished: 86400
    rbac:
      ownNamespaceOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    # UI can trigger runs and has no auth; internal gateway only.
    route:
      enabled: true
      hostnames: ["renovate.${SECRET_DOMAIN}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
    webhook:
      enabled: true
      # GitHub delivers here; the chart derives WEBHOOK_BASE_URL from hostnames[0].
      route:
        enabled: true
        hostnames: ["renovate-webhook.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana

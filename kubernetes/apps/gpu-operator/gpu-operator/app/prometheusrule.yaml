---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-rules
spec:
  groups:
    - name: nvidia-gpu-exporter
      rules:
        - alert: HighGpuUsage
          # nvidia_smi_utilization_gpu_ratio is 0-1, so 0.85 is 85%. pearl-miner fills the 2070 by design;
          # its own rules cover heat and VRAM while it runs.
          expr: |-
            avg_over_time(nvidia_smi_utilization_gpu_ratio[15m]) > 0.85
            unless on () (sum(kube_deployment_status_replicas{namespace="web3", deployment="pearl-miner"}) > 0)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              High GPU usage on {{ $labels.instance }} for 15 minutes
            description: >-
              GPU {{ $labels.uuid }} on {{ $labels.instance }}
              has passed 85% for over 15 minutes
        - alert: NvidiaVramLow
          # Time-sliced pods share VRAM. This board-wide alert uses total minus used.
          # Pearl's gate uses the driver's reported free memory, which excludes reserved VRAM.
          expr: max by (instance) (nvidia_smi_memory_total_bytes - nvidia_smi_memory_used_bytes) / 1048576 < 512
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              The RTX 2070 on {{ $labels.instance }} has {{ $value }} MiB of VRAM free; a new CUDA allocation on it
              (a pod restart, a larger batch) can fail. Check nvidia-smi for the process that grew.

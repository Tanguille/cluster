---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 4.6.0
      url: oci://ghcr.io/openebs/charts/localpv-provisioner
  interval: 1h
  values:
    analytics:
      enabled: false
    localpv:
      resources:
        requests:
          memory: 64Mi

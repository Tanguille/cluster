---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: games
components:
  - ../../components/common
  - ../../components/deny-apiserver-egress
  - ../../components/deny-lan-egress
  # satisfactory valuesFrom: prefers control-1 for single-thread speed.
  - ../../components/affinity-control-1
  # Session pods run Steam: SYS_ADMIN, unconfined seccomp and hostIPC for its bwrap sandbox.
  - ../../components/psa-privileged
resources:
  # Disabled until a session can start: the operator forces UNAME=ubuntu on wolf, while wolf:stable's
  # supervisord must run as root, so wolf never starts. A single-pod Sunshine would work, but needs
  # uinput in control-1's custom kernel build, i.e. an installer rebuild and a control-1 reboot.
  # - ./fenrir/ks.yaml
  - ./satisfactory/ks.yaml

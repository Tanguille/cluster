---
# yaml-language-server: $schema=https://github.com/games-on-whales/fenrir/raw/refs/heads/main/schemas/direwolf.games-on-whales.github.io/user_v1alpha1.json
# moonlight-proxy pairs every client as "alex" (hardcoded upstream), so the name is fixed.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: User
metadata:
  name: alex
spec:
  volumes:
    - name: wolf-supervisord
      configMap:
        name: wolf-supervisord
        defaultMode: 0755
  sidecarPolicies:
    # wolf composites and encodes (NVENC), so it needs the GPU as well as the app container.
    wolf:
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
      # See wolf/supervisord.conf: the operator starts wolf as ubuntu, the image expects root.
      volumeMounts:
        - name: wolf-supervisord
          mountPath: /etc/supervisord.conf
          subPath: supervisord.conf
          readOnly: true
        - name: wolf-supervisord
          mountPath: /etc/cont-init.d/99-stdout.sh
          subPath: 99-stdout.sh
          readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
          nvidia.com/gpu: 1

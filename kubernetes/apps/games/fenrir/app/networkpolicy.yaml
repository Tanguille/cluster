---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Session pods opt out of deny-lan-egress because wolf sends the stream as UDP to whichever LAN
# address the Moonlight client has. This puts back the rest of that deny: no TCP to private
# ranges, nothing at all to the router, NAS, BMC and Home Assistant.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fenrir-session-lan-egress
spec:
  endpointSelector:
    matchLabels:
      app: direwolf-worker
  enableDefaultDeny:
    egress: false
  egressDeny:
    - toCIDRSet:
        - cidr: 172.16.0.0/12
        - cidr: 192.168.0.0/16
      toPorts:
        - ports:
            - port: "1"
              endPort: 65535
              protocol: TCP
    - toCIDR:
        - ${OPNSENSE_IP}/32
        - ${TRUENAS_IP}/32
        - ${IPMI_IP}/32
        - ${HOME_ASSISTANT_IP}/32
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal-tls

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monerod
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  # low-priority-chain pods may sit Pending on a full cluster; waiting on them fails the upgrade and
  # its rollback alike.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  rollback:
    disableWait: true
  values:
    controllers:
      monerod:
        containers:
          app:
            image:
              repository: ghcr.io/sethforprivacy/simple-monerod
              tag: v0.18.5.4@sha256:1d48b2b2fb22e7dff04f97132495bdc7b83608faffd3b2c213a09d72a4f7f99c
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            args:
              - "--data-dir=/home/monero/.bitmonero"
              - "--log-file=/var/log/monero/monerod.log"
              - "--rpc-restricted-bind-ip=0.0.0.0"
              - "--rpc-restricted-bind-port=18089"
              - "--no-igd"
              - "--fast-block-sync=1"
              - "--zmq-pub=tcp://0.0.0.0:18083"
              - "--enforce-dns-checkpointing"
              - "--enable-dns-blocklist"
              - "--out-peers=32"
              - "--in-peers=64"
              - "--prune-blockchain"
              - "--sync-pruned-blocks"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: &get-info
                    path: /get_info
                    port: 18089
                  periodSeconds: 30
                  # app-template defaults (timeoutSeconds: 1, failureThreshold: 3) kill a healthy
                  # node about 60s into a restricted-RPC stall (sync bursts on the 300Gi Ceph RBD):
                  # 4 liveness kills in 6 minutes on 2026-11-18 after the 166106b rollout.
                  # 10s per probe and 5 failures tolerate about 130s.
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *get-info
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: *get-info
                  failureThreshold: 60
    defaultPodOptions:
      priorityClassName: low-priority-chain
      # monerod flushes chain data to the 300Gi PVC on shutdown; the 30s
      # default risks killing it mid-write.
      terminationGracePeriodSeconds: 120
      # Started as 1000, the entrypoint skips its root chown + su-exec.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      monerod:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: ${MONEROD_IP}
        loadBalancerSourceRanges:
          - ${LAN_CIDR}
        ports:
          p2p:
            port: 18080
          rpc:
            port: 18089
          zmq:
            port: 18083
    persistence:
      data:
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 300Gi
        retain: true
        globalMounts:
          - path: /home/monero/.bitmonero
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/monero

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashboard
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      dashboard:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        containers:
          web:
            image:
              repository: nginx
              tag: 1.31-alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
              readiness: *probe
          dashboard-server:
            image:
              repository: python
              tag: 3.15-slim@sha256:f786b2e19cf9bb54e96bfcd4c1b40c4c56336c22e60607ffd4b080ae5b5dee83
            command:
              - python3
              - /config/server.py
            args:
              - --data-dir
              - /var/lib/p2pool/api
              - --wallet
              - $(P2POOL_WALLET_ADDRESS)
            env:
              - name: P2POOL_WALLET_ADDRESS
                valueFrom:
                  secretKeyRef:
                    name: p2pool-wallet
                    key: address
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # Any JSON endpoint proves the server is up; avoid /xmrig_summary (503 when idle) and the observer.
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /observer_config
                    port: 8080
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # p2pool's gid (it writes local/ 0770); any other fsGroup re-chgrps the shared PVC each mount.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      dashboard:
        ports:
          web:
            port: 80
    route:
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Monero (p2pool)
          gethomepage.dev/description: Monero / p2pool dashboard
          gethomepage.dev/group: Web3
          gethomepage.dev/icon: monero.png
        hostnames:
          - p2pool.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      shared-api-data:
        existingClaim: p2pool-shared-api-data
        globalMounts:
          - path: /var/lib/p2pool/api
      tmp:
        type: emptyDir
        advancedMounts:
          dashboard:
            web:
              - path: /tmp
      dashboard-html:
        type: configMap
        name: dashboard
        advancedMounts:
          dashboard:
            web:
              - path: /usr/share/nginx/html
      dashboard-server-script:
        type: configMap
        name: dashboard-server-script
        advancedMounts:
          dashboard:
            dashboard-server:
              - path: /config/server.py
                subPath: server.py
                readOnly: true
      nginx-config:
        type: configMap
        name: dashboard-nginx-config
        advancedMounts:
          dashboard:
            web:
              - path: /etc/nginx/nginx.conf
                subPath: nginx.conf

worker_processes auto;

# Container-standard logging: visible via kubectl logs, no writable log dir needed
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" $upstream_cache_status';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Disable features that require write access
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # stats_log.json is ~0.5MB of repetitive numeric JSON — compresses ~10x
    gzip on;
    gzip_types application/json text/css application/javascript;

    # Every tab polls the same three /observer/ paths every 10s for a body that
    # only changes on p2pool's ~19s median share interval. Cached on disk: /tmp
    # is an emptyDir, so this does not count against the container's 64Mi limit.
    proxy_cache_path /tmp/observer_cache levels=1:2 keys_zone=observer:1m
                     max_size=64m inactive=60s;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index dashboard.html;

        # API endpoints - serve JSON files with correct content type
        # These are served from p2pool data directory
        location ~ ^/(local|network|pool)/ {
            alias /var/lib/p2pool/api$uri;
            # The files are extensionless; default_type sets the real
            # Content-Type (add_header would only append a second header)
            default_type application/json;
        }

        # The one route worth caching: 3.0MB gzipped, refetched every 10s by
        # every open tab. proxy_cache_lock collapses a simultaneous herd into a
        # single upstream fetch, bounded by proxy_cache_lock_timeout (5s) rather
        # than queueing behind it. No add_header here on purpose: an add_header
        # in a location replaces the server-level security headers instead of
        # adding to them, so cache visibility lives in log_format instead.
        location /observer/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_cache observer;
            proxy_cache_valid 200 15s;
            proxy_cache_lock on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve static files (HTML, CSS, JS, images); anything that isn't one
        # falls through to the Python server, which owns the route table —
        # nginx doesn't need its own copy of server.py's do_GET paths.
        location / {
            try_files $uri $uri/ @dashboard-api;
        }

        location @dashboard-api {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}

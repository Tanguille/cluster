---
apiVersion: v1
kind: Service
metadata:
  name: xmrig
spec:
  # One stable name across the three per-node Deployments for the dashboard's xmrig API poll;
  # it answers from whichever miner the Service picks.
  selector:
    app.kubernetes.io/component: thermal-guarded
  ports:
    - name: http-api
      port: 42000

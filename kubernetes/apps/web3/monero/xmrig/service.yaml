---
apiVersion: v1
kind: Service
metadata:
  name: xmrig-miners
spec:
  # Headless across the three per-node Deployments: DNS returns every running miner,
  # so the dashboard sums them instead of reading whichever one a ClusterIP picks.
  clusterIP: None
  selector:
    app.kubernetes.io/component: thermal-guarded
  ports:
    - name: http-api
      port: 42000

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monerod
  namespace: &namespace web3
spec:
  path: ./kubernetes/apps/web3/monero/monerod
  targetNamespace: *namespace
  prune: true
  interval: 1h
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: p2pool
  namespace: &namespace web3
spec:
  path: ./kubernetes/apps/web3/monero/p2pool
  targetNamespace: *namespace
  dependsOn:
    - name: monerod
  wait: true
  prune: true
  interval: 30m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: guard
  namespace: &namespace web3
spec:
  path: ./kubernetes/apps/web3/monero/guard
  targetNamespace: *namespace
  wait: true
  prune: true
  interval: 30m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: xmrig
  namespace: &namespace web3
spec:
  path: ./kubernetes/apps/web3/monero/xmrig
  targetNamespace: *namespace
  dependsOn:
    - name: p2pool
  wait: true
  prune: true
  interval: 30m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dashboard
  namespace: &namespace web3
spec:
  path: ./kubernetes/apps/web3/monero/dashboard
  targetNamespace: *namespace
  dependsOn:
    - name: p2pool
  wait: true
  prune: true
  interval: 30m

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: xmrig-guard-rules
spec:
  groups:
    - name: xmrig-guard.rules
      rules:
        - alert: XmrigGuardEnforcementBypassed
          # Per-node since each miner is its own Deployment gated on its own node: a global
          # min() would fire whenever any one node is unsafe while another legitimately mines.
          # `unless` covers safe=0 and a missing guard series in one expression - both leave
          # the node without a safe=1 to subtract. The cardinality and 120s freshness filters
          # mirror the ScaledObject's gate exactly, so a duplicate or stale safe=1 that closes
          # KEDA cannot also suppress this alert. Catches KEDA-operator-down, HPA wedges,
          # manual scales.
          expr: |-
            kube_deployment_status_replicas{namespace="web3", deployment=~"xmrig-control-.+"} > 0
            unless on (deployment)
            label_replace(
              (xmrig_guard_safe == 1)
              and on (node) (count by (node) (xmrig_guard_safe) == 1)
              and on (node) (timestamp(xmrig_guard_safe) >= time() - 120),
              "deployment", "xmrig-$1", "node", "(.*)"
            )
          for: 10m
          annotations:
            summary: >-
              {{ $labels.deployment }} is running while its node's thermal gate should be
              closed — the KEDA trip is not being enforced (operator down, HPA wedged, or
              manual scale)
          labels:
            severity: critical
        - alert: XmrigGuardAbsent
          expr: |-
            count(xmrig_guard_safe{node=~"control-[123]"}) != 3
            or absent(xmrig_guard_safe{node=~"control-[123]"})
          for: 15m
          annotations:
            summary: >-
              Guard safety signal missing or wrong cardinality — the KEDA gate is
              closed and mining is silently disabled (fails closed)
          labels:
            severity: warning
        - alert: XmrigGuardLatchedUnsafe
          # A node that trips or hits an evaluation error only re-earns safe=1 after
          # 600s at or below 60C. Paired here with the temperature actually being in
          # that band, so this fires for a stuck latch (the 2026-07-27 control-2
          # sensor-identity blip) and stays quiet when the gate is shut because the
          # drives are genuinely too hot, which is the expected steady state.
          expr: |-
            max_over_time(xmrig_guard_safe{node=~"control-[123]"}[6h]) == 0
            and on (node)
            max_over_time(xmrig_guard_nvme_temp_max_celsius{node=~"control-[123]"}[2h]) <= 60
          for: 30m
          annotations:
            summary: >-
              {{ $labels.node }} has been gated unsafe for 6h while its NVMe stayed
              within the 60C recovery band, so the guard is latched rather than
              thermally tripped and mining is disabled with no signal
          labels:
            severity: warning
        - alert: XmrigGuardEvaluationErrors
          # 0.01/s ~= 36 errors/h; the 2026-07 telemetry breakage ran 47-100/h
          expr: |-
            sum(rate(xmrig_guard_query_errors_total[10m])) > 0.01
          for: 15m
          annotations:
            summary: >-
              Guard evaluations are failing repeatedly — affected nodes fail closed
              and can never re-earn safe=1 until queries recover
          labels:
            severity: warning

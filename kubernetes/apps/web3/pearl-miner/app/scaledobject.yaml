---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pearl-miner
spec:
  scaleTargetRef:
    name: pearl-miner
  minReplicaCount: 0
  maxReplicaCount: 1
  # Start and keep levels live in the query, keyed on the running replica count.
  cooldownPeriod: 0
  pollingInterval: 30
  fallback:
    # A VictoriaMetrics/scaler error must not keep the miner running.
    failureThreshold: 1
    replicas: 0
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428
        # MetricsQL: WITH names the running replica count (0 or 1).
        # Design, thresholds and replay: docs/pearl-solar-mining.md. Result is 0 or 1; a missing series gives 0.
        # S = 15m net export plus the running miner (168 W) and running xmrig (50 W each) added back: start at 200 W, keep at 100 W.
        # Pearl outranks xmrig: it takes the surplus xmrig is using, and xmrig (which reads the raw meter) sheds once the miner's draw shows up.
        # tech_cave_cold (under 18 C, 15m average) adds 10 kW to S so the surplus test passes: the heat is wanted then. A missing sensor counts as warm.
        # Without a P1 reading the whole surplus part is 0 (add-backs included), so only the cold-room path can run the miner.
        # It is recorded in kubernetes/apps/web3/monero/guard/prometheusrule.yaml.
        # Also needs: control-1 guard safe and fresh, 64Mi request fits and 2Gi MemAvailable, 2070 free VRAM 2560 MiB to start / 1024 to keep and under 80 C,
        # R9700 junction 5m max under 85 C to start / 90 to keep, UPS 5m max under 63 % to start (85 % stop minus its ~22 points), 5m max under 85 % to keep.
        query: >-
          WITH (running = sum(kube_deployment_status_replicas{namespace="web3",deployment="pearl-miner"}) or vector(0))
          (
            (
              (
                ((
                  -sum(avg_over_time(hass_sensor_power_w{entity="sensor.p1_meter_power",job="homeassistant"}[15m]))
                  + 168 * (sum(avg_over_time(kube_deployment_status_replicas{namespace="web3",deployment="pearl-miner"}[15m])) or vector(0))
                  + 50 * (sum(avg_over_time(kube_deployment_status_replicas{namespace="web3",deployment=~"xmrig-.*"}[15m])) or vector(0))
                ) or vector(0))
                + 10000 * (tech_cave_cold or vector(0))
              ) >= bool (200 - 100 * running)
            )
            * min(xmrig_guard_safe{node="control-1"})
            * (count(xmrig_guard_safe{node="control-1"}) == bool 1)
            * (min(timestamp(xmrig_guard_safe{node="control-1"})) >= bool (time() - 120))
            * (
              (
                min(kube_node_status_allocatable{node="control-1",resource="memory"})
                - sum(
                  kube_pod_container_resource_requests{node="control-1",resource="memory",pod!~"xmrig-.*|pearl-miner-.*"}
                  * on(namespace, pod) group_left() (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
                )
              ) >= bool 67108864
            )
            * (
              (
                min(node_memory_MemAvailable_bytes{kubernetes_node="control-1"})
                + (sum(container_memory_working_set_bytes{node="control-1",namespace="web3",pod=~"pearl-miner-.*",container!="",container!="POD"}) or vector(0))
              ) >= bool 2147483648
            )
            * (max(nvidia_smi_memory_free_bytes) / 1048576 >= bool (2560 - 1536 * running))
            * (max(nvidia_smi_temperature_gpu) < bool 80)
            * (max(max_over_time(drm_temperature_celsius{sensor="junction",node="control-1"}[5m])) < bool (85 + 5 * running))
            * (
              (max(max_over_time(network_ups_tools_ups_load[5m])) < bool 63) * (running == bool 0)
              + (max(max_over_time(network_ups_tools_ups_load[5m])) < bool 85) * running
            )
          ) or vector(0)
        threshold: "1"
        activationThreshold: "0"
        ignoreNullValues: "false"

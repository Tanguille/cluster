---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../control

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: pearl-miner
    patch: |-
      - op: replace
        path: /spec/values/controllers/pearl-miner/containers/app/env/CP_CUDA_CONST64
        value: "1"

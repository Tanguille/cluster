---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
      # predict_linear duplicate of NodeVarFillingUp; KV-tier and image-GC sawtooth on /var trip it
      prometheusRuleOverrides:
        CephNodeDiskspaceWarning:
          disabled: true
    toolbox:
      enabled: true
    route:
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Ceph
          gethomepage.dev/description: Rook Ceph dashboard
          gethomepage.dev/group: Status
          gethomepage.dev/icon: rook.png
          gethomepage.dev/pod-selector: app=rook-ceph-mgr
        host:
          name: rook.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephImage:
      # Spelled out so Renovate tracks the image.
      repository: quay.io/ceph/ceph
      tag: v21.2.0@sha256:c9e6ed4ac3fcf67b28f38358bb9619dee4d1dfb96ddd4b9b583eee316a15f04d
    cephClusterSpec:
      # Ceph 20 rates cipher `aes` HEALTH_ERR, which blocks Rook's OSD upgrades. aes256k needs the
      # in-kernel client from Linux 7.0. keyType does nothing unless keyRotationPolicy is set.
      security:
        cephx:
          allowedCiphers: ["aes256k"]
          # daemon.keyType omitted: Rook already defaults to aes256k, and any value set here makes
          # it pass --mon-auth-emergency-allowed-ciphers to the mons.
          daemon: &cephxKey
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 4
            keyType: aes256k
          rbdMirrorPeer: *cephxKey
      cephConfig:
        global:
          # Rook rejects non-string cephConfig values.
          bdev_enable_discard: "true"
          bdev_async_discard_threads: "1"
          osd_class_update_on_start: "false"
          # RECENT_CRASH and RECENT_MGR_MODULE_CRASH warn for 1 day, not 14; nothing is archived
          mgr/crash/warn_recent_interval: "86400"
        mon:
          # Suppress pgmap/audit debug spam; keeps INF/WRN/ERR (was debug).
          mon_cluster_log_level: info
        mgr:
          # v21 map cache never frees erased maps: active mgr grew ~230 MiB/h and OOMed at 2Gi.
          # Drop once ceph/ceph#72727 ships.
          mgr_map_cache_enabled: "false"
        osd:
          # Default 1: a single slow op in 24h flips the cluster to HEALTH_WARN (BLUESTORE_SLOW_OP_ALERT).
          # osd.3 (shared PM983, also carries the ZIL + system disk) runs 0-1 normal slow ops/24h in steady
          # state, so 1 pages on routine contention. 5x the 14-day max (1); real degradation still crosses it.
          bluestore_slow_ops_warn_threshold: "5"
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      # Off: duplicates stdout (victoria-logs has it); its 100Mi request left rook-ceph-exporter-control-2 unschedulable.
      logCollector:
        enabled: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428
      mgr:
        modules:
          # Active mgr holds 4Gi vs 189Mi on the standby; both optional modules dropped
          - name: diskprediction_local
            enabled: false
          - name: insights
            enabled: false
      network:
        provider: host
        addressRanges:
          public:
            - ${LAN_CIDR}
          cluster:
            - ${LAN_CIDR}
      resources:
        osd:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            memory: "6Gi"
        mon:
          requests:
            cpu: "150m"
            memory: "512Mi"
        mgr:
          requests:
            cpu: "200m"
          limits:
            memory: "2Gi"
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: control-1
            devices:
              # Created as hdd while virtio reported rotational; see control-1's UdevRulesConfig.
              - name: /dev/disk/by-id/virtio-ZF6YrnfZ
            config:
              osdsPerDevice: "1"
              deviceClass: nvme
          - name: control-2
            devices:
              # Samsung 980 PRO 1TB
              - name: /dev/disk/by-id/nvme-eui.002538b221b029e7
            config:
              osdsPerDevice: "1"
          - name: control-3
            devices:
              # Micron 7450 960GB
              - name: /dev/disk/by-id/nvme-eui.000000000000000100a075244aa8faf6
            config:
              osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 2
            minSize: 1
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 2
              minSize: 1
          dataPools:
            - failureDomain: host
              replicated:
                size: 2
                minSize: 1
              parameters:
                compression_mode: aggressive
                compression_algorithm: zstd
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                memory: "4Gi"
        storageClass:
          enabled: true
          name: ceph-filesystem
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
    cephObjectStores: []

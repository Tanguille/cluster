---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Ceph
          gethomepage.dev/description: Rook Ceph dashboard
          gethomepage.dev/group: Status
          gethomepage.dev/icon: rook.png
        host:
          name: rook.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephImage:
      tag: v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
    cephClusterSpec:
      # Ceph 20 rates cipher `aes` HEALTH_ERR, which blocks Rook's OSD upgrades. aes256k needs the
      # in-kernel client from Linux 7.0. keyType does nothing unless keyRotationPolicy is set.
      security:
        cephx:
          allowedCiphers: ["aes256k"]
          # daemon.keyType omitted: Rook already defaults to aes256k, and any value set here makes
          # it pass --mon-auth-emergency-allowed-ciphers to the mons.
          daemon: &cephxKey
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 4
            keyType: aes256k
          rbdMirrorPeer: *cephxKey
      cephConfig:
        global:
          # Rook rejects non-string cephConfig values.
          bdev_enable_discard: "true"
          bdev_async_discard_threads: "1"
          osd_class_update_on_start: "false"
          device_failure_prediction_mode: local # requires mgr module
          # Auto-archive Ceph crashes after 1 day (86400 seconds)
          mgr/crash/warn_recent_interval: "86400"
        mon:
          # Suppress pgmap/audit debug spam; keeps INF/WRN/ERR (was debug).
          mon_cluster_log_level: info
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      # Off: the sidecar duplicates to host disk what daemons already write to stdout and
      # victoria-logs already collects. It also costs a 100Mi request on every ceph daemon
      # pod, which is what left rook-ceph-exporter-control-2 unschedulable (2026-08-06).
      logCollector:
        enabled: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428
      mgr:
        modules:
          # Active mgr holds 4Gi vs 189Mi on the standby; both optional modules dropped
          - name: diskprediction_local
            enabled: false
          - name: insights
            enabled: false
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        addressRanges:
          public:
            - ${LAN_CIDR}
          cluster:
            - ${LAN_CIDR}
      resources:
        osd:
          requests:
            cpu: "500m"
            memory: "3Gi"
          limits:
            memory: "6Gi"
        mon:
          requests:
            cpu: "150m"
            memory: "512Mi"
        mgr:
          requests:
            cpu: "200m"
          limits:
            memory: "2Gi"
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: control-1
            devices:
              - name: /dev/disk/by-id/virtio-ZF6YrnfZ
            config:
              osdsPerDevice: "1"
          - name: control-2
            devices:
              # Samsung 980 PRO 1TB
              - name: /dev/disk/by-id/nvme-eui.002538b221b029e7
            config:
              osdsPerDevice: "1"
          - name: control-3
            devices:
              # Micron 7450 960GB
              - name: /dev/disk/by-id/nvme-eui.000000000000000100a075244aa8faf6
            config:
              osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 2
            minSize: 1
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 2
              minSize: 1
          dataPools:
            - failureDomain: host
              replicated:
                size: 2
                minSize: 1
              parameters:
                compression_mode: aggressive
                compression_algorithm: zstd
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                memory: "4Gi"
        storageClass:
          enabled: true
          name: ceph-filesystem
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
    cephObjectStores: []

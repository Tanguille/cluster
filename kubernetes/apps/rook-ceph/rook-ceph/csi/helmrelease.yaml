---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  interval: 1h
  values:
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        # cephcsi ships no logrotate (the sidecar only errors); defaults and drivers both carry the chart's rotation.
        log: &csiLog { rotation: { enabled: false } }
        controllerPlugin:
          priorityClassName: system-cluster-critical
          replicas: 2
          # Snapshotter 8.7 enables groups by default; both drivers use volumeSnapshot.
          # Drop this arg before switching a driver to volumeGroupSnapshot, or it stays off.
          containerExtraArgs:
            csi-snapshotter:
              - --feature-gates=CSIVolumeGroupSnapshot=false
        nodePlugin:
          priorityClassName: system-node-critical
    drivers:
      rbd:
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        log: *csiLog
        controllerPlugin:
          replicas: 2
          # Sidecars idle at <=1m CPU p99 (7d), plugins 39m; container keys left out render as {}.
          resources: &csiControllerResources
            attacher:
              requests: { cpu: 10m, memory: 64Mi }
            snapshotter:
              requests: { cpu: 10m, memory: 64Mi }
            resizer:
              requests: { cpu: 10m, memory: 64Mi }
            provisioner:
              requests: { cpu: 10m, memory: 64Mi }
            omapGenerator:
              requests: { cpu: 10m, memory: 64Mi }
            liveness:
              requests: { cpu: 10m, memory: 64Mi }
            addons:
              requests: { cpu: 10m, memory: 64Mi }
            # Inert (rotation off, no sidecar) but non-empty: applying {} over the old requests reaches the CRD as null.
            logRotator: &inertLogRotator
              requests: { cpu: 10m, memory: 16Mi }
            # 30d peak 85Mi (rbd), 42Mi (cephfs).
            plugin:
              requests: { cpu: 100m, memory: 128Mi }
        nodePlugin:
          resources: &csiNodeResources
            registrar:
              requests: { cpu: 10m, memory: 32Mi }
            liveness:
              requests: { cpu: 10m, memory: 64Mi }
            addons:
              requests: { cpu: 10m, memory: 64Mi }
            logRotator: *inertLogRotator
            plugin:
              requests: { cpu: 100m, memory: 128Mi }
      cephfs:
        name: rook-ceph.cephfs.csi.ceph.com
        log: *csiLog
        controllerPlugin:
          replicas: 2
          resources: *csiControllerResources
        nodePlugin:
          resources: *csiNodeResources
        kernelMountOptions:
          ms_mode: prefer-crc
      nfs:
        enabled: false
      nvmeof:
        enabled: false

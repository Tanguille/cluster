---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: rook-ceph-dashboards-mixin
spec:
  wait: true
  # ceph-mixin dashboards, tracked off ceph main rather than pinned.
  inputs:
    - name: ceph-osds-overview
      asset: osds-overview
    - name: ceph-cluster-advanced
      asset: ceph-cluster-advanced
    - name: ceph-application-overview
      asset: ceph-application-overview
    - name: cephfs-overview
      asset: cephfsdashboard
    - name: hosts-overview
      asset: hosts-overview
    - name: osd-device-details
      asset: osd-device-details
    - name: pool-overview
      asset: pool-overview
    - name: pool-detail
      asset: pool-detail
  resources:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaDashboard
      metadata:
        name: << inputs.name >>
        namespace: rook-ceph
      spec:
        allowCrossNamespaceImport: true
        instanceSelector:
          matchLabels:
            grafana.internal/instance: grafana
        url: https://raw.githubusercontent.com/ceph/ceph/main/monitoring/ceph-mixin/dashboards_out/<< inputs.asset >>.json

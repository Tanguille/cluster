---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    image:
      repository: ghcr.io/rook/ceph
    csi:
      provisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.4.0@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
      snapshotter:
        repository: registry.k8s.io/sig-storage/csi-snapshotter
        tag: v8.7.0@sha256:b03d3334f8035fa42660b166f6eb819a659a14774da020eb1b6c52cd422eaadb
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 1Gi

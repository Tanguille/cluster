---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 1.21.2
      url: oci://ghcr.io/rook/rook-ceph
  interval: 1h
  values:
    priorityClassName: homelab-critical
    image:
      repository: ghcr.io/rook/ceph
    csi:
      provisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.4.1@sha256:9e76a2c599ffd7a66f08feeb62ddec61e3545eaa442f8f8f6a495569c0b06829
      snapshotter:
        repository: registry.k8s.io/sig-storage/csi-snapshotter
        tag: v8.7.0@sha256:b03d3334f8035fa42660b166f6eb819a659a14774da020eb1b6c52cd422eaadb
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 1Gi

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    image:
      repository: ghcr.io/rook/ceph
    csi:
      cephcsi:
        # v3.17.1 links librados 20.2.4 (CEPH_SHA1 7f793731, same build as the mons);
        # v3.17.0 links 20.2.1, which cannot read an aes256k cephx key. Untagged
        # upstream: published to quay, no GitHub release, Renovate does not offer it.
        tag: v3.17.1
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m

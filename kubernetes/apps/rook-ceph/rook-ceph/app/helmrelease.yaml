---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    image:
      repository: ghcr.io/rook/ceph
    csi:
      cephcsi:
        # librados 20.2.4, required by the aes256k csi keyType in ../cluster/helmrelease.yaml.
        # renovate: datasource=docker depName=quay.io/cephcsi/cephcsi
        tag: v3.17.1
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m

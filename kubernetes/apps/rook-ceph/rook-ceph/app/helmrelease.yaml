---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 1.21.2
      url: oci://ghcr.io/rook/rook-ceph
  interval: 1h
  values:
    priorityClassName: homelab-critical
    image:
      repository: ghcr.io/rook/ceph
    csi:
      provisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.4.0@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
      snapshotter:
        repository: registry.k8s.io/sig-storage/csi-snapshotter
        tag: v8.7.1@sha256:b534b99edb61a5f95e297da8e2a133d36e27ad098e2f643393986e86f093d425
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 1Gi

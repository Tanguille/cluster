---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: clm
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: clm
  ingress:
    - fromEndpoints:
        # In-namespace callers (hermes, litellm, cron agents).
        - matchLabels:
            io.kubernetes.pod.namespace: ai
        # network = envoy-internal fronting the clm route.
        - matchLabels:
            io.kubernetes.pod.namespace: network
        # actions-runner-system = agent-pr-review workflows.
        - matchLabels:
            io.kubernetes.pod.namespace: actions-runner-system
    # kubelet probes.
    - fromEntities:
        - host
  egress:
    # Only the encoder: the head is stateless and fully offline (checkpoint
    # baked into the image, --no-download), so no external egress is needed.
    # The llmkube netpol (inference-ingress-allowlist) carries the matching
    # ingress patch that lets this pod reach the encoder.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            inference.llmkube.dev/service: clm-encoder
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

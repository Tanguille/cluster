---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app clm
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Built by .github/workflows/clm.yaml from docker/clm, one tag
              # per commit. Bakes the 75 MB CLM projection head so the pod
              # runs fully offline; the 8B encoder is the llmkube
              # clm-encoder InferenceService (published llama.cpp image).
              repository: ghcr.io/tanguille/clm-head
              tag: 4d34c113636c456b5d2884f3b7008e53b8df8791
            env:
              # CLM_EMB_URL: the llama.cpp pooling server llmkube generates
              # (Service <inferenceservice-name> on the endpoint port).
              CLM_EMB_URL: "http://clm-encoder.ai.svc.cluster.local:8080/v1/embeddings"
              CLM_EMB_MODEL: "qwen3-8b"
              CLM_EMB_MAX_TOKENS: "2048" # head's default; 4096 ctx per slot
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 12
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
            # Head is 20M params on CPU: a few hundred MiB. The 8B encoder
            # is budgeted by its InferenceService (6 GiB), not here.
            resources:
              requests:
                cpu: "250m"
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 768Mi

    service:
      app:
        ports:
          http:
            port: 8080
            protocol: TCP

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: llmkube
  values:
    namespace: ai

    controllerManager:
      leaderElection:
        enabled: false
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 128Mi

    metrics:
      secure: false
    prometheus:
      serviceMonitor:
        enabled: true
      inferencePodMonitor:
        enabled: true
      # Scrapes the router-proxy metrics port (9090); matches nothing until a
      # ModelRouter is deployed, but keeps future proxies observable.
      routerPodMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        namespace: ai
        rules:
          # The gpu alerts key on DCGM_FI_DEV_* (NVIDIA); this cluster is AMD
          # and exports drm_*, so they can never fire.
          gpu:
            enabled: false

    grafana:
      dashboards:
        enabled: true
        namespace: observability
        # The rest render blank here: amd-gpu-observability queries amdgpu_*
        # (we run drm-exporter), llmkube-quota and model-router need features we
        # don't deploy, llmkube-slo needs pyrra burn-rate rules.
        only: [llmkube-inference, sglang-dashboard]
        operator:
          enabled: true
          folder: ai
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
          datasources:
            - datasourceName: VictoriaMetrics
              inputName: DS_PROMETHEUS

    # Shared RWX cache on CephFS: the controller and the iGPU InferenceServices
    # land on different nodes, so an RWO volume multi-attach-errors. Access is
    # write-once on download then read-once at load, so CephFS latency never
    # touches inference. qwen36-27b brings its own node-local modelCache.
    # The model-cache-prep init chowns /models as root, so CephFS (fsGroupPolicy:
    # None) works too.
    modelCache:
      # qwen3-embedding 0.64Gi + qwen35-2b 1.18Gi + vmcp-embedding 0.29Gi ≈ 2.1Gi
      # + headroom. Doubled from 4Gi to 8Gi: PVC hit 100% capacity
      # (KubePersistentVolumeFillingUp). StorageClass ceph-filesystem has
      # allowVolumeExpansion: true, so the in-place resize is supported.
      size: 8Gi
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany

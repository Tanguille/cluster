---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: llmkube
  values:
    namespace: ai

    controllerManager:
      leaderElection:
        enabled: false
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 128Mi

    metrics:
      secure: false
    prometheus:
      serviceMonitor:
        enabled: true
      inferencePodMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        namespace: ai
        rules:
          # The gpu alerts key on DCGM_FI_DEV_* (NVIDIA); this cluster is AMD
          # and exports drm_*, so they can never fire.
          gpu:
            enabled: false

    grafana:
      dashboards:
        enabled: true
        namespace: observability
        # Both runtimes we ship manifests for are listed and left to
        # operator.mode: auto below, which publishes a runtime dashboard only
        # while an InferenceService on that runtime exists. vllm follows qwen38
        # and llamacpp follows muse-glimmer (replicas 0 today), so neither this
        # list nor a dashboard goes stale when one is parked or scaled up.
        # sglang-dashboard is omitted rather than left to auto: that lane is
        # deleted, so it could never publish. Re-add it if SGLang returns.
        #
        # The excluded ones are not runtime-gated and would render blank
        # regardless: amd-gpu-observability queries amdgpu_* (we run
        # drm-exporter), llmkube-quota and model-router need features we don't
        # deploy, llmkube-slo needs pyrra burn-rate rules.
        only: [llmkube-inference, vllm-dashboard, llamacpp-dashboard]
        operator:
          enabled: true
          # Chart default, pinned explicitly: this is what gates the runtime
          # dashboards above. "all" would publish them unconditionally.
          mode: auto
          folder: ai
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
          datasources:
            - datasourceName: VictoriaMetrics
              inputName: DS_PROMETHEUS

    # Shared RWX cache on CephFS: the controller and the iGPU InferenceServices
    # land on different nodes, so an RWO volume multi-attach-errors. Access is
    # write-once on download then read-once at load, so CephFS latency never
    # touches inference. qwen38-27b-vllm brings its own node-local modelCache.
    # The model-cache-prep init chowns /models as root, so CephFS (fsGroupPolicy:
    # None) works too.
    modelCache:
      # qwen3-embedding 0.64Gi + qwen35-2b 1.18Gi + vmcp-embedding 0.29Gi ≈ 2.1Gi
      # + headroom (chart default is 100Gi)
      size: 4Gi
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany

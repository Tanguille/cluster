---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: llmkube
  values:
    controllerManager:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 256Mi

    metrics:
      secure: false
    prometheus:
      serviceMonitor:
        enabled: true
      inferencePodMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        namespace: ai
        rules:
          # Chart GPU alerts key on drm_* since 0.9.29 but their thresholds (90%
          # util, 85C, 250W) sit where this card runs at its power cap; keep
          # off.
          gpu:
            enabled: false
          # NVIDIA DCGM alerts; nothing exports DCGM_* on this AMD-only cluster.
          gpuHealth:
            enabled: false
          serving:
            kvOffload:
              enabled: true

    grafana:
      dashboards:
        enabled: true
        namespace: observability
        # Auto mode gates the SGLang and vLLM dashboards; quota, slo and model-router render blank (no GPUQuota, pyrra or router-proxy: the ModelRouter compiles to agentgateway).
        operator:
          enabled: true
          folder: ai
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
          datasources:
            - datasourceName: VictoriaMetrics
              inputName: DS_PROMETHEUS

    # RWX on CephFS: controller and iGPU services land on different nodes; read
    # once at load. qwen38-27b-vllm has its own node-local cache.
    modelCache:
      # embeddinggemma-2 0.31Gi + bge-reranker-v2-m3; 16Gi after 91% at 8Gi: the operator never GCs old revisions.
      size: 16Gi
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany

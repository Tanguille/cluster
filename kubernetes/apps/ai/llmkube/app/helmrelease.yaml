---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 0.10.19
      url: oci://ghcr.io/defilantech/charts/llmkube
  values:
    controllerManager:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 256Mi

    metrics:
      secure: false
    prometheus:
      serviceMonitor:
        enabled: true
      inferencePodMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        namespace: ai
        rules:
          # Chart GPU alerts key on drm_* since 0.9.29 but their thresholds (90%
          # util, 85C, 250W) sit where this card runs at its power cap; keep
          # off.
          gpu:
            enabled: false

    grafana:
      dashboards:
        enabled: true
        namespace: observability
        # Skips quota, slo and model-router: blank without GPUQuota, pyrra or router-proxy (the ModelRouter compiles to agentgateway).
        # Skips sglang (no SGLang runtime) and amd-gpu-observability (drm-exporter has its own GPU dashboard).
        # Auto mode publishes the runtime dashboards only while a matching InferenceService exists.
        # vllm-dashboard covers radiance, which serves through the vllm runtime.
        only:
          - llamacpp-dashboard
          - llmkube-inference
          - vllm-dashboard
        operator:
          enabled: true
          folder: ai
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
          datasources:
            - datasourceName: VictoriaMetrics
              inputName: DS_PROMETHEUS

    # RWX on CephFS: the controller and the GPU services land on different nodes; read
    # once at load. inkling2-mini (and the suspended qwen38-27b-vllm) have their own node-local caches.
    modelCache:
      # Flash 3.55Gi, rollback d3-nano 2.4Gi, embeddinggemma-2 0.31Gi, reranker and CUDA JIT cache.
      # Raised to 16Gi after usage reached 91% at 8Gi. The operator keeps old revisions.
      size: 16Gi
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: llmkube
  postRenderers:
    - kustomize:
        patches:
          # Embedders/rerankers never predict tokens, so the chart's llama.cpp
          # arm reads any backlog as a stall; n_decode_total counts both.
          - target:
              kind: PrometheusRule
              name: llmkube-alerts
            patch: |-
              - op: test
                path: /spec/groups/1/rules/0/alert
                value: InferenceAdmissionStalled
              - op: replace
                path: /spec/groups/1/rules/0/expr
                value: |
                  (avg_over_time(vllm:num_requests_waiting[10m]) > 0 and avg_over_time(vllm:num_requests_running[10m]) <= 1)
                  or
                  (avg_over_time(sglang:num_queue_reqs[10m]) > 0 and avg_over_time(sglang:num_running_reqs[10m]) <= 1)
                  or
                  (avg_over_time(llamacpp:requests_deferred[10m]) > 0 and rate(llamacpp:n_decode_total[10m]) == 0)
  values:
    namespace: ai

    controllerManager:
      leaderElection:
        enabled: false
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 128Mi

    metrics:
      secure: false
    prometheus:
      serviceMonitor:
        enabled: true
      inferencePodMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        namespace: ai
        rules:
          # Chart GPU alerts key on drm_* since 0.9.29 but their thresholds (90%
          # util, 85C, 250W) sit where this card runs at its power cap; keep
          # off.
          gpu:
            enabled: false

    grafana:
      dashboards:
        enabled: true
        namespace: observability
        # Auto mode gates runtime dashboards;
        # amd-gpu-observability/quota/slo/model-router render blank here (no
        # pyrra, drm_* not amdgpu_*).
        operator:
          enabled: true
          folder: ai
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
          datasources:
            - datasourceName: VictoriaMetrics
              inputName: DS_PROMETHEUS

    # RWX on CephFS: controller and iGPU services land on different nodes; read
    # once at load. qwen38-27b-vllm has its own node-local cache.
    modelCache:
      # embeddinggemma-2 0.31Gi + qwen35-2b 1.18Gi; 8Gi after hitting 100% at 4Gi
      # (the operator never GCs old revisions).
      size: 8Gi
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: llmkube
  values:
    namespace: ai

    controllerManager:
      leaderElection:
        enabled: false
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 128Mi

    metrics:
      secure: false
    prometheus:
      serviceMonitor:
        enabled: true
      inferencePodMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        namespace: ai
        rules:
          # Chart GPU alerts key on drm_* since 0.9.29 but their thresholds (90%
          # util, 85C, 250W) sit where this card runs at its power cap; keep
          # off.
          gpu:
            enabled: false

    grafana:
      dashboards:
        enabled: true
        namespace: observability
        # Auto mode gates runtime dashboards;
        # amd-gpu-observability/quota/slo/model-router render blank here (no
        # pyrra, drm_* not amdgpu_*).
        operator:
          enabled: true
          folder: ai
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
          datasources:
            - datasourceName: VictoriaMetrics
              inputName: DS_PROMETHEUS

    # RWX on CephFS: controller and iGPU services land on different nodes; read
    # once at load. qwen38-27b-vllm has its own node-local cache.
    modelCache:
      # qwen3-embedding 0.64Gi + qwen35-2b 1.18Gi; 8Gi after hitting 100% at 4Gi
      # (the operator never GCs old revisions).
      size: 8Gi
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany

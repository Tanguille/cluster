---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llmkube
  namespace: &namespace ai
spec:
  interval: 30m
  path: ./kubernetes/apps/ai/llmkube/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  # Targeted healthCheck rather than spec.wait: llmkube-models only needs the
  # CRD-providing HelmRelease Ready, not every rendered resource.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: llmkube
      namespace: ai
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llmkube-models
  namespace: &namespace ai
spec:
  interval: 30m
  dependsOn:
    - name: llmkube
    - name: generic-device-plugin
      namespace: kube-system
  # Deliberately gate only qwen36-27b: litellm and memini dependsOn this ks, and
  # a wedged embedder (known vmcp-embedding affinity deadlock) must not block
  # their reconciliation.
  healthChecks:
    - apiVersion: inference.llmkube.dev/v1alpha1
      kind: InferenceService
      name: qwen36-27b
      namespace: ai
  healthCheckExprs:
    - apiVersion: inference.llmkube.dev/v1alpha1
      kind: InferenceService
      failed: has(status.phase) && status.phase == 'Failed'
      # Stopped only ever means spec.replicas=0, i.e. someone parked the service on
      # purpose (qwen36-27b-vllm today); a model that breaks lands in Failed above.
      # The CRD tells readiness pollers to treat Stopped as Pending, but this gate asks
      # "has the Kustomization converged", and a parked service has. Excluding it would
      # hang llmkube-models forever, and litellm and memini behind it.
      current: has(status.phase) && (status.phase == 'Stopped' || (status.phase == 'Ready' && has(status.conditions) && status.conditions.exists(e, e.type == 'Available' && e.status == 'True')))
  path: ./kubernetes/apps/ai/llmkube/models
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace

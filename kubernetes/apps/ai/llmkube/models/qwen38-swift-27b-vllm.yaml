---
# Node-local staging for the Swift AWQ checkpoint (18.23 GiB), same pattern as
# the base 27B's model-cache; 20Gi leaves re-staging headroom. Pending until an
# InferenceService mounts it (WaitForFirstConsumer), so parked it costs nothing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-swift-27b-vllm-model-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 20Gi

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-swift-27b-vllm
spec:
  # TheUnderscore's AWQ build of ukisai/Swift-Qwen3.8-27b: g128
  # compressed-tensors W4A16, calibrated on 200k UltraChat samples,
  # 2026-09-13 upload (the only revision). Same Qwen3_5ForConditionalGeneration
  # architecture and geometry as the base 27B (verified 2026-09-18: 64
  # layers, head_dim 256, 4 KV heads, 24 Q heads, 48/16 linear V/K heads,
  # 128 linear head dims, conv kernel 4, fp32 mamba_ssm_dtype, 262K ctx).
  #
  # lm_head.weight is in the quantization ignore list and ships bf16
  # (verified in shard 00007's safetensors header: BF16 [248320, 5120]), so
  # the output layer is full-precision -- the property this PR also restores
  # on the base 27B. No requant Job.
  #
  # Pin: hf revisions are mutable (HF re-uploads under the same filename),
  # so the commit is pinned; Renovate bumps it like the base's.
  #
  # Not referenced by any InferenceService yet: cutover is a 2-line flip on
  # qwen38-27b-vllm.yaml (see its modelRef comment). Unmeasured on ROCm --
  # gate the first flip on concsweep.py/longctx.py vs the base's numbers and
  # the GSM8K/tools gates, and re-read "GPU KV cache size" from the boot log:
  # model-nonquant.safetensors carries 15 MTP tensors that load even with
  # spec decode off.
  source: hf://TheUnderscore/Swift-Qwen3.8-27b-W4A16-AWQ@6ced337b9c99adddf9871ff84abc78a7f1acafad
  format: safetensors
  quantization: compressed-tensors
  refreshPolicy: OnChange
  # MUST match the layout of `source` above -- the init container fetches
  # exactly these names and exits 1 on a 404 (same rule as the base's list:
  # only what vLLM loads). tokenizer.json is self-contained (vocab 248044 +
  # merges 247587 embedded, v1.0 BPE), so merges.txt/vocab.json are NOT
  # listed; the 7 AWQ shards + model-nonquant + index cover every tensor the
  # index references (verified: 8 distinct files, 2399 tensors).
  files:
    - model-00001-of-00007.safetensors
    - model-00002-of-00007.safetensors
    - model-00003-of-00007.safetensors
    - model-00004-of-00007.safetensors
    - model-00005-of-00007.safetensors
    - model-00006-of-00007.safetensors
    - model-00007-of-00007.safetensors
    - model-nonquant.safetensors
    - model.safetensors.index.json
    - config.json
    - generation_config.json
    - tokenizer.json
    - tokenizer_config.json
    - chat_template.jinja
    - preprocessor_config.json
    - video_preprocessor_config.json
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
      resourceName: squat.ai/dri

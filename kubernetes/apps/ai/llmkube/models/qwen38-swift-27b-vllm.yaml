---
# Node-local staging for the 18.23 GiB checkpoint. 20Gi, not the 40Gi that
# briefly covered Swift 1.0 and 1.5 coexisting during the OnChange restage:
# 1.0 is pruned (one cache dir on the PVC, 19G, 2026-09-29), and the bump
# wedged this Kustomization anyway -- openebs-hostpath cannot expand an
# existing volume (no allowVolumeExpansion, and the provisioner chart does
# not template one), so the server rejected the dry-run. Raise it only with
# a matching storage class that expands.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-swift-27b-vllm-model-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 20Gi

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-swift-27b-vllm
spec:
  # ukisai's Swift 1.5 AWQ build: g128 compressed-tensors W4A16,
  # 2026-09-24 upload (repo lastModified). 1.5 replaces Swift 1.0
  # (TheUnderscore build): -58.5% thinking tokens (1.0: -58.3%), fixed 1.0
  # bugs, stronger agentic performance (vendor, 5-seed runs; Terminal Bench
  # 2.1 gains come from not looping into overthinking failures).
  #
  # Same Qwen3_5ForConditionalGeneration architecture and geometry as the
  # base 27B and the 1.0 build (verified 2026-09-29: 64 layers, 48 linear
  # / 16 full attention, head_dim 256, 4 KV heads, 24 Q heads, hidden
  # 5120; 2399 tensors, 7 safetensors).
  #
  # lm_head.weight is in the quantization ignore list and ships bf16, so
  # the output layer is full-precision. No requant Job.
  #
  # Pin: hf revisions are mutable (HF re-uploads under the same filename),
  # so the commit is pinned; Renovate bumps it like the base's.
  #
  # model-mtp-bf16.safetensors carries the 15 MTP tensors (same set 1.0
  # shipped as model-nonquant.safetensors); they load even with spec
  # decode off.
  source: hf://ukisai/Swift-1.5-Qwen3.8-27b-W4A16-AWQ@9dba8a058771
  format: safetensors
  quantization: compressed-tensors
  refreshPolicy: OnChange
  # Exactly what vLLM loads; the init container exits 1 on a 404. tokenizer.json
  # is self-contained (no merges/vocab).
  files:
    - model-00001-of-00006.safetensors
    - model-00002-of-00006.safetensors
    - model-00003-of-00006.safetensors
    - model-00004-of-00006.safetensors
    - model-00005-of-00006.safetensors
    - model-00006-of-00006.safetensors
    - model-mtp-bf16.safetensors
    - model.safetensors.index.json
    - config.json
    - generation_config.json
    - tokenizer.json
    - tokenizer_config.json
    - chat_template.jinja
    - preprocessor_config.json
    - video_preprocessor_config.json
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
      resourceName: squat.ai/dri

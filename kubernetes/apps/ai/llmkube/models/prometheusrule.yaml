---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qwen38-27b-vllm-rules
spec:
  groups:
    - name: qwen38-27b-vllm.rules
      rules:
        # Latched adds ~30 ms/step (vLLM 31 -> 62 ms, unseen on radiance); healthy M=1 is 27-35 ms, conc-4 38 ms.
        # running<2 is load-bearing. No liveness band probe, so this is the only guard.
        - alert: LLMDecodeStepLatched
          expr: |-
            (
              rate(vllm:inter_token_latency_seconds_sum{model_name="qwen-3.8"}[15m])
              /
              rate(vllm:inter_token_latency_seconds_count{model_name="qwen-3.8"}[15m])
              > 0.055
            )
            and
            (avg_over_time(vllm:num_requests_running{model_name="qwen-3.8"}[15m]) < 2)
          # Persistent once latched; 15m rate + 30m for = ~45m notice.
          for: 30m
          annotations:
            summary: >-
              qwen38-27b-vllm decode is latched at
              {{ $value | humanizeDuration }}/token near single-stream, roughly
              half speed. If drm_engine_utilization_ratio{engine="vcn"} is at
              least 0.05 a VCN-busy co-tenant (Jellyfin or fileflows) is contending:
              pause it, a restart does not help. Otherwise it is the latched
              band: restart the pod to clear it.
          labels:
            severity: warning

        # The linear half: attention blocks without a state snapshot still re-prefill, yet count as attn hits.
        # 0.4 is provisional (3h read 61%).
        - alert: LLMPrefixCacheHitRateLow
          expr: |-
            sum(increase(radiance:linear_cached_tokens_total{model_name="qwen-3.8"}[1d]))
            /
            (
              sum(increase(radiance:linear_cached_tokens_total{model_name="qwen-3.8"}[1d]))
              + sum(increase(radiance:prefill_tokens_total{model_name="qwen-3.8"}[1d]))
            )
            < 0.4
          annotations:
            summary: >-
              qwen-3.8 prefix cache served only {{ $value | humanizePercentage }}
              of prompt tokens over 24h: sessions are being evicted
              (radiance:prefix_cache_ckpt_evictions_by_reason_total) or something is rewriting the resent prefix.
          labels:
            severity: warning

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vllm-serving-rules
spec:
  groups:
    - name: vllm.serving.rules
      # Repo-owned, deliberately separate from the chart's `llmkube-alerts`:
      # that one is regenerated by the Helm release and already needs a
      # postRenderer patch, so anything added there is lost on a chart bump.
      #
      # Every alert keys on SERVING, not liveness. On 2026-08-20 the engine sat
      # Ready=True with /health 200 for three hours while barely admitting
      # anything; InferenceServiceDown cannot see that by construction. The one
      # signal that did fire, LiteLLMPrimaryDegraded, only reported that
      # fallbacks were happening, never that vLLM had stopped admitting.
      #
      # Thresholds are backtested against that incident, not guessed.
      rules:
        # Earliest and most reliable detector: backtested, >30s fires from
        # 18:35 continuously through 22:05 (41 -> 70 -> 119 -> 207 -> 282 ->
        # 338s), i.e. ~3h15m before the degradation was noticed by hand.
        # Normal band is 0.002-2.9s, so 30s is far outside routine bursts.
        - alert: VLLMQueueTimeHigh
          expr: |-
            sum by (model_name) (
              increase(vllm:request_queue_time_seconds_sum[15m])
            )
            /
            sum by (model_name) (
              increase(vllm:request_queue_time_seconds_count[15m])
            ) > 30
          for: 15m
          annotations:
            summary: >-
              {{ $labels.model_name }} requests wait
              {{ $value | printf "%.0f" }}s before starting — the engine is
              accepting work far slower than it arrives
          labels:
            severity: critical

        # Same incident, names the CAUSE rather than the symptom. A cold GPU
        # prefix cache pushes nearly every request onto the offload load path,
        # whose in-flight block reservations then gate admission.
        # Backtested: >10s fires from 19:35 through 22:05 (10.7 -> 12.6 -> 36.8
        # -> 41.8 -> 94.8s). Healthy band is <5s.
        # Recovery is NOT patience -- clear the fs offload tier; see
        # docs/vllm-kv-offload-stall.md.
        - alert: VLLMKVOffloadLoadSlow
          expr: |-
            sum by (model_name) (
              increase(vllm:kv_offload_lookup_async_delay_seconds_sum[30m])
            )
            /
            sum by (model_name) (
              increase(vllm:kv_offload_lookup_async_delay_seconds_count[30m])
            ) > 10
          for: 15m
          annotations:
            summary: >-
              {{ $labels.model_name }} KV-offload loads average
              {{ $value | printf "%.0f" }}s — the offload tier is gating
              admission, clear it rather than waiting it out
          labels:
            severity: warning

        # Hard-freeze detector. Distinct from the two above: those need a bad
        # AVERAGE to accumulate, this catches a freeze from a standing start.
        # Backtested it only matched the acute phase of the 2026-08-20 incident
        # (one bucket at 21:49) because the stall was intermittent -- kept for
        # the unambiguous case, not as the primary detector.
        # A healthy scheduler chunk-prefills waiters alongside decode, so
        # queued-with-nothing-running is never normal: allocate_slots returning
        # None hits a hard `break` in the waiting loop rather than degrading.
        # Not summed by model_name -- one engine per pod, so summing would mask
        # a stalled model behind a busy sibling.
        - alert: VLLMAdmissionStalled
          expr: |-
            vllm:num_requests_waiting > 0
              and vllm:num_requests_running == 0
          for: 10m
          annotations:
            summary: >-
              {{ $labels.model_name }} has {{ $value }} requests queued and none
              running — the scheduler is admitting nothing
          labels:
            severity: critical

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qwen38-27b-vllm-rules
spec:
  groups:
    - name: qwen38-27b-vllm.rules
      rules:
        # Latched state: +30.8ms/step fixed until restart (4K M=1 31.3 healthy
        # vs 62.1; same delta at 32K). Healthy M=1 rises ~0.2ms/1K ctx (43.5 at
        # 64K, ~49 at 96K); latched >= 58.8 observed, healthy <= 39.5, hence
        # 55ms. False-fires on sustained M=1 past ~122K ctx: raise the
        # threshold, not the guard. running<2 is load-bearing: a healthy conc-5
        # step is 48ms. Backstop for the liveness slow-band probe in
        # qwen38-27b-vllm.yaml.
        - alert: VLLMDecodeStepLatched
          expr: |-
            (
              rate(vllm:inter_token_latency_seconds_sum{model_name="qwen-3.8"}[15m])
              /
              rate(vllm:inter_token_latency_seconds_count{model_name="qwen-3.8"}[15m])
              > 0.055
            )
            and
            (avg_over_time(vllm:num_requests_running{model_name="qwen-3.8"}[15m]) < 2)
          # Persistent once latched; 15m rate + 30m for = ~45m notice.
          for: 30m
          annotations:
            summary: >-
              qwen38-27b-vllm decode is latched at
              {{ $value | humanizeDuration }}/token near single-stream, roughly
              half speed. If drm_engine_utilization_ratio{engine="vcn"} is at
              least 0.05 a VCN-busy co-tenant (Jellyfin or fileflows) is contending:
              pause it, a restart does not help. Otherwise it is the latched
              band: restart the pod to clear it.
          labels:
            severity: warning

        # GPU and external tier hits are anticorrelated, so judge them combined.
        # The 1d ratio bottomed at 76% over 30d. The external term falls back to
        # 0 so the rule keeps evaluating if KV offload is ever turned off.
        - alert: VLLMPrefixCacheHitRateLow
          expr: |-
            (
              sum(increase(vllm:prefix_cache_hits_total{model_name="qwen-3.8"}[1d]))
              + (sum(increase(vllm:external_prefix_cache_hits_total{model_name="qwen-3.8"}[1d])) or vector(0))
            )
            / sum(increase(vllm:prefix_cache_queries_total{model_name="qwen-3.8"}[1d]))
            < 0.75
          annotations:
            summary: >-
              qwen-3.8 prefix cache served only {{ $value | humanizePercentage }}
              of prompt tokens over 24h: something is rewriting the resent prefix.
          labels:
            severity: warning

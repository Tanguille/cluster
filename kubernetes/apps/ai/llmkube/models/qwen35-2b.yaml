---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen35-2b
spec:
  # Revision-pinned (immutable bytes; unsloth re-uploads fixed GGUFs under the
  # same filename) — Renovate bumps the sha via the git-refs manager in
  # .renovaterc.json5; refreshPolicy makes the bump actually re-fetch.
  source: https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/f6d5376be1edb4d416d56da11e5397a961aca8ae/Qwen3.5-2B-Q4_K_M.gguf
  refreshPolicy: OnChange
  # Q4_K_M (~1.18 GiB) is the speed/quality sweet spot on the RDNA2 iGPU
  # (measured 43 tok/s decode, 513 tok/s prefill); Q8 would ~double the
  # footprint
  # for marginal gain on easy offload tasks.
  quantization: Q4_K_M
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: vulkan
      layers: -1
      resourceName: squat.ai/dri
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen35-2b
spec:
  modelRef: qwen35-2b
  # Must be recent enough for Qwen3.5's GDN (Gated Delta Networks) architecture;
  # verified to load `qwen35` and run GDN fully on Vulkan (no CPU fallback).
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:0db4cbd35400e6b262dd24826006fb6c2c93eb9fdb0282dad5555483e0a8ab42
  parallelSlots: 2 # Vulkan warmup hangs at parallel=1 (llama.cpp #24307)
  # llama.cpp splits contextSize across parallelSlots, so 32768/2 = 16384 per
  # slot.
  # GDN keeps KV tiny, so long ctx is cheap; 16K per slot is plenty for offload.
  contextSize: 32768
  jinja: true # use the model's chat template (correct Qwen3.5 formatting + tool calls)
  extraArgs:
    - "--alias"
    - "qwen3.5-2b" # served model name litellm sends in /v1/chat/completions
    # Unsloth's recommended non-thinking sampling for Qwen3.5 Small (repeats
    # otherwise);
    # set here since litellm's auto-registered alias carries no sampling params.
    - "--temp"
    - "0.7"
    - "--top-p"
    - "0.8"
    - "--presence-penalty"
    - "1.5"
    # Qwen3.5's chat template thinks by default; without this it burns the whole
    # output budget on reasoning_content and returns empty content (verified
    # live
    # 2026-08-02). Sampling flags above don't touch this — it's a template
    # setting.
    - "--reasoning"
    - "off"

  # Both iGPU nodes advertise 2 squat.ai/dri slots; amd.com/igpu narrows it to
  # those two nodes.
  nodeSelector:
    amd.com/igpu: "true"

  # One iGPU model per node; both sides carry the rule because anti-affinity is
  # only checked for the moving pod.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: qwen3-embedding
          topologyKey: kubernetes.io/hostname

  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups:
      - 44
      - 226

  # GPU allocation comes from Model.hardware.gpu.count; resources.gpu/gpuMemory
  # are dead fields here.
  resources:
    cpu: "500m" # inference is on the iGPU; CPU only tokenises/schedules/samples
    # Request AND limit (llmkube >= 0.9.29); 7d max working set 271Mi, the rest
    # is GTT headroom memcg cannot see.
    memory: 1Gi
  # endpoint omitted — operator defaults to a ClusterIP Service on :8080.

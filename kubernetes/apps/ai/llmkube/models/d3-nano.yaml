---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: d3-nano
spec:
  # vllm-sr/d3-nano, vLLM Semantic Router's 2B decision model: llama-server answers its typed questions at
  # /v1/systemone with per-option probabilities in one forward pass.
  source: https://huggingface.co/ggml-org/vllm-d3-nano-GGUF/resolve/f2256dfaff5b8337e8bf67ca064aeef18ee14a79/vllm-d3-nano-Q8_0.gguf
  refreshPolicy: OnChange
  # Only Q8_0 and BF16 are published.
  quantization: Q8_0
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: vulkan
      resourceName: squat.ai/dri
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: d3-nano
spec:
  modelRef: d3-nano
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:4bce66a7831e1d396f49d433eb738b9ef1edc20002f5a0d5099b15282d01d13f
  parallelSlots: 2 # Vulkan warmup hangs at parallel=1 (llama.cpp #24307)
  # Split across the slots; qwen-3.8-auto sends at most ~2000 characters plus the question.
  contextSize: 8192
  # vllm-d3 evaluates the whole prompt in one ubatch (default 512; batch already defaults to 2048). A
  # 2000-character log is ~1300 tokens with the question; denser text past 2048 fails and qwen-3.8-auto falls back.
  uBatchSize: 2048

  # Both iGPU nodes advertise 2 squat.ai/dri slots; amd.com/igpu narrows it to
  # those two nodes.
  nodeSelector:
    amd.com/igpu: "true"

  # One iGPU model per node: embeddinggemma-2's required anti-affinity keeps this pod off its
  # node too (the scheduler checks existing pods' rules against the incoming pod).

  # uid/group choice: see bge-reranker-v2-m3.
  podSecurityContext:
    runAsUser: 101
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups:
      - 44
      - 226

  # GPU allocation comes from Model.hardware.gpu.count; resources.gpu/gpuMemory
  # are dead fields here.
  resources:
    cpu: "500m" # inference is on the iGPU; CPU only tokenises/schedules
    # memcg does not charge amdgpu GTT, so the request counts it: 0.2Gi cgroup plus its share of
    # control-2's GTT (7d average 1.05Gi, p95 1.86Gi, shared with the reranker).
    memory: 896Mi
    memoryLimit: 2Gi

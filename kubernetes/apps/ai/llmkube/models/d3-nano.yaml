---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: d3-nano
spec:
  # vllm-sr/d3-nano, vLLM Semantic Router's 2B decision model: llama-server answers its typed questions at
  # /v1/systemone with per-option probabilities in one forward pass.
  source: https://huggingface.co/ggml-org/vllm-d3-nano-GGUF/resolve/f2256dfaff5b8337e8bf67ca064aeef18ee14a79/vllm-d3-nano-Q8_0.gguf
  refreshPolicy: OnChange
  # Only Q8_0 and BF16 are published.
  quantization: Q8_0
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      vendor: nvidia
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: d3-nano
spec:
  modelRef: d3-nano
  # Not server-cuda13: sm_75 crashes there (llama.cpp #31503).
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:22bd49f4cf68236a63c5a187d7d1867ffb08472611ddfbf0392b6842a1b30d44
  # Only control-1 advertises nvidia.com/gpu (RTX 2070, time-sliced, no VRAM isolation between pods).
  runtimeClassName: nvidia
  # Turing is PTX-only: a cold JIT cache costs ~60 s at start and ~25 s at the first request, a warm one 1-2 s.
  # A per-service subPath of the model-cache PVC keeps it writable while the models stay read-only.
  env:
    - name: CUDA_CACHE_PATH
      value: /cuda-cache/.nv-compute-cache
  extraVolumes:
    - name: cuda-cache
      persistentVolumeClaim:
        claimName: llmkube-model-cache
  extraVolumeMounts:
    - name: cuda-cache
      mountPath: /cuda-cache
      subPath: cuda-cache/d3-nano
  parallelSlots: 2 # qwen-3.8-auto and eightball can ask at the same time
  # Split across the slots; qwen-3.8-auto sends at most ~2000 characters plus the question.
  contextSize: 8192
  # vllm-d3 evaluates the whole prompt in one ubatch (default 512; batch already defaults to 2048). A
  # 2000-character log is ~1300 tokens with the question; denser text past 2048 fails and qwen-3.8-auto falls back.
  uBatchSize: 2048

  # uid/group choice: see bge-reranker-v2-m3.
  podSecurityContext:
    runAsUser: 101
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch

  # GPU allocation comes from Model.hardware.gpu.count; resources.gpu/gpuMemory
  # are dead fields here.
  resources:
    cpu: "500m" # inference is on the GPU; CPU only tokenises/schedules
    # 0.3Gi anonymous plus the mmapped token embeddings (0.5Gi, page cache) on the 2070.
    memory: 512Mi
    memoryLimit: 2Gi

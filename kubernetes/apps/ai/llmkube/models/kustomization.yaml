---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheusrule.yaml
  - networkpolicy.yaml
  - qwen38-27b-vllm.yaml
  - qwen38-swift-27b-vllm.yaml
  - qwen38-flash-next.yaml
  - qwen38-paiton.yaml
  - qwen3-embedding.yaml
  - qwen35-2b.yaml
  - bge-reranker-v2-m3.yaml
# No hash suffix: the InferenceService mounts these by name and kustomize only
# rewrites built-in types. Editing a file does not roll the pod; restart it.
configMapGenerator:
  - name: lds-gate-patch
    files:
      - zz_lds_gate.pth=./resources/zz_lds_gate.pth
      - zz_lds_gate_impl.py=./resources/zz_lds_gate_impl.py
  - name: aiter-ua-config
    files:
      - DEFAULT.json=./resources/aiter_unified_attention_gfx1201.json
generatorOptions:
  disableNameSuffixHash: true

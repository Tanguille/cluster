---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheusrule.yaml
  - grafanadashboard.yaml
  - inkling2-mini.yaml
  - qwen38-27b.yaml
  - ups-load-shed.yaml
  - embeddinggemma-2.yaml
  - d3-nano.yaml
  - decision.yaml
  - bge-reranker-v2-m3.yaml
# No hash suffix: referenced by name, and kustomize only rewrites built-in types.
# Editing the chat template or the radiance config does not roll the pod; restart it.
configMapGenerator:
  # radiance config of inkling2-mini, which also serves qwen-3.8.
  - name: inkling2-mini-radiance-config
    files:
      - config.yaml=./resources/inkling2-mini-radiance.yaml
  # Qwen Sharp v22.5.0 for qwen-3.8, from peculiar-ragdoll/Qwen-Sharp-Chat-Templates.
  - name: qwen38-sharp-chat-template
    files:
      - chat_template.jinja=./resources/qwen38_sharp_chat_template.jinja
generatorOptions:
  disableNameSuffixHash: true

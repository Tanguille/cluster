---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafanadashboard.yaml
  - prometheusrule.yaml
  - networkpolicy.yaml
  - qwen38-27b-vllm.yaml
  - qwen38-swift-27b-vllm.yaml
  - qwen3-embedding.yaml
  - qwen35-2b.yaml
  - bge-reranker-v2-m3.yaml
# No hash suffix: the InferenceService and GrafanaDashboard reference these by
# name and kustomize only rewrites built-in types. Editing a patch or template
# file does not roll the pod; restart it.
configMapGenerator:
  - name: lds-gate-patch
    files:
      - zz_lds_gate.pth=./resources/zz_lds_gate.pth
      - zz_lds_gate_impl.py=./resources/zz_lds_gate_impl.py
  # Qwen Sharp v22.5.0, from peculiar-ragdoll/Qwen-Sharp-Chat-Templates.
  - name: qwen38-sharp-chat-template
    files:
      - chat_template.jinja=./resources/qwen38_sharp_chat_template.jinja
  - name: vllm-kv-tiers-dashboard
    files:
      - dashboard/vllm-kv-tiers.json
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: bge-reranker-v2-m3
spec:
  # Cross-encoder reranker for memini recall (Cohere-style /v1/rerank).
  # gpustack's re-quant: the cstr build omits the bert.context_length GGUF
  # key, which llama.cpp's rerank path requires: the server hard-exits at
  # model load ("key not found") and the pod crash-loops.
  source: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/3093af03b1a635e67b084b1d8c03c5f5e020fd05/bge-reranker-v2-m3-Q8_0.gguf
  quantization: Q8_0
  refreshPolicy: OnChange
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: vulkan
      resourceName: squat.ai/dri
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: bge-reranker-v2-m3
spec:
  modelRef: bge-reranker-v2-m3
  # mode: rerank auto-appends --reranking --embedding --pooling rank --cache-ram 0; no hand-wired flags.
  mode: rerank
  # GTT-leak mitigation as with embeddinggemma-2: lifetime covers startup and
  # model load before this Vulkan server is recycled.
  maxPodLifetimeSeconds: 86400
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:406ea043f19533ee7c3c8a2098aa264b72336f5563e2dcdecdae593e0cae06a5
  # memini serializes rerank calls (MEMINI_RERANK_MAX_CONCURRENCY=1), and
  # each slot gets contextSize/parallelSlots, so one slot keeps the full window.
  parallelSlots: 1
  # A pair must fit one micro-batch or llama.cpp 500s; 2048 fits a query up to
  # ~5000 chars plus a 1024-char doc. 4096 held 4.4 GiB of GTT, 2048 holds
  # ~0.65 GiB (fdinfo, at load) with identical scores.
  contextSize: 2048
  uBatchSize: 2048
  extraArgs:
    # 12 x 1024-char pairs: 3.5s with flash attention auto (on), 3.15s off; rankings identical.
    - "-fa"
    - "off"
  # Pin to the iGPU node, as with the embedder; without this the scheduler
  # could place it on the dGPU node (which also advertises squat.ai/dri) and
  # steal a dGPU slot from the 27B serving pod.
  nodeSelector:
    amd.com/igpu: "true"

  # SOFT, so it still schedules with one iGPU node down: pairs with d3-nano,
  # whose request counts its GTT, rather than the embedder, whose request omits it.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: embeddinggemma-2
            topologyKey: kubernetes.io/hostname

  # Render/video host groups for /dev/dri — the documented Vulkan-runtime
  # path. Mirrored by embeddinggemma-2 / d3-nano.
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups:
      - 44
      - 226

  resources:
    cpu: "100m" # inference is on the iGPU; CPU only tokenises/schedules
    # Request AND limit (llmkube >= 0.9.29); ~0.2Gi RSS plus ~0.65Gi of amdgpu
    # GTT. memcg does not charge GTT, but the scheduler must count it. 2Gi did
    # not fit control-3 (1.76Gi requestable), pushing it onto the embedder's node.
    memory: 1Gi
  endpoint:
    path: /v1/rerank

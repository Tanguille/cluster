---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: bge-reranker-v2-m3
spec:
  # Cross-encoder reranker for memini recall (Cohere-style /v1/rerank).
  # gpustack's re-quant: the cstr build omits the bert.context_length GGUF
  # key, which llama.cpp's rerank path requires: the server hard-exits at
  # model load ("key not found") and the pod crash-loops.
  source: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/3093af03b1a635e67b084b1d8c03c5f5e020fd05/bge-reranker-v2-m3-Q8_0.gguf
  quantization: Q8_0
  refreshPolicy: OnChange
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: bge-reranker-v2-m3
spec:
  modelRef: bge-reranker-v2-m3
  # mode: rerank auto-appends --reranking --embedding --pooling rank --cache-ram 0; no hand-wired flags.
  mode: rerank
  # Image, runtime class and JIT cache: see d3-nano.
  image: ghcr.io/ggml-org/llama.cpp:server-cuda13@sha256:ef8785623dbd5c82eca35679592add50cbb70558b41652a4188835ced8722dfd
  runtimeClassName: nvidia
  env:
    - name: CUDA_CACHE_PATH
      value: /cuda-cache/.nv-compute-cache
  extraVolumes:
    - name: cuda-cache
      persistentVolumeClaim:
        claimName: llmkube-model-cache
  extraVolumeMounts:
    - name: cuda-cache
      mountPath: /cuda-cache
      subPath: cuda-cache/bge-reranker-v2-m3
  # llama.cpp scores each document as its own task, so 4 slots rerank 15 documents in parallel: p50 0.12 s -> 0.06 s
  # alone, p95 0.50 s -> 0.20 s under 4 concurrent callers, same 0.5 GiB of VRAM (measured on the 2070).
  parallelSlots: 4
  # contextSize/parallelSlots = 2048 per slot: a pair must fit one micro-batch or llama.cpp 500s; 2048 fits a query
  # up to ~5000 chars plus a 1024-char doc.
  contextSize: 8192
  uBatchSize: 2048
  extraArgs:
    # On the 2070: 0.50 GiB of VRAM vs 0.74 off, same latency and rankings.
    - "-fa"
    - "on"
  # uid 101 is the model downloader's (llmkube --init-container-user); the root
  # model-cache-prep init hands /models to group 102, so the server needs no root.
  podSecurityContext:
    runAsUser: 101
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch

  resources:
    cpu: "100m" # inference is on the GPU; CPU only tokenises/schedules
    # 0.36Gi anonymous plus the mmapped model in page cache.
    memory: 512Mi
    memoryLimit: 2Gi
  endpoint:
    path: /v1/rerank

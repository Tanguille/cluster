---
# hostpath: size unenforced (real limit is control-1 free disk) and unraisable: any size change fails the dry-run and wedges llmkube-models.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inkling2-mini-model-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      # The .rad is 19.14 GB.
      storage: 20Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: inkling2-mini
spec:
  # A ready radiance container (int8 trunk, NVFP4 experts as stored, DSpark drafter, bf16 vision tower), not a
  # checkpoint: nothing to convert. Its layout is tied to the engine build, so no Renovate bump: move the revision
  # and the image together, then the cache dir in resources/radiance.yaml (sha256 of this source, first 16 hex).
  source: hf://gostar77/inkling2-mini-i8-dspark-radiance@f90eb3600834e93f959781fb1d5a4db6d89bb256
  format: custom
  quantization: i8-nvfp4
  refreshPolicy: OnChange
  files:
    - inkling2-mini-i8-vl-dspark.rad
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
      resourceName: squat.ai/dri
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: inkling2-mini
spec:
  modelRef: inkling2-mini
  # radiance in the vllm runtime's own-launcher mode (command set): the ModelRouter maps only llamacpp and vllm.
  runtime: vllm
  # radiance 2.x takes only --config, so its flags live in resources/radiance.yaml. The ModelRouter still
  # needs --served-model-name in extraArgs, which the shell ignores.
  command: [sh]
  args:
    - -c
    - exec radiance --config /etc/radiance/config.yaml
    - radiance
  # Our own build until radiance ships Inkling (docs/llm-hosting/inkling2-mini-2026-11.md). After a bump the owner runs
  # from docs/llm-hosting: python3 bench/qualitygate.py needle --model inkling-2-mini --chat-needles (and qwen-3.8)
  # and prodshape.py --levels 8 (0 preemptions). The card holds one engine, so a bench means stopping production.
  image: ghcr.io/tanguille/radiance:attnrel-d34cc357@sha256:2257896e6239ff7f156d94ea7534c2d83b484ddc38e2ac6e0d51e2345330b237
  # Variant 2 of the relative-attention kernel (reads K and V straight from memory). Unset, the build runs the older
  # kernel: same output, ~12% slower at 8 sessions.
  # COMPACT_MIN=1 lets one or two sessions' long verifies take the compact band too (default: 4 sessions and up).
  env:
    - name: RADIANCE_REL_VARIANT
      value: "2"
    - name: RADIANCE_REL_COMPACT_MIN
      value: "1"
  # Roll only when vllm:num_requests_running is 0, else after 15 min.
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 900
  modelCache:
    claimName: inkling2-mini-model-cache
  extraArgs:
    # Must equal the models key in resources/radiance.yaml and the displayName in agentgateway/app/models.yaml:
    # the router checks only this one, and a drift fails every request at runtime.
    - --served-model-name=inkling-2-mini
  extraVolumes:
    - name: radiance-config
      configMap:
        name: radiance-config
    # qwen-3.8, the fleet's other model: its prefetched .rad (qwen38-27b.yaml) and chat template.
    - name: qwen38-27b
      persistentVolumeClaim:
        claimName: qwen38-27b-model-cache
        readOnly: true
    - name: qwen38-sharp-chat-template
      configMap:
        name: qwen38-sharp-chat-template
  extraVolumeMounts:
    - name: radiance-config
      mountPath: /etc/radiance/config.yaml
      subPath: config.yaml
      readOnly: true
    - name: qwen38-27b
      mountPath: /models-qwen
      readOnly: true
    - name: qwen38-sharp-chat-template
      mountPath: /chat-templates/chat_template.jinja
      subPath: chat_template.jinja
      readOnly: true
  nodeSelector:
    amd.com/gpu: "true"
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups: [44, 226]
    # The engine needs io_uring and NUMA binding.
    seccompProfile:
      type: Unconfined
  resources:
    cpu: "2"
    # Engine log pins 16.00 tier + ~7.1 checkpoints + 1.46 host pool GiB; qwen-3.8 pinned 26.4 GiB on 1.17. Only one of
    # the two is loaded at a time (park ram: never in the radiance config).
    memory: 26Gi
    # The engine warns when it pins over 80% of the limit. A ceiling, not a reservation: 64Gi would pass
    # control-1's 59 GiB allocatable.
    memoryLimit: 48Gi
  endpoint:
    port: 8000
  probeOverrides:
    # /health is the process: 200 once it listens, whichever model is loaded. The fleet's stuck-exit (60 s) ends a wedged
    # one; LLMEngineStalled pages.
    liveness:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 10
    readiness:
      tcpSocket:
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6

---
# hostpath: size unenforced (real limit is control-1 free disk) and unraisable: any size change fails the dry-run and wedges llmkube-models.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inkling2-mini-model-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      # The .rad is 19.14 GB.
      storage: 20Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: inkling2-mini
spec:
  # A ready radiance container (int8 trunk, NVFP4 experts as stored, DSpark drafter, bf16 vision tower), not a
  # checkpoint: nothing to convert. Its layout is tied to the engine build, so no Renovate bump: move the revision
  # and the image together, then the cache dir in --model below (sha256 of this source, first 16 hex).
  source: hf://gostar77/inkling2-mini-i8-dspark-radiance@f90eb3600834e93f959781fb1d5a4db6d89bb256
  format: custom
  quantization: i8-nvfp4
  refreshPolicy: OnChange
  files:
    - inkling2-mini-i8-vl-dspark.rad
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
      resourceName: squat.ai/dri
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: inkling2-mini
spec:
  modelRef: inkling2-mini
  # radiance in the vllm runtime's own-launcher mode (command set): the ModelRouter maps only llamacpp and vllm.
  runtime: vllm
  command: [radiance]
  # Our own build until radiance ships Inkling (docs/llm-hosting/inkling2-mini-2026-11.md). After a bump the owner runs
  # from docs/llm-hosting: python3 bench/qualitygate.py needle --model inkling-2-mini --chat-needles
  # and prodshape.py --levels 8 (0 preemptions). The card holds one engine, so a bench means stopping production.
  image: ghcr.io/tanguille/radiance:inkling2-perf608-0602bd10@sha256:f688516b8003ace9144726d866a26664353b796d0f4db3d353902b205db4ee14
  # Roll only when vllm:num_requests_running is 0, else after 15 min.
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 900
  modelCache:
    claimName: inkling2-mini-model-cache
  # Read by the router for the served name, so every flag lives here.
  extraArgs:
    - --model
    - /models/ca0a4e72e626e73f/inkling2-mini-i8-vl-dspark.rad
    - --served-model-name
    - inkling-2-mini
    # 12 x ~52K production sessions (~624K) overflow the ~483K pool: prodshape preempted 15 times, TTFT 19-28 s.
    - --max-num-seqs
    - "8"
    - --max-model-len
    - "262144"
    # bf16 cannot hold one 262K sequence beside the experts on 32 GB; i8 passes the needles through the chat template.
    - --kv-cache-dtype
    - i8
    # Leaves 2 GiB VRAM free for Jellyfin and FileFlows (DgpuVramLow watches it); the engine sizes the KV pool from the rest.
    - --gpu-headroom-mib
    - "2048"
    # The DSpark block drafter is 7 or off; adaptive verifies only what pays. +35% single stream.
    - --num-speculative-tokens
    - "7"
    - --draft-window
    - adaptive
    # For requests that name no effort; inkling-2-mini-auto picks one per request.
    - --reasoning-effort
    - medium
    # The 3600 s default drops idle sessions that vLLM kept until the memory was wanted.
    - --prefix-cache-ttl
    - "0"
    # Host KV tier, pinned in node RAM; there is no disk tier.
    - --prefix-cache-mib
    - "16384"
    # Tower read over the link once per image; its 0.6 GiB of VRAM goes to the KV pool.
    - --vision-tower-placement
    - ram
    # The Inkling plugin's kernels live in libr4d; the others only add host fallbacks.
    - --kernels
    - libr4d
    # Leave room for Jellyfin and FileFlows on the shared card.
    - --weight-prefetch
    - off
  nodeSelector:
    amd.com/gpu: "true"
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups: [44, 226]
    # The engine needs io_uring and NUMA binding.
    seccompProfile:
      type: Unconfined
  resources:
    cpu: "2"
    # Engine log pins 16.00 tier + ~7.1 checkpoints + 1.46 host pool GiB.
    memory: 26Gi
    # The engine warns when it pins over 80% of the limit. A ceiling, not a reservation: 64Gi would pass
    # control-1's 59 GiB allocatable.
    memoryLimit: 48Gi
  endpoint:
    port: 8000
  probeOverrides:
    liveness:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 10
    readiness:
      tcpSocket:
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: vmcp-embedding
spec:
  # harrier-oss-v1-270m Q8_0, 640-dim, 32K ctx — dedicated to vmcp-unified tool
  # search so its ~194-tool batch doesn't queue behind memini on qwen3-embedding.
  # Shares one iGPU with qwen3-embedding (292MB + 639MB; the device plugin
  # advertises count: 2 for exactly this pair), so raw compute is still shared:
  # check contention here first if session failures return.
  # Community GGUF pinned to a repo revision — the same filename can be rebuilt
  # in place. Renovate git-refs manager bumps the sha.
  source: https://huggingface.co/mykor/harrier-oss-v1-270m-GGUF/resolve/fe07a2a15994730f1b8f13943927bc8198bd7fa7/harrier-oss-v1-270M-Q8_0.gguf
  quantization: Q8_0
  # Re-fetch when the source changes. Without this, a source change keeps
  # serving the stale cached file (2026-07-02: this Model silently served the
  # rolled-back bge-small gguf after the switch to harrier — llmkube only
  # flags SourceDrifted, it never re-downloads under the default IfNotPresent).
  refreshPolicy: OnChange
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: vulkan
      layers: -1
      # iGPU slot via squat/generic-device-plugin (count: 2 on iGPU nodes);
      # nodeSelector below keeps this off the dGPU node.
      resourceName: squat.ai/dri
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: vmcp-embedding
spec:
  modelRef: vmcp-embedding
  mode: embedding
  # Native upstream GTT-leak mitigation in LLMKube >=0.9.10; lifetime includes
  # startup and model load before this Vulkan embedder is recycled.
  maxPodLifetimeSeconds: 86400
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:0262343f64f030e8efff15ec05ee8180b69b7f6745de2caa3af5148e0dcb8aba
  # Vulkan floor is 2 — warmup hangs at parallel=1 (llama.cpp #24307). The iGPU
  # is compute-bound, so more slots add interleave, not throughput.
  parallelSlots: 2
  # 6144 tokens/slot. Largest single tool description measured 2155 tokens under
  # harrier's Gemma3 tokenizer (2048/slot rejected it live 2026-07-02); 30d peak
  # prompt is 4102, so 12288 keeps ~50% headroom per slot.
  contextSize: 12288
  # See qwen3-embedding.yaml: 512 measured identical on throughput, ~49% less GTT.
  uBatchSize: 512
  # mode: embedding makes the operator inject --embedding --pooling last and
  # --metrics itself (verified on the live qwen3-embedding pod) — don't repeat them.
  extraArgs:
    - "--alias"
    - "vmcp-embedding" # served model name litellm/vmcp-unified send in /v1/embeddings
    # Same as qwen3-embedding: 8192 MiB host prompt cache, never hit, never released.
    - "--cache-ram"
    - "0"

  # Defense-in-depth: keeps the iGPU pin even if qwen3-embedding's own pin is
  # ever loosened (the podAffinity below would otherwise follow it anywhere).
  nodeSelector:
    amd.com/igpu: "true"

  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups:
      - 44
      - 226

  # Co-locate with qwen3-embedding: the two embedders share that node's iGPU,
  # one squat.ai/dri slot each of the node's 2.
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: qwen3-embedding
          topologyKey: kubernetes.io/hostname

  # GPU allocation comes from Model.hardware.gpu.count; resources.gpu/gpuMemory
  # are dead fields here.
  resources:
    cpu: "500m" # inference is on the iGPU; CPU only tokenises/schedules
    memory: 512Mi # 292MB Q8_0 weights via UMA; measured 436Mi working set
  endpoint:
    path: /v1/embeddings

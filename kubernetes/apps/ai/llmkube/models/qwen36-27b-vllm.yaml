---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen36-27b-vllm-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 50Gi
---
# Persist torch, Triton, and Inductor compile caches across restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen36-27b-vllm-compile-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 10Gi
---
# L3 tier for the fs secondary tier -- the vLLM analogue of SGLang's HiCache file backend.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen36-27b-vllm-kv-offload
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    # hostpath enforces no quota, so the real bound is the free-space guard below.
    requests:
      storage: 128Gi
---
# vLLM's fs tier has no evictor at v0.27.1, and control-1's root fs is shared with
# rook-ceph's mon-c store. Enforces the 160Gi floor SGLang's file backend enforces itself.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qwen36-27b-vllm-kv-offload-guard
  namespace: ai
spec:
  # Daily: SGLang's store took weeks to reach 147G.
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            # The serving pod runs runAsUser 0, so the store is root-owned on disk.
            runAsUser: 0
          containers:
            - name: guard
              image: ghcr.io/home-operations/busybox:1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  # $$ throughout: Flux postBuild envsubst substitutes bare $VAR.
                  set -eu
                  floor=167772160
                  # df, not du: the store reaches hundreds of thousands of files.
                  avail="$$(df -kP /kvoffload | awk 'NR==2{print $$4}')"
                  echo "avail: $${avail}K (floor: $${floor}K)"
                  if [ "$$avail" -lt "$$floor" ]; then
                    # ponytail: wipe-all, not LRU -- no per-entry recency on disk to sort by.
                    echo "below floor, wiping the L3 store"
                    rm -rf -- /kvoffload/*
                  fi
              volumeMounts:
                - name: kv-offload
                  mountPath: /kvoffload
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: kv-offload
              persistentVolumeClaim:
                claimName: qwen36-27b-vllm-kv-offload
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen36-27b-vllm
spec:
  # Pin the model revision for reproducible staging. QuantTrio is the boot-validated
  # variant; the prior cyankiwi INT4 pin was never booted.
  source: hf://QuantTrio/Qwen3.6-27B-AWQ@9b507bdc9afafb87b7898700cc2a591aa6639461
  format: safetensors
  quantization: AWQ
  files:
    - model-00001-of-00008.safetensors
    - model-00002-of-00008.safetensors
    - model-00003-of-00008.safetensors
    - model-00004-of-00008.safetensors
    - model-00005-of-00008.safetensors
    - model-00006-of-00008.safetensors
    - model-00007-of-00008.safetensors
    - model-00008-of-00008.safetensors
    - model.safetensors.index.json
    - config.json
    - configuration.json
    - generation_config.json
    - tokenizer.json
    - tokenizer_config.json
    - chat_template.jinja
    - merges.txt
    - vocab.json
    - preprocessor_config.json
    - video_preprocessor_config.json
  refreshPolicy: OnChange
  hardware:
    accelerator: rocm
    memoryBudget: 34Gi
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
      resourceName: squat.ai/dri
      memory: 32Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen36-27b-vllm
spec:
  modelRef: qwen36-27b-vllm
  runtime: vllm
  # Operator default binds :: (IPv6-only on this IPv4 cluster); override to v4.
  bindAddress: 0.0.0.0
  modelCache:
    claimName: qwen36-27b-vllm-cache
  # v0.26.0 measured identical to the nightly on KV pool and throughput (2026-07-25).
  # The nightly self-reports a stale 0.23.1rc1 base tag; tags are not version-ordered.
  image: vllm/vllm-openai-rocm:v0.27.1@sha256:bb44b39aea26798cce43030a98bf48efd0322ca7147367db86e38b96bd80f0e7
  # Parked for the muse-glimmer-30b evaluation window; measured table in the PR that parked it.
  replicas: 0
  # Above 16 the 125,041-token pool oversubscribes: TG 48 -> 35, TTFT 11s -> 85s.
  parallelSlots: 16
  vllmConfig:
    # Fits the measured pool below; SGLang's 180K needs ~6.55 GiB.
    maxModelLen: 112000
    kvCacheDtype: fp8_e4m3
    # Off, mamba leaves 'align' mode and the offloading connector asserts.
    enablePrefixCaching: true
    maxNumBatchedTokens: 4096
    # HARD CEILING: shared with Jellyfin transcoding, never raise.
    gpuMemoryUtilization: 0.875
  env:
    - name: VLLM_ROCM_USE_AITER
      value: "0"
    - name: HIP_VISIBLE_DEVICES
      value: "0"
    - name: ROCR_VISIBLE_DEVICES
      value: "0"
    - name: VLLM_CACHE_ROOT
      value: /cache/vllm
    - name: TRITON_CACHE_DIR
      value: /cache/triton
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /cache/inductor
    # Pins the fs tier's block-hash seed; unset it is random per process and restarts lose it.
    - name: PYTHONHASHSEED
      value: "0"
  extraVolumes:
    - name: compile-cache
      persistentVolumeClaim:
        claimName: qwen36-27b-vllm-compile-cache
    - name: kv-offload
      persistentVolumeClaim:
        claimName: qwen36-27b-vllm-kv-offload
    # The CPU offload tier mmaps 8Gi here; the 64M default EFAULTs on pre-fault.
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 10Gi
  extraVolumeMounts:
    - name: compile-cache
      mountPath: /cache
    - name: kv-offload
      mountPath: /kvoffload
    - name: dshm
      mountPath: /dev/shm
  extraArgs:
    - --served-model-name
    - qwen-3.6
    # Zeroes every modality limit, so the vision tower loads on the meta device.
    - --language-model-only
    # Use bfloat16 Mamba cache dtype to reduce memory for the long context window.
    - --mamba-ssm-cache-dtype
    - bfloat16
    - --trust-remote-code
    # Without these the gateway gets thinking blocks and tool calls as raw text.
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_coder
    # vLLM's own "to fit into requested memory" figure at 0.875 (measured 2026-08-12).
    - --kv-cache-memory-bytes
    - "4691494912"
    # Hierarchical KV cache: CPU tier = SGLang's --hicache-ratio (9.01 GB measured), fs tier
    # = its file backend. No block_size -- Qwen3.6's hybrid groups trip a divisibility assert.
    - --kv-transfer-config
    - >-
      {"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":8589934592,"secondary_tiers":[{"type":"fs","root_dir":"/kvoffload","locality":"LOCAL"}]}}
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 15
      failureThreshold: 240
    # Inert by design: long model loads and transient GPU work must not restart the pod.
    liveness:
      exec:
        command: ["true"]
      periodSeconds: 3600
    readiness:
      tcpSocket:
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6
  nodeSelector:
    amd.com/gpu: "true"
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups: [44, 226]
    seccompProfile:
      type: Unconfined
  resources:
    cpu: "2"
    # 24Gi base + the 8 GiB the CPU offload tier pins.
    memory: 32Gi
  endpoint:
    port: 8000

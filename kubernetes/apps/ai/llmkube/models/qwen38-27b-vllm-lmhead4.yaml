---
# Stage for the 4-bit lm_head re-pack of qwen38-27b-vllm's checkpoint. The
# Job below writes it here from the live model cache; the Model CR reads it
# back through pvc://. Separate claim so the 50Gi model cache does not have
# to hold source, staged copy and fetched copy at once.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-27b-vllm-lmhead4
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 20Gi
---
# Re-packs model.safetensors with lm_head quantised (see the script). CPU
# only, streams the 18.7 GB file, ~3 GB RAM peak, one run. Request stays low: control-1
# sits at 98% memory requests, the 6Gi limit is the real bound. Idempotent on DST/DONE,
# so a Flux re-apply after completion is a no-op. Job specs are immutable:
# delete the Job before changing anything below.
#
# Same image as the engine so pack_to_int32 comes from the exact
# compressed-tensors build vLLM unpacks with. No GPU requested and no
# nodeSelector: the two hostpath claims already pin the pod to control-1.
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-27b-vllm-lmhead4-requant
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: requant
          image: vllm/vllm-openai-rocm:nightly@sha256:a78d3e91404e7875aa650a61dea580a9e26d72553bee9ae5b93dbdef7107594d
          command:
            - sh
            - -c
            - |
              set -eu
              # exactly one staged checkpoint is expected in the model cache
              [ "$(ls /models/*/model.safetensors | wc -l)" = 1 ]
              SRC=$(dirname /models/*/model.safetensors)
              echo "source $SRC"
              export SRC DST=/out/Qwen3.8-27B-W4A16-AWQ-lmhead4
              # no GPU in this pod; keep torch from probing for one
              export HIP_VISIBLE_DEVICES= ROCR_VISIBLE_DEVICES=
              python3 /scripts/lmhead4_requant.py
              ls -la "$DST"
          resources:
            requests:
              cpu: "2"
              memory: 512Mi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: out
              mountPath: /out
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: qwen38-27b-vllm-model-cache
            readOnly: true
        - name: out
          persistentVolumeClaim:
            claimName: qwen38-27b-vllm-lmhead4
        - name: script
          configMap:
            name: lmhead4-requant
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
# Same checkpoint as qwen38-27b-vllm with lm_head stored W4A16 g128 (was
# bf16, 2.54 GB read every decode step). Quality gate 2026-09-13: GSM8K 94.0
# vs 93.3 (McNemar p=1.0), tools 12/12; docs/llm-hosting/perf-plan-2026-09-13.md.
# Reports Failed and requeues every 5 min until the Job above has written
# DST/DONE; flip the InferenceService modelRef only once this is Ready.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-27b-vllm-lmhead4
spec:
  source: pvc://qwen38-27b-vllm-lmhead4/Qwen3.8-27B-W4A16-AWQ-lmhead4
  # pvc:// takes a single object (a directory for vLLM) and mounts the claim read-only at
  # /model-source; a files list is only valid for hf://|s3:// prefixes (InvalidFileSet otherwise).
  format: safetensors
  quantization: compressed-tensors
  refreshPolicy: OnChange
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
      resourceName: squat.ai/dri

---
# Holds the already-built checkpoint the Model below reads via pvc://. The
# staging Job that wrote it (re-packing model.safetensors from the bf16 source
# with lm_head quantised, see lmhead4_requant.py) is removed now that the
# result is baked and stable -- it only existed to produce this once, and kept
# recurring immutable-Job Kustomization failures on every vllm-openai-rocm
# digest bump (Job.spec.template is immutable; Renovate touched its image on
# every bump).
#
# Rebuild recipe if this checkpoint ever needs regenerating: re-create a Job
# with the same shape as the one removed here (`git show
# c245623f4~1:kubernetes/apps/ai/llmkube/models/qwen38-27b-vllm-lmhead4.yaml`
# has it verbatim) against a fresh bf16 fetch. That fetch needs its own Model
# CR + PVC too -- `git show
# c245623f4~1:kubernetes/apps/ai/llmkube/models/qwen38-27b-vllm.yaml` has the
# deleted one, including the exact `files:` list (philbert ships one
# model.safetensors, not cyankiwi's 5 shards -- get this wrong and the init
# container 404s) and why philbert440/Qwen3.8-27B-W4A16-AWQ (g128, thinking-mode
# calibrated) was chosen over cyankiwi's g32 build. Pin:
# hf://philbert440/Qwen3.8-27B-W4A16-AWQ@7908d42a71077a5e4dc458f273682b12dfe384a0
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-27b-vllm-lmhead4
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 20Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
# Same checkpoint as qwen38-27b-vllm with lm_head stored W4A16 g128 (was
# bf16, 2.54 GB read every decode step). Quality gate 2026-09-13: GSM8K 94.0
# vs 93.3 (McNemar p=1.0), tools 12/12; docs/llm-hosting/perf-plan-2026-09-13.md.
# Reports Failed and requeues every 5 min until the Job above has written
# DST/DONE; flip the InferenceService modelRef only once this is Ready.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-27b-vllm-lmhead4
spec:
  source: pvc://qwen38-27b-vllm-lmhead4/Qwen3.8-27B-W4A16-AWQ-lmhead4
  # pvc:// takes a single object (a directory for vLLM) and mounts the claim read-only at
  # /model-source; a files list is only valid for hf://|s3:// prefixes (InvalidFileSet otherwise).
  format: safetensors
  quantization: compressed-tensors
  refreshPolicy: OnChange
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
      resourceName: squat.ai/dri

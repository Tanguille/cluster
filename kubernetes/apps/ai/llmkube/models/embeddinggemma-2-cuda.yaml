---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embeddinggemma-2-cuda
spec:
  # The embedder on the RTX 2070, beside the Vulkan embeddinggemma-2 until the cutover
  # (docs/nvidia-gpu-control-1.md): same GGUF, so the same model-cache file and the same vectors.
  # EmbeddingGemma 2: 270M params, 768 dims native; needs llama.cpp with gemma-embedding2.
  source: https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/6ea3e3a309d12a4779cfda98b8c19800d2d5da71/embeddinggemma-2-Q8_0.gguf
  quantization: Q8_0
  refreshPolicy: OnChange
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      vendor: nvidia
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embeddinggemma-2-cuda
spec:
  modelRef: embeddinggemma-2-cuda
  mode: embedding
  # Image, runtime class and JIT cache: see d3-nano.
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:22bd49f4cf68236a63c5a187d7d1867ffb08472611ddfbf0392b6842a1b30d44
  runtimeClassName: nvidia
  env:
    - name: CUDA_CACHE_PATH
      value: /cuda-cache/.nv-compute-cache
  extraVolumes:
    - name: cuda-cache
      persistentVolumeClaim:
        claimName: llmkube-model-cache
  extraVolumeMounts:
    - name: cuda-cache
      mountPath: /cuda-cache
      subPath: cuda-cache/embeddinggemma-2-cuda
  # 4 slots: the 194-tool search and memini share one embedder; keeps the
  # 194-item batch from queueing behind memini (0.9 s on the 2070, 7.4 s on the iGPU).
  parallelSlots: 4
  # contextSize/parallelSlots = 8192 per slot, matching the per-input cap below.
  contextSize: 32768
  # Bidirectional model: min(batchSize, uBatchSize) is the per-input token cap, so
  # set both (n_batch stays at its 2048 default otherwise). 8192 is the model's
  # native context: 4096 rejected a 4105-token kritika chunk.
  batchSize: 8192
  uBatchSize: 8192
  extraArgs:
    # gemma-embedding2 requires mean pooling.
    - "--pooling"
    - "mean"
    # Explicit: auto turned it off for head_dim 512 on Turing (llama.cpp #30398). 1.06 GiB compute buffer here.
    - "-fa"
    - "on"
  # uid/group choice: see bge-reranker-v2-m3.
  podSecurityContext:
    runAsUser: 101
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch
  resources:
    cpu: "250m" # inference is on the GPU; CPU only tokenises/schedules
    # 0.4Gi anonymous plus the mmapped model in page cache.
    memory: 512Mi
    memoryLimit: 2Gi
  endpoint:
    path: /v1/embeddings

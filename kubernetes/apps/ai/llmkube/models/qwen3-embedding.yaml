---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-embedding
spec:
  # Q8_0 over F16: this iGPU is compute-bound, and Q8_0 halves the compute for
  # negligible loss on similarity search (194-item batch, ~10s isolated /
  # 19-52s under 3x concurrent).
  # Revision-pinned (immutable bytes) — Renovate bumps the sha via the git-refs
  # manager in .renovaterc.json5; refreshPolicy makes the bump actually re-fetch.
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/370f27d7550e0def9b39c1f16d3fbaa13aa67728/Qwen3-Embedding-0.6B-Q8_0.gguf
  quantization: Q8_0
  refreshPolicy: OnChange
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: vulkan
      layers: -1
      # iGPU stays on generic-device-plugin (squat.ai/dri), NOT DRA: main has since
      # grown a 3-way concurrent squat.ai/dri sharing scenario on the iGPU nodes
      # (qwen3-embedding + vmcp-embedding + qwen35-2b, count:2/node) via pod
      # (anti-)affinity. The AMD DRA driver has no timeslicing/consumable-capacity
      # support, so a DRA claim here would be exclusive and break that sharing.
      # DRA migration (components/dra-dgpu) is scoped to the exclusive dGPU only.
      resourceName: squat.ai/dri
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-embedding
spec:
  modelRef: qwen3-embedding
  mode: embedding
  # Native upstream GTT-leak mitigation in LLMKube >=0.9.10; lifetime includes
  # startup and model load before this Vulkan embedder is recycled.
  maxPodLifetimeSeconds: 86400
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:f5122475f77cf20719a514dc01c8d371cd874ceee2109c02ae7db0920562ec96
  # Two slots are the Vulkan-safe floor; more interleaving did not improve
  # throughput on this compute-bound iGPU. VMCP has its own embedder now.
  parallelSlots: 2 # Vulkan warmup hangs at parallel=1 (llama.cpp #24307)
  # 30d peak prompt is 4030 tokens, and contextSize splits across parallelSlots,
  # so 8192 left each slot 4096 with 66 tokens of headroom. 10240 restores a
  # ~27% margin; anything an input overruns fails the embedding outright.
  contextSize: 10240
  # No batchSize: llama.cpp forces n_batch = n_ubatch when embeddings are
  # enabled, so any value above uBatchSize is logged as a warning and discarded.
  # 512 over 2048: benchmarked identical on this iGPU (194-item batch 3.61s vs
  # 3.68s median, single 65ms vs 69ms, 4k input 402 vs 390 tok/s) while cutting
  # GTT ~49%, since the attention scratch scales with the square of the micro-batch.
  uBatchSize: 512
  extraArgs:
    - "--alias"
    - "qwen3-embedding" # served model name memini sends in /v1/embeddings
    # Host prompt cache (default 8192 MiB) is never released: 100 distinct
    # embedding requests took anon 0.08 -> 8.06 GiB. One-shot embeddings never hit it.
    - "--cache-ram"
    - "0"

  # Pin to the iGPU node — narrows to the shared squat.ai/dri iGPU slots and
  # keeps this off the exclusive dGPU node reserved for sglang.
  nodeSelector:
    amd.com/igpu: "true"

  # Mutual half of qwen35-2b's anti-affinity (see qwen35-2b.yaml). Anti-affinity
  # is checked only at the moving pod's scheduling time, so the rule must exist
  # on both sides: 2026-07-03 a reshuffle rolled this pod onto qwen35-2b's node,
  # filling its 2 dri slots and re-stranding vmcp-embedding (which hard-follows
  # this pod) in Pending.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: qwen35-2b
          topologyKey: kubernetes.io/hostname

  # Render/video host groups for /dev/dri — the documented Vulkan-runtime path.
  # Mirrored by qwen35-2b and vmcp-embedding.
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups:
      - 44
      - 226

  resources:
    cpu: "500m" # inference is on the iGPU; CPU only tokenises/schedules
    # ~3.1 GiB peak working set over 7 days; 4 GiB so the scheduler accounts for
    # the model's UMA usage.
    memory: 4Gi
  endpoint:
    path: /v1/embeddings

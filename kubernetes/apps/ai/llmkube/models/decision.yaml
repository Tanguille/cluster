---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
# The served decision model (Perplexity Decider Flash v1.3), used by inkling-2-mini-auto and 8-ball.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: decision
spec:
  source: https://huggingface.co/fxoz/pplx-decider-flash-v1.3-GGUF/resolve/6ff75cda62a1cbbceda5d0a24b81dab874a28b85/pplx-decider-flash-v1.3-Q4_K_M.gguf
  sha256: be71648b53548959a995f5a4404264d9edefeab775ff51d3b6a14b3b882c7600
  prefetch: true
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: cuda
    gpu:
      count: 1
      enabled: true
      vendor: nvidia
  refreshPolicy: OnChange
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: decision
spec:
  # Rollback: modelRef d3-nano (d3-nano.yaml).
  modelRef: decision
  # CUDA 13 image: its PTX loads on Turing because toolkit >= 1.19.1 injects the image's compat libcuda
  # (llama.cpp #31503); measured on the 2070 in docs/nvidia-gpu-control-1.md.
  image: ghcr.io/ggml-org/llama.cpp:server-cuda13@sha256:ef8785623dbd5c82eca35679592add50cbb70558b41652a4188835ced8722dfd
  # Turing is PTX-only: a cold JIT cache costs ~60 s at start and ~25 s at the first request, a warm one 1-2 s.
  # A per-service subPath of the model-cache PVC keeps it writable while the models stay read-only.
  env:
    - name: CUDA_CACHE_PATH
      value: /cuda-cache/.nv-compute-cache
  extraVolumes:
    - name: cuda-cache
      persistentVolumeClaim:
        claimName: llmkube-model-cache
  extraVolumeMounts:
    - name: cuda-cache
      mountPath: /cuda-cache
      subPath: cuda-cache/decision
  parallelSlots: 2 # inkling-2-mini-auto and eightball can ask at the same time
  # Split across the slots; inkling-2-mini-auto sends at most ~2000 characters plus the question.
  contextSize: 8192
  # Flash evaluates each prompt in one physical batch. A 2000-character log plus the question
  # typically fits in 1300 tokens. Above 2048 tokens the effort router falls back.
  uBatchSize: 2048
  extraArgs:
    - --load-mode
    - none
    # Keep the served id when modelRef switches between decision models.
    - --alias
    - decision
  # The first typed decision can compile CUDA kernels after the HTTP health check passes.
  probeOverrides:
    startup:
      exec:
        command:
          - curl
          - --fail
          - --silent
          - --show-error
          - --output
          - /dev/null
          - --max-time
          - "75"
          - --header
          - "Content-Type: application/json"
          - --data
          - >-
            {"state":"Repeated checks after the service update return HTTP 503. User requests are failing and
            there is no successful recovery yet. The operator needs to decide whether to investigate
            now.","questions":{"investigate":{"type":"noul","instructions":"Does the evidence describe an active
            failure requiring investigation?"}}}
          - http://127.0.0.1:8080/v1/systemone
      periodSeconds: 5
      timeoutSeconds: 80
      failureThreshold: 180

  # uid/group choice: see bge-reranker-v2-m3.
  podSecurityContext:
    runAsUser: 101
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch

  # GPU allocation comes from Model.hardware.gpu.count; resources.gpu/gpuMemory
  # are dead fields here.
  resources:
    cpu: "500m"
    # Loading the weights also uses host RAM.
    memory: 1536Mi
    memoryLimit: 3Gi

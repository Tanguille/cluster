---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inference-ingress-allowlist
spec:
  # llmkube InferenceService pods (radiance :8000, llama.cpp :8080) are
  # unauthenticated; agentgateway is the only sanctioned front door (keys,
  # routing, admission), with its embedding cache in front of the embedder.
  # Expected ingress: agentgateway, embedding-cache, vmagent scrapes, kubelet
  # probes. Note ai-ingress-allowlist (../../networkpolicy.yaml)
  # also selects these pods and admits the whole namespace; allows union, so
  # this list documents intent rather than enforcing it. Health/guard probes run in-pod.
  # Direct bge-reranker-v2-m3 callers get their own policy below.
  endpointSelector:
    matchExpressions:
      - key: inference.llmkube.dev/service
        operator: Exists
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            gateway.networking.k8s.io/gateway-name: agentgateway
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: embedding-cache
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
---
# memini and Hermes (web-extract-rerank) call the reranker directly; intent only, like the policy above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inference-rerank-memini-allow
spec:
  endpointSelector:
    matchLabels:
      inference.llmkube.dev/service: bge-reranker-v2-m3
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: memini
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

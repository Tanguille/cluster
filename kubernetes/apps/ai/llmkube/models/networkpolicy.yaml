---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inference-ingress-allowlist
spec:
  # llmkube InferenceService pods (vLLM :8000, llama.cpp :8080) are
  # unauthenticated; agentgateway is the only sanctioned front door (keys,
  # routing, admission), with its embedding cache in front of the embedder.
  # Expected ingress: agentgateway, vmagent scrapes and kubelet probes.
  # The namespace policy now only adds host probes and DNS replies; it no longer
  # grants all AI callers access. Health/guard probes run in-pod.
  # Direct bge-reranker-v2-m3 callers get their own policy below.
  endpointSelector:
    matchExpressions:
      - key: inference.llmkube.dev/service
        operator: Exists
  # Init model-downloader revalidates/downloads HuggingFace artifacts on startup.
  # Pod-wide: Cilium cannot scope egress to an init container, so serving containers get it too.
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            gateway.networking.k8s.io/gateway-name: agentgateway
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is ephemeral not 53.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
---
# memini's and Hermes's (web-extract-rerank plugin) rerank paths, carved out of the gateway-only allowlist above.
# Deliberately a SEPARATE policy: its endpointSelector pins the reranker
# service, so memini and Hermes reach bge-reranker-v2-m3 and nothing else in the
# llmkube fleet — the unauthenticated 27B chat and vLLM pods stay
# gateway-only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inference-rerank-memini-allow
spec:
  endpointSelector:
    matchLabels:
      inference.llmkube.dev/service: bge-reranker-v2-m3
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: memini
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# The cache fronts only the embedder, not the unauthenticated chat models.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inference-embedding-cache-allow
spec:
  endpointSelector:
    matchLabels:
      inference.llmkube.dev/service: embeddinggemma-2
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: embedding-cache
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

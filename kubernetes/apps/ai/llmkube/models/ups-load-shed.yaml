---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/keda.sh/scaledobject_v1alpha1.json
# Sheds the LLM when the tech cave UPS (Ellipse ECO 1200, load % of ~960 W) nears overload, e.g. desktop gaming
# plus the printer. The dGPU is the only large load the cluster can drop (~250 W busy, CPUs 30-60 W per node).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: qwen38-27b-vllm-ups-shed
spec:
  scaleTargetRef:
    apiVersion: inference.llmkube.dev/v1alpha1
    kind: InferenceService
    name: qwen38-27b-vllm
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 30
  # Hysteresis lives in the query, so drop to 0 as soon as it says so.
  cooldownPeriod: 0
  advanced:
    restoreToOriginalReplicaCount: true
  fallback:
    # Fail open: a scaler or VictoriaMetrics error must not take the LLM down.
    failureThreshold: 3
    replicas: 1
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428
        # Running: stay up unless load held above 90 % for a full minute.
        # Shed: come back only after 15 min under 65 %, since the LLM adds ~23 points when busy.
        # Missing NUT or kube-state-metrics data falls through to 1.
        query: >-
          max(
            (
              (min_over_time(network_ups_tools_ups_load[1m]) <= bool 90)
              and on() (kube_deployment_spec_replicas{namespace="ai", deployment="qwen38-27b-vllm"} > 0)
            )
            or on()
            (
              (max_over_time(network_ups_tools_ups_load[15m]) < bool 65)
              and on() (kube_deployment_spec_replicas{namespace="ai", deployment="qwen38-27b-vllm"} == 0)
            )
            or on() vector(1)
          )
        threshold: "1"

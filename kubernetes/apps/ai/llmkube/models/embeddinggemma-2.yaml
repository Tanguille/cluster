---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embeddinggemma-2
spec:
  # EmbeddingGemma 2: 270M params, 768 dims native; needs llama.cpp with gemma-embedding2.
  source: https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/6ea3e3a309d12a4779cfda98b8c19800d2d5da71/embeddinggemma-2-Q8_0.gguf
  quantization: Q8_0
  refreshPolicy: OnChange
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: vulkan
      resourceName: squat.ai/dri
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embeddinggemma-2
spec:
  modelRef: embeddinggemma-2
  mode: embedding
  # Native upstream GTT-leak mitigation in LLMKube >=0.9.10; lifetime includes
  # startup and model load before this Vulkan embedder is recycled.
  maxPodLifetimeSeconds: 86400
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:f885c1137a997b318eede280b76b3f35cb84b757c218f41480a33be2b129b8a9
  # 4 slots: the 194-tool search and memini share one embedder; keeps the
  # 194-item batch from queueing behind memini (bench: 7.43s median for 194
  # 400-char items isolated, 120s is the toolhive timeout). Vulkan warmup hangs
  # at parallel=1 (llama.cpp #24307).
  parallelSlots: 4
  # contextSize/parallelSlots = 8192 per slot, matching the per-input cap below.
  contextSize: 32768
  # Bidirectional model: min(batchSize, uBatchSize) is the per-input token cap, so
  # set both (n_batch stays at its 2048 default otherwise). 8192 is the model's
  # native context: 4096 rejected a 4105-token kritika chunk. Attention scratch
  # (GTT) scales with its square.
  batchSize: 8192
  uBatchSize: 8192
  extraArgs:
    # gemma-embedding2 requires mean pooling.
    - "--pooling"
    - "mean"
  # Pin to an iGPU node. On the dGPU it took 1.2 GiB of VRAM and left 0.93 GiB
  # free, under the then-used 1.82 GiB Jellyfin reserve.
  nodeSelector:
    amd.com/igpu: "true"
  # One iGPU model per node. The scheduler enforces a required anti-affinity in both
  # directions, so this rule alone also keeps d3-nano off this node.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: d3-nano
          topologyKey: kubernetes.io/hostname
  # Render/video groups for /dev/dri (Vulkan path); mirrored by d3-nano.
  # uid/group choice: see bge-reranker-v2-m3.
  podSecurityContext:
    runAsUser: 101
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups:
      - 44
      - 226
  resources:
    cpu: "250m" # inference is on the iGPU; CPU only tokenises/schedules
    # Request AND limit (llmkube >= 0.9.29); working set ~0.2Gi plus amdgpu GTT
    # (uncharged by memcg; control-3 7d average 1.21Gi, p95 1.88Gi, all this model).
    memory: 1280Mi
  endpoint:
    path: /v1/embeddings

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embeddinggemma-2
spec:
  # EmbeddingGemma 2 (google/embeddinggemma-2): text-only, 270M params,
  # 768 dims native (Matryoshka-truncatable to 512/256/128).
  # Q8_0 GGUF from huggingface.co/ggml-org/embeddinggemma-2-GGUF (310 MB).
  # Needs llama.cpp with gemma-embedding2 (see image pin); mean pooling required.
  source: https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/bfcd298762cc34d0357ece5ebdd31791a3a374d8/embeddinggemma-2-Q8_0.gguf
  quantization: Q8_0
  refreshPolicy: OnChange
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: vulkan
      layers: -1
      # Slot counts live at the device plugin (kube-system/generic-device-plugin);
      # nodeSelector pins this to the iGPU.
      resourceName: squat.ai/dri
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embeddinggemma-2
spec:
  modelRef: embeddinggemma-2
  mode: embedding
  # Native upstream GTT-leak mitigation in LLMKube >=0.9.10; lifetime includes
  # startup and model load before this Vulkan embedder is recycled.
  maxPodLifetimeSeconds: 86400
  # Old qwen3-embedding pin predates gemma-embedding2 (llama.cpp PR #30054, merged 2026-10-06; first release b11446, pruned from GHCR).
  # Pinned to b11459's digest: oldest surviving tag with the arch.
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:ee2ecb9c3a4d6fa00b918b133fd7a2828195593688eeaef6e6516ef833f88f09
  # 4 slots: the 194-tool search and memini share one embedder; keeps the
  # 194-item batch
  # from queueing behind memini (bench: 7.07s median for the 194-tool batch
  # isolated,
  # 120s is the toolhive timeout). Vulkan warmup hangs at parallel=1 (llama.cpp
  # #24307).
  parallelSlots: 4
  # Model native context is 8192; we keep 20480 to preserve the previous
  # per-slot budget and tuned profile; headroom is generous.
  contextSize: 20480
  # No batchSize: llama.cpp forces n_batch = n_ubatch when embeddings are
  # enabled, so any value above uBatchSize is logged as a warning and discarded.
  # 512 over 20480: the model is smaller (768 vs 1024 dims) so 512 is well
  # within bounds; keep the GTT lesson (uBatchSize controls attention scratch
  # scale, not a truncation limit).
  uBatchSize: 512
  extraArgs:
    - "--alias"
    # served model name memini sends in /v1/embeddings
    - "embeddinggemma-2"
    # Mean pooling is required for the gemma-embedding2 architecture in
    # llama.cpp; without it embeddings are not produced correctly.
    # Reference: community GGUF repos serve it with --pooling mean e.g.
    # llama-server -m embeddinggemma-2-Q8_0.gguf --embeddings --pooling mean.
    - "--pooling"
    - "mean"
    # Host prompt cache (default 8192 MiB) is never released: 100 distinct
    # embedding requests took anon 0.08 -> 8.06 GiB. One-shot embeddings never
    # hit it.
    - "--cache-ram"
    - "0"
  # Pin to the iGPU node; without this the scheduler could place it on the dGPU
  # node (also advertises squat.ai/dri) and steal a 27B slot.
  nodeSelector:
    amd.com/igpu: "true"
  # One iGPU model per node; both sides carry the rule (checked for the moving pod only).
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: qwen35-2b
          topologyKey: kubernetes.io/hostname
  # Render/video groups for /dev/dri (Vulkan path); mirrored by qwen35-2b.
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups:
      - 44
      - 226
  resources:
    cpu: "500m" # inference is on the iGPU; CPU only tokenises/schedules
    # Request AND limit (llmkube >= 0.9.29); working set <224Mi, model buffer
    # in amdgpu GTT (~1.9 GiB, uncharged; raising it restarts the embedder).
    # 512Mi is ~4x; the 6Gi reservation held control-2 at 95.8% overcommit.
    memory: 512Mi
  endpoint:
    path: /v1/embeddings

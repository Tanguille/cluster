---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen36-27b-model-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen36-27b-triton-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen36-27b-hicache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    # hostpath enforces no quota, so the real bound is the evictor's MAX_SIZE below.
    requests:
      storage: 64Gi
---
# Prunes superseded HiCache generations. The storage dir below is versioned per image
# digest because reuse across a bump is unsafe -- page names encode neither the weights
# revision nor the engine, and SGLang's own config_suffix only covers --served-model-name
# and TP, both constant across bumps. Nothing in the CRD can prune the old directory (no
# initContainers field), so it was manual, and a missed cleanup orphaned 64G on 2026-07-30.
# That matters more than it looks: control-1's disk is a SPARSE zvol on TrueNAS SSD_Pool,
# which had 60.3G available on 2026-07-30. Orphaned generations consume real pool space,
# and exhausting that pool stops the VM.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qwen36-27b-hicache-prune
  namespace: ai
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            # Superseded generations were written by root-era pods (pre-4a4b06f), so the
            # pruner needs uid 0 to unlink them. It mounts nothing but this PVC.
            runAsUser: 0
          containers:
            - name: prune
              image: ghcr.io/home-operations/busybox:1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  cd /hicache
                  # Newest by mtime is the live generation; the running pod writes to it
                  # constantly. Never prune it, and never prune anything touched in the
                  # last day, so a rollout's outgoing pod keeps its cache while draining.
                  newest="$(ls -1dt -- */ 2>/dev/null | head -1)"
                  for d in */; do
                    [ -d "$d" ] || continue
                    [ "$d" = "$newest" ] && continue
                    [ -n "$(find "$d" -maxdepth 0 -mmin +1440)" ] || continue
                    echo "pruning superseded generation: $d ($(du -sh "$d" | cut -f1))"
                    rm -rf -- "$d"
                  done
                  # Count only -- a `du -sh .` here would stat the whole live generation
                  # (619,346 files on 2026-07-30) every run just to log a number.
                  echo "remaining: $(ls -1d -- */ 2>/dev/null | wc -l) generation(s)"
              volumeMounts:
                - name: hicache
                  mountPath: /hicache
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
          volumes:
            - name: hicache
              persistentVolumeClaim:
                claimName: qwen36-27b-hicache
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen36-27b-awq
spec:
  source: hf://mattbucci/Qwen3.6-27B-AWQ@f541031dfc1bf5da3f198b52b9bf44cbd5ceee49
  format: safetensors
  refreshPolicy: OnChange
  files:
    - model.safetensors
    - model-vision.safetensors
    - model.safetensors.index.json
    - config.json
    - generation_config.json
    - chat_template.jinja
    - processor_config.json
    - tokenizer.json
    - tokenizer_config.json
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
      resourceName: squat.ai/dri
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen36-27b
spec:
  modelRef: qwen36-27b-awq
  runtime: sglang
  # Operator default binds :: (IPv6-only on this IPv4 cluster); override to v4.
  bindAddress: 0.0.0.0
  image: ghcr.io/tanguille/sglang-rdna4:sha-cb7b76050cbf8dda9e5a78c07b24df1a783caeb3@sha256:f961fc274eaad4af065097e0921b88ae5a97a478baa0e384e6c5ee440c355b29
  containerPort: 30000
  endpoint:
    # v0.9.8 maps endpoint.port to both Service port and targetPort; use the
    # runtime port so generated traffic reaches SGLang directly.
    port: 30000
  nodeSelector:
    kubernetes.io/hostname: control-1
  podSecurityContext:
    # The image's own USER 10001:10001 owns /home/sglang/.cache 0700 (flashinfer's JIT
    # workspace lives there). The operator drops ALL capabilities on the container, so
    # runAsUser: 0 no longer gets CAP_DAC_OVERRIDE to force its way past that ownership --
    # root became just another uid. Match the image's own user instead of overriding it.
    runAsUser: 10001
    runAsGroup: 10001
    # The triton-cache and hicache PVCs were written by every prior root-based pod, so
    # they're root-owned on disk. fsGroup makes kubelet recursively chown volume mounts
    # to this group at mount time -- the same fix as runAsGroup, but for PVC contents
    # instead of the image's own baked files. OnRootMismatch: hicache already holds 64G;
    # skip the recursive chown walk on every future restart once the root matches.
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups:
      - 44
      - 226
    seccompProfile:
      type: Unconfined
  modelCache:
    claimName: qwen36-27b-model-cache
  sglangConfig:
    contextLength: 180000
    # HARD CEILING: the R9700 is shared with Jellyfin transcoding, raising this fails
    # media workloads. 0.95 grows the pool 183,240 -> 261,019 tokens but OOMs on a
    # 13.8K-token prefill (2026-07-25).
    memFractionStatic: 0.875
    # No maxRunningRequests: the mamba clamp always wins, so setting it here only misleads.
    # resolve_max_num_reqs() takes min(requested, max_mamba_cache_size // 3), and unset it
    # takes min(estimated, ...) where estimated floors at 2048 -- both land on 48//3 = 16.
    chunkedPrefillSize: 8192
    tensorParallelSize: 1
    quantization: awq
    kvCacheDtype: fp8_e4m3
    reasoningParser: qwen3
  resources:
    cpu: "2"
    hostMemory: 24Gi
  env:
    - name: HIP_VISIBLE_DEVICES
      value: "0"
    - name: ROCR_VISIBLE_DEVICES
      value: "0"
    - name: GPU_DEVICE_ORDINAL
      value: "0"
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
    # $HOME/.cache/flashinfer/<ver>/ is root-owned in the image (a build-time
    # `import torch, sglang, sgl_kernel` verification step triggers flashinfer's JIT
    # logger init as root, before the runtime user exists) -- uid 10001 can enter it
    # (0755) but not write the JIT log, crashing at import. Redirect off $HOME entirely.
    - name: FLASHINFER_WORKSPACE_BASE
      value: /tmp
    - name: TRITON_CACHE_DIR
      value: /cache/sglang/triton
    # Required at TP=1: LLMKube runs launch_server directly, bypassing the image's
    # entrypoint.sh/gpu-selection.sh, the only place this is normally set. Without it the
    # JIT store_cache kernel crashes on first request (kvcache.cuh:204).
    - name: SGLANG_RDNA4_DISABLE_STORE_CACHE
      value: "1"
    # Page names encode neither the weights revision nor the engine, so this suffix MUST be
    # bumped with the image digest above or the AWQ revision, or stale KV pages get served.
    # SGLang's own per-model cache key (config_suffix, HiCacheFile.__init__) only covers
    # --served-model-name/TP, which stays "qwen-3.6" across bumps -- it doesn't catch this.
    # SGLang's own evictor only manages its own configured path, so the OLD suffix's
    # directory is orphaned on every bump; the qwen36-27b-hicache-prune CronJob above
    # reclaims it a day later.
    - name: SGLANG_HICACHE_FILE_BACKEND_STORAGE_DIR
      value: /hicache/sglang-v0.5.16_awq-f541031d_fork-cb7b760
    # Unset defaults to unbounded; a full L2 measured 14G on 2026-07-27.
    - name: SGLANG_HICACHE_FILE_BACKEND_MAX_SIZE
      value: 64Gi
    # MAX_SIZE alone is blind to the other tenants of control-1's shared 500G root, so
    # hold a floor well above kubelet's ~50G nodefs eviction threshold.
    - name: SGLANG_HICACHE_FILE_BACKEND_MIN_FREE_SPACE
      value: 100Gi
    # Without this every L3 lookup walks the store with os.scandir/os.path.exists; the
    # directory holds 619,346 files (2026-07-30). Upstream #29716 measured P99 TTFT -22.1%
    # at 157K files. Off by default. Costs a one-time startup scan of the store, which runs
    # against the ~30min startup-probe budget below (120 x 15s) -- time a cold restart and
    # record it here; a scan longer than that budget turns this into a CrashLoopBackOff.
    - name: SGLANG_HICACHE_FILE_BACKEND_ENABLE_METADATA_CACHE
      value: "1"
  extraVolumes:
    - name: triton-cache
      persistentVolumeClaim:
        claimName: qwen36-27b-triton-cache
    - name: hicache
      persistentVolumeClaim:
        claimName: qwen36-27b-hicache
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  extraVolumeMounts:
    - name: triton-cache
      mountPath: /cache
    - name: hicache
      mountPath: /hicache
    - name: dshm
      mountPath: /dev/shm
  probeOverrides:
    # SGLang's health endpoint is suitable for startup; keep liveness inert so
    # long model loads or transient GPU work cannot trigger a restart.
    startup:
      httpGet:
        path: /health
        port: 30000
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 120
    liveness:
      exec:
        command:
          - "true"
      # Inert probe; hourly period avoids a pointless CRI exec every 10s.
      periodSeconds: 3600
    readiness:
      tcpSocket:
        port: 30000
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6
  extraArgs:
    - --dtype
    - bfloat16
    - --num-continuous-decode-steps
    - "16"
    - --watchdog-timeout
    - "600"
    - --attention-backend
    - triton
    - --pre-warm-nccl
    - --trust-remote-code
    - --chat-template
    - /opt/rdna4-inference/scripts/qwen3.6_devrole_chat_template.jinja
    - --tool-call-parser
    - qwen3_coder
    - --disable-custom-all-reduce
    - --disable-overlap-schedule
    - --cuda-graph-backend-decode=disabled
    - --cuda-graph-backend-prefill=disabled
    # Mamba slots and full-KV tokens share one byte budget (unified_memory_pool.py), so
    # unused slots are KV tokens forgone: measured 4.46G/60 slots = 74.3MB each, against
    # 5.60G/183,240 KV tokens. Peak slots actually used over 14d is 32, peak concurrency 16.
    # 48 = 16 running x the no_buffer ratio of 3, so this value alone sets the concurrency
    # ceiling. Frees ~892M -> ~29K more KV tokens (+16% pool). Concurrency touched 16 once
    # in 14d (typical peak 8-12), and the aborts we do see cluster at 8-11, not at a ceiling.
    - --max-mamba-cache-size
    - "48"
    - --served-model-name
    - qwen-3.6
    - --mamba-ssm-dtype
    - bfloat16
    - --max-queued-requests
    - "32"
    - --weight-loader-drop-cache-after-load
    - --enable-hierarchical-cache
    - --hicache-io-backend
    - direct
    - --hicache-ratio
    - "1.5"
    - --model-loader-extra-config
    - '{"num_threads":2}'
    - --schedule-conservativeness
    - "0.1"
    - --enable-mixed-chunk
    # write_through_selective gates promotion on hit_count >= 2, which left L3 empty.
    - --hicache-write-policy
    - write_through
    - --hicache-storage-backend
    - file

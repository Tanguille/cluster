---
# Persist torch, Triton, and Inductor compile caches across restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-27b-vllm-compile-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 10Gi
---
# fs KV tier (OffloadingConnector secondary); hostpath has no quota, the guard
# CronJob below is the bound.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-27b-vllm-kv-offload
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 128Gi
---
# vLLM's fs tier has no evictor; the root fs is shared with the rook-ceph mon.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qwen38-27b-vllm-kv-offload-guard
spec:
  # Sweep, not a cap: hourly because a restart can regrow the tier past the
  # floor within a day.
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            # The serving pod runs runAsUser 0, so the store is root-owned on
            # disk.
            runAsUser: 0
          # hostPath pins this to control-1; it must tolerate the DiskPressure
          # it exists to clear.
          tolerations:
            - key: node.kubernetes.io/disk-pressure
              operator: Exists
              effect: NoSchedule
          containers:
            - name: guard
              image: ghcr.io/home-operations/busybox:1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  # $$ throughout: Flux postBuild envsubst substitutes bare
                  # $VAR.
                  set -eu
                  avail() { df -kP /kvoffload | awk 'NR==2{print $$4}'; }
                  # 160Gi = 32% of the 499.6Gi disk; ceph
                  # mon_data_avail_warn=27, so an 80Gi (15%) floor could never
                  # clear it. Non-tier usage measured 128Gi (2026-08-22).
                  floor=167772160
                  avail_kb="$$(avail)"
                  echo "avail: $${avail_kb}K (floor: $${floor}K)"
                  if [ "$$avail_kb" -ge "$$floor" ]; then
                    echo "above floor, nothing to do"
                    exit 0
                  fi
                  # LRU by mtime, oldest first; blocks are write-once.
                  n=0
                  # busybox find has no -printf.
                  find /kvoffload -type f -exec stat -c '%Y %n' {} + | sort -n | cut -d' ' -f2- |
                  while IFS= read -r f; do
                    rm -f -- "$$f"
                    n=$$((n + 1))
                    if [ $$((n % 2000)) -eq 0 ]; then
                      avail_kb="$$(avail)"
                      echo "evicted $${n} files, avail now $${avail_kb}K"
                      [ "$$avail_kb" -ge "$$floor" ] && break
                    fi
                  done
                  # Tier fully evicted and still short: the shortfall is
                  # elsewhere on the shared fs.
                  avail_kb="$$(avail)"
                  [ "$$avail_kb" -ge "$$floor" ] && exit 0
                  echo "floor unreachable: $${avail_kb}K < $${floor}K, tier fully evicted" >&2
                  exit 1
              volumeMounts:
                - name: kv-offload
                  mountPath: /kvoffload
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: kv-offload
              persistentVolumeClaim:
                claimName: qwen38-27b-vllm-kv-offload
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen38-27b-vllm
spec:
  # Swift AWQ since 2026-09-18 (GSM8K 95.3 vs philbert 93.3, tools 12/12).
  # Checkpoint swap = modelRef + modelCache.claimName, one restart; pre-stage
  # files into the PVC at /models/<sha256(source)[:16]> so the init container
  # only revalidates. fs KV tier is keyed per model by vLLM's file_mapper;
  # nothing to do.
  modelRef: qwen38-swift-27b-vllm
  runtime: vllm
  replicas: 1
  # 5, not 6: MAX_SKINNY_BATCH_SIZE=5 in rdna_hybrid_w4a16.py sends every W4A16
  # projection to Triton at M=6.
  # Warm agg tok/s M=1..5 (2026-09-18): 31 / 55 / 73 / 97 / 117. Bimodal until
  # warmed (cold M=2 ~30 vs warm ~55): one warmup run is not enough.
  parallelSlots: 5
  bindAddress: 0.0.0.0
  # nightly: gfx1201 support landed after v0.27.1; v0.28.0 tag untested.
  # Digest-pinned so Renovate can bump it. Bench any bump with
  # docs/llm-hosting/bench/longctx.py at 4000 AND 50000; classify the gfx1201
  # band first (docs/llm-hosting/gfx1201-fast-slow-band-2026-09-12.md).
  image: vllm/vllm-openai-rocm:nightly@sha256:d5da8f963f0571a171f6817cc108bc2371a39528a11aeba5a00cb78177fcb4e5
  modelCache:
    claimName: qwen38-swift-27b-vllm-model-cache
  vllmConfig:
    # Per-request KV cap; decode cliffs below pool/cap ~1.17x (bisect
    # 2026-08-19: 1.19x 31.5 tok/s, 1.17x 31.7, 1.16x UNSTABLE, 1.14x 18.9).
    # Pool is 304,808 (1.23x). Do not raise without re-bisecting. Engine refuses
    # to boot if pool < cap: re-read "GPU KV cache size" after any
    # --kv-cache-memory, mamba dtype, or image change.
    maxModelLen: 246944
    kvCacheDtype: fp8_e4m3
    # ~27% hit rate under real traffic.
    enablePrefixCaching: true
    # Do not lower: 2048 cost TTFT p50 5s -> 80s (a 20K prompt = 10 prefill
    # steps). Workload is 129:1 prompt:output.
    maxNumBatchedTokens: 4096
    # Inert while --kv-cache-memory is set; drop it together with that flag at
    # the next restart.
    gpuMemoryUtilization: 0.875
  env:
    # Attention = ROCM_AITER_UNIFIED_ATTN (boot log "Overriding with"). Backend
    # comparison: docs/llm-hosting/gfx1201-decode-findings-2026-09-02.md
    - name: VLLM_ROCM_USE_AITER
      value: "1"
    # gfx1201 fast/slow band at exactly 2x (ROCm/ROCm#6347). One queue: fast
    # 80/81 windows vs slow 5/5 without; not a pin.
    - name: GPU_MAX_HW_QUEUES
      value: "1"
    - name: HIP_VISIBLE_DEVICES
      value: "0"
    - name: ROCR_VISIBLE_DEVICES
      value: "0"
    - name: VLLM_CACHE_ROOT
      value: /cache/vllm
    - name: TRITON_CACHE_DIR
      value: /cache/triton
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /cache/inductor
    # Seeds fs-tier block hashes; removing it rehashes and invalidates the whole
    # tier.
    - name: PYTHONHASHSEED
      value: "0"
  extraVolumes:
    - name: compile-cache
      persistentVolumeClaim:
        claimName: qwen38-27b-vllm-compile-cache
    - name: kv-offload
      persistentVolumeClaim:
        claimName: qwen38-27b-vllm-kv-offload
    # = cpu_bytes_to_use + 2Gi; the 64M default EFAULTs on pre-fault. Nothing
    # enforces it.
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 14Gi
    # Raises the W4A16 skinny-GEMM LDS gate to the C++ kernel's real limit.
    - name: lds-gate-patch
      configMap:
        name: lds-gate-patch
    # attn_3d.num_stages 2->1 (2-stage fp8 K+V at head_dim 256 = 64 KiB LDS = a
    # whole CU). 64K M=1: 23.25 -> 29.06 tok/s; TRITON_ATTN backend 1.9 tok/s,
    # not an alternative. Whole-file overlay of a pre-2026-09-15 schema:
    # upstream re-keyed attn_3d by D/DT (aiter #4868) and D_LEQ_256.DT_any_fp8
    # still ships num_stages 2, so on the next image bump re-diff against the
    # image copy or fold this one key into the .pth hook.
    - name: aiter-ua-config
      configMap:
        name: aiter-ua-config
  extraVolumeMounts:
    - name: compile-cache
      mountPath: /cache
    - name: kv-offload
      mountPath: /kvoffload
    - name: dshm
      mountPath: /dev/shm
    # See resources/zz_lds_gate_impl.py. Drop the mount and generator entry once
    # vllm#52619 (open) and the M<=32 tile config (no upstream PR yet) land.
    - name: lds-gate-patch
      mountPath: /usr/local/lib/python3.12/dist-packages/zz_lds_gate.pth
      subPath: zz_lds_gate.pth
      readOnly: true
    - name: lds-gate-patch
      mountPath: /usr/local/lib/python3.12/dist-packages/zz_lds_gate_impl.py
      subPath: zz_lds_gate_impl.py
      readOnly: true
    # Overlays the whole file, so re-diff against the image copy on bumps.
    - name: aiter-ua-config
      mountPath: /usr/local/lib/python3.12/dist-packages/aiter/ops/triton/configs/gfx1201/triton/attention/unified_attention/DEFAULT.json
      subPath: DEFAULT.json
      readOnly: true
  extraArgs:
    # 2nd name is an alias for the litellm-operator's auto-registered
    # LiteLLMModel, which sends model=<InferenceService.spec.modelRef>
    # (llmkube_projection.go), i.e. qwen38-swift-27b-vllm today, so this alias
    # no longer matches; the generated group has no consumers. Fix or drop at
    # the next restart.
    - --served-model-name
    - qwen-3.8
    - qwen38-27b-vllm
    - --trust-remote-code
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_coder
    # NO --long-prefill-token-threshold: 1600 raised stall share 19% -> 37% and
    # single-stream TTFT was unchanged without it (64K 63.4 s vs 64.1).
    # Capture sizes = 1..parallelSlots: the default 512 ceiling OOMs on GDN
    # hybrids (vllm#39010); vLLM pads to the next capture size, so [1,2,4,6] ran
    # M=5 as the all-Triton M=6.
    - --compilation-config
    - '{"cudagraph_capture_sizes": [1, 2, 3, 4, 5]}'
    # Keep prior-turn reasoning in context.
    - --default-chat-template-kwargs
    - '{"preserve_thinking": true}'
    # NO --speculative-config: n-gram corrupts output on GDN hybrids
    # (vllm#39273, hit in prod), DSpark 0.59x, MTP -27..-45% and greedy
    # divergence 4/5 (2026-09-12), EAGLE3/DFlash disable prefix caching
    # (vllm#41640). Re-open only on those fixes; gate in
    # docs/llm-hosting/spec-decode-rejected.md.
    - --mamba-cache-dtype
    - bfloat16
    - --mamba-ssm-cache-dtype
    - bfloat16
    # Both needed: ssm does not inherit on Qwen3.5 (forces fp32); dropping it
    # cost 7,160 KV tokens.
    # 5% (~15K tokens) held free at admission; 117 preemptions/17h before
    # (2026-09-03). Revert if TTFT p50 rises without preemptions falling.
    - --watermark
    - "0.05"
    # 9.5 GiB -> 304,808 KV tokens (33,494 B/token; confirm in the boot log).
    # Reserve 2.48 GiB vs the largest non-vLLM VRAM excursion 1.82 GiB (3d of
    # drm samples); 10 GiB would leave 0.16. Transcodes: 4K DV 0.85 GB,
    # fileflows 0.69 GB; Jellyfin has no concurrency cap (DgpuVramLow).
    - --kv-cache-memory
    - "10200547328"
    # No --language-model-only: Hermes uses the vision tower.
    # CPU tier 12Gi (~385K tokens, ~7 prompts). Revert to 23622320128 (dshm
    # 24Gi, memory 32Gi) if prod_kvtier.py 24h shows external hit ratio < 0.25,
    # fs->cpu share > 20%, async lookup mean > 7.5 s, or TTFT p50 rises.
    # Keep the fs tier: removing it halved single-stream decode (15.5 vs 31
    # tok/s); it keeps eviction async.
    # blocks_per_chunk 4: 8 tried 2026-09-03, total lookup s/request +45% (one
    # serial lookup thread).
    # kv_load_failure_policy is a top-level field; nested it is silently
    # ignored, grep the boot log for the literal.
    - --kv-transfer-config
    - >-
      {"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":12884901888,"blocks_per_chunk":4,"secondary_tiers":[{"type":"fs","root_dir":"/kvoffload","locality":"LOCAL"}]}}
  nodeSelector:
    amd.com/gpu: "true"
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups: [44, 226]
    # RuntimeDefault: ROCm compute (kfd ioctls, /dev/dri, /dev/shm) and the
    # band-detection liveness probe (curl + /sys reads) all pass the default
    # profile. Unconfined was set at the 3.8 cutover (#4509) as a blanket
    # precaution, not to fix a syscall failure. Watch VLLMDecodeStepLatched /
    # TTFT after rollout; revert this one field if serving fails to boot.
    seccompProfile:
      type: RuntimeDefault
  resources:
    cpu: "2"
    # Request AND limit (llmkube >= 0.9.29). tmpfs is charged: 12Gi shm + anon
    # (5.3Gi idle, 5.9Gi at the 4x32K load peak) = ~18Gi.
    memory: 24Gi
  endpoint:
    port: 8000
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 15
      failureThreshold: 240
    # Startup owns the load window. (1) /health with 20x30s slack, counted in
    # /tmp because failureThreshold must stay 1 for (2). (2) gfx1201 slow band:
    # with exactly 1 request decoding and sclk >= 3100 (prefill sits at
    # 2480-2800), mem_busy reads ~81 fast / ~40 slow; 8 samples under 25% fast
    # fails. Only card1 has the counter. Same fault as VLLMDecodeStepLatched in
    # prometheusrule.yaml; the probe is the remedy, the alert the backstop.
    liveness:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            f=/tmp/band; g=/sys/class/drm/card1/device
            sclk_min=3100; busy_min=60; window=8; fast_min_pct=25
            if ! curl -sf -m 8 -o /dev/null localhost:8000/health; then
              n=$$(( $$(cat "$$f".fail 2>/dev/null || echo 0) + 1 )); echo "$$n" > "$$f".fail
              [ "$$n" -ge 20 ] && exit 1; exit 0
            fi
            rm -f "$$f".fail
            running=$$(curl -s -m 8 localhost:8000/metrics | awk '/^vllm:num_requests_running\{/{print $$2}')
            sclk=$$(awk '/\*/{sub(/Mhz/,"",$$2); print $$2}' $$g/pp_dpm_sclk)
            [ "$$running" = "1.0" ] && [ "$${sclk:-0}" -ge "$$sclk_min" ] || exit 0
            [ "$$(cat $$g/mem_busy_percent)" -ge "$$busy_min" ] && echo 1 >> "$$f" || echo 0 >> "$$f"
            tail -n "$$window" "$$f" > "$$f".new && mv "$$f".new "$$f"
            n=$$(wc -l < "$$f"); fast=$$(grep -c 1 "$$f")
            [ "$$n" -ge "$$window" ] || exit 0
            if [ $$((fast * 100)) -lt $$((n * fast_min_pct)) ]; then echo "slow band: $$fast/$$n solo samples fast" >&2; exit 1; fi
      # 2/5 spawns read slow in minute 1; 900s is ~10 min past the ~4 min
      # startup.
      initialDelaySeconds: 900
      periodSeconds: 30
      timeoutSeconds: 20
      failureThreshold: 1
    readiness:
      tcpSocket:
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6

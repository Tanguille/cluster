---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-27b-vllm-model-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 50Gi
---
# Persist torch, Triton, and Inductor compile caches across restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-27b-vllm-compile-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 10Gi
---
# L3 tier for the fs secondary tier -- the vLLM analogue of SGLang's HiCache
# file backend. Ported from qwen36-27b-vllm.yaml: proven pattern, same
# hardware, same GPU-memory ceiling.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-27b-vllm-kv-offload
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    # hostpath enforces no quota, so the real bound is the free-space guard below.
    requests:
      storage: 128Gi
---
# vLLM's fs tier has no evictor at v0.27.1, and this node's root fs is shared with
# rook-ceph's mon store, so the tier needs an external one.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qwen38-27b-vllm-kv-offload-guard
spec:
  # Hourly, not daily: a daily window let a busy day cross the floor and sit
  # there for hours. Safe to run this often only because eviction is now
  # incremental (see the script) rather than a full wipe.
  # ponytail: periodic sweep, not a hard cap -- move to a quota-enforcing
  # storage class if the floor is ever actually breached.
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            # The serving pod runs runAsUser 0, so the store is root-owned on disk.
            runAsUser: 0
          containers:
            - name: guard
              image: ghcr.io/home-operations/busybox:1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  # $$ throughout: Flux postBuild envsubst substitutes bare $VAR.
                  set -eu
                  # 80Gi, not the 160Gi this started as: unreachable on a 500G
                  # disk with ~370G held elsewhere, so the guard wiped the whole
                  # tier every run. The prefix-hit rate needs the store to survive.
                  floor=83886080
                  # df, not du: the store reaches hundreds of thousands of files.
                  avail="$$(df -kP /kvoffload | awk 'NR==2{print $$4}')"
                  echo "avail: $${avail}K (floor: $${floor}K)"
                  if [ "$$avail" -ge "$$floor" ]; then
                    echo "above floor, nothing to do"
                    exit 0
                  fi
                  # Oldest-first, not a wipe: blocks are write-once so mtime is
                  # real recency. Walk down only until back above the floor.
                  for age in 30 14 7 3 1 0; do
                    find /kvoffload -type f -mtime +$$age -delete 2>/dev/null || true
                    avail="$$(df -kP /kvoffload | awk 'NR==2{print $$4}')"
                    echo "evicted >$${age}d, avail now $${avail}K"
                    if [ "$$avail" -ge "$$floor" ]; then
                      exit 0
                    fi
                  done
                  # Still short with only <24h blocks left: the shortfall is
                  # elsewhere on the shared fs. Fail loudly -- a guard that
                  # silently misses its floor reads healthy until the node fills.
                  echo "floor unreachable: $${avail}K < $${floor}K, only <24h blocks left" >&2
                  exit 1
              volumeMounts:
                - name: kv-offload
                  mountPath: /kvoffload
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: kv-offload
              persistentVolumeClaim:
                claimName: qwen38-27b-vllm-kv-offload
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-27b-vllm
spec:
  # philbert g128 over cyankiwi g32: ignore lists match on 311/313 entries, so
  # group_size is the only material difference. 1.5 GB smaller, and the only
  # build documenting thinking-mode calibration (llm-compressor #2680 corrupts
  # <think> without it; thinking is on by default here).
  # Pinned to the 2026-08-15 tokenizer fix; earlier revisions 400 on image input.
  source: hf://philbert440/Qwen3.8-27B-W4A16-AWQ@7908d42a71077a5e4dc458f273682b12dfe384a0
  format: safetensors
  quantization: compressed-tensors
  refreshPolicy: OnChange
  files:
    - model-00001-of-00005.safetensors
    - model-00002-of-00005.safetensors
    - model-00003-of-00005.safetensors
    - model-00004-of-00005.safetensors
    - model-00005-of-00005.safetensors
    - model.safetensors.index.json
    - config.json
    - generation_config.json
    - tokenizer.json
    - tokenizer_config.json
    - chat_template.jinja
    - merges.txt
    - vocab.json
    - preprocessor_config.json
    - video_preprocessor_config.json
  hardware:
    accelerator: rocm
    memoryBudget: 28Gi
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
      resourceName: squat.ai/dri
      memory: 32Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
# concsweep.py, warm, agg tok/s vs the SGLang qwen-3.6 baseline (conc 1/8/16):
# 14.88/53.93/100.82 vs 14.96/36.24/34.49. Bench warm only -- cold reads ~12.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen38-27b-vllm
spec:
  modelRef: qwen38-27b-vllm
  runtime: vllm
  replicas: 1
  # Matches the proven qwen36 production concurrency ceiling; operator
  # translates this to --max-num-seqs for the vllm runtime.
  parallelSlots: 16
  bindAddress: 0.0.0.0
  # Commit-tagged nightly, not the rolling `nightly` tag.
  # v0.27.1 is the newest release and predates gfx1201 support.
  image: vllm/vllm-openai-rocm:nightly-5a4c8d99242e9e069b604d0e9b969e77f7dd501d@sha256:5ea7099b53cdf9049ddcd446f15d831f32bce06c2822d6f8f228b819f189fc48
  modelCache:
    claimName: qwen38-27b-vllm-model-cache
  vllmConfig:
    # The only per-request cap on KV blocks, so it decides how much of the pool
    # a single session can hold. Headroom, not a working size -- Hermes peaks at
    # 112K and p90 prompts are 20K, and normal concurrency is unaffected
    # because KV is paged and allocated on demand.
    #
    # A decode-performance ceiling, NOT a pool-matching value: the pool is
    # 287,159 tokens (1.30x this cap) and that margin is deliberate. DO NOT
    # raise this toward the model's 262,144 limit -- 262,144 measured ~half the
    # single-stream decode (15.8-17.1 vs 29.7-32.0 tok/s), confirmed by exact
    # revert; mechanism unexplained. Production prompts are 47-56K anyway.
    #
    # If the pool ever shrinks below this cap the engine refuses to start
    # rather than silently truncating. Re-read "GPU KV cache size" from the
    # boot log after ANY of: --kv-cache-memory, the mamba cache dtypes, the
    # attention block size, or a vLLM image bump -- and check by hand, since
    # Renovate cannot order a commit-tagged nightly and will not open that PR.
    maxModelLen: 221612
    kvCacheDtype: fp8_e4m3
    # Confirmed working on this hybrid Mamba/GDN model (~27% hit rate under
    # real traffic on the sibling qwen36 config).
    enablePrefixCaching: true
    # Do NOT lower this to buy transcode headroom: 2048 was tried and cost
    # 4-16x TTFT (p50 5s -> 80s, avg 13.8s -> 58.5s) because a 20K-token
    # prompt then needs 10 prefill steps instead of 5 and decode starves
    # behind them. This workload is prefill-bound (129:1 prompt:output).
    maxNumBatchedTokens: 4096
    # INERT while --kv-cache-memory is set below (vLLM skips profiling and logs
    # that it ignores this); kept only so dropping that flag falls back to a
    # sane value. The media-reserve math lives with that flag, not here.
    gpuMemoryUtilization: 0.875
  env:
    # Inert for attention: with a KV connector set, rocm.py:703 rejects
    # ROCM_AITER_UNIFIED_ATTN and selects TRITON_ATTN. FP8 linear kernels do
    # not apply to W4A16 either. Kept for the GDN linear-attn path.
    # Forcing AITER attention measured +84% decode but ~10x worse prefill.
    - name: VLLM_ROCM_USE_AITER
      value: "1"
    - name: HIP_VISIBLE_DEVICES
      value: "0"
    - name: ROCR_VISIBLE_DEVICES
      value: "0"
    - name: VLLM_CACHE_ROOT
      value: /cache/vllm
    - name: TRITON_CACHE_DIR
      value: /cache/triton
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /cache/inductor
    # Pins the fs tier's block-hash seed; unset it is random per process and restarts lose it.
    - name: PYTHONHASHSEED
      value: "0"
  extraVolumes:
    - name: compile-cache
      persistentVolumeClaim:
        claimName: qwen38-27b-vllm-compile-cache
    - name: kv-offload
      persistentVolumeClaim:
        claimName: qwen38-27b-vllm-kv-offload
    # The CPU offload tier mmaps cpu_bytes_to_use here; the 64M default
    # EFAULTs on pre-fault. Keep this at cpu_bytes_to_use + 2Gi. Nothing
    # enforces that -- the kv-offload-guard CronJob only sweeps /kvoffload.
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 24Gi
  extraVolumeMounts:
    - name: compile-cache
      mountPath: /cache
    - name: kv-offload
      mountPath: /kvoffload
    - name: dshm
      mountPath: /dev/shm
  extraArgs:
    # First name is what vLLM reports back as `model`, so qwen-3.8 stays
    # primary. The second is an alias: the operator derives a LiteLLMModel from
    # this InferenceService's own name and has no field to override it, so
    # without the alias that generated model group sends model=qwen38-27b-vllm
    # and vLLM 404s it (verified 2026-08-17). Keep it in sync with metadata.name.
    - --served-model-name
    - qwen-3.8
    - qwen38-27b-vllm
    - --trust-remote-code
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_coder
    # Qwen3.5-family GDN hybrids OOM during CUDA-graph capture at vLLM's
    # default 512-size ceiling regardless of gpuMemoryUtilization/
    # enablePrefixCaching (vLLM #39010 on gfx1201). Cap capture sizes to the
    # production concurrency ceiling (16) instead of disabling graphs
    # outright, to keep decode throughput on par with 3.6.
    # Also fixes a real crash, not just perf: hybrid Mamba/GDN cache only had
    # 71 blocks available at this budget, and vLLM's default max-num-seqs
    # (256) overshoots it — spec.parallelSlots above must stay <= that.
    - --compilation-config
    - '{"cudagraph_capture_sizes": [1, 2, 4, 8, 16]}'
    # Keep prior-turn reasoning in context; matches production qwen36 config.
    - --default-chat-template-kwargs
    - '{"preserve_thinking": true}'
    # MTP speculative decoding is deliberately OMITTED: measured on this
    # hardware, MTP + tool-calling grammar wedges to ~0.2 tok/s (100x
    # regression) under concurrent tool traffic. Re-test that wedge before
    # re-adding.
    # Separate pools, both needed -- ssm does NOT inherit from the other on
    # Qwen3.5 (its config forces auto to fp32). Dropping it cost 7,160 KV
    # tokens and halved the CPU tier. bfloat16 is vLLM's floor for either.
    - --mamba-cache-dtype
    - bfloat16
    - --mamba-ssm-cache-dtype
    - bfloat16
    # Skips profiling, so this -- not gpuMemoryUtilization -- sizes KV. The
    # profiler was conservative: 3.22 GiB, which forced the old 98K ceiling.
    # Sized against a 2 GiB transcode reserve, not the old 4.6 GB guess, which
    # was never measured. Measured separately 2026-08-17 (drm VRAM): a 4K Dolby
    # Vision transcode 0.85 GB, fileflows 0.69 GB -- 1.54 GB if they ever peak
    # together, which was not observed but is the number the reserve must cover.
    # Jellyfin has no transcode concurrency cap, so a third stream would exceed
    # 2 GiB and evict KV; see the DgpuVramLow alert. Measured free at this
    # config: 2.57 GB at peak load (was 2.81 GB at 7 GiB) -- this raise spends
    # 0.24 GB of that reserve. Pool 223,172 -> 287,159 tokens, concurrency
    # 1.01x -> 1.30x. Retention benefit NOT yet measured.
    - --kv-cache-memory
    - "9663676416"
    # Hierarchical KV cache: CPU tier (matches SGLang's --hicache-ratio sizing
    # philosophy) + fs tier (SGLang's file backend analogue). Ported from
    # qwen36-27b-vllm.yaml, WITHOUT that config's --language-model-only —
    # Hermes' auxiliary.vision block actively uses this model's vision tower,
    # so it must stay loaded even though that costs some context headroom.
    # CPU tier 22Gi: the 16Gi tier cascaded 3.5 GB/hour to the fs tier, i.e.
    # eviction pressure. Benefit NOT yet validated -- needs a restart-free
    # window, since this tier is an emptyDir tmpfs that every restart wipes.
    # Roll back to 17179869184 (16Gi, dshm 18Gi, memory 32Gi) if after a 24h
    # restart-free soak vllm:external_prefix_cache_hits_total/queries_total has
    # not beaten its 0.5333 pre-change baseline, or if control-1 shows memory
    # pressure or OOMKills.
    # DO NOT remove the fs secondary tier to save Ceph writes: its 4.5% hit
    # rate is not its job. Removing it halved single-stream decode (15.5 vs
    # 31 tok/s, exact-revert confirmed) -- it keeps eviction asynchronous.
    - --kv-transfer-config
    - >-
      {"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":23622320128,"secondary_tiers":[{"type":"fs","root_dir":"/kvoffload","locality":"LOCAL"}]}}
  nodeSelector:
    amd.com/gpu: "true"
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups: [44, 226]
    seccompProfile:
      type: Unconfined
  resources:
    cpu: "2"
    # tmpfs is charged here, so this tracks cpu_bytes_to_use: 28.3Gi peak
    # under 4x32K concurrent load with the tier full (7.7Gi headroom).
    # Headroom kept for the load spike rather than trimmed -- an OOMKill
    # mid-load throws away the compile cache this node takes ~40min to
    # rebuild.
    memory: 36Gi
  endpoint:
    port: 8000
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 15
      failureThreshold: 240
    # Startup owns the load/compile window, so this only ever sees a serving
    # engine. Slack on purpose: a restart costs ~2min, so only a 10-minute
    # outage (20 x 30s) counts as death.
    liveness:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 20
    readiness:
      tcpSocket:
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6

---
# hostpath: size unenforced and unraisable (the .rad is 18.6 GB); control-1 free disk is the limit.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radiance-engine-rad
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 24Gi
---
# Converts the checkpoint into a .rad (~45 s); Flux recreates the Job when its image or the Model source changes, which reconverts.
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-27b-rad-convert
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: convert
          image: docker.io/stilldeadcode/radiance:1.15.1@sha256:cccbc0bd6bfef1441e8fcf3ca8d10313d4e6d18a03d9c6ede3bcb15d95376668
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Filled from the Model's spec.source by the replacement in kustomization.yaml.
            - name: MODEL_SOURCE
              value: replaced
            # The InferenceService's image, by the same replacement.
            - name: ENGINE_IMAGE
              value: replaced
          command:
            - /bin/sh
            - -c
            - |
              # Flux postBuild envsubst context: bare $VAR -> $$.
              set -eu
              # The operator caches the Model under sha256(source)[:16]; the last file it lists marks a finished download.
              src=/models/$$(printf %s "$$MODEL_SOURCE" | sha256sum | cut -c1-16)
              # Named by revision and engine digest (see --model).
              out=/out/swift15-27b-w4a16-awq.$${MODEL_SOURCE##*@}.$${ENGINE_IMAGE##*:}.rad
              # activeDeadlineSeconds bounds the wait.
              until [ -f "$$src/video_preprocessor_config.json" ]; do echo "waiting for $$src" >&2; sleep 10; done
              rad-convert "$$src" --recipe /opt/radiance/share/radiance/recipes/q38-27b-w4a16.recipe -o "$$out.tmp"
              mv "$$out.tmp" "$$out"
              # Also a failed run's .tmp; a running pod keeps an unlinked file open until it restarts.
              find /out -maxdepth 1 -name '*.rad*' ! -path "$$out" -delete
              ls -l /out
          resources:
            # control-1 has ~2.2 GiB requestable beside the 32Gi engine; conversions peaked at 1.15 GiB working set
            # (coarse samples of a 45 s run).
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: src
              mountPath: /models
              readOnly: true
            - name: out
              mountPath: /out
      volumes:
        - name: src
          persistentVolumeClaim:
            claimName: qwen38-swift-27b-vllm-model-cache
            readOnly: true
        - name: out
          persistentVolumeClaim:
            claimName: radiance-engine-rad
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen38-27b-vllm
spec:
  modelRef: qwen38-swift-27b-vllm
  # radiance in the vllm runtime's own-launcher mode (command set): the ModelRouter maps only llamacpp and vllm.
  runtime: vllm
  command: [radiance]
  parallelSlots: 8
  # After a bump, run bench/qualitygate.py on an unrouted clone (baseline: docs/llm-hosting/radiance-2026-11.md).
  image: docker.io/stilldeadcode/radiance:1.15.1@sha256:cccbc0bd6bfef1441e8fcf3ca8d10313d4e6d18a03d9c6ede3bcb15d95376668
  # Roll only when vllm:num_requests_running is 0, else after 15 min.
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 900
  modelCache:
    claimName: qwen38-swift-27b-vllm-model-cache
  extraVolumes:
    - name: qwen38-sharp-chat-template
      configMap:
        name: qwen38-sharp-chat-template
    - name: rad
      persistentVolumeClaim:
        claimName: radiance-engine-rad
        readOnly: true
  extraVolumeMounts:
    # Our own path, so it survives modelRef changes.
    - name: qwen38-sharp-chat-template
      mountPath: /chat-templates/chat_template.jinja
      subPath: chat_template.jinja
      readOnly: true
    - name: rad
      mountPath: /rad
      readOnly: true
  # Read by the router for the served name, so every flag lives here.
  extraArgs:
    # kustomization.yaml fills in the checkpoint revision and the engine digest, so a pod never serves a .rad
    # from another checkpoint or engine: after a bump it fails until the Job writes this one. It targets
    # extraArgs.1, so keep --model first.
    - --model
    - /rad/swift15-27b-w4a16-awq.revision.engine.rad
    - --served-model-name
    - qwen-3.8
    - --max-num-seqs
    - "8"
    - --max-model-len
    - "262144"
    # Prefix hits resume on 2048-token chunks, so the batch size is also the resume granularity.
    - --max-num-batched-tokens
    - "2048"
    # K in E4M3, V in int4: ~0.78x the fp8 cost per token at the same KL.
    - --kv-cache-dtype
    - fp8_v4
    # Leaves 2.5 GiB VRAM free for Jellyfin (floor 1.82 GiB); the engine sizes the KV pool from the rest.
    - --gpu-headroom-mib
    - "2560"
    # Shared card: no weight-prefetch ring.
    - --weight-prefetch
    - "off"
    # NO speculation: it stalls at 8 sessions (docs/llm-hosting/radiance-2026-11.md).
    - --num-speculative-tokens
    - "0"
    # The 3600 s default drops idle sessions that vLLM kept until the memory was wanted.
    - --prefix-cache-ttl
    - "0"
    # Host KV tier, pinned in node RAM; there is no disk tier.
    - --prefix-cache-mib
    - "20480"
    # One state snapshot per session; the default capped the cache at ~6 sessions of 100K.
    - --checkpoint-policy
    - tip-only
    # 16 auto slots overflowed (store_full) under 8 agent sessions.
    - --checkpoint-slots
    - "32"
    # A resumed turn re-prefills up to one chunk less; a hit is no longer bit-identical to a cold run.
    - --prefix-resume
    - nearest
    # Tower read over the link once per image (~55 ms); its 0.86 GiB of VRAM goes to the KV pool.
    - --vision-tower-placement
    - ram
    # Sharp template over the container's; highest-priority source.
    - --override-chat-template
    - /chat-templates/chat_template.jinja
    # Keep prior-turn reasoning in context.
    - --chat-template-kwargs
    - '{"preserve_thinking": true}'
  nodeSelector:
    amd.com/gpu: "true"
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups: [44, 226]
    # The engine needs io_uring and NUMA binding.
    seccompProfile:
      type: Unconfined
  resources:
    cpu: "2"
    # Pins 28.6 GiB (engine log): 20 tier + 4.6 checkpoints + 2.4 embedding + 0.9 vision tower + runtime.
    memory: 32Gi
  endpoint:
    port: 8000
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 180
    # No slow-band restart probe: none seen on radiance; LLMDecodeStepLatched pages instead.
    liveness:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 10
    readiness:
      tcpSocket:
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-ingress-allowlist
  namespace: ai
# Policies are additive; app rules below union with the ToolHive/inference policies.
specs:
  # Default-deny both directions for every pod, including Jobs. The qwen38-27b-vllm
  # kv-offload-guard and compile-cache-prune CronJobs need only this DNS egress.
  - endpointSelector: {}
    ingress:
      # kubelet probes.
      - fromEntities:
          - host
      # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is ephemeral not 53.
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
    egress:
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        io.kubernetes.pod.namespace: ai
        gateway.networking.k8s.io/gateway-name: agentgateway
    ingress:
      - fromEndpoints:
          - &hermes
            matchLabels:
              io.kubernetes.pod.namespace: ai
              app.kubernetes.io/instance: hermes
          - matchLabels:
              io.kubernetes.pod.namespace: ai
              app.kubernetes.io/instance: opencode
          - &memini
            matchLabels:
              io.kubernetes.pod.namespace: ai
              app.kubernetes.io/instance: memini
          - &unified
            matchLabels:
              io.kubernetes.pod.namespace: ai
              app: virtualmcpserver
              app.kubernetes.io/instance: unified
          - matchLabels:
              io.kubernetes.pod.namespace: default
              app.kubernetes.io/instance: karakeep
          - matchLabels:
              io.kubernetes.pod.namespace: kritika
              app.kubernetes.io/name: kritika
          - matchLabels:
              io.kubernetes.pod.namespace: security
              app.kubernetes.io/name: kguardian-llm-bridge
          - &envoy-internal
            matchLabels:
              io.kubernetes.pod.namespace: network
              gateway.networking.k8s.io/gateway-name: envoy-internal
        toPorts: &tcp-4000
          - ports:
              - port: "4000"
                protocol: TCP
      - fromEndpoints:
          - &headroom
            matchLabels:
              io.kubernetes.pod.namespace: ai
              app.kubernetes.io/instance: headroom
          - &agentgateway
            matchLabels:
              io.kubernetes.pod.namespace: ai
              gateway.networking.k8s.io/gateway-name: agentgateway
        toPorts: &tcp-8080
          - ports:
              - port: "8080"
                protocol: TCP
      - fromEndpoints:
          - *envoy-internal
        toPorts:
          - ports:
              - port: "15000"
                protocol: TCP
      - fromEndpoints:
          - &vmagent
            matchLabels:
              io.kubernetes.pod.namespace: observability
              app.kubernetes.io/name: vmagent
        toPorts:
          - ports:
              - port: "15020"
                protocol: TCP
    egress:
      - toEndpoints:
          - *headroom
        toPorts: &tcp-8787
          - ports:
              - port: "8787"
                protocol: TCP
      - toEndpoints:
          - *agentgateway
          - matchLabels:
              io.kubernetes.pod.namespace: ai
              app.kubernetes.io/instance: embedding-cache
          - &reranker
            matchLabels:
              io.kubernetes.pod.namespace: ai
              inference.llmkube.dev/service: bge-reranker-v2-m3
          - &embedder
            matchLabels:
              io.kubernetes.pod.namespace: ai
              inference.llmkube.dev/service: embeddinggemma-2
          - matchLabels:
              io.kubernetes.pod.namespace: ai
              inference.llmkube.dev/service: qwen35-2b
        toPorts: *tcp-8080
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: ai
              inference.llmkube.dev/service: qwen38-27b-vllm
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: ai
              app.kubernetes.io/instance: omniroute
        toPorts: &tcp-20128
          - ports:
              - port: "20128"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: network
              app.kubernetes.io/name: agentgateway
        toPorts:
          - ports:
              - port: "9978"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        io.kubernetes.pod.namespace: ai
        # HEADROOM_OFFLINE=1: historic HTTPS remains an audit question.
        app.kubernetes.io/instance: headroom
    ingress:
      - fromEndpoints:
          - *agentgateway
          - *vmagent
        toPorts: *tcp-8787
    egress:
      - toEndpoints:
          - *agentgateway
        toPorts: *tcp-8080
  - endpointSelector:
      matchLabels:
        io.kubernetes.pod.namespace: ai
        app.kubernetes.io/instance: embedding-cache
    ingress:
      - fromEndpoints:
          - *agentgateway
        toPorts: *tcp-8080
    egress:
      - toEndpoints:
          - *embedder
        toPorts: *tcp-8080
  - endpointSelector:
      matchLabels:
        io.kubernetes.pod.namespace: ai
        app.kubernetes.io/instance: memini
    ingress:
      - fromEndpoints:
          - *hermes
          - *unified
        toPorts: *tcp-8080
      - fromEndpoints:
          - *envoy-internal
        toPorts:
          - ports:
              - port: "8081"
                protocol: TCP
      - fromEndpoints:
          - *vmagent
        toPorts:
          - ports:
              - port: "9090"
                protocol: TCP
    egress:
      - toEndpoints:
          - *agentgateway
        toPorts: *tcp-4000
      - toEndpoints:
          - *reranker
        toPorts: *tcp-8080
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: database
              cnpg.io/poolerName: pgbouncer-rw
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        io.kubernetes.pod.namespace: ai
        app.kubernetes.io/instance: omniroute
    ingress:
      - fromEndpoints:
          - *agentgateway
          - *envoy-internal
        toPorts: *tcp-20128
    egress:
      - &internet-https
        toEntities:
          - world
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        io.kubernetes.pod.namespace: ai
        # SSH and unresolved ports 1925/4096 require owner-approved destinations.
        # Do not infer an allow from a historical address or the stale Unpackerr port.
        app.kubernetes.io/instance: hermes
    ingress:
      - fromEndpoints:
          - *envoy-internal
        toPorts:
          - ports:
              - port: "9119"
                protocol: TCP
    egress:
      - toEndpoints:
          - *unified
        toPorts: &tcp-4483
          - ports:
              - port: "4483"
                protocol: TCP
      - toEndpoints:
          - *agentgateway
        toPorts: *tcp-4000
      - toEndpoints:
          - *memini
          - *reranker
        toPorts: *tcp-8080
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: media
              app.kubernetes.io/instance: unpackerr
        toPorts:
          - ports:
              - port: "5656"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: observability
              app.kubernetes.io/name: vmsingle
        toPorts:
          - ports:
              - port: "8428"
                protocol: TCP
      # In-cluster HTTPS goes through envoy-internal, which world does not match.
      - toEndpoints:
          - *envoy-internal
        toPorts:
          - ports:
              - port: "10443"
                protocol: TCP
      - toServices:
          - k8sService:
              serviceName: external-homeassistant
              namespace: network
        toPorts:
          - ports:
              - port: "8123"
                protocol: TCP
      - &internet-http
        toEntities:
          - world
        toPorts:
          - ports:
              - port: "80"
                protocol: TCP
              - port: "443"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        io.kubernetes.pod.namespace: ai
        app.kubernetes.io/instance: opencode
    ingress:
      - fromEndpoints:
          - *envoy-internal
        toPorts:
          - ports:
              - port: "4096"
                protocol: TCP
    egress:
      - toEndpoints:
          - *unified
        toPorts: *tcp-4483
      - toEndpoints:
          - *agentgateway
        toPorts: *tcp-4000
      - *internet-http
  - endpointSelector:
      matchLabels:
        io.kubernetes.pod.namespace: ai
        # Controller API access and observed model/provider metadata downloads.
        app.kubernetes.io/name: llmkube
    ingress:
      - fromEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "9443"
                protocol: TCP
      - fromEndpoints:
          - *vmagent
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
    egress:
      - &kube-api
        toEntities:
          - kube-apiserver
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
              - port: "6443"
                protocol: TCP
      - *internet-https
  - endpointSelector:
      matchLabels:
        # Kopiur reads its job/config API. NFS mounts are performed by the node.
        app.kubernetes.io/managed-by: kopiur
    egress:
      - *kube-api
  - endpointSelector:
      matchLabels:
        # Scheduled rollout restart; do not depend on a particular Job/pod name.
        io.cilium.k8s.policy.serviceaccount: vmcp-restart
    egress:
      - *kube-api

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-ingress-allowlist
  namespace: ai
spec:
  # Default-deny ingress for every pod in the namespace. The per-pod allowlists (vmcp,
  # MCP proxies/backends, inference pods) stay and union with this one. Egress
  # stays default-allow.
  # Excludes the Semantic Router, whose own policy admits only agentgateway.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [semantic-router]
  ingress:
    # Namespaces that consume *.ai.svc (grep '\.ai\.svc' across the repo):
    # default = karakeep -> agentgateway; observability = vmagent scrapes +
    # gatus probes; security = kguardian llm-bridge -> agentgateway;
    # network = envoy-internal fronting the HTTPRoutes; ai = intra-namespace.
    # kritika = review, confidence and embedding models through agentgateway on :4000.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
        - matchLabels:
            io.kubernetes.pod.namespace: default
        - matchLabels:
            io.kubernetes.pod.namespace: kritika
        - matchLabels:
            io.kubernetes.pod.namespace: observability
        - matchLabels:
            io.kubernetes.pod.namespace: security
        - matchLabels:
            io.kubernetes.pod.namespace: network
        # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is
        # ephemeral not 53.
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
    - fromEntities:
        # kubelet probes.
        - host
        # llmkube admission webhooks.
        - kube-apiserver

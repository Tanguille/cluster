---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-ingress-allowlist
  namespace: ai
spec:
  # Default-deny ingress for every pod in the namespace; egress stays default-allow. Allows
  # union, so a narrower per-pod allow enforces nothing here: only a deny fences inside this
  # list (toolhive-ingress-deny).
  endpointSelector: {}
  ingress:
    # Namespaces that consume *.ai.svc (grep '\.ai\.svc' across the repo):
    # default = karakeep -> agentgateway; observability = vmagent scrapes +
    # gatus probes; security = kguardian llm-bridge -> agentgateway;
    # network = envoy-internal fronting the HTTPRoutes; ai = intra-namespace.
    # kritika = review and embedding models through agentgateway on :4000.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
        - matchLabels:
            io.kubernetes.pod.namespace: default
        - matchLabels:
            io.kubernetes.pod.namespace: kritika
        - matchLabels:
            io.kubernetes.pod.namespace: observability
        - matchLabels:
            io.kubernetes.pod.namespace: security
        - matchLabels:
            io.kubernetes.pod.namespace: network
    - fromEntities:
        # llmkube admission webhooks.
        - kube-apiserver

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: semantic-router
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: semantic-router
  postRenderers:
    - kustomize:
        patches:
          # The chart has no strategy value, and the model cache PVC is RWO.
          - target:
              kind: Deployment
              name: semantic-router
            patch: |-
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
          # Without its applied-revision annotation the chart never reuses the live config,
          # so every upgrade renders configOverride from Git.
          - target:
              kind: ConfigMap
              name: semantic-router-config
            patch: |-
              - op: remove
                path: /metadata/annotations/semantic-router.vllm.ai~1chart-config-revision
  values:
    image:
      tag: 5bd7c69419487a783cbce18dfd41f707441a1b85@sha256:6f6a2cd99677dedff4bbb7fdc41fb5597b8e8980489f8070eb741ffb0b8236c7
    resources:
      requests:
        cpu: 500m
        # d3-nano BF16: 4.65Gi steady RSS, 7.35Gi load peak.
        memory: 6Gi
      limits:
        cpu: "4"
        memory: 10Gi
    extraEnv:
      # The router keeps half the cores for a second worker; D3 is the only one.
      - name: VLLM_SRUN_CPU_THREADS
        valueFrom:
          resourceFieldRef:
            resource: limits.cpu
    persistence:
      storageClassName: ceph-block
    # Serve only ExtProc (50051) behind agentgateway; no OpenAI listener of its own.
    gateway:
      mode: extproc
    configMap:
      # Must differ from the (stripped) live annotation; see the postRenderer.
      applyValuesRevision: git
    # Picks the model for `vllm-sr/auto`; see agentgateway/app/models/vllm-sr-auto.yaml.
    configOverride:
      providers:
        defaults:
          model: qwen-3.8
        models:
          - name: qwen-3.8
            backend_refs: &agentgateway
              - endpoint: agentgateway.ai.svc.cluster.local:4000
          - name: qwen-3.8-fast
            backend_refs: *agentgateway
      routing:
        signals:
          decision:
            - name: direct_answer
              deployment: d3
              question:
                type: noul
                instructions: Can this request be answered directly, without multi-step reasoning, debugging, coding or planning?
              predicate:
                gte: 0.85
              timeout_ms: 3000
        # Thinking stays on unless D3 is confident; a late or failed answer keeps qwen-3.8.
        decisions:
          - name: fast
            priority: 200
            rules:
              type: decision
              name: direct_answer
              on_unknown: no_match
            modelRefs:
              - model: qwen-3.8-fast
          - name: default
            priority: 100
            modelRefs:
              - model: qwen-3.8
      global:
        model_catalog:
          deployments:
            d3:
              provider: model_runtime
              artifact: vllm-sr/d3-nano
              revision: aeb70d4dd53ed25b855c3b0a66394b8fe265db7f
              device: cpu

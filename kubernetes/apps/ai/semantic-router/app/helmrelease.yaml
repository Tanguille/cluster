---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: semantic-router
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: semantic-router
  postRenderers:
    - kustomize:
        patches:
          # The chart has no strategy value, and the model cache PVC is RWO.
          - target:
              kind: Deployment
              name: semantic-router
            patch: |-
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
          # Without its applied-revision annotation the chart never reuses the live config,
          # so every upgrade renders configOverride from Git.
          - target:
              kind: ConfigMap
              name: semantic-router-config
            patch: |-
              - op: remove
                path: /metadata/annotations/semantic-router.vllm.ai~1chart-config-revision
  values:
    image:
      tag: nightly-20261026@sha256:f6107cfbb35dc89f0ea752ab8ae1882ca654031151f182804f78cf827843811d
    resources:
      requests:
        cpu: 500m
        # d3-nano BF16: 4.65Gi steady RSS, 7.35Gi load peak.
        memory: 6Gi
      limits:
        cpu: "4"
        memory: 10Gi
    extraEnv:
      # The router keeps half the cores for a second worker; D3 is the only one.
      - name: VLLM_SRUN_CPU_THREADS
        valueFrom:
          resourceFieldRef:
            resource: limits.cpu
    persistence:
      storageClassName: ceph-block
    # Serve only ExtProc (50051) behind agentgateway; no OpenAI listener of its own.
    gateway:
      mode: extproc
    configMap:
      # Must differ from the (stripped) live annotation; see the postRenderer.
      applyValuesRevision: git
    # Picks the reasoning effort for `vllm-sr/auto`; see agentgateway/app/models/vllm-sr-auto.yaml.
    configOverride:
      providers:
        defaults:
          model: qwen-3.8
        models:
          - name: qwen-3.8
            # Qwen3.8's chat template reads chat_template_kwargs.reasoning_effort: low, medium or xhigh.
            reasoning:
              type: reasoning_effort
              parameter: reasoning_effort
              levels: [low, medium, xhigh]
              default: medium
            backend_refs:
              - endpoint: agentgateway.ai.svc.cluster.local:4000
      routing:
        signals:
          decision:
            - name: effort
              deployment: d3
              question:
                type: choice
                instructions: How much reasoning does a good answer to this request need?
                choices:
                  - key: low
                    description: A greeting, short factual answer or one clearly specified action
                  - key: medium
                    description: An ordinary question, explanation or routine tool use
                  - key: xhigh
                    description: Coding, debugging, planning, mathematics or hard analysis
              timeout_ms: 3000
        # Underthinking costs quality and overthinking only time, so low needs more confidence.
        # A late or failed answer keeps medium.
        decisions:
          - name: low
            priority: 300
            rules:
              type: decision
              name: effort
              label: low
              predicate:
                gte: 0.85
              on_unknown: no_match
            modelRefs:
              - model: qwen-3.8
                use_reasoning: true
                reasoning_effort: low
          - name: xhigh
            priority: 200
            rules:
              type: decision
              name: effort
              label: xhigh
              predicate:
                gte: 0.6
              on_unknown: no_match
            modelRefs:
              - model: qwen-3.8
                use_reasoning: true
                reasoning_effort: xhigh
          - name: medium
            priority: 100
            modelRefs:
              - model: qwen-3.8
                use_reasoning: true
                reasoning_effort: medium
      global:
        model_catalog:
          deployments:
            d3:
              provider: model_runtime
              artifact: vllm-sr/d3-nano
              revision: aeb70d4dd53ed25b855c3b0a66394b8fe265db7f
              device: cpu

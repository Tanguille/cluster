---
# Only agentgateway reaches the ExtProc port. The unauthenticated management API on 8080 serves
# kubelet probes alone; the namespace-wide allowlist excludes this pod (../../networkpolicy.yaml).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: semantic-router-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: semantic-router
  ingress:
    - fromEntities: [host]
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            gateway.networking.k8s.io/gateway-name: agentgateway
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
    # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is ephemeral not 53.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

components:
  - ../../components/common
  - ../../components/ndots-1
  - ../../components/psa-privileged
  - ../../components/kopiur/privileged-movers
# DRA admin-access label, mirroring kube-system and media: required for pods
# in this namespace to allocate ResourceClaims (llmkube/models: the exclusive
# dGPU claim for paiton/flash-next/swift-27b-vllm).
patches:
  - target:
      kind: Namespace
      name: not-used
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          resource.kubernetes.io/admin-access: "true"
resources:
  - ./hermes/ks.yaml
  - ./litellm/ks.yaml
  - ./memini/ks.yaml
  - ./omniroute/ks.yaml
  - ./llmkube/ks.yaml
  - ./opencode/ks.yaml
  - ./toolhive/ks.yaml
  - ./networkpolicy.yaml

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: headroom
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: headroom
      app.kubernetes.io/instance: headroom
  endpoints:
    - port: http
      path: /metrics
      interval: 1m
      scrapeTimeout: 10s
      # /metrics is in headroom's auth-exempt path list, so no credentials.

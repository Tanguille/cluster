---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headroom
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      priorityClassName: homelab-important
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

    controllers:
      headroom:
        # One replica is enough inline (agentgateway -> headroom -> agentgateway): while it is
        # unreachable agentgateway retries the request uncompressed (agentgateway-clients-retry).
        containers:
          app:
            image:
              repository: ghcr.io/headroomlabs-ai/headroom
              # slim: code-aware parsing and ML extras are disabled below anyway.
              tag: 0.41.0-slim-nonroot@sha256:686a86ad0f7dba60816b5d3d6f6438a02323d256d70491c6448526212c6c08b3
            # Appended to the image's `headroom proxy` entrypoint, which runs a semantic response
            # cache and rate limiter by default; chat is near-unique per turn, and agentgateway
            # owns rate limits. --no-ccr: CCR injects a headroom_retrieve tool (~380 prompt tokens)
            # into every request, and with HEADROOM_STATELESS there is no store to retrieve from.
            args: ["--no-cache", "--no-rate-limit", "--no-ccr"]
            env:
              TZ: ${TIMEZONE}
              # Image default is 127.0.0.1.
              HEADROOM_HOST: 0.0.0.0
              HEADROOM_PORT: &port 8787
              # Compressed requests go back to agentgateway's models listener, which routes on the
              # model name; Headroom appends the /v1/... path itself.
              OPENAI_TARGET_API_URL: &models http://agentgateway.ai.svc.cluster.local:8080
              ANTHROPIC_TARGET_API_URL: *models
              # Default 300s; past the longest models-listener chain (omniroute's 150s, then the
              # 1800s qwen-3.8 fallback) so that listener answers first.
              HEADROOM_REQUEST_TIMEOUT: "2000"
              # agentgateway retries and fails over; Headroom retrying too would multiply both.
              HEADROOM_RETRY_MAX_ATTEMPTS: "1"
              # The proxy default (cache) never rewrites prior turns, so older tool results, the
              # only thing worth compressing here, went through whole (0 vs 34% saved on a
              # 65K-token turn). The compressors below are deterministic, so the rewritten
              # prefix stays byte-identical across turns and vLLM's prefix cache still hits.
              HEADROOM_MODE: token
              # CCR store would need the unmounted /data volume.
              HEADROOM_STATELESS: "1"
              # JSON-only: HEADROOM_LOSSLESS=1 saved 0 tokens, and the log compressor drops whole
              # INFO runs. smart_crusher/tabular re-encode arrays as tables keeping every row
              # (2000/2000, -65%), byte-identical across calls. No CCR markers on this path, so
              # anything lossy (Kompress, log, code-aware) would be unrecoverable.
              HEADROOM_COMPRESSORS: smart_crusher tabular
              HEADROOM_DISABLE_KOMPRESS: "1"
              HEADROOM_DISABLE_KOMPRESS_FALLBACK: "1"
              HEADROOM_LOSSLESS_THEN_LOSSY: "0"
              HEADROOM_CODE_AWARE_ENABLED: "0"
              # Off since the LiteLLM guardrail, which withheld assistant rows so dedup pointers and
              # tool-name guards could not resolve; the proxy sees whole turns, so it can be re-tested.
              HEADROOM_DEDUPE: "0"
              HEADROOM_COMPRESS_USER_MESSAGES: "0"
              HEADROOM_COMPRESSION_MAX_WORKERS: "2"
              # No Kompress model to fetch, and the only thing keeping the upload beacon off (BEACON_DEFAULT_ON is true upstream).
              HEADROOM_OFFLINE: "1"
            envFrom:
              - secretRef:
                  name: headroom-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 1Gi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &readyz
                    path: /readyz
                    port: *port
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *readyz
                  periodSeconds: 10
                  timeoutSeconds: 5
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
            # /metrics requires the proxy token for non-loopback callers (401 otherwise).
            authorization:
              credentials:
                name: headroom-secret
                key: HEADROOM_PROXY_TOKEN

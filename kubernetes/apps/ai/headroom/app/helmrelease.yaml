---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headroom
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      priorityClassName: homelab-important
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

    controllers:
      headroom:
        # One replica is enough inline (agentgateway -> headroom -> agentgateway): while it is
        # unreachable agentgateway retries the request uncompressed (agentgateway-clients-retry).
        containers:
          app:
            image:
              repository: ghcr.io/headroomlabs-ai/headroom
              # slim: the compressors selected below need neither code-aware parsing nor ML extras.
              tag: 0.43.1-slim-nonroot@sha256:ba108bc0c269464de93efb6ae20990b3ab0e153c888bcb217407766dbb8eaea4
            # Appended to the image's `headroom proxy` entrypoint, which runs a semantic response
            # cache and rate limiter by default; chat is near-unique per turn, and agentgateway
            # owns rate limits. --no-ccr: HEADROOM_STATELESS leaves no store to retrieve from, and
            # CCR response handling can flip streaming turns to buffered. --no-read-lifecycle: it
            # swaps stale Read results for markers, and lossless mode doesn't gate it.
            args:
              - --no-cache
              - --no-rate-limit
              - --no-ccr
              - --no-read-lifecycle
            env:
              TZ: ${TIMEZONE}
              # Image default is 127.0.0.1.
              HEADROOM_HOST: 0.0.0.0
              # Compressed requests go back to agentgateway's models listener, which routes on the
              # model name; Headroom appends the /v1/... path itself.
              OPENAI_TARGET_API_URL: &models http://agentgateway.ai.svc.cluster.local:8080
              ANTHROPIC_TARGET_API_URL: *models
              # Allow-only mode for x-headroom-base-url: an override to any other host is ignored
              # or rejected, so it cannot carry the forwarded internal key off-cluster.
              HEADROOM_ALLOWED_BASE_URLS: agentgateway.ai.svc.cluster.local
              # Just past Kritika's 5-minute request limit: Headroom doesn't notice a non-streaming chat
              # client leaving, so this ends the abandoned decode. Longer non-streaming chat calls fail
              # too. It's a read timeout, so a stream only hits it after this long without a byte.
              # Non-streaming /v1/messages has its own 600s bound, and no client sends those here.
              HEADROOM_REQUEST_TIMEOUT: "330"
              # agentgateway retries and fails over; Headroom retrying too would multiply both.
              HEADROOM_RETRY_MAX_ATTEMPTS: "1"
              # The proxy default (cache) never rewrites prior turns, so older tool results, the
              # only thing worth compressing here, went through whole (0 vs 34% saved on a
              # 65K-token turn, about 5% over live traffic). The compressors below are deterministic,
              # so the rewritten prefix normally stays byte-identical across turns and the engine's
              # prefix cache still hits.
              HEADROOM_MODE: token
              # CCR store would need the unmounted /data volume.
              HEADROOM_STATELESS: "1"
              # --no-ccr drops the reversibility guard; without this, dense-line elision and SmartCrusher
              # row drops cut tool output for good.
              HEADROOM_LOSSLESS: "1"
              # Re-encode arrays as tables keeping every row (2000/2000, -65%), byte-identical across calls.
              HEADROOM_COMPRESSORS: smart_crusher tabular
              HEADROOM_COMPRESS_USER_MESSAGES: "0"
              HEADROOM_COMPRESSION_MAX_WORKERS: "2"
              # No Kompress model to fetch, and the only thing keeping the upload beacon off (BEACON_DEFAULT_ON is true upstream).
              HEADROOM_OFFLINE: "1"
            envFrom:
              - secretRef:
                  name: headroom-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 1Gi
            # /livez throughout: /readyz sends a keyless HEAD / to agentgateway every 30s (a 401 that counts as ready).
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &livez
                    path: /livez
                    port: &port 8787
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *livez
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *livez
                  periodSeconds: 10
                  timeoutSeconds: 5
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
            # /metrics requires the proxy token for non-loopback callers (401 otherwise).
            authorization:
              credentials:
                name: headroom-secret
                key: HEADROOM_PROXY_TOKEN

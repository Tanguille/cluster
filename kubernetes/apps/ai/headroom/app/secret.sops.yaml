# HEADROOM_PROXY_TOKEN: shared token between litellm (guardrail client) and the
# headroom proxy. Add the value, then:
#   mise exec -- sops --encrypt --in-place kubernetes/apps/ai/headroom/app/secret.sops.yaml
# (sops.yaml path_regex matches (bootstrap|kubernetes)/.*\.sops\.ya?ml)
apiVersion: v1
kind: Secret
metadata:
  name: headroom-secret
type: Opaque
stringData:
  HEADROOM_PROXY_TOKEN: CHANGE_ME

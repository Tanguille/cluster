---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pearl-miner-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pearl-miner
  # A third-party binary: DNS plus the internet only, no cluster or host
  # endpoints. Not limited to the pool port or FQDN because the dev fee
  # may use another pool endpoint.
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - world

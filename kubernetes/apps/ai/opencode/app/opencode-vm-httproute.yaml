---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode-vm
spec:
  hostnames:
    - opencode-vm.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    # Native CORS filter rather than an Envoy Gateway SecurityPolicy: same fields, one less
    # vendor CRD. The rule matches every method, so preflight OPTIONS reaches the filter.
    - filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://opencode.${SECRET_DOMAIN}
            allowCredentials: true
            allowMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Last-Event-ID
      backendRefs:
        - name: opencode-vm
          port: 4096

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/anomalyco/opencode
              tag: 2.2.5@sha256:1690aad69864d2f6714772d1e040918feebc6df5286d2bd7e181fbb35d12d4a9
            env:
              TZ: ${TIMEZONE}
              # Sessions migrated from the VM store absolute paths under this home.
              HOME: /home/tanguille
              OPENCODE_CONFIG: /config/opencode.jsonc
              LLM_API_KEY: ${LLM_API_KEY}
            envFrom:
              - secretRef:
                  name: opencode-secret
            securityContext:
              allowPrivilegeEscalation: false
            command:
              - sh
              - -c
              # The image has no git, which OpenCode needs for projects, snapshots and git plugins.
              # ponytail: installs at every start, build our own image if a mirror outage bites.
              - apk add --no-cache bash curl git jq && exec opencode serve --hostname 0.0.0.0 --port 4096
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: &probe
                    path: /
                    port: &port 4096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  initialDelaySeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 2Gi

    defaultPodOptions:
      priorityClassName: homelab-important
      # Runs model-directed bash and in-process npm plugins.
      runtimeClassName: gvisor

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: OpenCode
          gethomepage.dev/description: Agentic coding assistant
          gethomepage.dev/group: Agents
          gethomepage.dev/icon: opencode.png
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: /home/tanguille
      config-file:
        type: configMap
        name: opencode-config
        globalMounts:
          - path: /config/opencode.jsonc
            subPath: opencode.jsonc

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app eightball
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.1.18
      url: oci://ghcr.io/tanguille/charts/eightball
  # The chart's defaults cover the image, security contexts, probes, resources and the Service. They mount the
  # eightball-config ConfigMap (resources/config.toml, generated in kustomization.yaml) at /etc/eightball and put
  # the database at /data/8ball.db on the PVC below, which the kopiur component backs up.
  values:
    controllers:
      eightball:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env:
              # api_key_env of the qwen endpoint in resources/config.toml.
              LLM_API_KEY: ${LLM_API_KEY}
              EIGHTBALL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: eightball-secret
                    key: EIGHTBALL_API_KEY
    persistence:
      data:
        existingClaim: *app
    serviceMonitor:
      app:
        enabled: true
    rawResources:
      prometheusRule:
        enabled: true
    configMapsFromFolder:
      enabled: true

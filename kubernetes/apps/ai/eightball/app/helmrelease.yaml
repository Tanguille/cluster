---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app eightball
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 0.1.0
      url: oci://ghcr.io/tanguille/charts/eightball
  # The chart's defaults cover the image, security contexts, probes, resources and the Service. They also fix the
  # mounts this app depends on: ConfigMap eightball-config (configMapGenerator) at /etc/eightball, and the database at
  # /data/8ball.db, which the kopiur SnapshotPolicy backs up with sourcePathOverride /data.
  values:
    controllers:
      eightball:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env:
              EIGHTBALL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: eightball-secret
                    key: EIGHTBALL_API_KEY
    persistence:
      data:
        existingClaim: *app
    serviceMonitor:
      app:
        enabled: true
    rawResources:
      prometheusRule:
        enabled: true
    grafanaDashboards:
      enabled: true

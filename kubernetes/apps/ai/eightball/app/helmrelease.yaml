---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app eightball
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.1.17
      url: oci://ghcr.io/tanguille/charts/eightball
  # The chart's defaults cover the image, security contexts, probes, resources and the Service. They also put the
  # database at /data/8ball.db on the PVC below, which the kopiur component backs up.
  values:
    controllers:
      eightball:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env:
              # The config comes from EIGHTBALL_CONFIG_TOML, which conflicts with the chart's default file path.
              EIGHTBALL_CONFIG: null
              EIGHTBALL_CONFIG_TOML: |
                default = "d3"

                [endpoints.d3]
                url = "http://d3-nano.ai.svc.cluster.local:8080"
                kind = "systemone"

                # An unsure answer is re-asked once on the 27B with thinking off (one token, logprob bands).
                # qwen-3.8-fast is the non-thinking alias; qwen-3.8-auto would call d3-nano for its effort and may think.
                # A failed, slow or over-budget escalation keeps the unsure answer.
                [endpoints.qwen]
                url = "http://agentgateway.ai.svc.cluster.local:4000"
                kind = "logprob"
                model = "qwen-3.8-fast"
                api_key_env = "LLM_API_KEY"
                concurrency = 8

                [escalation]
                endpoint = "qwen"
                per_minute = 30

                [specs.gitops-investigate]
                type = "noul"
                instructions = "Does this candidate warrant investigating for this homelab? The state is JSON data with context (current inventory and recent recommendations) and item (the candidate). Investigate changes plausibly affecting a component we use, including migrations, breakage, or meaningful operational improvements. Routine version bumps and changes limited to components we do not use do not warrant investigation. Judge only the supplied evidence."

                [specs.llm-radar-recommend]
                type = "noul"
                instructions = "Does this radar candidate (a new model, engine release or deployment change) warrant a Now or Engine Swap recommendation for this homelab's local LLM stack? The state is JSON data with context (the deployed stack and recent radar entries) and item (the candidate). Judge only the supplied evidence. Routine version bumps, models that do not fit our hardware and things we already run do not warrant one."
              LLM_API_KEY: ${LLM_API_KEY}
              EIGHTBALL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: eightball-secret
                    key: EIGHTBALL_API_KEY
    persistence:
      config:
        enabled: false
      data:
        existingClaim: *app
    serviceMonitor:
      app:
        enabled: true
    rawResources:
      prometheusRule:
        enabled: true
    configMapsFromFolder:
      enabled: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app eightball
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      eightball:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tanguille/8-ball
              tag: sha-5b87d5ed754bf12f882cc7c7ec94a2a192e8c50c@sha256:949fd40b234bf137766a214b13262036a6623edd0cbfad0a7b98c94179c2da39
            env:
              EIGHTBALL_CONFIG: /etc/eightball/config.toml
              EIGHTBALL_DB: /data/8ball.db
              EIGHTBALL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: eightball-secret
                    key: EIGHTBALL_API_KEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /healthz
                    port: &port 8080
                  timeoutSeconds: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 12
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
    persistence:
      config:
        type: configMap
        name: eightball-config
        globalMounts:
          - path: /etc/eightball
            readOnly: true
      data:
        existingClaim: *app

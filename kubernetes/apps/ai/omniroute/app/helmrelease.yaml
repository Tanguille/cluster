---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omniroute
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  valuesFrom:
    - kind: ConfigMap
      name: ndots-1

  values:
    controllers:
      omniroute:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: diegosouzapw/omniroute
              tag: 3.8.52@sha256:b08a12e876baa8a5ccadd1ebbe346fe7267dba3b1c9f4fd6bb02070fae41ab6c
            env:
              TZ: ${TIMEZONE}
              PORT: &port 20128
              REQUIRE_API_KEY: "false"
              # V8 heap ceiling; chat sheds 503 at 85% of it.
              OMNIROUTE_MEMORY_MB: "1536"
              # First-event wait per combo step (default adapts up to 180s for tool-heavy calls); a stalled free provider fails over inside agentgateway's 150s.
              STREAM_READINESS_TIMEOUT_MS: "60000"
              STREAM_READINESS_MAX_TIMEOUT_MS: "60000"
              # envoy-internal terminates TLS at the gateway.
              AUTH_COOKIE_SECURE: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 3Gi
    defaultPodOptions:
      priorityClassName: homelab-important
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: omniroute
        globalMounts:
          - path: /app/data

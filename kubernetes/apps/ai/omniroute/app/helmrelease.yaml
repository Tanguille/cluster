---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omniroute
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  valuesFrom:
    - kind: ConfigMap
      name: ndots-1

  values:
    controllers:
      omniroute:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/diegosouzapw/omniroute
              # On `next` for one upstream fix, not for novelty: 3.8.49 never
              # clears the last-known-good-provider pin when its target starts
              # failing, so every request re-selects the same exhausted model
              # instead of failing over (upstream #10034). No tagged release
              # carries it yet; move to the v3.8.50 tag once it ships.
              # Renovate cannot prompt that move -- `next` is not a version it
              # can diff against, so it will only ever offer digest bumps that
              # walk this further along the branch. Digest-pinned so the branch
              # moving does not silently move us.
              tag: next@sha256:f6a362bd0e06487fe6b0b41a2dd688901deaf03cfc1a8eb72a8504657b51a7e0
            env:
              TZ: ${TIMEZONE}
              DATA_DIR: /app/data
              PORT: &port 20128
              # Only litellm's /v1/* proxy calls skip auth (unauthenticated-backend
              # + non-empty-apiKey convention, same as the qwen-3.8 vLLM model);
              # the dashboard at the internal route below still requires
              # INITIAL_PASSWORD login.
              REQUIRE_API_KEY: "false"
              # envoy-internal-tls terminates TLS at the gateway.
              AUTH_COOKIE_SECURE: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["omniroute.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: omniroute
        globalMounts:
          - path: /app/data

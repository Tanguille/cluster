---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omniroute
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  valuesFrom:
    - kind: ConfigMap
      name: ndots-1

  values:
    controllers:
      omniroute:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/diegosouzapw/omniroute
              tag: 3.8.51-web@sha256:dcec56b564b6cd92972f180ae9f9e46710f1b748d138cd477b4c9700d4d9309a
            env:
              TZ: ${TIMEZONE}
              DATA_DIR: /app/data
              PORT: &port 20128
              REQUIRE_API_KEY: "false"
              # envoy-internal-tls terminates TLS at the gateway.
              AUTH_COOKIE_SECURE: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 1000m
                memory: 4Gi
    defaultPodOptions:
      # 5000 (homelab-important): evicted before an llmkube model, after unclassified pods.
      priorityClassName: homelab-important
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: omniroute
        globalMounts:
          - path: /app/data
      # Chromium for the cfp (Cloudflare playground) provider; the default 64Mi /dev/shm crashes it.
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm

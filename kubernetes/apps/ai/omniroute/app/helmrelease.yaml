---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omniroute
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      omniroute:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/diegosouzapw/omniroute
              tag: 3.8.49
            env:
              TZ: ${TIMEZONE}
              DATA_DIR: /app/data
              PORT: &port 20128
              # Only litellm's /v1/* proxy calls skip auth (unauthenticated-backend
              # + non-empty-apiKey convention, same as the qwen-3.6 SGLang model);
              # the dashboard at the internal route below still requires
              # INITIAL_PASSWORD login.
              REQUIRE_API_KEY: "false"
              # envoy-internal-tls terminates TLS at the gateway.
              AUTH_COOKIE_SECURE: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
    defaultPodOptions:
      # Default ndots:5 search-expands "opencode.ai" to
      # "opencode.ai.svc.cluster.local" first, which matches our own
      # in-namespace opencode Service — silently hijacking every lookup of
      # the real opencode.ai provider. ndots:1 tries the absolute name first.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["omniroute.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: omniroute
        globalMounts:
          - path: /app/data

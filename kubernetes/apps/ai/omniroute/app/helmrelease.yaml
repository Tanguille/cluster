---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omniroute
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  valuesFrom:
    - kind: ConfigMap
      name: ndots-1

  values:
    controllers:
      omniroute:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/diegosouzapw/omniroute
              # Tried main@digest 2026-08-11 and reverted: main is only dependabot
              # bumps ahead of this tag (provider work lives on the `next` image,
              # which has no public branch to audit) and its CI run was cancelled.
              tag: 3.8.49@sha256:92c768c56e2de32c51a0621ef182835018b00b288c9bb235c5c5e4514658c1a1
            env:
              TZ: ${TIMEZONE}
              DATA_DIR: /app/data
              PORT: &port 20128
              # Only litellm's /v1/* proxy calls skip auth (unauthenticated-backend
              # + non-empty-apiKey convention, same as the qwen-3.6 SGLang model);
              # the dashboard at the internal route below still requires
              # INITIAL_PASSWORD login.
              REQUIRE_API_KEY: "false"
              # envoy-internal-tls terminates TLS at the gateway.
              AUTH_COOKIE_SECURE: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["omniroute.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: omniroute
        globalMounts:
          - path: /app/data

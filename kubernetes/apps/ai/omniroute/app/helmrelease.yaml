---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omniroute
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  valuesFrom:
    - kind: ConfigMap
      name: ndots-1

  values:
    controllers:
      omniroute:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/diegosouzapw/omniroute
              # On `next` for two upstream fixes: LKGP pin never clears on
              # failure (#10034) and auto/* credential lookups misresolve
              # "opencode" as "opencode-zen" (#10892). Both merged into
              # release/v3.8.50; no tagged release carries them yet -- move to
              # v3.8.50 once it ships. Digest-pinned since Renovate can't diff
              # `next` as a version, only offer digest bumps.
              tag: next@sha256:cea45237c2085bb3d5c5938831dbe6cdcbe70a904732cce4d0dde4b57b90aed8
            env:
              TZ: ${TIMEZONE}
              DATA_DIR: /app/data
              PORT: &port 20128
              REQUIRE_API_KEY: "false"
              # envoy-internal-tls terminates TLS at the gateway.
              AUTH_COOKIE_SECURE: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["omniroute.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: omniroute
        globalMounts:
          - path: /app/data

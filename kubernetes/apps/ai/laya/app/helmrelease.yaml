---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app laya
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      # Model load takes ~40 s on cluster CPUs; 120 s of slack before the
      # startup probe window opens.
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Built by .github/workflows/laya.yaml from docker/laya, one
              # tag per commit. The model weights are baked into the image,
              # so this pod has no HF Hub dependency.
              repository: ghcr.io/tanguille/laya-server
              tag: 07a52580a
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 18
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
            # Measured in the 2026-09-20 PoC: 5.4 GiB peak RSS for the
            # encoder + HF stack, 3.5-6 s per triage on 4-6 physical cores.
            resources:
              requests:
                cpu: "2"
                memory: 6Gi
              limits:
                cpu: 4
                memory: 8Gi

    service:
      app:
        ports:
          http:
            port: 8080
            protocol: TCP

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

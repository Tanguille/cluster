---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: memini

  values:
    controllers:
      main:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          main:
            envFrom:
              - secretRef:
                  name: memini-secret
            env:
              TZ: ${TIMEZONE}
              MEMINI_BACKEND: "postgres"
              MEMINI_EMBED_BASE_URL: "http://litellm.ai.svc.cluster.local/v1"
              MEMINI_EMBED_API_KEY: ${LITELLM_API_KEY}
              MEMINI_EMBED_MODEL: "embeddinggemma-2"
              # Native width; fixed at store creation (changing it needs export/import).
              MEMINI_EMBED_DIMS: "768"
              # EmbeddingGemma 2's trained retrieval prompts; the trailing space is intentional.
              MEMINI_EMBED_QUERY_PREFIX: "task: search result | query: "
              MEMINI_EMBED_DOC_PREFIX: "title: none | text: "
              # Re-embed rather than silently mixing vector spaces if the model ever changes.
              MEMINI_REEMBED_ON_MODEL_CHANGE: "true"
              # Short serial batches keep capture/dedup embedding from creating a recall tail under load.
              MEMINI_EMBED_MAX_CONCURRENCY: "1"
              MEMINI_EMBED_MAX_BATCH: "8"
              MEMINI_EMBED_MAX_BATCH_CHARS: "12000"
              MEMINI_EMBED_MAX_ITEM_CHARS: "4000"
              # The 5s default drops writes to vectorless whenever the shared iGPU embedder is busy.
              MEMINI_WRITE_EMBED_TIMEOUT: "15s"
              # The 2s default degrades recall to keyword_only when the embedder is busy.
              MEMINI_RECALL_EMBED_TIMEOUT: "20s"
              # Direct to the LLMKube reranker (litellm has no rerank provider); allowed by inference-rerank-memini-allow. Base URL is the API root, memini appends /rerank.
              MEMINI_RERANK: "http://bge-reranker-v2-m3.ai.svc.cluster.local:8080/v1"
              MEMINI_RERANK_MODEL: "bge-reranker-v2-m3"
              # One wider than the recall limit of 3. codingagent_v1 (166 q, EmbeddingGemma 2, 2026-10-15): pools 4-24 all
              # give R@3 88.0% (86.1% unranked) and R@1 65.1-65.7%, while bench wall time grows 69s (4) -> 112s (8) -> 327s (24).
              MEMINI_RERANK_POOL: "4"
              # Prompt recalls rerank on the whole prompt (~50s per pool), so ~96% timed out; skip them. Explicit short-query recalls still rerank.
              MEMINI_RERANK_PROMPT: "false"
              # Hermes abandons a recall at 8s (_EXTERNAL_PREFETCH_TIMEOUT_S); 5s fits typical reranks (~3.3s) and leaves time for the fused-order fallback. No MIN_SCORE gate: it dropped on-topic keyword-query results (logits -3..0).
              MEMINI_RERANK_TIMEOUT: "5s"
              # Payload cap per /rerank request; the 6000 default shards a deep pool into ~10 serial requests.
              MEMINI_RERANK_MAX_BATCH_CHARS: "20000"
              # One in-flight call keeps a slow shared-iGPU reranker from stalling recall.
              MEMINI_RERANK_MAX_CONCURRENCY: "1"
              # Default 2048; the iGPU scores each pair serially, so a pool of 12 worst-case docs takes 10.0s at 2048 chars vs 5.1s at 1024. 79% of memories fit in 1024.
              MEMINI_RERANK_MAX_DOC_CHARS: "1024"
            probes:
              # Startup re-embed (MEMINI_REEMBED_ON_MODEL_CHANGE) blocks the listener; without this the 45s liveness window kills it mid-run.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 1
                memory: 512Mi

    defaultPodOptions:
      priorityClassName: homelab-important

    persistence:
      data:
        enabled: false

    route:
      ui:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"

    serviceMonitor:
      main:
        enabled: true

    grafanaDashboards:
      enabled: true

    networkpolicies:
      main:
        # /v1/handshake reports admin=true, read_only=false to any caller, so
        # reachability is the only access control there is. Scoped to memini alone,
        # on top of the ai namespace ingress allowlist. Egress untouched.
        rules:
          ingress:
            - from:
                # ai = hermes' memory provider and toolhive's MCP entry, both :8080.
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: ai
                # network = envoy-internal fronting the memini UI route (:8081).
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: network
                # observability = vmagent scraping the serviceMonitor (:9090).
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: observability
                # Rev-NAT'd DNS replies hit ingress; no ports, dest port is ephemeral not 53.
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns

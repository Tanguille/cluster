---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: v0.7.39
      url: oci://registry.erwanleboucher.dev/eleboucher/charts/memini
  values:
    controllers:
      main:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          main:
            envFrom:
              - secretRef:
                  name: memini-secret
            env:
              TZ: ${TIMEZONE}
              MEMINI_BACKEND: "postgres"
              MEMINI_EMBED_BASE_URL: "http://agentgateway.ai.svc.cluster.local:4000/v1"
              MEMINI_EMBED_API_KEY: ${LLM_API_KEY}
              MEMINI_EMBED_MODEL: "embeddinggemma-2"
              # Native width; fixed at store creation (changing it needs export/import).
              MEMINI_EMBED_DIMS: "768"
              # EmbeddingGemma 2's trained retrieval prompts; the trailing space is intentional.
              MEMINI_EMBED_QUERY_PREFIX: "task: search result | query: "
              MEMINI_EMBED_DOC_PREFIX: "title: none | text: "
              # Re-embed rather than silently mixing vector spaces if the model ever changes.
              MEMINI_REEMBED_ON_MODEL_CHANGE: "true"
              # Only long query prompts get cut (every memory is under 1.7K); embedding more of a 30-99K-char prompt does not focus it.
              MEMINI_EMBED_MAX_ITEM_CHARS: "4000"
              # Direct to the LLMKube reranker. Base URL is the API root, memini appends /rerank.
              MEMINI_RERANK: "http://bge-reranker-v2-m3.ai.svc.cluster.local:8080/v1"
              MEMINI_RERANK_MODEL: "bge-reranker-v2-m3"
              # One wider than the recall limit of 3. codingagent_v1 on the 2070 (2026-11-20): pool 3/4/6/8 give R@1 65.1/65.7/65.1/65.1%
              # and R@3 86.1/88.0/88.0/88.0%; pool 12 and 24 gave no more (86.1% unranked).
              MEMINI_RERANK_POOL: "4"
              # Hermes abandons a recall at 8s (_EXTERNAL_PREFETCH_TIMEOUT_S); the 2s default recall embed plus 2s here leaves room for the
              # fused-order fallback. No MIN_SCORE gate: it dropped on-topic keyword-query results (logits -3..0).
              MEMINI_RERANK_TIMEOUT: "2s"
              # /rerank payload cap (512-char query + docs): 26000 keeps a limit-10 MCP recall of 2048-char docs in one call; the 6000 default fits 2.
              MEMINI_RERANK_MAX_BATCH_CHARS: "26000"
            probes:
              # Startup re-embed (MEMINI_REEMBED_ON_MODEL_CHANGE) blocks the listener; without this the 45s liveness window kills it mid-run.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 50m
                memory: 16Mi
              limits:
                cpu: 1
                memory: 512Mi

    defaultPodOptions:
      labels:
        egress.home.arpa/postgres: allow
      priorityClassName: homelab-important

    persistence:
      data:
        enabled: false

    route:
      ui:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"

    serviceMonitor:
      main:
        enabled: true

    grafanaDashboards:
      enabled: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: memini

  values:
    controllers:
      main:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          main:
            envFrom:
              - secretRef:
                  name: memini-secret
            env:
              TZ: ${TIMEZONE}
              MEMINI_BACKEND: "postgres"
              MEMINI_EMBED_BASE_URL: "http://litellm.ai.svc.cluster.local/v1"
              MEMINI_EMBED_API_KEY: ${LITELLM_API_KEY}
              MEMINI_EMBED_MODEL: "qwen3-embedding"
              # Native width of Qwen3-Embedding-0.6B; not a truncation, raising it needs a bigger model.
              MEMINI_EMBED_DIMS: "1024"
              # Asymmetric model: query side takes the prefix, documents must not. Query-only,
              # so stored vectors stay valid. Measured relevant-vs-irrelevant cosine margin on the
              # live embedder: 0.419 bare -> 0.474 prefixed.
              MEMINI_EMBED_QUERY_PREFIX: |-
                Instruct: Given a search query, retrieve relevant memories that answer the query
                Query:
              # Re-embed rather than silently mixing vector spaces if the model or dims ever change.
              MEMINI_REEMBED_ON_MODEL_CHANGE: "true"
              # Bound capture/dedup embedding work to short, serial batches so
              # it cannot create the multi-second recall tail under load.
              MEMINI_EMBED_MAX_CONCURRENCY: "1"
              MEMINI_EMBED_MAX_BATCH: "8"
              MEMINI_EMBED_MAX_BATCH_CHARS: "12000"
              MEMINI_EMBED_MAX_ITEM_CHARS: "4000"
              # The 5s default drops writes to vectorless whenever the shared
              # iGPU embedder is busy; the two from 2026-08-04 20:50 never got
              # a vector back and are keyword-only.
              MEMINI_WRITE_EMBED_TIMEOUT: "15s"
              # Read path has the write path's failure on a tighter 2s default: a busy
              # embedder degrades recall to keyword_only instead of returning vector hits.
              MEMINI_RECALL_EMBED_TIMEOUT: "20s"
              # Cross-encoder rerank of the composite top-k. Direct to the LLMKube
              # reranker (NOT litellm, which has no rerank provider in v1.102.0);
              # the netpol carve-out kubernetes/apps/ai/llmkube/models/
              # networkpolicy.yaml (inference-rerank-memini-allow) permits exactly
              # this path, reranker service only. Base URL is the API root — memini
              # appends /rerank itself.
              MEMINI_RERANK: "http://bge-reranker-v2-m3.ai.svc.cluster.local:8080/v1"
              MEMINI_RERANK_MODEL: "bge-reranker-v2-m3"
              # Re-rank a wider pool than the recall limit, then truncate: lets a
              # composite-buried memory be rescued by its own relevance. Cost is one
              # forward pass per candidate — 50 is the natural ceiling (recall never
              # retrieves more) and keeps the rerank call within its timeout.
              MEMINI_RERANK_POOL: "50"
              # Absolute relevance floor: drops low-relevance candidates outright,
              # so a query with no genuine match returns empty (a verdict) instead
              # of the best-of-a-bad-pool. 0.5 is a conservative start on
              # llama.cpp's sigmoid-scaled [0,1] scores — validate against live
              # traffic before moving it (memini bench.RerankGateSweep).
              MEMINI_RERANK_MIN_SCORE: "0.5"
              # Same congestion logic as the embedder knobs: one in-flight rerank
              # call keeps a slow shared-iGPU reranker from stalling the recall
              # tail; past the 10s timeout recall degrades to composite order.
              MEMINI_RERANK_MAX_CONCURRENCY: "1"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 1
                memory: 512Mi

    defaultPodOptions:
      # 5000 (homelab-important): evicted before an llmkube model, after unclassified pods.
      priorityClassName: homelab-important

    persistence:
      data:
        enabled: false

    route:
      ui:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"

    serviceMonitor:
      main:
        enabled: true

    grafanaDashboards:
      enabled: true

    networkpolicies:
      main:
        # /v1/handshake reports admin=true, read_only=false to any caller, so
        # reachability is the only access control there is. Scoped to memini alone;
        # the rest of ai stays default-allow. Egress untouched.
        rules:
          ingress:
            - from:
                # ai = hermes' memory provider and toolhive's MCP entry, both :8080.
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: ai
                # network = envoy-internal fronting the memini UI route (:8081).
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: network
                # observability = vmagent scraping the serviceMonitor (:9090).
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: observability
                # Rev-NAT'd DNS replies hit ingress; no ports, dest port is ephemeral not 53.
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns

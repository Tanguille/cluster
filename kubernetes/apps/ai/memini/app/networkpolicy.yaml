---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: memini-ingress-deny
spec:
  # No API key is set, so every request is admitted: deny the namespaces ai-ingress-allowlist
  # admits that have no memini client (allow rules union, a deny wins).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: memini
  ingressDeny:
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values:
                - default
                - kritika
                - security

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret.yaml
  - modelcatalog.yaml
  - gateway.yaml
  - service.yaml
  - models.yaml
  - models/qwen-3.8.yaml
  - models/qwen-3.8-fast.yaml
  - models/omniroute.yaml
  - models/qwen35-2b.yaml
  - models/embeddinggemma-2.yaml
  - models/bge-reranker-v2-m3.yaml
  - clients.yaml
  - embedding-cache.yaml
  - httproute.yaml
  - grafanadashboard.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: agentgateway-llm-dashboard
    files:
      - dashboard/agentgateway-llm.json
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true

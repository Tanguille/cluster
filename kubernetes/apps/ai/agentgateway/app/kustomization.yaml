---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret.yaml
  - modelcatalog.yaml
  - gateway.yaml
  - service.yaml
  - backends.yaml
  - routes.yaml
  - clients.yaml
  - policies.yaml
  - embedding-cache.yaml
  - httproute.yaml
  - grafanadashboard.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: agentgateway-llm-dashboard
    files:
      - dashboard/agentgateway-llm.json
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true

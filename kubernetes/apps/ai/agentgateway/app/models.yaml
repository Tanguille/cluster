---
# Models listener, shared by every model: routing key, auth, catch-alls and default retry.
# Each model is a file under models/ (backend, route, its own policies), routed on the body's
# model. Not the AgentgatewayModel API: its virtual models fail over on the next request
# instead of retrying the one that failed, and a policy cannot target a model.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-models
spec:
  parentRefs:
    - name: agentgateway
      sectionName: models
  rules:
    # Lowest precedence: any model without a route in models/. Answered by agentgateway-unknown-model.
    # Model routes repeat this /v1 prefix so their header match, not path length, wins.
    - name: unknown-model
      matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen-3.8
    # Answered by agentgateway-models-list; the backend only exists to make the rule valid.
    - name: models-list
      matches:
        - path:
            type: Exact
            value: /v1/models
          method: GET
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen-3.8
---
# Routing key for the model routes: the OpenAI and Anthropic bodies both carry `model`.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-model-header
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway
      sectionName: models
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: x-gateway-model
            value: json(request.body).model
---
# The http listener and Headroom both arrive with the internal key, and only that key is
# accepted: the rest of the namespace can reach port 8080 directly, and a client key here would
# skip the http listener's per-key limits. The gateway strips Authorization before forwarding,
# so backends never see a key.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway
      sectionName: models
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          agentgateway.dev/apikey-internal: "true"
---
# Hand-maintained: one entry per file in models/.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-models-list
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-models
      sectionName: models-list
  traffic:
    directResponse:
      status: 200
      headers:
        - name: content-type
          value: application/json
      body: |-
        {"object":"list","data":[
        {"id":"qwen-3.8","object":"model","owned_by":"vllm"},
        {"id":"qwen-3.8-fast","object":"model","owned_by":"vllm"},
        {"id":"omniroute","object":"model","owned_by":"omniroute"},
        {"id":"qwen35-2b","object":"model","owned_by":"llamacpp"},
        {"id":"embeddinggemma-2","object":"model","owned_by":"llamacpp"},
        {"id":"bge-reranker-v2-m3","object":"model","owned_by":"llamacpp"}]}
---
# OpenAI-shaped, like LiteLLM's: Headroom turns the gateway's plain-text 404 into a 502.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-unknown-model
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-models
      sectionName: unknown-model
  traffic:
    directResponse:
      status: 400
      headers:
        - name: content-type
          value: application/json
      body: '{"error":{"message":"Invalid model name passed in model=...; see GET /v1/models","type":"invalid_request_error","code":"model_not_found"}}'
---
# Retry dropped connections (each costs a Hermes cron run), never timeouts: re-running a 900s
# prefill deepens the contention. A refused or reset connection surfaces as 503. Every model
# gets it; agentgateway-retry-omniroute (models/omniroute.yaml) replaces it on omniroute (a
# route-level policy wins over a listener-level one).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-retry
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway
      sectionName: models
  traffic:
    retry:
      attempts: 2
      codes:
        - 500
        - 502
        - 503

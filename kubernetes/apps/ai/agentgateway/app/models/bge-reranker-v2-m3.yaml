---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaymodel_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: bge-reranker-v2-m3
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-models
      sectionName: models
  provider: Custom
  custom:
    backendRef:
      name: bge-reranker-v2-m3
      port: 8080
    providerOverride: llamacpp
    formats:
      - type: Rerank

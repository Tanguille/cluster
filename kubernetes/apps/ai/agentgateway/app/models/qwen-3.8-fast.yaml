---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaybackend_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: qwen-3.8-fast
spec:
  ai:
    provider:
      # Moves with qwen-3.8 (qwen-3.8.yaml): both must always name the same live backend.
      host: qwen38-27b-vllm.ai.svc.cluster.local
      port: 8000
      custom:
        model: qwen-3.8
        providerOverride: vllm
        formats:
          - type: Completions
          - type: Messages
          - type: AnthropicTokenCount
          - type: Responses
  policies:
    ai:
      # Non-thinking instruct-mode sampling, matching Qwen3.8's model card
      # exactly (temperature/top_p/presence_penalty). Defaults only: client-set
      # params win.
      defaults:
        - field: temperature
          value: 0.7
        - field: top_p
          value: 0.8
        - field: presence_penalty
          value: 1.5
        - field: chat_template_kwargs
          value:
            enable_thinking: false
    http:
      # Hermes compression is a ~100K+ prefill on this alias; under GPU contention the shared prefill rate drops below what 600s covers.
      requestTimeout: 900s
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-qwen-3.8-fast
spec:
  parentRefs:
    - name: agentgateway
      sectionName: models
  rules:
    - name: qwen-3-8-fast
      matches:
        - path:
            type: PathPrefix
            value: /v1
          headers:
            - name: x-gateway-model
              value: qwen-3.8-fast
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen-3.8-fast

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaybackend_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: omniroute
spec:
  ai:
    groups:
      # smart-free is a persisted omniroute combo (Logfare DeepSeek V4.1 Flash 1017; Gemini 3.8 Flash;
      # Antigravity Gemini 3.8 Flash High; Logfare GLM 5.3, then Qwen 3.8 27B last). A model joins only if on par
      # with qwen3.8-27b on the AA index and no successor at similar price exists, or it is another quota tier.
      - providers:
          - name: omniroute
            # Through pasteguard, which masks secrets before they reach the free providers.
            host: pasteguard.ai.svc.cluster.local
            port: 3000
            custom:
              model: smart-free
              providerOverride: omniroute
              formats:
                - type: Completions
                  path: /openai/v1/chat/completions
                - type: Messages
                  path: /anthropic/v1/messages
            policies:
              # GLM thinks only when asked. No include_reasoning: since 11-01 any value makes Logfare DeepSeek 1017
              # answer 400 "supported API model names are deepseek-flash, deepseek-v4-pro", and 1017 no longer
              # reasons through any field. Client-set values win.
              # high, not max: 16 of ~490 calls in 3h (2026-11-15) spent kritika's 16384-token step cap on reasoning with no
              # content, which omniroute rejects and fails over (the next target repeats it).
              ai:
                defaults:
                  - field: reasoning_effort
                    value: high
              # pii-masker rewrites any bare 10-digit number as [PHONE_REDACTED], corrupting byte counts and memory limits (8 of 9 review runs); guardrails have only a per-request opt-out, credential-masker stays on.
              transformation:
                request:
                  set:
                    - name: x-omniroute-disabled-guardrails
                      value: '"pii-masker"'
              http:
                # Omniroute's own waits (15s queue, 60s cooldown, 120s per target) plus margin, under kritika's 300s step
                # timeout. Only kritika uses this route (owner, 2026-11-15) and it falls back to inkling-2-mini itself, so no
                # second group or eviction here: with one provider an eviction would only answer 503.
                requestTimeout: 240s
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-omniroute
spec:
  parentRefs:
    - name: agentgateway
      sectionName: models
  rules:
    - name: omniroute
      matches:
        - path:
            type: PathPrefix
            value: /v1
          headers:
            - name: x-gateway-model
              value: omniroute
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: omniroute
---
# Listed in GET /v1/models only: requests for omniroute match agentgateway-omniroute above
# (a longer path than the model router's "/"), so this model never serves one.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaymodel_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: omniroute
spec:
  parentRefs:
    - kind: HTTPRoute
      name: agentgateway-router
  provider: Custom
  custom:
    backendRef:
      name: omniroute
      port: 20128
    providerOverride: omniroute
    formats:
      - type: Completions
      - type: Messages

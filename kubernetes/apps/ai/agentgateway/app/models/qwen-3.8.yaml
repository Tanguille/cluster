---
# qwen-3.8 is the second model of the inkling2-mini radiance process (llmkube/models/resources/radiance.yaml):
# a request for it swaps it onto the card. Hand-written, not a ModelRouter backend, so a mistake here cannot refuse the
# router's inkling-2-mini route. Nothing checks the name: it must equal that file's models key.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaymodel_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: qwen-3.8
spec:
  parentRefs:
    - kind: HTTPRoute
      name: agentgateway-router
  provider: Custom
  custom:
    backendRef:
      name: inkling2-mini
      port: 8000
    providerOverride: vllm
    formats:
      - type: Completions
      - type: Messages
      - type: AnthropicTokenCount
      - type: Responses

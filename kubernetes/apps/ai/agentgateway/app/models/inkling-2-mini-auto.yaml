---
# D3-nano picks inkling-2-mini's reasoning effort from the first user message; routing rules and the
# cache: docs/llm-hosting/llm-auto-effort.md. Requests with tools never get "none": qwen-3.8 looped on repeated calls
# without thinking.
# It replaces a client's effort; call `inkling-2-mini` for a fixed one.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaymodel_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: inkling-2-mini-auto
spec:
  parentRefs:
    - kind: HTTPRoute
      name: agentgateway-router
  virtualModel:
    callout:
      # A url, not backendRef: v1.7 takes the callout path only from a url.
      url: http://d3-nano.ai.svc.cluster.local:8080/v1/systemone
      # Hermes appends recalled memory to the user message, which must not count. The first and last 1000
      # characters bound the decision latency and keep a question asked after a pasted document.
      body: >-
        llmRequest.messages.filter(m, m.role == "user")[0].content.split("<memory-context>")[0].with(t, {
        "state": size(t) > 2000 ? t.substring(0, 1000) + "\n...\n" + t.substring(size(t) - 1000) : t,
        "questions": {"effort": {"type": "choice",
        "instructions": "Pick the reasoning effort a strong assistant needs for the user's request.",
        "criteria": {"low": "chit-chat, a quick fact, a simple command or conversion",
        "medium": "ordinary work, including writing any code, writing, summaries and planning",
        "xhigh": "debugging, finding a bug or a root cause, proofs or math, design with trade-offs, or multi-step quantitative reasoning"}}}})
      cache:
        # Hashed, so a pasted document is not kept in memory.
        key:
          - sha256.encode(bytes(llmRequest.messages.filter(m, m.role == "user")[0].content.split("<memory-context>")[0]))
        # Any other answer evaluates to null, which skips caching it.
        ttl: >-
          callout.body.answers.effort.choice in ["low", "medium", "xhigh"] ? duration("24h") : null
        maxEntries: 1024
      # In chat_template_kwargs, not top-level: radiance lets the kwargs win, and Hermes sends an effort on every turn.
      # Merged over the client's kwargs, so only the effort changes. Inkling still uses about 45 reasoning tokens
      # at "none" (docs/llm-hosting/inkling2-mini-2026-11.md).
      transformation:
        model: '"inkling-2-mini"'
        chat_template_kwargs: >-
          (has(llmRequest.chat_template_kwargs) ? llmRequest.chat_template_kwargs : {}).merge({"reasoning_effort":
          callout.body.answers.effort.choice != "low" ? callout.body.answers.effort.choice :
          callout.body.answers.effort.probabilities.low < 0.95 ? "medium" :
          has(llmRequest.tools) ? "low" : "none"})
      fallback:
        modelRef:
          # The ModelRouter's generated model for inkling-2-mini.
          name: agentgateway-router-inkling2

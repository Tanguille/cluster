---
# Qwen2B picks qwen-3.8's reasoning effort from the first user message. The callout is cached on that
# message, so a conversation keeps one effort and the 27B's prefix cache stays warm. It replaces a client's
# effort; call `qwen-3.8` for a fixed effort. If Qwen2B fails, the keyword rule below decides.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaymodel_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: vllm-sr-auto
spec:
  parentRefs:
    - kind: HTTPRoute
      name: agentgateway-router
  match:
    model: vllm-sr/auto
  virtualModel:
    callout:
      url: http://qwen35-2b.ai.svc.cluster.local:8080/v1/chat/completions
      # Hermes appends recalled memory to the user message, which must not count. The first and last 1000
      # characters bound the decision latency and keep a question asked after a pasted document.
      body: >-
        llmRequest.messages.filter(m, m.role == "user")[0].content.split("<memory-context>")[0].with(t, {
        "model": "qwen35-2b", "max_tokens": 20, "temperature": 0,
        "response_format": {"type": "json_schema", "json_schema": {"name": "effort", "strict": true, "schema": {
        "type": "object", "properties": {"effort": {"type": "string", "enum": ["low", "medium", "xhigh"]}},
        "required": ["effort"], "additionalProperties": false}}},
        "messages": [{"role": "system", "content": "Pick the reasoning effort a strong assistant needs for the user's request.\nlow: chit-chat, a quick fact, a simple command or conversion.\nmedium: ordinary work, including writing any code, writing, summaries and planning.\nxhigh: debugging, finding a bug or a root cause, proofs or math, design with trade-offs, or multi-step quantitative reasoning.\nAnswer with JSON only."},
        {"role": "user", "content": size(t) > 2000 ? t.substring(0, 1000) + "\n...\n" + t.substring(size(t) - 1000) : t}]})
      cache:
        # The text the decision sees.
        key:
          - >-
            llmRequest.messages.filter(m, m.role == "user")[0].content.split("<memory-context>")[0].with(t,
            size(t) > 2000 ? t.substring(0, 1000) + "\n...\n" + t.substring(size(t) - 1000) : t)
        # An answer outside the enum evaluates to null, which skips caching it.
        ttl: >-
          json(callout.body.choices[0].message.content).effort in ["low", "medium", "xhigh"] ? duration("24h") : null
        maxEntries: 1024
      # Top-level, not chat_template_kwargs: vLLM lets it win, and Hermes sends one on every turn.
      transformation:
        # An answer outside the enum goes to the keyword rule.
        model: >-
          json(callout.body.choices[0].message.content).effort in ["low", "medium", "xhigh"] ? "qwen-3.8" : "qwen-3.8-auto-rule"
        reasoning_effort: json(callout.body.choices[0].message.content).effort
      fallback:
        modelRef:
          name: qwen-3.8-auto-rule
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaymodel_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: qwen-3.8-auto-rule
spec:
  parentRefs:
    - kind: HTTPRoute
      name: agentgateway-router
  match:
    model: qwen-3.8-auto-rule
  visibility: Internal
  provider: Custom
  custom:
    # Same server as qwen-3.8. Concrete, not a virtual model: virtual models cannot carry policies.
    backendRef:
      name: qwen38-27b-vllm
      port: 8000
    providerOverride: vllm
    formats:
      - type: Completions
      - type: Messages
      - type: AnthropicTokenCount
      - type: Responses
  policies:
    transformations:
      - field: model
        expression: '"qwen-3.8"'
      # Same field and memory split as the callout. The template's ladder is low/medium/xhigh.
      - field: reasoning_effort
        expression: >-
          llmRequest.messages.filter(m, m.role == "user")[0].content.split("<memory-context>")[0].with(t,
          t.matches("(?i)\\b(one word|yes or no|briefly|tl;?dr|in short|one line|one sentence)\\b") ? "low"
          : (size(t) > 4000
          || t.matches("(?i)\\b(derive|integral|equation|solve for|closed form|proof|prove|debug\\w*|traceback|stack trace|root[- ]?cause|step by step|trade-?off|pros and cons)\\b"))
          ? "xhigh" : "medium")

---
# Picks qwen-3.8's reasoning effort from the first user message, so it stays fixed per conversation
# and keeps the prefix cache warm. A client-set chat_template_kwargs is replaced; call `qwen-3.8` for a fixed effort.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaymodel_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: vllm-sr-auto
spec:
  parentRefs:
    - kind: HTTPRoute
      name: agentgateway-router
  match:
    model: vllm-sr/auto
  provider: Custom
  custom:
    # Same server as qwen-3.8. Concrete, not a virtual model: virtual models cannot carry policies.
    backendRef:
      name: qwen38-27b-vllm
      port: 8000
    providerOverride: vllm
    formats:
      - type: Completions
      - type: Messages
      - type: AnthropicTokenCount
      - type: Responses
  policies:
    transformations:
      - field: model
        expression: '"qwen-3.8"'
      # "high" 400s on this deployment: the template's ladder is low/medium/xhigh.
      - field: chat_template_kwargs
        expression: >-
          llmRequest.messages.filter(m, m.role == "user")[0].content.with(t,
          {"reasoning_effort":
          t.matches("(?i)\\b(one word|yes or no|briefly|tl;?dr|in short|one line|one sentence)\\b") ? "low"
          : (size(t) > 4000
          || t.matches("(?i)\\b(derive|integral|equation|solve for|closed form|proof|prove|debug\\w*|traceback|stack trace|root[- ]?cause|step by step|trade-?off|pros and cons)\\b"))
          ? "xhigh" : "medium"})

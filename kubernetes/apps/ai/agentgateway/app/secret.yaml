---
# Client keys for both listeners, one JSON entry per key; user_id drives the per-key policies
# (agentgateway-clients-auth) and the user_id metric label. The shared key comes from
# cluster-secrets; Home Assistant's own key is in secret.sops.yaml under the same label.
# An unset variable renders an empty key, which agentgateway rejects as invalid (the policy
# goes PartiallyValid) rather than matching an empty bearer token.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/secret_v1.json
apiVersion: v1
kind: Secret
metadata:
  name: agentgateway-api-keys
  labels:
    agentgateway.dev/apikey: "true"
type: Opaque
stringData:
  shared: '{"key": "${LLM_API_KEY}", "metadata": {"user_id": "shared"}}'
---
# Sent by the http listener (directly and through Headroom) to the models listener, the only
# key that listener accepts: a client key there would skip the http listener's per-key limits.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/secret_v1.json
apiVersion: v1
kind: Secret
metadata:
  name: agentgateway-internal-key
  labels:
    agentgateway.dev/apikey-internal: "true"
type: Opaque
stringData:
  key: ${LLM_API_KEY}

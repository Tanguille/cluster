---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/service.json
# Separate from the controller-managed gateway listener Service.
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-ui
spec:
  type: ClusterIP
  selector:
    gateway.networking.k8s.io/gateway-name: agentgateway
  ports:
    - name: http
      port: 15000
      targetPort: 15000
      protocol: TCP

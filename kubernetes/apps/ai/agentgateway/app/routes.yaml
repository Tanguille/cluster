---
# Models listener: every request is routed on the body's model, which the
# agentgateway-model-header policy copies into x-gateway-model before routing. Each rule
# repeats the /v1 prefix of unknown-model so the header match, not path length, decides.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-models
spec:
  parentRefs:
    - name: agentgateway
      sectionName: models
  rules:
    - name: qwen-3-8
      matches:
        - path:
            type: PathPrefix
            value: /v1
          headers:
            - name: x-gateway-model
              value: qwen-3.8
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen-3.8
    - name: qwen-3-8-fast
      matches:
        - path:
            type: PathPrefix
            value: /v1
          headers:
            - name: x-gateway-model
              value: qwen-3.8-fast
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen-3.8-fast
    - name: omniroute
      matches:
        - path:
            type: PathPrefix
            value: /v1
          headers:
            - name: x-gateway-model
              value: omniroute
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: omniroute
    - name: qwen35-2b
      matches:
        - path:
            type: PathPrefix
            value: /v1
          headers:
            - name: x-gateway-model
              value: qwen35-2b
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen35-2b
    - name: embeddinggemma-2
      matches:
        - path:
            type: PathPrefix
            value: /v1
          headers:
            - name: x-gateway-model
              value: embeddinggemma-2
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: embeddinggemma-2
    - name: bge-reranker-v2-m3
      matches:
        - path:
            type: PathPrefix
            value: /v1
          headers:
            - name: x-gateway-model
              value: bge-reranker-v2-m3
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: bge-reranker-v2-m3
    # Lowest precedence: any model without a rule above. Answered by agentgateway-unknown-model.
    - name: unknown-model
      matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen-3.8
    # Answered by agentgateway-models-list; the backend only exists to make the rule valid.
    - name: models-list
      matches:
        - path:
            type: Exact
            value: /v1/models
          method: GET
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen-3.8

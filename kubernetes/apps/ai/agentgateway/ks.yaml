---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway-controller
  namespace: &namespace ai
spec:
  dependsOn:
    # The CRDs stay in network: moving their release would need a manual Helm ownership handover.
    - name: agentgateway-crds
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/ai/agentgateway/controller
  prune: true
  targetNamespace: *namespace
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway
  namespace: &namespace ai
spec:
  interval: 30m
  dependsOn:
    # GatewayClass and the controller.
    - name: agentgateway-controller
    # The ModelRouter CRD and its webhook (models.yaml).
    - name: llmkube
  # Gate dependents (memini) on the Gateway only: wait: true would also block them on the
  # optional embedding-cache HelmRelease.
  healthChecks:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: agentgateway
      namespace: ai
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      failed: status.conditions.filter(e, e.type == 'Programmed').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Programmed').all(e, e.status == 'True')
  path: ./kubernetes/apps/ai/agentgateway/app
  prune: true
  targetNamespace: *namespace

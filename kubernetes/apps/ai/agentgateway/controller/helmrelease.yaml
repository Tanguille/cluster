---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Not agentgateway: the release name becomes the Deployment, Service and
  # ServiceAccount name, which the Gateway's proxy already uses in this namespace.
  name: agentgateway-controller
spec:
  interval: 1h
  # Bump the chart once the release includes PR #4140 (configurable retry body limit, v1.7.0
  # never retries bodies over 64 KiB). Then re-read the retry policies and update the
  # comments in app/models/omniroute.yaml. Keep this comment
  # out of ref: the Renovate inline OCI regex needs tag: right after it.
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: v1.7.0
      url: oci://cr.agentgateway.dev/charts/agentgateway
  values:
    controller:
      priorityClassName: homelab-important
    # No Istio here; enabled (the chart default) watches mesh CRDs that do not exist.
    istio:
      enabled: false
    monitoring:
      enabled: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Not agentgateway: the release name becomes the Deployment, Service and
  # ServiceAccount name, which the Gateway's proxy already uses in this namespace.
  name: agentgateway-controller
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: v1.7.0
      url: oci://cr.agentgateway.dev/charts/agentgateway
  values:
    controller:
      priorityClassName: homelab-important
    # No Istio here; enabled (the chart default) watches mesh CRDs that do not exist.
    istio:
      enabled: false
    monitoring:
      enabled: true

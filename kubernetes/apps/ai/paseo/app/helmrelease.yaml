---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paseo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      priorityClassName: homelab-important
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      paseo:
        type: deployment
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          seed:
            image: &image
              repository: ghcr.io/tanguille/paseo
              # REQUIRED, no default. Detached until a tested published digest exists.
              tag: "${PASEO_IMAGE_TAG}"
            command:
              - /usr/local/bin/paseo-seed
            env:
              HOME: /home/paseo
              PASEO_HOME: /home/paseo/.paseo
              GIT_TERMINAL_PROMPT: "0"
            securityContext: &containerSecurity
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources: &resources
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                cpu: 2
                memory: 4Gi
        containers:
          app:
            image: *image
            env:
              HOME: /home/paseo
              PASEO_HOME: /home/paseo/.paseo
              HERMES_HOME: /home/paseo/.hermes
              PASEO_LISTEN: 0.0.0.0:6767
              PASEO_WEB_UI_ENABLED: "true"
              PASEO_RELAY_ENABLED: "false"
              PASEO_HOSTNAMES: paseo.${SECRET_DOMAIN}
              PASEO_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paseo-secret
                    key: PASEO_PASSWORD
            securityContext: *containerSecurity
            resources: *resources
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    path: /api/health
                    port: &port 6767
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
    service:
      app:
        controller: paseo
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      home:
        existingClaim: paseo-home
        globalMounts:
          - path: /home/paseo
      workspace:
        existingClaim: paseo-workspace
        globalMounts:
          - path: /workspace

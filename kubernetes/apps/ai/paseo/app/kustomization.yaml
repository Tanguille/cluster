---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
# Activation gate: add secret.sops.yaml only after permission and a real password.
configMapGenerator:
  - name: paseo-runtime
    files:
      - resources/seed.sh
      - resources/password-guard.sh
      - resources/config.json
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true

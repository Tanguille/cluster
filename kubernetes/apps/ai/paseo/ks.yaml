---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paseo-storage
  namespace: &namespace ai
spec:
  interval: 30m
  path: ./kubernetes/apps/ai/paseo/storage
  targetNamespace: *namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      APP: paseo
      PVC_CAPACITY: 70Gi
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
      KOPIUR_IGNORE_RULES: "[/lost+found, /home/.cache/*, /home/.npm/*]"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# DETACHED: do not activate until publication, real encrypted password and deployment approval.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paseo
  namespace: &namespace ai
spec:
  interval: 30m
  path: ./kubernetes/apps/ai/paseo/app
  targetNamespace: *namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: paseo-storage
  postBuild:
    substitute:
      APP: *app
      # Before activation add PASEO_IMAGE_TAG: <source-revision-tag>@sha256:<published-digest>.
      # No default, local image ID or invented registry digest is acceptable.

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paseo
  namespace: &namespace ai
spec:
  interval: 30m
  path: ./kubernetes/apps/ai/paseo/app
  targetNamespace: *namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 32Gi
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
      # npm/pnpm/cargo caches, rustup and mise toolchains, build output: re-fetched or rebuilt on demand
      KOPIUR_IGNORE_RULES: "[/lost+found, /home/.cache/*, /home/.npm/*, /home/.local/share/pnpm/store/*, /home/.cargo/registry/*, /home/.rustup/toolchains/*, /home/.local/share/mise/installs/*, /workspace/*/target/*, /workspace/*/node_modules/*]"

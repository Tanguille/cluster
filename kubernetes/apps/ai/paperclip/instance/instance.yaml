---
# yaml-language-server: $schema=https://raw.githubusercontent.com/paperclipinc/paperclip-operator/main/config/crd/bases/paperclip.inc_instances.yaml
apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: my-paperclip
spec:
  # The operator pulls by digest when set; tag is kept for Renovate.
  image:
    repository: ghcr.io/paperclipai/paperclip
    tag: 2026.916.1
    digest: sha256:a02ac35ac41df911af477422ea0e781cf41d2b2c600c66f0a5ac9d8c63f52c2c
  # Kept explicit: CRD defaults apply only inside a present object, and the
  # operator (no webhook) passes an empty mode through to the app.
  deployment:
    mode: authenticated
    exposure: private
  database:
    mode: managed
  auth:
    secretRef:
      name: paperclip-auth
      key: BETTER_AUTH_SECRET
  adapters:
    apiKeysSecretRef:
      name: paperclip-api-keys
  # apiKeysSecretRef injects only the two *_API_KEY entries, so endpoints go here.
  # Anthropic clients append /v1/messages themselves; OpenAI clients expect /v1.
  env:
    - name: ANTHROPIC_BASE_URL
      value: http://litellm.ai.svc.cluster.local
    # Adapter default is claude-opus-5; litellm serves no Claude models.
    - name: ANTHROPIC_MODEL
      value: qwen-3.8
    # Claude CLI background calls otherwise request a haiku model.
    - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
      value: qwen-3.8
    - name: OPENAI_BASE_URL
      value: http://litellm.ai.svc.cluster.local/v1
  storage:
    persistence:
      accessModes:
        - ReadWriteOnce
  security:
    seLinuxRelabel: false
    # The rendered default-deny policy blocks egress to in-cluster LiteLLM.
    networkPolicy:
      enabled: false
  probes:
    startup:
      failureThreshold: 60
      periodSeconds: 5
  podAnnotations:
    reloader.stakater.com/auto: "true"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  observability:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/paperclipinc/paperclip-operator/main/config/crd/bases/paperclip.inc_instances.yaml
apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: my-paperclip
  namespace: ai
spec:
  image:
    repository: ghcr.io/paperclipai/paperclip
    tag: v2026.916.1
    pullPolicy: IfNotPresent
  workload: StatefulSet
  deployment:
    mode: authenticated
    exposure: private
  database:
    mode: managed
    managed:
      storageSize: 10Gi
      storageClass: ceph-block
  auth:
    secretRef:
      name: paperclip-auth
      key: BETTER_AUTH_SECRET
  adapters:
    apiKeysSecretRef:
      name: paperclip-api-keys
  storage:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ceph-block
      accessModes:
        - ReadWriteOnce
  networking:
    service:
      type: ClusterIP
      port: 3100
  security:
    seLinuxRelabel: false
    networkPolicy:
      enabled: false
  probes:
    type: auto
    startup:
      failureThreshold: 60
      periodSeconds: 5
  availability:
    replicas: 1
  podAnnotations:
    reloader.stakater.com/auto: "true"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  observability:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
    logging:
      level: info

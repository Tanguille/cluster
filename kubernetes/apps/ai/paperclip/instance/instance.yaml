---
# yaml-language-server: $schema=https://raw.githubusercontent.com/paperclipinc/paperclip-operator/main/config/crd/bases/paperclip.inc_instances.yaml
apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: my-paperclip
spec:
  image:
    repository: ghcr.io/paperclipai/paperclip
    tag: v2026.916.1
  # Kept explicit: CRD defaults apply only inside a present object, and the
  # operator (no webhook) passes an empty mode through to the app.
  deployment:
    mode: authenticated
    exposure: private
  database:
    mode: managed
  auth:
    secretRef:
      name: paperclip-auth
      key: BETTER_AUTH_SECRET
  adapters:
    apiKeysSecretRef:
      name: paperclip-api-keys
  storage:
    persistence:
      accessModes:
        - ReadWriteOnce
  security:
    seLinuxRelabel: false
    # The rendered default-deny policy blocks egress to in-cluster LiteLLM.
    networkPolicy:
      enabled: false
  probes:
    startup:
      failureThreshold: 60
      periodSeconds: 5
  podAnnotations:
    reloader.stakater.com/auto: "true"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  observability:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

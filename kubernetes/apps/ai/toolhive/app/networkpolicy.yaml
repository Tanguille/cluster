---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmcp-unified-ingress-allowlist
spec:
  # ToolHive vMCP (`unified`) aggregates every ToolHive backend behind one
  # :4483/mcp endpoint and is anonymous (spec.incomingAuth: anonymous), so
  # reachability is the only access control there is. Scoped to the unified
  # vMCP pod alone, on top of the ai namespace ingress allowlist.
  endpointSelector:
    matchLabels:
      app: virtualmcpserver
      app.kubernetes.io/instance: unified
  ingress:
    - fromEndpoints:
        # Same-namespace consumers: hermes (MCP client), opencode (MCP client),
        # toolhive-operator (reconciler/health).
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hermes
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: opencode
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: toolhive-operator
        # envoy-internal proxying mcp.${SECRET_DOMAIN}; the only gateway that
        # front-refs the mcp-unified HTTPRoute.
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
        # gatus probing the service directly (not via envoy).
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: gatus-sidecar
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
    # vmagent scraping /metrics on the diagnostics port (MCPTelemetryConfig).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9464"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcpserver-proxy-ingress-allowlist
spec:
  # Every MCPServer gets a toolhive proxy Deployment (app: mcpserver) on :8080
  # with no auth of its own; only the unified vMCP, toolhive-operator and
  # kubelet probes reach it.
  endpointSelector:
    matchLabels:
      app: mcpserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app: virtualmcpserver
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: toolhive-operator
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcpserver-backend-ingress-allowlist
spec:
  # The MCP server StatefulSets (toolhive: "true" minus the proxy/vMCP
  # Deployments) hold the real credentials (talos, truenas, ...). Ports vary
  # per transport (8080/8086/3000/8081), so no toPorts: the only peer is the
  # proxy. stdio servers have no listener at all and are unaffected.
  endpointSelector:
    matchLabels:
      toolhive: "true"
    matchExpressions:
      - key: app
        operator: NotIn
        values: [mcpserver, virtualmcpserver]
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app: mcpserver
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: toolhive-ingress-deny
spec:
  # Deny ingress from outside ai except envoy-internal, gatus and vmagent (allow rules union, a deny wins).
  endpointSelector:
    matchLabels:
      toolhive: "true"
  ingressDeny:
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values:
                - default
                - kritika
                - security
        - matchLabels:
            io.kubernetes.pod.namespace: network
          matchExpressions:
            - key: gateway.networking.k8s.io/gateway-name
              operator: NotIn
              values:
                - envoy-internal
        - matchLabels:
            io.kubernetes.pod.namespace: observability
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: NotIn
              values:
                - gatus-sidecar
                - vmagent

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-operator
spec:
  chart:
    kind: OCIRepository
    spec:
      ref:
        tag: 0.70.0
      url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
  interval: 1h
  values:
    operator:
      # Chart lowered GOMEMLIMIT to 110MiB in 0.41.0, under the 128Mi live RSS, so the GC ran flat out; raise it with the limit.
      gc:
        gomemlimit: 230MiB
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 256Mi

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/serviceaccount_v1.json
# vmcp leaks 250-430 MiB/day (stacklok/toolhive#5860) and its sessions degrade by day 3 at ~40% of the
# memory limit, so restart every 2 days. Delete this file once #5860 is fixed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmcp-restart
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vmcp-restart
rules:
  # `kubectl rollout restart` is a get + patch of the pod template; scoped to the one
  # deployment so the token cannot touch anything else in the namespace.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["unified"]
    verbs: ["get", "patch"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vmcp-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vmcp-restart
subjects:
  - kind: ServiceAccount
    name: vmcp-restart
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vmcp-restart
spec:
  # Odd days: worst gap is 2 days; 31->1 is 1 day, tighter, never looser.
  schedule: "30 3 */2 * *"
  timeZone: ${TIMEZONE}
  # Don't start a missed run after 04:30 (quiet-window cutoff).
  startingDeadlineSeconds: 3600
  # Allow, not Forbid: a run stuck Pending (activeDeadlineSeconds only counts once a pod is
  # scheduled) stays "active" and under Forbid silently skipped the next tick — that is
  # what happened on 2026-10-29 (10-25 run stuck, 03:30 tick skipped, CronJobNotScheduled
  # firing 4 days later). This job is an idempotent `rollout restart`, so an overlapping
  # run is harmless: worst case the deployment restarts twice.
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: vmcp-restart
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              # Skew-matched to the 1.37 server; Renovate bumps it.
              image: registry.k8s.io/kubectl:v1.37.2@sha256:fe049faa65ae483ac200009a949a68fa4c9985daea12c9cb1195c9c7965301fc
              args:
                - rollout
                - restart
                - deployment/unified
                - -n
                - ai
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi

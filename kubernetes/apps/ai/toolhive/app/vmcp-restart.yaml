---
# vmcp leaks 250-414 MiB/day (14d, stacklok/toolhive#5860); at the peak, restarting every 3 days
# stays under AiContainerMemoryNearLimit, short of the ~5-day OOM.
# 2026-10-28 (t_47b710c7): 4-day cadence insufficient - outage on day 3 (leak 250-414 MiB/day vs 2Gi limit); tightened to 3 days.
# Delete this file once #5860 is fixed.
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/serviceaccount_v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmcp-restart
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vmcp-restart
rules:
  # `kubectl rollout restart` is a get + patch of the pod template; scoped to the one
  # deployment so the token cannot touch anything else in the namespace.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["unified"]
    verbs: ["get", "patch"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vmcp-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vmcp-restart
subjects:
  - kind: ServiceAccount
    name: vmcp-restart
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vmcp-restart
spec:
  # Explicit day list instead of a 1-31/3 step so the cadence is legible at a
  # glance. Worst gap is 3 days (28->1 in a 30-day month); 31->1 is 1 day --
  # tighter, never looser, than the 3-day cadence the leak rate needs.
  schedule: "30 3 1,4,7,10,13,16,19,22,25,28,31 * *"
  timeZone: ${TIMEZONE}
  # Don't start a missed run after 04:30 (quiet-window cutoff).
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: vmcp-restart
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              # Skew-matched to the 1.37 server; Renovate bumps it.
              image: registry.k8s.io/kubectl:v1.37.2
              args:
                - rollout
                - restart
                - deployment/unified
                - -n
                - ai
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi

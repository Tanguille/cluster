---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: toolhive-rules
spec:
  groups:
    - name: toolhive.rules
      rules:
        # Gatus probes each vmcp with a real MCP initialize, which stays green while
        # individual backends drop out; only the CR reports per-backend health
        - alert: VirtualMCPServerNotReady
          expr: |-
            max by (exported_namespace, name, phase) (toolhive_resource_info{ready!="True"})
          for: 15m
          annotations:
            summary: >-
              VirtualMCPServer {{ $labels.exported_namespace }}/{{ $labels.name }} is not
              ready (phase={{ $labels.phase }}) — tools may be missing from the gateway
          labels:
            severity: warning

        # vmcp leaks (#5860, vmcp-restart.yaml); alert on the approach, since each OOM kill costs a full optimizer re-embed and Gatus probes every 15m miss it.
        - alert: AiContainerMemoryNearLimit
          expr: |-
            container_memory_working_set_bytes{namespace="ai", container!=""}
              / on (namespace, pod, container)
            kube_pod_container_resource_limits{namespace="ai", resource="memory"}
              > 0.9
          for: 15m
          annotations:
            summary: >-
              ai/{{ $labels.pod }} container {{ $labels.container }} is at
              {{ $value | humanizePercentage }} of its memory limit
            description: >-
              vmcp (pod unified-*): the known #5860 leak; firing before the vmcp-restart
              CronJob runs means the leak grew. Restart it at a quiet moment with
              `kubectl rollout restart deploy/unified -n ai` (drains cleanly, an OOM kill
              does not); raising the limit only moves the OOM.
              Any other container: plot the working set between restarts; a rising slope
              is a leak, a flat line near the ceiling means the limit is too low.
          labels:
            severity: warning

        # Catches the kill itself for anything in the namespace, including backends
        # whose limits were never tuned. Fires on a change in the counter rather
        # than its presence, so an old OOM does not alert forever.
        - alert: AiContainerOOMKilled
          expr: |-
            increase(kube_pod_container_status_restarts_total{namespace="ai"}[10m]) > 0
            and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{namespace="ai", reason="OOMKilled"} == 1
          annotations:
            summary: >-
              ai/{{ $labels.pod }} container {{ $labels.container }} was OOMKilled
            description: >-
              Already restarting; confirm it came back ready, then find why
              AiContainerMemoryNearLimit missed it (growth outran its 15m `for:`, or a
              sudden jump). vmcp OOMing between vmcp-restart runs means the leak
              accelerated: report it on stacklok/toolhive#5860 with the growth series.
          labels:
            severity: warning

        - alert: VirtualMCPServerAbsent
          expr: |-
            absent(toolhive_resource_info)
          for: 5m
          annotations:
            summary: >-
              No VirtualMCPServer metrics — kube-state-metrics lost the toolhive CRs, gateway health is unmonitored
          labels:
            severity: warning

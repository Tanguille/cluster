# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ghostfolio
spec:
  image: ghcr.io/mhajder/ghostfolio-mcp:1.7.0@sha256:e0cce33b6f0d48ec7290cfae2ca5327a68568e9b72c0b68e6b28e7f49393c41e
  # ghostfolio-mcp's own transport selection only recognizes "http"/"sse" as literal
  # values (src/ghostfolio_mcp/server.py); toolhive injects spec.transport verbatim as
  # MCP_TRANSPORT, so "streamable-http" silently falls through to its stdio default
  # while the proxy still expects a network listener on mcpPort — crash loop.
  transport: stdio
  proxyPort: 8080
  groupRef:
    name: all
  toolConfigRef:
    name: ghostfolio
  env:
    - name: GHOSTFOLIO_URL
      value: http://ghostfolio.default.svc.cluster.local:3333
    # Cautious default: the agent gets read access first; flip once its
    # recommendations are trusted enough to let it place trades/edit activities.
    - name: READ_ONLY_MODE
      value: "true"
  secrets:
    - name: toolhive-secrets
      key: GHOSTFOLIO_TOKEN
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 100Mi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: ghostfolio
spec:
  # Source: mhajder/ghostfolio-mcp 1.7.0 src/ghostfolio_mcp/tools (2026-09-30); exhaustive, including TOOL_SEARCH_ENABLED extras.
  toolsFilter:
    - add_market_data_points
    - add_to_watchlist
    - call_tool
    - create_account
    - create_account_balance
    - create_activity
    - delete_account
    - delete_account_balance
    - delete_activity
    - delete_asset_profile
    - export_portfolio
    - get_account_balances
    - get_account_details
    - get_accounts
    - get_asset_profile
    - get_benchmark_performance
    - get_benchmarks
    - get_dividends
    - get_dividends_for_import
    - get_exchange_rate
    - get_health
    - get_historical_data
    - get_investments
    - get_market_data_for_asset
    - get_orders
    - get_platforms
    - get_portfolio_details
    - get_portfolio_holdings
    - get_portfolio_performance
    - get_position
    - get_symbol_data
    - get_user_info
    - get_watchlist
    - import_transactions
    - lookup_symbols
    - remove_from_watchlist
    - search_tools
    - transfer_account_balance
    - update_account
    - upsert_asset_profile

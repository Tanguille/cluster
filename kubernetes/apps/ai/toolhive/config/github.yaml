# GitHub's hosted MCP server instead of the self-run container: stdio dies on the
# virtual-MCP health check re-running `initialize` (#5890, still open in 0.41.0) and
# the container's http mode has no server-side token path (#4220). A remote entry has
# neither problem — headerForward injects the PAT server-side, the same shape context7
# has run since 2026-04. The endpoint takes a raw PAT (verified: `Bearer <pat>` and a
# bare `<pat>` both return 200, `token <pat>` returns 400), so the existing secret key
# goes in unmodified. Despite the hostname, no Copilot entitlement is involved: a token
# carrying no `copilot` scope lists all 46 repo/issue/PR tools.
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: github
spec:
  remoteUrl: https://api.githubcopilot.com/mcp/
  transport: streamable-http
  groupRef:
    name: all
  toolConfigRef:
    name: github
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-secrets
          key: GITHUB_PERSONAL_ACCESS_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: github
spec:
  # Source: github/github-mcp-server upstream catalog (2026-09-30); exhaustive catalog, hosted endpoint exposes an approximately 46-tool subset.
  toolsFilter:
    - actions_get
    - actions_list
    - actions_run_trigger
    - add_comment_to_pending_review
    - add_issue_comment
    - add_reply_to_pull_request_comment
    - assign_copilot_to_issue
    - assign_copilot_to_issue_with_intent
    - create_branch
    - create_gist
    - create_or_update_file
    - create_pull_request
    - create_repository
    - create_repository_ruleset
    - custom_properties_read
    - custom_properties_write
    - delete_file
    - delete_repository
    - discussion_comment_write
    - dismiss_notification
    - fork_repository
    - get_code_quality_finding
    - get_code_scanning_alert
    - get_commit
    - get_dependabot_alert
    - get_discussion
    - get_discussion_comments
    - get_file_contents
    - get_gist
    - get_job_logs
    - get_label
    - get_latest_release
    - get_me
    - get_notification_details
    - get_release_by_tag
    - get_repository_tree

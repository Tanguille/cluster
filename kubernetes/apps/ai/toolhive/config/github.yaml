# Hosted MCP server, not the self-run container: stdio dies on the vMCP health check re-running `initialize` (#5890) and the container's http mode has no server-side token path (#4220).
# The endpoint takes a raw PAT (`Bearer <pat>` and bare `<pat>` return 200, `token <pat>` returns 400); no Copilot entitlement is needed, a token without the `copilot` scope lists all 46 tools.
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: github
spec:
  remoteUrl: https://api.githubcopilot.com/mcp/
  transport: streamable-http
  groupRef:
    name: all
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-secrets
          key: GITHUB_PERSONAL_ACCESS_TOKEN

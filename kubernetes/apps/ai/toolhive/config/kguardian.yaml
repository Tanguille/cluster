# kguardian LLM bridge MCP server (security ns), served by the chart's llm-bridge at /mcp on :8080.
# The .svc short form is deliberate: ToolHive's SSRF guard rejects *.cluster.local (same gap as memini.yaml, which explains it) and ndots resolves the full name.
# Auth is a static Bearer token forwarded server-side from toolhive-secrets.KGUARDIAN_MCP_TOKEN (the full "Bearer <hex>" string); the raw token also lives in security/kguardian/app/secret.sops.yaml (kguardian-mcp-token:token) for the broker's MCP_AUTH_TOKEN.
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: kguardian
spec:
  remoteUrl: http://kguardian-llm-bridge.security.svc:8080/mcp
  transport: streamable-http
  groupRef:
    name: all
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-secrets
          key: KGUARDIAN_MCP_TOKEN

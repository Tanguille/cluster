---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name postgres-mcp
spec:
  image: crystaldba/postgres-mcp:0.3.0@sha256:dbbd346860d29f1543e991f30f3284bf4ab5f096d049ecc3426528f20b1b6e6b
  transport: stdio
  groupRef:
    name: database
  args:
    - "--access-mode=restricted"
  secrets:
    - name: toolhive-secrets
      key: POSTGRES_MCP_DATABASE_URI
      targetEnvName: DATABASE_URI
  toolConfigRef:
    name: *name
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: postgres-mcp-opt
spec:
  image: crystaldba/postgres-mcp:0.3.0@sha256:dbbd346860d29f1543e991f30f3284bf4ab5f096d049ecc3426528f20b1b6e6b
  transport: stdio
  groupRef:
    name: all
  args:
    - "--access-mode=restricted"
  secrets:
    - name: toolhive-secrets
      key: POSTGRES_MCP_DATABASE_URI
      targetEnvName: DATABASE_URI
  toolConfigRef:
    name: postgres-mcp
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: postgres-mcp
spec:
  toolsFilter: []

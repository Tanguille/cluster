---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: unified
spec:
  # Single replica on purpose: the optimizer's tool index is in-memory per-pod, so a session
  # that lands on a second replica triggers a full re-embed (lazyInjectSessionTools). One
  # replica eliminates that cross-pod double-embed. Trade-off: no HA on this gateway.
  replicas: 1
  podTemplateSpec:
    spec:
      # The operator sets readOnlyRootFilesystem, so the optimizer's FTS5 index has
      # nowhere to spill: queries whose sorter exceeds memory fail with "disk I/O
      # error (6410)", which the MCP layer returns as zero matches rather than an
      # error. An agent reads that as "this tool does not exist".
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: vmcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            # sqlite's unix VFS tries /var/tmp before /tmp; both are read-only here,
            # so point it at the mount explicitly instead of relying on the search order.
            - name: TMPDIR
              value: /tmp
            - name: OPENAI_API_KEY
              value: ${LITELLM_API_KEY}
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 5
            initialDelaySeconds: 0
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 10
  sessionStorage:
    provider: redis
    address: dragonfly.database.svc.cluster.local:6379
    keyPrefix: "thv:vmcp:unified:session:"
  incomingAuth:
    type: anonymous
  groupRef:
    name: all
  config:
    # Cold embedding cache takes ~27-35s on the iGPU, past the 30s default
    # (2026-07-03). Anchored to embeddingServiceTimeout — same call.
    # ponytail: `default` covers every backend request, not just session-build;
    # switch to perWorkload if a hung backend's slow failure starts mattering.
    operational:
      timeouts:
        default: &embeddingTimeout 120s
      # Default healthCheckTimeout (10s) marks a backend "degraded" past ~5s (half-timeout
      # heuristic) -- routine control-1 latency blips cross that and flap every backend's
      # status at once. Raised so a transient node stall doesn't read as a backend outage.
      failureHandling:
        healthCheckTimeout: 20s
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    optimizer:
      # embeddingServerRef omitted: operator rejects when embeddingProvider is "openai".
      # Routes to litellm -> existing iGPU embedder instead.
      embeddingProvider: openai
      embeddingService: http://litellm.ai.svc.cluster.local/v1
      embeddingModel: vmcp-embedding
      embeddingServiceTimeout: *embeddingTimeout
      # find_tool returns each match's FULL json schema, re-prefilled every
      # later turn: measured 7,721 tok/turn over 339 turns. Default 8 bound
      # only 2 of 11 stored calls (mean 5.91 returned); top 3 drops 48.9% of
      # schema bytes.
      maxToolsToReturn: 3

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: flux
spec:
  replicas: 2
  sessionStorage:
    provider: redis
    address: dragonfly.database.svc.cluster.local:6379
    keyPrefix: "thv:vmcp:flux:session:"
  incomingAuth:
    type: anonymous
  groupRef:
    name: flux
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: observability
spec:
  replicas: 2
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              # OOMKilled at the operator's 512Mi default.
              memory: 1Gi
  sessionStorage:
    provider: redis
    address: dragonfly.database.svc.cluster.local:6379
    keyPrefix: "thv:vmcp:observability:session:"
  incomingAuth:
    type: anonymous
  groupRef:
    name: observability
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
# Named "ha" to avoid Deployment name collision with MCPServer "homeassistant"
# (operator creates Deployment = name).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: ha
spec:
  replicas: 2
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              # OOMKilled twice at 1Gi; peaks swing 30Mi-1022Mi with session load.
              memory: 2Gi
  sessionStorage:
    provider: redis
    address: dragonfly.database.svc.cluster.local:6379
    keyPrefix: "thv:vmcp:ha:session:"
  incomingAuth:
    type: anonymous
  groupRef:
    name: homeassistant
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
---

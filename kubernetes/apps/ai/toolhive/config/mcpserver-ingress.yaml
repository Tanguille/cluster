---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcpserver-proxy-ingress-allowlist
spec:
  # Every MCPServer gets a toolhive proxy Deployment (app: mcpserver) on :8080
  # with no auth of its own; the unified vMCP is its only client. Observed
  # ingress over 48h (kguardian): unified pod + kubelet probes, nothing else.
  endpointSelector:
    matchLabels:
      app: mcpserver
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app: virtualmcpserver
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: toolhive-operator
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Rev-NAT'd DNS replies hit ingress; no toPorts, dest port is ephemeral.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcpserver-backend-ingress-allowlist
spec:
  # The MCP server StatefulSets (toolhive: "true" minus the proxy/vMCP
  # Deployments) hold the real credentials (talos, truenas, ...). Ports vary
  # per transport (8080/8086/3000/8081), so no toPorts: the only peer is the
  # proxy. stdio servers have no listener at all and are unaffected.
  endpointSelector:
    matchLabels:
      toolhive: "true"
    matchExpressions:
      - key: app
        operator: NotIn
        values: [mcpserver, virtualmcpserver]
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app: mcpserver
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns

# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: homeassistant
spec:
  image: ghcr.io/homeassistant-ai/ha-mcp:9.2.0@sha256:9de5bf6c4216142fdffe862900abe72dac8dfe9621dd0b2b050d132372b676ba
  transport: streamable-http
  mcpPort: 8086
  groupRef:
    name: all
  env:
    - name: HOMEASSISTANT_URL
      value: http://${HOME_ASSISTANT_IP}:8123
    - name: ENABLE_BETA_FEATURES
      value: "true"
    - name: HAMCP_ENABLE_DASHBOARD_SCREENSHOT
      value: "true"
    - name: HAMCP_DASHBOARD_SCREENSHOT_ENGINE_URL
      value: http://${HOME_ASSISTANT_IP}:10000
  secrets:
    - name: toolhive-secrets
      key: HOMEASSISTANT_API_TOKEN
      targetEnvName: HOMEASSISTANT_TOKEN
  podTemplateSpec:
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          command: ["ha-mcp-web"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: mcp
              containerPort: 8086
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 1
              memory: 512Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

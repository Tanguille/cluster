# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: searxng
spec:
  image: ghcr.io/rcdailey/mcp-searxng:latest@sha256:ccef0130bbbadb0593512cd24a1176e517245887c103859154b4afb93e5c90dc
  groupRef:
    name: all
  env:
    - name: SEARXNG_URL
      value: http://searxng.default.svc.cluster.local:8080
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 100Mi

# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
# cedricziel/truenas-mcp (MIT): read-only unless TRUENAS_MCP_ENABLE_WRITES, on top of upstream's denylist of unrecoverable ops.
# Chosen over iXsystems' server: stalled upstream, binaries only, no --readonly.
# TLS stays verified: the target is its Let's Encrypt name, no INSECURE flag.
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: truenas
spec:
  image: ghcr.io/cedricziel/truenas-mcp:0.4.2@sha256:1a165c9b3831b8cf546c78231857896431c27a4465d2fcb16260c7d578bbee55
  args: ["--stdio"]
  groupRef:
    name: all
  env:
    - name: TRUENAS_MCP_TARGET
      value: truenas.${SECRET_DOMAIN}
  secrets:
    - name: toolhive-secrets
      key: TRUENAS_MCP_API_KEY
      targetEnvName: TRUENAS_MCP_API_KEY
  podTemplateSpec:
    spec:
      # Only the proxy manages Kubernetes pods; this backend uses its configured service credentials.
      automountServiceAccountToken: false
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: truenas
spec:
  # Source: cedricziel/truenas-mcp 0.4.2 README; curated, omits call_method, includes conditional write tools.
  # The single-word dispatcher tools (apps, backup, catalog, filesystem, inventory,
  # jobs, sharing, storage, system, virtualization) are read-only and cannot mutate state.
  toolsFilter:
    - app_pull_images
    - app_redeploy
    - app_rollback
    - app_start
    - app_stop
    - app_upgrade
    - apps
    - backup
    - catalog
    - create_nfs_export
    - create_smb_share
    - create_snapshot
    - describe_method
    - filesystem
    - inventory
    - jobs
    - search_methods
    - server_info
    - set_path_acl
    - set_smb_share_acl
    - sharing
    - storage
    - system
    - system_info
    - virtualization

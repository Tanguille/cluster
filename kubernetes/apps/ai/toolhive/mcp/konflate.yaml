---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
# Read-only rendered-diff tools; the endpoint has no auth and the public route redirects /mcp, so only in-cluster callers reach it.
# .svc short form, not .cluster.local: see kguardian.yaml.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: konflate
spec:
  remoteUrl: http://konflate.kritika.svc:8080/mcp
  transport: streamable-http
  groupRef:
    name: all

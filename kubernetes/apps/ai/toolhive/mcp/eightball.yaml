# .svc short form, not .cluster.local: see kguardian.yaml.
# EIGHTBALL_MCP_TOKEN holds 'Bearer <key>'; the raw key is EIGHTBALL_API_KEY in ai/eightball/app/secret.sops.yaml.
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: eightball
spec:
  remoteUrl: http://eightball.ai.svc:8080/mcp
  transport: streamable-http
  groupRef:
    name: all
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-secrets
          key: EIGHTBALL_MCP_TOKEN

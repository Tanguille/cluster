---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opnsense-proxy-isolation
spec:
  # Matches proxy AND stdio pod, following observed operator labels.
  endpointSelector:
    matchLabels:
      toolhive-name: opnsense
  # Deny overrides the namespace's broad ingress allow union. Only unified's
  # identity may reach the proxy; node-local kubelet health checks remain allowed.
  # Preserve allow-kube-dns-replies for same-node rev-NAT replies on ephemeral
  # ports. Scope that exception to kube-system, not any pod labeled kube-dns.
  ingressDeny:
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
            - key: io.kubernetes.pod.namespace
              operator: NotIn
              values: [ai, kube-system]
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: [ai]
            - key: toolhive-name
              operator: NotIn
              values: [unified]
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: [kube-system]
            - key: k8s-app
              operator: NotIn
              values: [kube-dns]
    # DNS replies do not require the MCP port; keep even CoreDNS out of it.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - world
        - remote-node
        - kube-apiserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            toolhive-name: unified
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opnsense-backend-egress
spec:
  # Only the stdio workload. The ToolHive proxy needs Kubernetes API attach;
  # do not constrain that controller-facing pod as if it were the backend.
  endpointSelector:
    matchLabels:
      toolhive-basename: opnsense
  egress:
    - toCIDR:
        - ${OPNSENSE_IP}/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

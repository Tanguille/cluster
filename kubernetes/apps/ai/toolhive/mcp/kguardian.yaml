# ToolHive checks only *.cluster.local, not bare .svc; allowPrivateEndpoint would lift that but also
# opens RFC 1918 and ULA targets. memini and konflate use the same bare form.
# KGUARDIAN_MCP_TOKEN holds 'Bearer <hex>'; the raw token is kguardian-mcp-token.token in security/kguardian/app/secret.sops.yaml.
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: kguardian
spec:
  remoteUrl: http://kguardian-llm-bridge.security.svc:8080/mcp
  transport: streamable-http
  groupRef:
    name: all
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-secrets
          key: KGUARDIAN_MCP_TOKEN

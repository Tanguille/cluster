# KRITIKA_MCP_TOKEN holds the full 'Bearer <token>' Authorization header.
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: kritika
spec:
  remoteUrl: https://kritika.${SECRET_DOMAIN}/mcp
  transport: streamable-http
  groupRef:
    name: all
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-secrets
          key: KRITIKA_MCP_TOKEN

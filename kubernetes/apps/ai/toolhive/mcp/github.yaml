# Hosted server, not the self-run container: its http mode has no server-side token path (#4220)
# and stdio dies on vMCP's repeated `initialize` health check (#5890, closed upstream, stdio stays off).
# headerForward sends the raw PAT as-is; no Copilot entitlement is needed despite the hostname.
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: github
spec:
  remoteUrl: https://api.githubcopilot.com/mcp/
  transport: streamable-http
  groupRef:
    name: all
  headerForward:
    addPlaintextHeaders:
      X-MCP-Toolsets: context,repos,issues,pull_requests,users,actions,code_quality,code_security,dependabot,discussions,gists,git,governance,labels,notifications,orgs,projects
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-secrets
          key: GITHUB_PERSONAL_ACCESS_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: github
spec:
  toolsFilter:
    - actions_get
    - actions_list
    - actions_run_trigger
    - add_comment_to_pending_review
    - add_issue_comment
    - add_reply_to_pull_request_comment
    - create_branch
    - create_or_update_file
    - create_pull_request
    - custom_properties_read
    - delete_file
    - get_code_quality_finding
    - get_code_scanning_alert
    - get_commit
    - get_dependabot_alert
    - get_discussion
    - get_discussion_comments
    - get_file_contents
    - get_gist
    - get_job_logs
    - get_label
    - get_latest_release
    - get_me
    - get_notification_details
    - get_release_by_tag
    - get_repository_tree
    - get_tag
    - get_team_members
    - get_teams
    - issue_read
    - issue_write
    - list_branches
    - list_code_scanning_alerts
    - list_commits
    - list_dependabot_alerts
    - list_discussion_categories
    - list_discussions
    - list_gists
    - list_issue_fields
    - list_issue_types
    - list_issues
    - list_label
    - list_notifications
    - list_pull_requests
    - list_releases
    - list_repository_collaborators
    - list_tags
    - projects_get
    - projects_list
    - pull_request_read
    - pull_request_review_write
    - repository_ruleset_read

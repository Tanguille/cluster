# Hosted server, not the self-run container: its http mode has no server-side token path (#4220)
# and stdio dies on vMCP's repeated `initialize` health check (#5890, closed upstream, stdio stays off).
# headerForward sends the raw PAT as-is; no Copilot entitlement is needed despite the hostname.
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: github
spec:
  remoteUrl: https://api.githubcopilot.com/mcp/
  transport: streamable-http
  groupRef:
    name: all
  headerForward:
    addPlaintextHeaders:
      X-MCP-Toolsets: context,repos,issues,pull_requests,users,actions
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-secrets
          key: GITHUB_PERSONAL_ACCESS_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: github
spec:
  toolsFilter:
    - actions_get
    - actions_list
    - actions_run_trigger
    - add_comment_to_pending_review
    - add_issue_comment
    - add_reply_to_pull_request_comment
    - create_branch
    - create_or_update_file
    - create_pull_request
    - delete_file
    - get_commit
    - get_file_contents
    - get_job_logs
    - get_label
    - get_latest_release
    - get_me
    - get_release_by_tag
    - get_tag
    - get_team_members
    - get_teams
    - issue_read
    - issue_write
    - list_branches
    - list_commits
    - list_issue_fields
    - list_issue_types
    - list_issues
    - list_pull_requests
    - list_releases
    - list_repository_collaborators
    - list_tags
    - pull_request_read
    - pull_request_review_write
    - search_code
    - search_issues
    - search_pull_requests
    - search_repositories
    - sub_issue_write
    - update_issue_comment
    - update_pull_request
    - update_pull_request_branch

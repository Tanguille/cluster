# changedetection.io >= 0.70.1 ships a built-in MCP server (stateless streamable HTTP at /mcp/v1);
# MCPServerEntry proxies the running instance in place, no bridge pod.
# The Bearer token is created in the instance UI: Settings -> AI / LLM / MCP -> Access tokens
# (token "hermes": write on monitors/tags/notifications, read on system info).
# CHANGEDETECTION_MCP_TOKEN holds 'Bearer <token>' in toolhive-secrets (sops-encrypted).
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: changedetection
spec:
  remoteUrl: http://changedetection.default.svc.cluster.local:5000/mcp/v1
  transport: streamable-http
  groupRef:
    name: all
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-secrets
          key: CHANGEDETECTION_MCP_TOKEN

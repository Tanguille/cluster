---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: memini
spec:
  remoteUrl: http://memini.ai.svc:8080/mcp
  transport: streamable-http
  groupRef:
    name: all
  # Same namespace and home as the hermes memini plugin (MEMINI_NAMESPACE/MEMINI_HOME), so memories
  # written through the vMCP and by hermes share one read set instead of landing in "default".
  headerForward:
    addPlaintextHeaders:
      X-Memini-Namespace: tanguille
      X-Memini-Home: cluster

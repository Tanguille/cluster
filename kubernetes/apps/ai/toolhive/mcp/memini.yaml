---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: memini
spec:
  remoteUrl: http://memini.ai.svc:8080/mcp
  transport: streamable-http
  groupRef:
    name: all
  # Only forward the home namespace (shared across profiles). Each Hermes profile
  # sets its own MEMINI_NAMESPACE via its .env/profile config — do NOT pin the
  # namespace here, or every project on the machine shares the "tanguille" pool
  # (the global-namespace-pin warning from memini itself). Removing this header
  # forward lets each profile resolve its own namespace via the MCP client
  # headers the plugin already sends.
  headerForward:
    addPlaintextHeaders:
      X-Memini-Home: cluster

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcptelemetryconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPTelemetryConfig
metadata:
  name: prometheus
spec:
  prometheus:
    enabled: true
    # Unset serves /metrics on anonymous :4483 too (routed via mcp-unified); keep it on 9464 only.
    metricsOnTransportPort: false

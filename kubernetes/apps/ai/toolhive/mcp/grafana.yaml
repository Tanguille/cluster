# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
spec:
  image: grafana/mcp-grafana:2.2.0@sha256:697336440e34878f8e0b26a69675db8d7e97b4d0daec25ec5441c85ac6c60e81
  transport: streamable-http
  mcpPort: 8000
  groupRef:
    name: all
  args:
    - "-t"
    - "streamable-http"
    - "-address"
    - "0.0.0.0:8000"
    # proxy sends the backend Service as Host; any ai pod can reach it, toolhive-ingress-deny fences other namespaces
    - "-allowed-hosts"
    - "*"
    # Grafana OSS + Prometheus/Alertmanager only; Cloud, Pyroscope, Loki and
    # Sift-backed tools have no datasource here.
    - "-enabled-tools"
    - "search,datasource,prometheus,alerting,dashboard,folder,annotations,rendering,navigation"
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability.svc.cluster.local:3000
    # 2.0 enables anonymous usage stats by default
    - name: GRAFANA_USAGE_STATS
      value: disabled
  podTemplateSpec:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 100Mi

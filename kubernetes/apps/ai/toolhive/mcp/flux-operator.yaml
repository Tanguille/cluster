# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: flux-operator
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.62.1@sha256:0b4181bc9ada80eedf3e9df3355153abc9c3e6d8b913bddebe0b12908309bff6
  transport: streamable-http
  groupRef:
    name: all
  args:
    - serve
    - --transport=http
    - --port=8080
  # In-cluster auth: the old static admin kubeconfig carried a client cert that expired after 1 year.
  serviceAccount: flux-operator-mcp
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          ports:
            - name: mcp
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 1
              memory: 256Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 200Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-operator-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-operator-mcp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: flux-operator-mcp
    namespace: ai
---
# Flux CRD write access for reconcile/suspend/resume.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-operator-mcp-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-operator-edit
subjects:
  - kind: ServiceAccount
    name: flux-operator-mcp
    namespace: ai
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: flux-operator
spec:
  # Source: controlplaneio-fluxcd/flux-operator cmd/mcp/toolbox and docs/mcp/tools.md; curated, omits install_flux_instance and set_kubeconfig_context.
  toolsFilter:
    - apply_kubernetes_manifest
    - delete_kubernetes_resource
    - diff_kubernetes_manifest
    - get_flux_instance
    - get_kubeconfig_contexts
    - get_kubernetes_api_versions
    - get_kubernetes_events
    - get_kubernetes_logs
    - get_kubernetes_metrics
    - get_kubernetes_resources
    - patch_kubernetes_resource
    - read_flux_doc
    - reconcile_flux_resource
    - resume_flux_reconciliation
    - search_flux_docs
    - suspend_flux_reconciliation
    - trace_kubernetes_resource

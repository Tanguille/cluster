---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: orbitread
spec:
  toolsFilter:
    - get_task
    - list_task_statuses
    - list_tasks
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpremoteproxy_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: orbitread
spec:
  remoteUrl: https://orbit.${SECRET_DOMAIN}/mcp
  transport: streamable-http
  toolConfigRef:
    name: orbitread
  telemetryConfigRef:
    name: prometheus
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive-secrets
          key: ORBIT_READ_MCP_TOKEN

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: victorialogs-mcp
spec:
  image: ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0@sha256:753bb4fbe402ca1a782842f44636830f9895736f11d7fe783b924f8a0daf083d
  # Native streamable-http: the proxy pod reaches /mcp on :8081 (MCP_LISTEN_ADDR) directly, no stdio bridge.
  transport: streamable-http
  mcpPort: 8081
  groupRef:
    name: all
  env:
    - name: HOME
      value: /tmp
    # VictoriaLogs single-node in observability/ (helm server.fullnameOverride: victoria-logs),
    # no auth configured — plain HTTP.
    - name: VL_INSTANCE_ENTRYPOINT
      value: http://victoria-logs.observability.svc.cluster.local:9428
    - name: MCP_SERVER_MODE
      value: http
    # Binary defaults to localhost:8081 (upstream config.go), unreachable from the separate proxy pod.
    - name: MCP_LISTEN_ADDR
      value: 0.0.0.0:8081
    # Hide the non-query tools (server flag list + docs prompt); query toolset only.
    - name: MCP_DISABLED_TOOLS
      value: documentation,flags
  podTemplateSpec:
    spec:
      # The image runs as the unprivileged user `mcp` (uid 65534, no group in the
      # image config); the operator sets readOnlyRootFilesystem — /tmp is the only
      # path the server touches, mounted emptyDir. No cluster access needed, so no
      # SA token.
      automountServiceAccountToken: false
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: mcp
              containerPort: 8081
          # The binary ships /health/liveness + /health/readiness (v1.9.0).
          startupProbe:
            httpGet:
              path: /health/liveness
              port: mcp
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: mcp
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

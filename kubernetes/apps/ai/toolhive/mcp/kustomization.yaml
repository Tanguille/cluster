# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - changedetection.yaml
  - cloudflare.yaml
  - context7.yaml
  - eightball.yaml
  - flux-operator.yaml
  - flux-schema.yaml
  - ghostfolio.yaml
  - github.yaml
  - grafana.yaml
  - homeassistant.yaml
  - karakeep.yaml
  - kguardian.yaml
  - konflate.yaml
  - kritika.yaml
  - kubesearch.yaml
  - mcpgroups.yaml
  - mealie.yaml
  - memini.yaml
  - mesh-organiser.yaml
  - opnsense
  - podmonitor.yaml
  - searxng.yaml
  - talos-mcp.yaml
  - telemetryconfig.yaml
  - truenas.yaml
  - victorialogs-mcp.yaml
  - virtualmcpservers.yaml

patches:
  # Every MCPServer pod runs third-party tool code; MCPServerEntry has no pod. Opt a server out by narrowing the target.
  # No server needs its service account token: flux-operator authenticates with its own kubeconfig.
  - target:
      kind: MCPServer
    patch: |-
      apiVersion: toolhive.stacklok.dev/v1beta1
      kind: MCPServer
      metadata:
        name: not-used
      spec:
        podTemplateSpec:
          spec:
            automountServiceAccountToken: false
            runtimeClassName: gvisor

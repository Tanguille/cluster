# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - context7.yaml
  - flux-operator.yaml
  - flux-schema.yaml
  - ghostfolio.yaml
  - github.yaml
  - grafana.yaml
  - homeassistant.yaml
  - karakeep.yaml
  - kguardian.yaml
  - konflate.yaml
  - kubesearch.yaml
  - mcpgroups.yaml
  - memini.yaml
  - podmonitor.yaml
  - searxng.yaml
  - talos-mcp.yaml
  - telemetryconfig.yaml
  - truenas.yaml
  - victorialogs-mcp.yaml
  - virtualmcpservers.yaml

patches:
  # Every MCPServer pod runs third-party tool code; MCPServerEntry has no pod. Opt a server out by narrowing the target.
  - target:
      kind: MCPServer
    patch: |-
      apiVersion: toolhive.stacklok.dev/v1beta1
      kind: MCPServer
      metadata:
        name: not-used
      spec:
        podTemplateSpec:
          spec:
            runtimeClassName: gvisor
  # Unauthenticated proxy resolves the OS user at start; the static binary has no cgo, so it warns without $USER. Drop once proxy auth lands.
  - target:
      kind: MCPServer
    patch: |-
      apiVersion: toolhive.stacklok.dev/v1beta1
      kind: MCPServer
      metadata:
        name: not-used
      spec:
        resourceOverrides:
          proxyDeployment:
            env:
              - name: USER
                value: toolhive

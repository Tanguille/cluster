---
# Hermes managed scope: merged per key over every profile's PVC config.yaml.
webapp:
  enabled: true
  host: 0.0.0.0
  public_url: https://hermes.${SECRET_DOMAIN}
dashboard:
  # Envoy pods have no fixed IP; the Webapp listener reads this too.
  trusted_proxies:
    - ${POD_CIDR}
browser:
  # Hermes' auto-bypass doesn't detect uid 10000 on containerd.
  chromium_args:
    - --no-sandbox
    - --disable-dev-shm-usage
plugins:
  auto_apply: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      priorityClassName: homelab-important
      terminationGracePeriodSeconds: 90
      # Terminal tool and headless Chromium run model-directed code.
      runtimeClassName: gvisor
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      hermes:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          configure-d3:
            image: &image
              repository: nousresearch/hermes-agent
              tag: v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
            command:
              ["/opt/hermes/.venv/bin/python", "-P", "/opt/d3/configure_d3.py"]
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: "1"
                memory: 256Mi

        containers:
          app:
            image: *image
            # The image entrypoint starts as root for s6/permission setup, then
            # drops gateway execution to the non-root hermes user.
            securityContext:
              allowPrivilegeEscalation: false
            args:
              - gateway
              - run
            env:
              TZ: ${TIMEZONE}
              HERMES_DASHBOARD: true
              HERMES_DASHBOARD_PORT: &port 9119
              # Scheduler inactivity watchdog in seconds.
              HERMES_CRON_TIMEOUT: "900"
              S6_CMD_RECEIVE_SIGNALS: "1"
              HERMES_RESTART_DRAIN_TIMEOUT: "45"
              S6_SERVICES_GRACETIME: "80000"
              # Chromium's sandbox can't work under non-root uid 10000, and browser_tool.py's
              # own bypass detection doesn't recognise a containerd pod. Value matches the one
              # it injects itself.
              AGENT_BROWSER_ARGS: "--no-sandbox,--disable-dev-shm-usage"
              # s6 containers never multiplex implicitly; explicit true folds all profiles into this gateway.
              GATEWAY_MULTIPLEX_PROFILES: "true"
              # Profile subprocesses get their own HOME; one cache root keeps uv/HF/pnpm off the PVC.
              XDG_CACHE_HOME: /opt/data/.cache
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /api/status
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                cpu: 2
                memory: 6Gi

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Hermes
          gethomepage.dev/description: Nous Hermes agent
          gethomepage.dev/group: Agents
          gethomepage.dev/icon: mdi-robot-outline
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      d3-decisions:
        type: configMap
        name: hermes-d3-decisions
        globalMounts:
          - path: /opt/d3/plugins/d3-decisions
            readOnly: true
      d3-memini:
        type: configMap
        name: hermes-d3-memini
        globalMounts:
          - path: /opt/d3/plugins/d3-memini
            readOnly: true
      d3-client:
        type: configMap
        name: hermes-d3-gateway
        globalMounts:
          - path: /opt/d3/shared/d3_client.py
            subPath: d3_client.py
            readOnly: true
      d3-configure:
        type: configMap
        name: hermes-d3-configure
        globalMounts:
          - path: /opt/d3/configure_d3.py
            subPath: configure_d3.py
            readOnly: true
      data:
        existingClaim: *app
        globalMounts:
          - path: /opt/data
      # uv/huggingface/pnpm caches reached 9.4GB of the 20Gi PVC (and every kopiur snapshot).
      cache:
        type: emptyDir
        sizeLimit: 10Gi
        globalMounts:
          - path: /opt/data/.cache
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm

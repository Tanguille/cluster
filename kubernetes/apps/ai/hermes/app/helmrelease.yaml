---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  interval: 30m
  # Recreate grace plus the startup probe budget exceed Flux's 5m default.
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      priorityClassName: homelab-important
      terminationGracePeriodSeconds: 90
      # Terminal tool and headless Chromium run model-directed code.
      runtimeClassName: gvisor
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image: &image
              repository: nousresearch/hermes-agent
              tag: v0.23.0@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
            # The image entrypoint starts as root for s6/permission setup, then
            # drops gateway execution to the non-root hermes user.
            securityContext:
              allowPrivilegeEscalation: false
            args:
              - gateway
              - run
            env:
              TZ: ${TIMEZONE}
              HERMES_DASHBOARD: true
              HERMES_DASHBOARD_PORT: &port 9119
              # Inactivity watchdog, seconds; named profiles read their own .env.
              HERMES_CRON_TIMEOUT: "900"
              S6_CMD_RECEIVE_SIGNALS: "1"
              HERMES_RESTART_DRAIN_TIMEOUT: "45"
              S6_SERVICES_GRACETIME: "80000"
              # s6 containers never multiplex implicitly; explicit true folds all profiles into this gateway.
              GATEWAY_MULTIPLEX_PROFILES: "true"
              # Profile subprocesses get their own HOME; one cache root keeps uv/HF/pnpm off the PVC.
              XDG_CACHE_HOME: /opt/data/.cache
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /api/status
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                cpu: 2
                memory: 6Gi
          # Holds the Google token away from the agents; serves the digest on 127.0.0.1:8765 (resources/google_digest.py).
          google-digest:
            image: *image
            command:
              - /opt/hermes/.venv/bin/python
              - /app/google_digest.py
            env:
              TZ: ${TIMEZONE}
            securityContext:
              runAsUser: 65534
              runAsGroup: 65534
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi

    service:
      app:
        ports:
          http:
            port: *port
          webapp:
            port: 9120

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}-admin.${SECRET_DOMAIN}"
        parentRefs: &parentRefs
          - name: envoy-internal
            namespace: network
      webapp:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Hermes
          gethomepage.dev/description: Nous Hermes agent
          gethomepage.dev/group: Agents
          gethomepage.dev/icon: mdi-robot-outline
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs: *parentRefs
        rules:
          - backendRefs:
              - port: webapp

    # Agent volumes mount into app only: google-digest holds the token and shares nothing writable with the agents.
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
      # uv/huggingface/pnpm caches reached 9.4GB of the 20Gi PVC (and every kopiur snapshot).
      cache:
        type: emptyDir
        sizeLimit: 10Gi
        advancedMounts:
          hermes:
            app:
              - path: /opt/data/.cache
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          hermes:
            app:
              - path: /dev/shm
      # subPath: a mount over /etc/hermes would hide the image's baked Chromium path and provenance.
      managed-config:
        type: configMap
        name: hermes-managed-config
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes/config.yaml
                subPath: config.yaml
      google-digest:
        type: configMap
        name: hermes-google-digest
        advancedMounts:
          hermes:
            google-digest:
              - path: /app
      google-token:
        type: secret
        name: hermes-google
        advancedMounts:
          hermes:
            google-digest:
              - path: /secret

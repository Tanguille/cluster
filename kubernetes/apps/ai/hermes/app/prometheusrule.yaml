---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hermes-rules
spec:
  groups:
    - name: hermes.rules
      # Pushed every 10m by cron_health_export.py (hermes PVC, not git); bare selectors go blind
      # past VM's 5m staleness, so every rule uses last_over_time().
      rules:
        # A paused job's frozen last status never clears, so paused jobs are excluded.
        # The 1h clause bounds last_status_ok staleness for infrequent jobs (a weekly cron fired 5 days on one transient error); with for: 15m plus the 10m export interval it leaves ~35m of firing.
        - alert: HermesCronJobFailed
          expr: |-
            last_over_time(hermes_cron_last_status_ok[30m]) == 0
              unless on (id) last_over_time(hermes_cron_paused[30m]) == 1
              and on (id) (time() - last_over_time(hermes_cron_last_run_timestamp[30m])) < 3600
          for: 15m
          annotations:
            summary: >-
              Hermes cron {{ $labels.name }} failed within the last hour — it will keep
              failing on schedule until the cause is fixed
          labels:
            severity: warning

        # Delivery is a separate failure from execution: the job can succeed and the
        # Discord post still vanish, which reads green everywhere else.
        - alert: HermesCronDeliveryFailed
          expr: |-
            last_over_time(hermes_cron_delivery_failed[30m]) == 1
              unless on (id) last_over_time(hermes_cron_paused[30m]) == 1
          for: 15m
          annotations:
            summary: >-
              Hermes cron {{ $labels.name }} ran but could not deliver its output —
              the result is lost, not late
          labels:
            severity: warning

        # Already excludes disabled and paused jobs at export time. One hour of slack
        # absorbs a long-running predecessor without flapping.
        - alert: HermesCronOverdue
          expr: |-
            last_over_time(hermes_cron_overdue_seconds[30m]) > 3600
          for: 15m
          annotations:
            summary: >-
              Hermes cron {{ $labels.name }} is {{ $value | humanizeDuration }} past its
              scheduled run — the scheduler is not firing it
          labels:
            severity: warning

        # The exporter is itself a hermes cron job, so a stale heartbeat means hermes is down or
        # long agent jobs hold every cron.max_parallel_jobs slot (pending_slot in jobs.json).
        # Without this the other three rules go quiet exactly when they matter.
        - alert: HermesCronExporterStale
          expr: |-
            time() - last_over_time(hermes_cron_export_timestamp[2h]) > 1800
          for: 5m
          annotations:
            summary: >-
              Hermes cron health metrics are {{ $value | humanizeDuration }} stale —
              cron alerting is blind, check the hermes pod and long-running cron jobs
          labels:
            severity: warning

        # No for: absent() over 2h cannot flap, and a delay would read "recovered" between Stale resolving and Absent firing.
        - alert: HermesCronExporterAbsent
          expr: |-
            absent(last_over_time(hermes_cron_export_timestamp[2h]))
          annotations:
            summary: >-
              No Hermes cron health metrics at all — the exporter never ran or was removed
          labels:
            severity: warning

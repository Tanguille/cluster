# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../components/d3-gateway

# The component's ConfigMap name is shared with d3-nano in this namespace.
patches:
  - target:
      kind: ConfigMap
      name: d3-gateway
    patch: |-
      - op: replace
        path: /metadata/name
        value: hermes-d3-gateway

resources:
  - helmrelease.yaml
  - prometheusrule.yaml
  - google-secret.sops.yaml
  - secret.sops.yaml

configMapGenerator:
  - name: hermes-d3-decisions
    files:
      - __init__.py=resources/d3_decisions/__init__.py
      - plugin.yaml=resources/d3_decisions/plugin.yaml
  - name: hermes-d3-memini
    files:
      - __init__.py=resources/d3_memini/__init__.py
      - plugin.yaml=resources/d3_memini/plugin.yaml
  - name: hermes-d3-configure
    files:
      - configure_d3.py=resources/configure_d3.py
  - name: hermes-google-digest
    files:
      - google_digest.py=./resources/google_digest.py
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled

generatorOptions:
  disableNameSuffixHash: true

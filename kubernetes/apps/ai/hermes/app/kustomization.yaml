# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrelease.yaml
  - prometheusrule.yaml
  - google-secret.sops.yaml
  - secret.sops.yaml
configMapGenerator:
  - name: hermes-google-digest
    files:
      - ./resources/google_digest.py
  - name: hermes-cron-health
    files:
      - ./resources/cron_health_export.py
  - name: hermes-managed-config
    files:
      - config.yaml=./resources/managed-config.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled

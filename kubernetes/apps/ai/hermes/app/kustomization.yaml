# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrelease.yaml
  - prometheusrule.yaml
  - google-secret.sops.yaml
  - secret.sops.yaml
configMapGenerator:
  - name: hermes-google-digest
    files:
      - google_digest.py=./resources/google_digest.py
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
  namespace: &namespace ai
spec:
  targetNamespace: *namespace
  interval: 30m
  path: ./kubernetes/apps/ai/hermes/app
  prune: true
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 32Gi
      KOPIUR_PUID: "10000"
      # npm/pnpm/uv/cargo caches, rustup and mise toolchains, Hermes-managed LSP servers: all re-fetched on demand
      # After a restore run `pnpm install --frozen-lockfile` in /opt/data/mo and `uv python install 3.11`.
      KOPIUR_IGNORE_RULES: "[/lost+found, /.npm/*, /home/.npm/*, /profiles/*/home/.npm/*, /home/.cache/*, /home/.local/share/pnpm/store/*, /home/.local/share/pnpm/package-manager-store/*, /cache/uv/*, /home/.cargo/registry/*, /home/.rustup/toolchains/*, /home/.local/share/mise/installs/*, /lsp/node_modules/*, /profiles/*/lsp/node_modules/*, /mo/node_modules/*, /home/.local/share/uv/python/*]"

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
  namespace: &namespace ai
spec:
  targetNamespace: *namespace
  interval: 30m
  path: ./kubernetes/apps/ai/hermes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 32Gi
      KOPIUR_PUID: "10000"
      KOPIUR_PGID: "10000"
      # lazy_deps install target, npm/pnpm/uv/cargo caches, rustup and mise toolchains: all re-fetched on demand
      KOPIUR_IGNORE_RULES: "[/lost+found, /lazy-packages/*, /home/.npm/*, /home/.local/share/pnpm/store/*, /cache/uv/*, /home/.cargo/registry/*, /home/.rustup/toolchains/*, /home/.local/share/mise/installs/*]"

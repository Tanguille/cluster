---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.97.0@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
  applyMode: api
  replicas: 2
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  service:
    port: 80
  envFrom:
    - secretRef:
        name: litellm-secret
  # Measured cold start ~81s; the chart's ~40s grace kills prisma-migrate.
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 10
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 10
    timeoutSeconds: 5
  litellmSettings:
    callbacks: ["prometheus"]
    service_callback: ["prometheus_system"]
    # Embeddings only — chat is near-unique per turn (~0 hit rate). vmcp re-embeds
    # the same ~194 tool descriptions every MCP initialize.
    cache: true
    cache_params:
      type: redis
      host: dragonfly.database.svc.cluster.local
      port: 6379
      supported_call_types: ["embedding", "aembedding"]
      ttl: 604800 # 7d; tool descriptions are stable, dragonfly runs cache_mode (LRU)
    drop_params: true
    num_retries: 0
  routerSettings:
    # Per-error override of num_retries: 0 — a dropped backend connection costs a
    # whole Hermes cron run. Timeouts stay at 0: re-running a ~100K prefill that
    # already burned 900s only deepens the contention that caused it.
    retry_policy:
      InternalServerErrorRetries: 2
    # omniroute's free providers have no SLA; qwen-3.8-fast catches that.
    # qwen35-2b is the last resort because a single-entry chain went hard-down
    # on 2026-08-17 when the 27B was scaled to 0 -- it is iGPU-pinned, so it
    # never shares control-1's dGPU. Degraded, not down.
    fallbacks:
      - omniroute: ["qwen-3.8-fast", "qwen35-2b"]
  route:
    hostnames:
      - "litellm.${SECRET_DOMAIN}"
    parentRefs:
      - name: envoy-internal
        namespace: network
  resources:
    requests:
      cpu: 100m
      memory: 1Gi # measured ~1.05GiB usage, was invisible to the scheduler at 512Mi
    limits:
      cpu: 2
      memory: 5Gi

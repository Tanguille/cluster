---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.106.2@sha256:7294b90f868c5c38c99b83021c7ba46f9b439e95f8e32964c925c7d2563a03f7
  applyMode: api
  replicas: 2
  # One replica per node, else both can share the drained node and the PDB deadlocks the drain.
  # pod-template-hash: only same-revision pods repel, so a rollout surge pod may share a node with an old pod.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: litellm
              app.kubernetes.io/name: litellm
          matchLabelKeys:
            - pod-template-hash
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  service:
    port: 80
  envFrom:
    - secretRef:
        name: litellm-secret
  # Measured cold start ~81s; the chart's ~40s grace kills prisma-migrate.
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 10
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 10
    timeoutSeconds: 5
  litellmSettings:
    callbacks: ["prometheus"]
    service_callback: ["prometheus_system"]
    # Embeddings only — chat is near-unique per turn (~0 hit rate). vmcp re-embeds
    # the same ~194 tool descriptions every MCP initialize.
    cache: true
    cache_params:
      type: redis
      host: dragonfly.database.svc.cluster.local
      port: 6379
      supported_call_types: ["embedding", "aembedding"]
      ttl: 604800 # 7d; tool descriptions are stable, dragonfly runs cache_mode (LRU)
    drop_params: true
    num_retries: 0
  routerSettings:
    # Retry dropped connections (each costs a Hermes cron run), never timeouts: re-running a 900s prefill deepens the contention.
    retry_policy:
      InternalServerErrorRetries: 2
    # Thinking on: the reviewer is a tool loop; thinking-off scored 0/20 on DeepSWE (docs/llm-hosting/deepswe-swift-2026-09-22.md).
    # One deep: qwen35-2b's 16384-token slot rejects review payloads (503 becomes 400) and widening it
    # costs iGPU-node RAM; it still serves karakeep. LiteLLMFallbackBackendDown guards the target.
    fallbacks:
      - omniroute: ["qwen-3.8"]
  route:
    hostnames:
      - "litellm.${SECRET_DOMAIN}"
    parentRefs:
      - name: envoy-internal
        namespace: network
  resources:
    requests:
      cpu: 100m
      memory: 1Gi # measured ~1.05GiB usage
    limits:
      cpu: 2
      memory: 5Gi

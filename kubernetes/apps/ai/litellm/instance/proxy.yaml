---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.104.1@sha256:501909ec6f504551f263f82fe8c53cfa34679d5753de507a2df69680a6021ad8
  applyMode: api
  replicas: 2
  # One replica per node, else both can share the drained node and the PDB deadlocks the drain.
  # pod-template-hash: only same-revision pods repel, so a rollout surge pod may share a node with an old pod.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: litellm
              app.kubernetes.io/name: litellm
          matchLabelKeys:
            - pod-template-hash
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  service:
    port: 80
  envFrom:
    - secretRef:
        name: litellm-secret
  # Measured cold start ~81s; the chart's ~40s grace kills prisma-migrate.
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 10
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 10
    timeoutSeconds: 5
  litellmSettings:
    callbacks: ["prometheus"]
    service_callback: ["prometheus_system"]
    # Embeddings only — chat is near-unique per turn (~0 hit rate). vmcp re-embeds
    # the same ~194 tool descriptions every MCP initialize.
    cache: true
    cache_params:
      type: redis
      host: dragonfly.database.svc.cluster.local
      port: 6379
      supported_call_types: ["embedding", "aembedding"]
      ttl: 604800 # 7d; tool descriptions are stable, dragonfly runs cache_mode (LRU)
    drop_params: true
    num_retries: 0
  routerSettings:
    # Per-error override of num_retries: 0 — a dropped backend connection costs a
    # whole Hermes cron run. Timeouts stay at 0: re-running a ~100K prefill that
    # already burned 900s only deepens the contention that caused it.
    retry_policy:
      InternalServerErrorRetries: 2
    # omniroute's free providers have no SLA; qwen-3.8 catches that. Thinking on:
    # the reviewer is a tool loop and thinking-off scored 0/20 on DeepSWE
    # (docs/llm-hosting/deepswe-swift-2026-09-22.md).
    # Deliberately one deep. qwen35-2b is not a second tier: llama.cpp splits
    # contextSize across parallelSlots, so it serves a 16384-token window and
    # rejects review-sized payloads, turning a 503 into a 400. Widening it costs
    # iGPU-node RAM not worth spending on a last resort. (The model itself still
    # runs -- karakeep uses it.) A one-deep chain is only safe while its target
    # is live, which LiteLLMFallbackBackendDown enforces.
    fallbacks:
      - omniroute: ["qwen-3.8"]
  route:
    hostnames:
      - "litellm.${SECRET_DOMAIN}"
    parentRefs:
      - name: envoy-internal
        namespace: network
  resources:
    requests:
      cpu: 100m
      memory: 1Gi # measured ~1.05GiB usage, was invisible to the scheduler at 512Mi
    limits:
      cpu: 2
      memory: 5Gi

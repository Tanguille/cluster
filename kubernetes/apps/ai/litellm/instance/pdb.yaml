---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/policy/poddisruptionbudget_v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
spec:
  # 2 replicas across control-1/control-2: a node drain must leave one proxy serving, or
  # every LLM client (hermes, opencode, vmcp, memini) loses its router mid-drain. The
  # LiteLLMProxy CRD has no disruption budget of its own, so this targets the
  # operator-managed deployment's labels.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/managed-by: litellm-operator
      app.kubernetes.io/name: litellm

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/policy/poddisruptionbudget_v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
spec:
  # LiteLLMProxy has no PDB field; a node drain must leave one of the 2 proxies serving every LLM client.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/managed-by: litellm-operator
      app.kubernetes.io/name: litellm

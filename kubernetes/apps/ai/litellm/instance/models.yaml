---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen-3.8
spec:
  modelName: qwen-3.8
  proxyRef: litellm
  params:
    # Renamed from qwen-3.6 atomically with every consumer that hardcodes it
    # (karakeep, agent-pr-review.yaml, proxy.yaml fallbacks, hermes profiles).
    # Backend swapped to qwen38-27b-vllm 2026-08-16 -- numbers in that file.
    model: openai/qwen-3.8
    apiBase: http://qwen38-27b-vllm.ai.svc.cluster.local:8000/v1
    # Native vLLM/SGLang are unauthenticated internally, but LiteLLM's OpenAI provider
    # requires a non-empty api_key.
    apiKey: sk-vllm-noauth
    additional:
      timeout: 1800
      stream_timeout: 1800
      num_retries: 0
  info:
    mode: chat
    # vLLM's maxModelLen (112000) minus maxOutputTokens; covers Hermes' measured
    # p100 (112K), so routine sessions never truncate. Takes both the
    # OffloadingConnector and an explicit --kv-cache-memory to reach — see
    # qwen38-27b-vllm.yaml.
    maxInputTokens: 103808
    maxOutputTokens: 8192
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen-3.8-fast
spec:
  modelName: qwen-3.8-fast
  proxyRef: litellm
  params:
    model: openai/qwen-3.8
    apiBase: http://qwen38-27b-vllm.ai.svc.cluster.local:8000/v1
    apiKey: sk-vllm-noauth
    additional:
      # Hermes compression is a ~100K+ prefill on this alias; under GPU contention
      # the shared prefill rate drops below what 600s covers (2026-07-07).
      timeout: 900
      stream_timeout: 900
      num_retries: 0
      # Non-thinking instruct-mode sampling — matches Qwen3.8's model card
      # exactly (temperature/top_p/presence_penalty), same as Qwen3.6's.
      # Defaults only: client-set params win (v1.91.0 router merge).
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  info:
    mode: chat
    # 112000 - 8192, as above.
    maxInputTokens: 103808
    maxOutputTokens: 8192
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: omniroute
spec:
  modelName: omniroute
  proxyRef: litellm
  params:
    # Bare "auto" sticks to the last-known-good provider regardless of quality;
    # auto/smart scores live on quota/health/cost/taskFit instead.
    model: openai/auto/smart
    apiBase: http://omniroute.ai.svc.cluster.local:20128/v1
    # REQUIRE_API_KEY=false internally; LiteLLM's OpenAI provider still needs
    # a non-empty api_key (same convention as qwen-3.8's sk-vllm-noauth).
    apiKey: sk-omniroute-noauth
    additional:
      # Bounded so the qwen-3.8-fast fallback fires inside the pr-reviewer-action's
      # 600s curl timeout instead of the action giving up and retrying blind
      # (observed 2026-08-03: 60min run, fallback never triggered). Timeouts
      # aren't in the proxy's retry_policy and num_retries is 0, so one attempt
      # then fallback. 90s cut healthy-but-slow free providers (2026-08-11:
      # 115s/92s streams fell back needlessly); 150s clears the observed tail.
      timeout: 150
      # Without this, litellm falls back through _get_stream_timeout to plain
      # `timeout`, but that's an httpx per-chunk read timeout — it resets on
      # every byte, so a stream that trickles keep-alives without ever
      # completing (observed 2026-08-04: response_format error on a streamed
      # call to opencode/deepseek-v4-flash-free) never gets cut off server-side
      # and rides out to the action's own 600s curl ceiling instead.
      stream_timeout: 150
      num_retries: 0
      # omniroute's pii-masker guardrail rewrites any bare 10-digit number as
      # [PHONE_REDACTED] (its phone_us regex matches \d{3}\d{3}\d{4}), so byte
      # counts and memory limits reach the model corrupted and it reports the
      # redaction as the defect (2026-08-12: 8 of 9 review runs). Guardrails have
      # no persisted toggle — per-request opt-out only. credential-masker stays on.
      extra_headers:
        x-omniroute-disabled-guardrails: pii-masker
  info:
    mode: chat

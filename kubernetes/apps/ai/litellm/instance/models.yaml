---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen-3.8
spec:
  modelName: qwen-3.8
  proxyRef: litellm
  params:
    model: openai/qwen-3.8
    apiBase: http://qwen38-27b-vllm.ai.svc.cluster.local:8000/v1
    # Native vLLM is unauthenticated internally, but LiteLLM's OpenAI provider
    # requires a non-empty api_key.
    apiKey: sk-vllm-noauth
    additional:
      timeout: 1800
      stream_timeout: 1800
      num_retries: 0
      # Sharp template default is medium; medium is also the better
      # quality/latency point for most turns. Only affects this alias --
      # qwen-3.8-fast sets enable_thinking false, and the template gates effort
      # behind thinking.
      extra_body:
        chat_template_kwargs:
          reasoning_effort: medium
  info:
    mode: chat
    # maxModelLen (246944) minus maxOutputTokens; re-derive if that changes,
    # nothing enforces it across the two CRDs.
    # 64000 mirrors the upstream serving max-tokens bump (joryirving/home-ops
    # 27b088f) so long agentic turns stop truncating. Serving side still only
    # sets maxModelLen (246944) here, so the sum has to keep fitting it.
    maxInputTokens: 182944
    maxOutputTokens: 64000
    extra:
      # Electricity only: 250 W x EUR 0.30/kWh / (1083 t/s prefill, 74 t/s decode at 3 concurrent).
      input_cost_per_token: 2.0e-8
      output_cost_per_token: 2.8e-7
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen-3.8-fast
spec:
  modelName: qwen-3.8-fast
  proxyRef: litellm
  params:
    model: openai/qwen-3.8
    # Moves with qwen-3.8 above: both must always name the same live backend.
    apiBase: http://qwen38-27b-vllm.ai.svc.cluster.local:8000/v1
    apiKey: sk-vllm-noauth
    additional:
      # Hermes compression is a ~100K+ prefill on this alias; under GPU contention the shared prefill rate drops below what 600s covers.
      timeout: 900
      stream_timeout: 900
      num_retries: 0
      # Non-thinking instruct-mode sampling — matches Qwen3.8's model card
      # exactly (temperature/top_p/presence_penalty), same as Qwen3.6's.
      # Defaults only: client-set params win (v1.91.0 router merge).
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  info:
    mode: chat
    # 246944 - 8192, as above.
    maxInputTokens: 238752
    maxOutputTokens: 8192
    extra:
      # Same electricity cost as qwen-3.8 above.
      input_cost_per_token: 2.0e-8
      output_cost_per_token: 2.8e-7
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: omniroute
spec:
  modelName: omniroute
  proxyRef: litellm
  params:
    # smart-free is a persisted omniroute combo (priority order: Gemini 3.8 and 3.7
    # Flash, Antigravity Gemini Flash, Groq qwen3.8-27b for prompts under 6k tokens,
    # charm-hyper glm-5.3-flash last since it is paid).
    model: openai/smart-free
    apiBase: http://omniroute.ai.svc.cluster.local:20128/v1
    # REQUIRE_API_KEY=false internally; LiteLLM's OpenAI provider still needs
    # a non-empty api_key (same convention as qwen-3.8's sk-vllm-noauth).
    apiKey: sk-omniroute-noauth
    additional:
      # Bounded so the qwen-3.8 fallback fires inside the reviewer's 600s curl timeout (timeouts are not in retry_policy, so one attempt then fallback); 90s cut healthy-but-slow 115s/92s streams, 150s clears the observed tail.
      timeout: 150
      # Without it stream_timeout falls back to plain timeout, an httpx per-chunk read timeout that resets on every byte, so a trickling stream is never cut off before the 600s curl ceiling.
      stream_timeout: 150
      num_retries: 0
      # pii-masker rewrites any bare 10-digit number as [PHONE_REDACTED], corrupting byte counts and memory limits (8 of 9 review runs); guardrails have only a per-request opt-out, credential-masker stays on.
      extra_headers:
        x-omniroute-disabled-guardrails: pii-masker
  info:
    mode: chat

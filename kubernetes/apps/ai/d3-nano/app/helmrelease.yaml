---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app d3-nano
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      priorityClassName: homelab-important
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      d3-nano:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          runtime:
            image: &image
              repository: ghcr.io/vllm-project/semantic-router/vllm-sr
              tag: 5bd7c69419487a783cbce18dfd41f707441a1b85@sha256:6f6a2cd99677dedff4bbb7fdc41fb5597b8e8980489f8070eb741ffb0b8236c7
            command: ["vllm-srun"]
            args:
              - serve
              - vllm-sr/d3-nano
              - --revision
              - aeb70d4dd53ed25b855c3b0a66394b8fe265db7f
              - --device
              - cpu
              - --threads
              - "$(OMP_NUM_THREADS)"
              - --host
              - 0.0.0.0
              - --port
              - "8100"
              - --max-num-seqs
              - "1"
              - --max-num-batched-tokens
              - "4096"
              - --max-request-bytes
              - "65536"
              - --max-queue
              - "4"
              - --max-queued-tokens
              - "16384"
              - --media-workers
              - "0"
            env:
              HF_HOME: /var/cache/vllm-srun
              # Match native CPU threads to its declared CPU ceiling.
              OMP_NUM_THREADS:
                valueFrom:
                  resourceFieldRef:
                    resource: limits.cpu
            securityContext: &security
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                # Bursty decisions share CPU; a 2-core request cannot fit the memory-capable node.
                cpu: 500m
                # Steady RSS was 4.65Gi locally; the 7.35Gi BF16 load peak fits under the limit.
                memory: 6Gi
              limits:
                cpu: "4"
                memory: 10Gi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &ready
                    path: /health
                    port: 8100
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 180
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *ready
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: 8100
                  periodSeconds: 30
                  timeoutSeconds: 5
          gateway:
            image: *image
            command: ["python", "/app/decision_gateway.py"]
            env:
              LLM_API_KEY: ${LLM_API_KEY}
            securityContext: *security
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: "1"
                memory: 256Mi
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8101
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8101
                  periodSeconds: 10
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8101
                  periodSeconds: 30
                  timeoutSeconds: 5
    service:
      app:
        ports:
          http:
            port: 8101
          metrics:
            port: 8100
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
    persistence:
      model-cache:
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          d3-nano:
            runtime:
              - path: /var/cache/vllm-srun
      gateway:
        type: configMap
        name: d3-gateway
        advancedMounts:
          d3-nano:
            gateway:
              - path: /app/decision_gateway.py
                subPath: decision_gateway.py
                readOnly: true
              - path: /app/d3_client.py
                subPath: d3_client.py
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

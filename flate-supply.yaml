---
# Dummies for SOPS keys flate drops since v0.7.0; the nextcloud valuesFrom needs FROM_ADDRESS. Never applied.
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
  namespace: default
stringData:
  FROM_ADDRESS: nextcloud@example.invalid
---
# SOPS-only; rsume's bare "${SECRET_DOMAIN}" host otherwise renders null.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: default
stringData:
  SECRET_DOMAIN: example.invalid
  SECRET_CONTACT_EMAIL: contact@example.invalid

---
# Dummies for SOPS keys flate drops since v0.7.0; the nextcloud valuesFrom needs FROM_ADDRESS. Never applied.
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
  namespace: default
stringData:
  FROM_ADDRESS: nextcloud@example.invalid
---
# Reference-only, never applied: stand-in for the SOPS cluster-secrets flate cannot read.
# It lives in `default` because the consuming apps do. Add a key here whenever an app's
# values read one, or its render fails offline (rsume needs SECRET_DOMAIN as a bare
# hostname, which otherwise renders null).
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: default
stringData:
  SECRET_DOMAIN: example.invalid
  SECRET_CONTACT_EMAIL: contact@example.invalid

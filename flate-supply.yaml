---
# Reference-only, never applied: stand-in for the SOPS cluster-secrets flate cannot read.
# It lives in `default` because the consuming apps do. Add a key here whenever an app's
# values read one, or its render fails offline. Konflate cannot read this file, so a bare secret
# value needs a `${VAR:=placeholder}` default in the manifest itself (rsume's hostname).
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: default
stringData:
  SECRET_DOMAIN: example.invalid
  SECRET_CONTACT_EMAIL: contact@example.invalid

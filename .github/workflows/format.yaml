---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Format

# Runs every formatter on the whole tree and pushes the fixes as the bot app (a GITHUB_TOKEN push
# would not re-trigger CI). Renovate and fork branches are only checked: Renovate rebases its own.
on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Format - Fix
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'renovate/') }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # The lefthook formatters plus shfmt (shell-lint only checks it).
      - name: Format
        run: |
          mise exec -- oxfmt .
          mise fmt
          git ls-files -z '*.just' .justfile | xargs -0 -rn1 mise exec -- just --fmt --justfile
          git ls-files -z '*.sh' | xargs -0 -r mise exec -- shfmt -w --

      - name: Push
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          git diff --quiet && exit 0
          git config user.name "tanguille-cluster[bot]"
          git config user.email "205505618+tanguille-cluster[bot]@users.noreply.github.com"
          git commit -am "style: format"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${HEAD_REF}"

      - name: Check
        run: git diff --exit-code

---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Format

# Runs the lefthook `format` jobs on the whole tree and pushes the fixes as the bot app (a GITHUB_TOKEN
# push would not re-trigger CI). Renovate commits as the same bot, so a fix doesn't mark its branch
# as edited. Fork branches get no token: there it only fails with the diff.
on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Format - Fix
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Only the formatters: the full tool set is a ~465 MB cache restore.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: aqua:evilmartians/lefthook oxfmt aqua:casey/just aqua:mvdan/sh

      - name: Format
        run: lefthook run pre-commit --all-files --no-auto-install --no-stage-fixed --tag format

      - name: Push
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git diff --exit-code && exit 0
          [ -n "$TOKEN" ] || exit 1
          git config user.name "tanguille-cluster[bot]"
          git config user.email "205505618+tanguille-cluster[bot]@users.noreply.github.com"
          git commit --no-verify -am "style: format"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_HEAD_REF}"

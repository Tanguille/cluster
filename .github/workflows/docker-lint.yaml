---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docker Lint

on:
  push:
    branches: ["main"]
    paths: ["**/Dockerfile", "**/Dockerfile.*", ".github/workflows/docker-lint.yaml"]
  pull_request:
    branches: ["main"]
    paths: ["**/Dockerfile", "**/Dockerfile.*", ".github/workflows/docker-lint.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Docker Lint - Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Lint
        run: |
          set -euo pipefail
          mapfile -t dockerfiles < <(git ls-files 'Dockerfile' '**/Dockerfile' '**/Dockerfile.*')
          [ "${#dockerfiles[@]}" -gt 0 ] || { echo "no Dockerfiles tracked; nothing to lint"; exit 0; }
          mise exec -- hadolint "${dockerfiles[@]}"

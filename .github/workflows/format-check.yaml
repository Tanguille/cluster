---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Format Check

# Same oxfmt as the lefthook format-yaml/format-json hooks, for commits that skip local hooks.
on:
  push:
    branches: ["main"]
    paths:
      [
        "**/*.yaml",
        "**/*.json",
        "**/*.json5",
        "**/*.jsonc",
        ".oxfmtrc.json",
        ".prettierignore",
        ".mise.toml",
        "mise.lock"
      ]
  pull_request:
    branches: ["main"]
    paths:
      [
        "**/*.yaml",
        "**/*.json",
        "**/*.json5",
        "**/*.jsonc",
        ".oxfmtrc.json",
        ".prettierignore",
        ".mise.toml",
        "mise.lock"
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Format Check - oxfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Check
        run: mise exec -- oxfmt --check .

---
name: OPNsense MCP

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed image to GHCR (requires separate approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test pinned upstream and monitor extension
        run: docker build --platform linux/amd64 --target test -t opnsense-mcp:test docker/opnsense-mcp
      - name: Test Hermes collector
        run: python3 -m unittest discover -s kubernetes/apps/ai/hermes/app/resources -p test_opnsense_spamhaus_watch.py -v
      - name: Build runtime and test restricted stdio
        run: |
          docker build --platform linux/amd64 --target runtime --build-arg "REVISION=${GITHUB_SHA}" -t opnsense-mcp:local docker/opnsense-mcp
          docker run --rm --entrypoint /venv/bin/python opnsense-mcp:local -c 'import os; assert os.getuid() == 65532'
          python3 -m venv /tmp/opnsense-test
          /tmp/opnsense-test/bin/pip install --require-hashes -r docker/opnsense-mcp/test-requirements.lock
          /tmp/opnsense-test/bin/python docker/opnsense-mcp/tests/container_smoke.py opnsense-mcp:local

  publish:
    if: ${{ inputs.publish }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish provenance and SBOM
        run: |
          image="ghcr.io/tanguille/opnsense-mcp:0.4.2-monitor.${GITHUB_SHA:0:12}"
          docker buildx build --platform linux/amd64 --target runtime \
            --build-arg "REVISION=${GITHUB_SHA}" --provenance=mode=max --sbom=true \
            --metadata-file /tmp/opnsense-metadata.json --tag "${image}" --push docker/opnsense-mcp
          digest="$(jq -er '."containerimage.digest"' /tmp/opnsense-metadata.json)"
          printf 'Image: %s\n\nDigest: %s\n\nRevision: %s\n' "${image}" "${digest}" "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"

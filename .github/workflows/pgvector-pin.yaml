---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: pgvector pin

on:
  pull_request:
    branches: ["main"]
    paths:
      - .github/workflows/pgvector-pin.yaml
      - kubernetes/apps/database/cloudnative-pg/cluster/cluster.yaml
      - kubernetes/apps/database/cloudnative-pg/databases/resourceset.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Bundled pgvector shadows mounted extension images, so the pin must match the image.
  pgvector-pin:
    name: pgvector pin matches image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pin with the image
        run: |
          set -euo pipefail
          cluster=kubernetes/apps/database/cloudnative-pg/cluster/cluster.yaml
          rset=kubernetes/apps/database/cloudnative-pg/databases/resourceset.yaml
          img=$(yq -e '.spec.imageName' "$cluster")
          want=$(docker run --rm --entrypoint sed "$img" -n "s/^default_version = '\(.*\)'/\1/p" \
            /usr/share/postgresql/18/extension/vector.control)
          got=$(yq -e '.spec.inputs[].extensions[] | select(.name == "vector") | .version' "$rset" | sort -u)
          echo "image ${img} ships vector ${want}; ResourceSet pins ${got}"
          [ "$want" = "$got" ] || { echo "::error::vector pin '${got}' != image default_version '${want}'"; exit 1; }

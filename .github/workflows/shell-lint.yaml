---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Shell Lint

on:
  push:
    branches: ["main"]
    paths:
      ["**.sh", ".github/workflows/shell-lint.yaml", ".mise.toml", "mise.lock"]
  pull_request:
    branches: ["main"]
    paths:
      ["**.sh", ".github/workflows/shell-lint.yaml", ".mise.toml", "mise.lock"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Shell Lint - Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # Save from main only; PR-scoped copies crowd the Actions cache quota.
          cache_save: ${{ github.event_name == 'push' }}
          install_args: aqua:ewhauser/shuck

      - name: Lint
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shuck check "${scripts[@]}"

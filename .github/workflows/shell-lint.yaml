---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Shell Lint

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Shell Lint - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get Changed Files List
        id: changed-files-list
        run: |
          set -euo pipefail
          CHANGED_FILES_JSON="${{ steps.changed-files.outputs.changed_files }}"
          if [[ "$CHANGED_FILES_JSON" == '[]' ]]; then
            echo "changed-files=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '.[] | select(endswith(".sh"))' <<< "$CHANGED_FILES_JSON" > "$GITHUB_OUTPUT"

  lint:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Shellcheck
        env:
          CHANGED_FILES: ${{ needs.filter.outputs.changed-files }}
        run: |
          set -euo pipefail
          mapfile -t scripts < <(jq -r '.[] | select(endswith(".sh"))' <<< "$CHANGED_FILES")
          if (( ${#scripts[@]} == 0 )); then
            echo "No changed shell scripts; skipping shellcheck."
            exit 0
          fi
          echo "Shellchecking: ${scripts[*]}"
          mise exec -- shellcheck "${scripts[@]}"

      - name: Shfmt
        env:
          CHANGED_FILES: ${{ needs.filter.outputs.changed-files }}
        run: |
          set -euo pipefail
          mapfile -t scripts < <(jq -r '.[] | select(endswith(".sh"))' <<< "$CHANGED_FILES")
          if (( ${#scripts[@]} == 0 )); then
            echo "No changed shell scripts; skipping shfmt."
            exit 0
          fi
          echo "Shfmt checking: ${scripts[*]}"
          mise exec -- shfmt --diff -ln bash -- "${scripts[@]}"

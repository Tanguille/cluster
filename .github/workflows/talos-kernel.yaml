---
name: Talos Kernel

on:
  push:
    branches: ["main"]
    paths:
      - docker/talos-kernel/**
      # Not a build input; editing it cost an 11m no-op run (33327983434).
      - "!docker/talos-kernel/README.md"
      - scripts/talos-kernel-build.sh
      - talos/schematic.yaml
      - talos/nodes/**/*.schematic.yaml
      - kubernetes/apps/system-upgrade/tuppr/upgrades/talosupgrade.yaml
  # Dispatch against the bump branch to build BEFORE merging it — the only way to have the
  # installer exist by the time main starts naming it:
  #     gh workflow run talos-kernel.yaml --ref <branch>
  # No version input: the ref already selects both versions, from that branch's Dockerfile ARG
  # and its tuppr CR, so an input could only disagree with the tree being built.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's 360m hosted ceiling less headroom, not a build estimate; runs are 87-112m.
    timeout-minutes: 340
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pipeline needs ~35-40 GB: the kernel build layer alone is ~17.7 GB. Docker's
      # data-root lives on /, which has only 21-31 GB free on a hosted runner, so the build dies
      # mid-compile with an opaque ENOSPC. /mnt is undocumented but present with ~66 GB free.
      # This is cheaper and more reliable than the disk-reclaim actions.
      - name: Move Docker data-root to /mnt
        run: |
          df -h / /mnt
          sudo systemctl stop docker.service docker.socket
          sudo mkdir -p /mnt/docker
          printf '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker.service
          docker info --format '{{.DockerRootDir}}'

      # CONFIG_LTO_CLANG_THIN is set, so the vmlinux link runs an lld backend per hardware
      # thread, each holding gigabytes -- peak link memory blows past the runner's 16 GB and
      # the runner process is killed ("lost communication with the server") ~43m in, after the
      # far lighter compile phase has already succeeded. Swap rather than fewer backends: the
      # kernel that comes out is identical, and the compile phase that dominates the run keeps
      # every core.
      #
      # On /, not /mnt: the step above hands /mnt's ~66 GB to Docker, which needs ~35-40 GB of
      # it, so a swapfile there would re-create the ENOSPC that move exists to avoid. Moving
      # the data-root leaves / idle with ~85 GB free (measured), so take the swap from there.
      - name: Add swap for the ThinLTO link
        run: |
          free -h
          # 32G is 3x the shortfall seen. Sizing from free space always hit this cap anyway.
          # -B1, not -BG: df's GiB output rounds UP, so 36.2G free would report as 37G and pass.
          free_g="$(( $(df -B1 --output=avail / | tail -1 | tr -dc '0-9') / 1073741824 ))"
          [[ "${free_g}" -ge 37 ]] || { echo "only ${free_g}G free on /, need 37G for a 32G swapfile" >&2; exit 1; }
          echo "allocating 32G swap of ${free_g}G free"
          # Not /swapfile: the runner already has one there, active, and fallocate on a swapped-on
          # file fails with ETXTBSY. This is added alongside it rather than replacing it.
          sudo fallocate -l 32G /swapfile-thinlto
          sudo chmod 600 /swapfile-thinlto
          sudo mkswap /swapfile-thinlto
          sudo swapon /swapfile-thinlto
          swapon --show
          free -h

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything is derived from the tree: the Talos version from the tuppr CR, the kernel from
      # the Renovate-managed Dockerfile ARG, TOOLS/PKGS from the Talos release's own Makefile,
      # and the node list from talos/nodes/. The script writes its own job summary naming every
      # ref it published. Same entrypoint as a workstation build, so the two cannot drift.
      - name: Build and publish installers
        run: just talos kernel-build

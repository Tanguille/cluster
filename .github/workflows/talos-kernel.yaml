---
name: Talos Kernel

on:
  push:
    branches: ["main"]
    paths:
      - docker/talos-kernel/**
      - scripts/talos-kernel-build.sh
      - talos/schematic.yaml
      - talos/nodes/**/*.schematic.yaml
      - kubernetes/apps/system-upgrade/tuppr/upgrades/talosupgrade.yaml
  workflow_dispatch:
    inputs:
      talos-version:
        description: "Talos version to build against; defaults to the tuppr CR's"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # ~2h45m measured shape
    timeout-minutes: 340
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pipeline needs ~35-40 GB: the kernel build layer alone is ~17.7 GB. Docker's
      # data-root lives on /, which has only 21-31 GB free on a hosted runner, so the build dies
      # mid-compile with an opaque ENOSPC. /mnt is undocumented but present with ~66 GB free.
      # This is cheaper and more reliable than the disk-reclaim actions.
      - name: Move Docker data-root to /mnt
        run: |
          df -h / /mnt
          sudo systemctl stop docker.service docker.socket
          sudo mkdir -p /mnt/docker
          printf '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker.service
          docker info --format '{{.DockerRootDir}}'

      # CONFIG_LTO_CLANG_THIN is set, so the vmlinux link runs an lld backend per hardware
      # thread, each holding gigabytes -- peak link memory blows past the runner's 16 GB and
      # the runner process is killed ("lost communication with the server") ~43m in, after the
      # far lighter compile phase has already succeeded. Swap rather than fewer backends: the
      # kernel that comes out is identical, and the compile phase that dominates the ~2h45m
      # keeps every core.
      #
      # On /, not /mnt: the step above hands /mnt's ~66 GB to Docker, which needs ~35-40 GB of
      # it, so a swapfile there would re-create the ENOSPC that move exists to avoid. Moving
      # the data-root leaves / idle with 87 GB free (measured), so take the swap from there.
      # Sized from what is actually free, keeping 5 GB back, rather than assuming a figure.
      - name: Add swap for the ThinLTO link
        run: |
          free -h
          # -B1, not -BG: df's GiB output rounds UP, so e.g. 12.1G free reports as 13G and an
          # 8G swapfile would leave only 4.1G, not the intended 5G margin. Floor from bytes.
          free_g="$(( $(df -B1 --output=avail / | tail -1 | tr -dc '0-9') / 1073741824 ))"
          swap_g=$(( free_g - 5 ))
          # 32G caps it at 3x the shortfall seen; more just costs fallocate time on a bigger runner.
          [[ "${swap_g}" -le 32 ]] || swap_g=32
          [[ "${swap_g}" -ge 8 ]] || { echo "only ${free_g}G free on /, refusing to size swap" >&2; exit 1; }
          echo "allocating ${swap_g}G swap of ${free_g}G free"
          # Not /swapfile: the runner already has one there, active, and fallocate on a swapped-on
          # file fails with ETXTBSY. This is added alongside it rather than replacing it.
          sudo fallocate -l "${swap_g}G" /swapfile-thinlto
          sudo chmod 600 /swapfile-thinlto
          sudo mkswap /swapfile-thinlto
          sudo swapon /swapfile-thinlto
          swapon --show
          free -h

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The script derives everything else itself: the kernel version from the Renovate-managed
      # ARG, and TOOLS/PKGS from the Talos release's own Makefile.
      - name: Build and publish installers
        # Through env, not interpolated into the shell: a workflow_dispatch input expanded
        # directly into a run block is a code-injection vector.
        env:
          TALOS_VERSION_INPUT: ${{ inputs.talos-version }}
        run: |
          talos_version="${TALOS_VERSION_INPUT}"
          [ -n "${talos_version}" ] || talos_version="$(just tuppr-version talos)"
          # The node list comes from talos/nodes/, and the script writes its own job summary
          # naming every ref it published.
          scripts/talos-kernel-build.sh "${talos_version}" $(just talos nodes)

---
name: truenas-mcp Image

# Publishes ghcr.io/tanguille/truenas-mcp from the official
# truenas/truenas-mcp GitHub release (static Go binary + a tiny glibc
# base). Upstream ships no container image, so the ToolHive MCPServer in
# kubernetes/apps/ai/toolhive/config/truenas.yaml pins this image.

on:
  push:
    branches: ["main"]
    paths:
      - docker/truenas-mcp/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version ARG is the single bump point (Renovate-managed in the
      # Dockerfile), so the tag and the fetched release can never drift:
      # both are derived from the same value.
      - name: Extract version
        id: version
        run: |
          tag="$(sed -n 's/^ARG VERSION=//p' docker/truenas-mcp/Dockerfile)"
          [ -n "${tag}" ] || { echo "no VERSION ARG in Dockerfile" >&2; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # The tag reaches the shell through env, not template expansion: it is
      # read out of a file, which zizmor treats as attacker-controllable.
      - name: Build and push
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}/truenas-mcp
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "VERSION=${VERSION}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            --metadata-file "${RUNNER_TEMP}/build.json" \
            --push \
            docker/truenas-mcp/

      # Print the immutable manifest-list digest the push served, so the
      # MCPServer manifest can pin tag@sha256: (same posture as every other
      # image in this repo). buildx already reports it in --metadata-file, so
      # there is nothing to inspect back out of the registry.
      - name: Print published digest
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}/truenas-mcp
        run: |
          digest="$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/build.json")"
          { echo "### Published"; echo "${IMAGE}:${VERSION}@${digest}"; } >> "$GITHUB_STEP_SUMMARY"

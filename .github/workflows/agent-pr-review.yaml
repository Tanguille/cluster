---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Agent PR Review

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # review-runner, not cluster-runner: this job feeds untrusted PR text to a tool-calling model,
    # and cluster-runner mounts Talos os:admin into every pod it schedules.
    runs-on: review-runner
    # Renovate's type/digest PRs do not need model review.
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(github.event.pull_request.labels.*.name, 'type/digest')
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # this job checks out untrusted PR code; don't leave a usable token in .git/config
          persist-credentials: false

      - name: Run reviewer
        uses: misospace/pr-reviewer-action@99e7764a4906f94d99c249231d2016c3cda8997e # v2.2.0
        with:
          github_token: ${{ github.token }}
          ai_base_url: http://litellm.ai.svc.cluster.local/v1
          ai_api_key: ${{ secrets.LITELLM_API_KEY }}
          # omniroute routes to a larger free-tier model than the self-hosted 27B
          # (see litellm routerSettings.fallbacks); falls back to qwen-3.8-fast
          # automatically if the free provider fails or times out.
          ai_model: omniroute
          # v2.1.10 inherits ai_fallback_base_url from ai_base_url when unset, then
          # requires ai_fallback_model whenever ai_fallback_base_url is set (even
          # inherited) — fails fast with no model call otherwise. Point this at
          # qwen-3.8-fast directly (same litellm endpoint) rather than duplicating
          # ai_model: litellm's routerSettings.fallbacks already retries omniroute
          # failures internally, so this only fires if that whole chain fails —
          # a real second attempt via a distinct model, not a no-op retry.
          ai_fallback_model: qwen-3.8-fast
          # omniroute's proxied models don't share SGLang's sampling_defaults, so
          # an empty temperature has no known-good fallback here — pin explicitly.
          ai_temperature: "0.2"
          ai_response_format: json_schema
          # Covers both omniroute (observed 2-74s) and, on fallback, qwen-3.8-fast's
          # ~10 tok/s cold prefill on this GPU (155-220s near ~100K ctx, validated).
          ai_request_timeout_sec: "600"
          verdict_policy: findings_severity_gated
          inline_findings: "true"
          inline_findings_max: "12"
          publish_mode: review_comment
          # concise patches the bundled default prompt, so it needs system_prompt_mode: append below.
          review_verbosity: concise
          system_prompt_mode: append
          # v2.1.1 bundles the release-notes STYLE rules (no raw PR/issue/SHA links, summarize in
          # prose, at most one URL) for renovate-ish PR kinds, so this addendum only steers FETCH
          # behavior: Renovate embeds upstream notes under a literal "### Release Notes" heading
          # whenever it can resolve a changelog source — don't re-fetch those. When fetching is
          # needed, use the authenticated gh_api tool — web_fetch of github.com HTML truncates to
          # page boilerplate at the response cap and never yielded usable notes (validated in run
          # logs). Projects that publish no GitHub releases (e.g. Ceph) return 404/empty from
          # gh_api, so fall back to the project official release-notes documentation page.
          # v2.1.11 concatenates system_prompt_file then system_prompt (upstream #426).
          system_prompt_file: .github/pr-review-prompt.md
          system_prompt: >-
            ${{ contains(github.event.pull_request.body, '### Release Notes')
            && 'The PR body already contains upstream release notes from Renovate. Do not fetch
            release notes externally; summarize the embedded notes.'
            || 'For dependency upgrade and Renovate PRs the body lacks upstream release notes.
            Fetch them with the gh_api tool (api.github.com /repos/OWNER/REPO/releases JSON) first.
            If that returns 404 or an empty list (the project does not publish GitHub releases,
            e.g. Ceph), fall back to web_fetch of the project official release-notes documentation
            page (e.g. docs.ceph.com/en/latest/releases/tentacle/#v20-2-3-tentacle) rather than
            github.com HTML pages, which truncate to boilerplate. Large changelogs (Ceph lists
            hundreds of backported PRs) exhaust the context budget if fetched whole: extract only
            the target version section and its Notable Changes summary, then stop.' }}
            Only when the PR changes a dependency version or digest, summarize them in a
            **Release notes** section in review_markdown: user-visible changes, breaking
            changes, and security fixes.
          # Engine hard cap is 126,848 tokens (KV pool); 131072 was over it -> HTTP 500 on
          # max-packed reviews (validated). 120000 stays under the cap and trims cold-prefill time.
          model_context_tokens: "120000"
          allowed_source_hosts: "github.com,api.github.com,raw.githubusercontent.com,gitlab.com,registry.terraform.io,artifacthub.io,www.talos.dev,talos.dev,fluxcd.io,kubernetes.io,cilium.io"
          tool_mode: native_loop
          # 42 of the last 83 reviews stopped at exactly the default 4 calls, none exceeded it.
          # tool_max_rounds stays at 3 (6 turns): if counts now plateau at 6, that is the next cap.
          tool_max_requests: "8"
          # gh_api is the tool loop's only authenticated fetch path; left unset it is locked to
          # this repo, so upstream release lookups fell back to anonymous HTML scraping and failed
          # ("GitHub API access was restricted for the external repository" in posted reviews).
          # "*" keeps the action's read-only path allowlist (releases/commits; secrets denied).
          tool_allowed_gh_api_repos: "*"
          # Default 120s caps the WHOLE native_loop — less than one cold ~100K prefill on this GPU.
          # 900s lets a review finish its tool loop (within-review prefix cache keeps later turns
          # cheap; review-runner maxRunners:3 caps how much of the renovate burst runs at once).
          tool_loop_wall_clock_sec: "900"
          # Native-loop turns use a separate total timeout; 60s expired during 155-220s prefills.
          tool_planning_timeout_sec: "600"
          tool_loop_summarize: "true"
          search_url: http://searxng.default.svc.cluster.local:8080/search

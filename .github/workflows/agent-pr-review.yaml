---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Agent PR Review

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # review-runner, not cluster-runner: this job feeds untrusted PR text to a tool-calling model,
    # and cluster-runner mounts Talos os:admin into every pod it schedules.
    runs-on: review-runner
    # Renovate's type/digest PRs do not need model review.
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(github.event.pull_request.labels.*.name, 'type/digest')
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # this job checks out untrusted PR code; don't leave a usable token in .git/config
          persist-credentials: false

      - name: Run reviewer
        uses: misospace/pr-reviewer-action@a962cdfc21c378a3b8cf2d8b194c787408e60e6b # v2.5.0
        with:
          github_token: ${{ github.token }}
          ai_base_url: http://litellm.ai.svc.cluster.local/v1
          ai_api_key: ${{ secrets.LITELLM_API_KEY }}
          # omniroute = larger free-tier model; litellm already retries inside it, so the
          # action-level fallback is a distinct self-hosted model, not a no-op retry.
          ai_model: omniroute
          ai_fallback_model: qwen-3.8-fast
          ai_temperature: "0.2"
          ai_response_format: json_schema
          # qwen-3.8-fast cold prefill near ~100K ctx measured 155-220s.
          ai_request_timeout_sec: "600"
          verdict_policy: findings_severity_gated
          inline_findings: "true"
          inline_findings_max: "12"
          publish_mode: review_comment
          # concise patches the bundled prompt, so system_prompt_mode must be append.
          review_verbosity: concise
          system_prompt_mode: append
          system_prompt_file: .github/pr-review-prompt.md
          # Renovate embeds notes under "### Release Notes" only when it resolves a changelog.
          # Otherwise: gh_api on the single-tag endpoint. The releases LIST and github.com
          # HTML both blow past the response cap before the body field (measured).
          system_prompt: >-
            ${{ contains(github.event.pull_request.body, '### Release Notes')
            && 'The PR body already contains upstream release notes from Renovate. Do not fetch
            release notes externally; summarize the embedded notes.'
            || 'For dependency upgrade and Renovate PRs the body lacks upstream release notes.
            Fetch them with gh_api endpoint repos/OWNER/REPO/releases/tags/TAG (one call per
            release; the release body is the last JSON field). Never fetch the releases list or
            github.com HTML pages. If the tag returns 404 (the project does not publish GitHub
            releases, e.g. Ceph), fall back to web_fetch of the project official release-notes
            documentation page (e.g. docs.ceph.com/en/latest/releases/tentacle/#v20-2-3-tentacle).
            Large changelogs exhaust the context budget if fetched whole: extract only the target
            version section and its Notable Changes summary, then stop.' }}
            Only when the PR changes a dependency version or digest, summarize them in a
            **Release notes** section in review_markdown: user-visible changes, breaking
            changes, and security fixes.
          # qwen-3.8-fast KV pool caps at 126,848 tokens; 131072 returned HTTP 500.
          model_context_tokens: "120000"
          allowed_source_hosts: "github.com,api.github.com,raw.githubusercontent.com,gitlab.com,registry.terraform.io,artifacthub.io,www.talos.dev,talos.dev,fluxcd.io,kubernetes.io,cilium.io"
          tool_mode: native_loop
          tool_max_requests: "8"
          # gh_api is the only authenticated fetch path; unset = locked to this repo.
          tool_allowed_gh_api_repos: "*"
          # A release JSON puts `body` after `assets`: toolhive v0.50.0 = 61KB, talos = 102KB.
          # The default 12000 cut every asset-heavy release before its notes.
          tool_max_response_bytes: "120000"
          # Default 120s caps the whole loop, less than one cold prefill.
          tool_loop_wall_clock_sec: "900"
          tool_turn_timeout_sec: "600"
          # Folds old tool results instead of clipping them when the context fills up.
          tool_loop_summarize: "true"
          search_url: http://searxng.default.svc.cluster.local:8080/search

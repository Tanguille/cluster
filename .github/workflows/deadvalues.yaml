---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Dead Values

# Helm silently ignores values keys a chart does not read: typos, keys a chart
# dropped, or keys an AI agent invented. Flux stays green while the key does
# nothing. deadvalues renders every changed chart and reports the keys with no
# effect; a chart bump that kills a key (BREAKING) fails the pull request.
on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**", ".deadvalues.yaml"]
  # PRs only restore caches saved on main; these runs keep the chart cache warm.
  push:
    branches: ["main"]
    paths: ["kubernetes/**", ".deadvalues.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deadvalues:
    name: Dead Values - scan Helm values
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Chart cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/deadvalues
          key: deadvalues-${{ hashFiles('kubernetes/**/ocirepository.yaml', 'kubernetes/**/helmrelease.yaml') }}
          restore-keys: deadvalues-

      - name: Dead values
        uses: guarnz/deadvalues@6ed0a88f1513ea7c3c93b3bb9a4b4fc71b951b25 # v0.1.9
        with:
          path: kubernetes/apps
          # HEAD^1 is main in the PR merge checkout (and the previous commit on push); the default
          # pull_request base.sha is the stale merge-base.
          base: HEAD^1
          fail-on-scan: dead
          # Apps this PR migrates to inline spec.chart OCI sources. deadvalues v0.1.9 resolves
          # only spec.chartRef and reports the migrated apps as "sourceRef kind '' is not
          # supported"; skip them until the tool supports inline chart sources.
          skip: kubernetes/apps/actions-runner-system/actions-runner-controller/app,kubernetes/apps/actions-runner-system/actions-runner-controller/runners/cluster,kubernetes/apps/ai/agentgateway/controller,kubernetes/apps/ai/llmkube/app,kubernetes/apps/ai/memini/app,kubernetes/apps/ai/toolhive/app,kubernetes/apps/ai/toolhive/crds,kubernetes/apps/cert-manager/cert-manager/app,kubernetes/apps/database/cloudnative-pg/app,kubernetes/apps/database/cloudnative-pg/barman-cloud,kubernetes/apps/database/dragonfly/app,kubernetes/apps/default/nextcloud/app,kubernetes/apps/default/obico/app,kubernetes/apps/flux-system/flux-instance/app,kubernetes/apps/flux-system/flux-operator/app,kubernetes/apps/flux-system/konflate/app,kubernetes/apps/kopiur-system/kopiur/app,kubernetes/apps/kritika/kritika/app,kubernetes/apps/kube-system/cilium/app,kubernetes/apps/kube-system/coredns/app,kubernetes/apps/kube-system/descheduler/app,kubernetes/apps/kube-system/metrics-server/app,kubernetes/apps/kube-system/node-problem-detector/app,kubernetes/apps/kube-system/reloader/app,kubernetes/apps/kube-system/snapshot-controller/app,kubernetes/apps/kube-system/spegel/app,kubernetes/apps/media/brrpolice/app,kubernetes/apps/media/seerr/app,kubernetes/apps/network/agentgateway/crds,kubernetes/apps/network/envoy-gateway/app,kubernetes/apps/network/external-dns/app,kubernetes/apps/network/k8s-gateway/app,kubernetes/apps/observability/exporters/blackbox-exporter/app,kubernetes/apps/observability/exporters/drm-exporter/app,kubernetes/apps/observability/exporters/kepler/app,kubernetes/apps/observability/exporters/node-exporter/app,kubernetes/apps/observability/exporters/smartctl-exporter/app,kubernetes/apps/observability/exporters/speedtest-exporter/app,kubernetes/apps/observability/gatus/app,kubernetes/apps/observability/grafana/app,kubernetes/apps/observability/keda/app,kubernetes/apps/observability/kromgo/app,kubernetes/apps/observability/kube-state-metrics/app,kubernetes/apps/observability/prometheus-operator-crds/app,kubernetes/apps/observability/silence-operator/app,kubernetes/apps/observability/victoria-logs/app,kubernetes/apps/observability/victoria-logs/collector,kubernetes/apps/observability/victoria-metrics/app,kubernetes/apps/openebs-system/openebs/app,kubernetes/apps/renovate/renovate-operator/app,kubernetes/apps/rook-ceph/rook-ceph/app,kubernetes/apps/rook-ceph/rook-ceph/cluster,kubernetes/apps/rook-ceph/rook-ceph/csi,kubernetes/apps/security/crowdsec/app,kubernetes/apps/security/crowdsec/bouncers/envoy,kubernetes/apps/security/kguardian/app,kubernetes/apps/security/trivy-operator/app,kubernetes/apps/system-upgrade/tuppr/app

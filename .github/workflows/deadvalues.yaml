---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Dead Values

# Helm silently ignores values keys a chart does not read: typos, keys a chart
# dropped, or keys an AI agent invented. Flux stays green while the key does
# nothing. deadvalues renders every configured chart and reports the keys with no
# effect; a chart bump that leaves a configured key dead or redundant fails the pull request.
on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**", ".deadvalues.yaml"]
  # PRs only restore caches saved on main; these runs keep the chart cache warm.
  push:
    branches: ["main"]
    paths: ["kubernetes/**", ".deadvalues.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deadvalues:
    name: Dead Values - scan Helm values
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Chart cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/deadvalues
          key: deadvalues-${{ hashFiles('kubernetes/**/ocirepository.yaml', 'kubernetes/**/helmrelease.yaml') }}
          restore-keys: deadvalues-

      - name: Dead values
        uses: guarnz/deadvalues@feac43f3d0c03046cc84c26cbac79c697ce841bf # v0.2.0-rc.1
        with:
          # A SHA-pinned action installs the latest release unless told otherwise; pin the binary to the same tag.
          # renovate: datasource=github-releases depName=guarnz/deadvalues
          version: v0.2.0-rc.1
          # Scan configured versions; migrations can remove values required by the old chart.
          # xmrig's HelmReleases come from a ResourceSet, which deadvalues lists as not supported yet.
          args: scan kubernetes/apps --details --fail-on redundant --skip xmrig

---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Gitleaks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Gitleaks - Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # The regression suite exercises actual hook ordering with pinned Lefthook.
          install_args: aqua:mikefarah/yq aqua:evilmartians/lefthook

      - name: Secret guardrail regression tests
        run: mise exec aqua:mikefarah/yq -- python3 -m unittest discover -s scripts/tests -v

      - name: Check all tracked index blobs (no decryption)
        run: mise exec aqua:mikefarah/yq -- bash scripts/secret-check.sh --all

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # the action refuses PR scans without a token since v2.3.7
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

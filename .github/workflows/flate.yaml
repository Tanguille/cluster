---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  flate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Flate
        uses: home-operations/flate/action@2862e47ed4d6efebeffb43c7691ee6df06b4536c # v0.5.0

      # All three diffs share one job: the first render warms flate's on-disk cache,
      # so the other two are near-free. Separate jobs each render from cold.
      - name: Run Flate
        id: flate
        env:
          FLATE_OUTPUT: github
          FLATE_PATH: ./kubernetes/flux/cluster
        run: |-
          for kind in helmrelease kustomization; do
            echo "${kind}<<EOF" >> $GITHUB_OUTPUT
            flate diff "$kind" >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          done

      - name: Run Flate (images)
        id: images
        env:
          FLATE_OUTPUT: json
          FLATE_PATH: ./kubernetes/flux/cluster
        run: |-
          echo 'images<<EOF' >> $GITHUB_OUTPUT
          flate diff images >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - if: ${{ steps.flate.outputs.helmrelease != '' || steps.flate.outputs.kustomization != '' }}
        name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - if: ${{ steps.flate.outputs.helmrelease != '' }}
        name: Add Comment (HelmRelease)
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          message-id: ${{ github.event.pull_request.number }}/kubernetes/helmrelease
          message: |-
            ```diff
            ${{ steps.flate.outputs.helmrelease }}
            ```

      - if: ${{ steps.flate.outputs.kustomization != '' }}
        name: Add Comment (Kustomization)
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          message-id: ${{ github.event.pull_request.number }}/kubernetes/kustomization
          message: |-
            ```diff
            ${{ steps.flate.outputs.kustomization }}
            ```

  pull:
    if: >-
      ${{
        needs.flate.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: flate
    name: Flate - Pull Images
    runs-on: cluster-runner
    steps:
      # 96MiB per run, on every container PR. /tool-cache is a shared RWX cache: optional,
      # and writable by any job, so every binary is sha256-checked against the release.
      - name: Install talosctl
        env:
          # renovate: datasource=github-releases depName=siderolabs/talos
          TALOS_VERSION: v1.13.8
        run: |
          set -euo pipefail
          base="https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}"
          bin="$HOME/.local/bin"
          cache="/tool-cache/talosctl-${TALOS_VERSION}"
          mkdir -p "$bin"

          want=$(curl -fsSL "${base}/sha256sum.txt" | awk '$2 == "talosctl-linux-amd64" { print $1 }')
          [[ -n "$want" ]] || { echo "no sha256 published for talosctl-linux-amd64"; exit 1; }
          verify() { [[ -f "$1" ]] && echo "${want}  $1" | sha256sum --check --status; }

          # verify the copy, not the shared entry: check-then-read leaves a swap window
          if cp "$cache" "$bin/talosctl" 2>/dev/null && verify "$bin/talosctl"; then
            echo "talosctl ${TALOS_VERSION} served from cache"
          else
            curl -fsSL -o "$bin/talosctl" "${base}/talosctl-linux-amd64"
            verify "$bin/talosctl" || { echo "sha256 mismatch on downloaded talosctl"; exit 1; }
            if [[ -w /tool-cache ]]; then
              # mktemp, not $$: PIDs collide across pods sharing the mount
              tmp=$(mktemp "/tool-cache/.talosctl.XXXXXX")
              trap 'rm -f -- "$tmp"' EXIT
              cp "$bin/talosctl" "$tmp"
              chmod 0644 "$tmp"
              mv -f "$tmp" "$cache"
              trap - EXIT
              # only the pinned version is read; -ignore_readdir_race so a concurrent
              # pruner removing the same entry is not a failure
              find /tool-cache -maxdepth 1 -ignore_readdir_race \
                -name 'talosctl-*' ! -name "talosctl-${TALOS_VERSION}" -delete
            fi
          fi
          chmod +x "$bin/talosctl"
          echo "$bin" >> "$GITHUB_PATH"

      # One runner pod pulls all images to its node; Spegel mirrors the blobs cluster-wide,
      # so a single node is enough to pre-warm (and beats one pod + talosctl install per image).
      # yq (not jq): explicitly installed in the home-operations runner image; the guard
      # fails loudly if the flate output doesn't parse (yq is lenient about garbage input).
      - name: Pull Images
        env:
          IMAGES: ${{ needs.flate.outputs.images }}
        run: |
          set -euo pipefail
          images=$(yq -r '.[]' <<< "$IMAGES")
          [ -n "$images" ] || { echo "no images parsed from flate output: $IMAGES"; exit 1; }
          rc=0
          while IFS= read -r image; do
            echo "Pulling ${image}"
            talosctl --nodes "$NODE" image pull "${image}" || rc=1
          done <<< "$images"
          exit $rc

  success:
    if: ${{ !cancelled() }}
    needs: [flate, pull]
    name: Flate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"

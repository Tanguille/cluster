---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**", "flate-supply.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flate:
    name: Flate
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.flate.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Flate
        uses: home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3

      # All three diffs share one job: the first render warms flate's on-disk cache,
      # so the other two are near-free. Separate jobs each render from cold.
      - name: Run Flate
        id: flate
        env:
          FLATE_API_VERSIONS: monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,grafana.integreatly.org/v1beta1/GrafanaDashboard
          FLATE_OUTPUT: github
          # No FLATE_PATH: root discovery, like konflate and validate-pr.sh.
          FLATE_SUPPLY: ./flate-supply.yaml
        # Diffs go to files, not step outputs: the comment action receives an input as one
        # environment variable, and Linux caps a single one at 128 KiB ("Argument list too
        # long" on large PRs). Outputs only flag which comments to post.
        run: |-
          for kind in helmrelease kustomization; do
            diff="$(flate diff "$kind")"
            if [ -n "$diff" ]; then
              printf '%s\n' '```diff' "$diff" '```' > "${RUNNER_TEMP}/flate-${kind}.md"
              echo "${kind}=true" >> "$GITHUB_OUTPUT"
            fi
          done
          {
            echo 'images<<EOF'
            FLATE_OUTPUT=json flate diff images
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - if: ${{ steps.flate.outputs.helmrelease == 'true' || steps.flate.outputs.kustomization == 'true' }}
        name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - if: ${{ steps.flate.outputs.helmrelease == 'true' }}
        name: Add Comment (HelmRelease)
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          message-id: ${{ github.event.pull_request.number }}/kubernetes/helmrelease
          message-path: ${{ runner.temp }}/flate-helmrelease.md

      - if: ${{ steps.flate.outputs.kustomization == 'true' }}
        name: Add Comment (Kustomization)
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          message-id: ${{ github.event.pull_request.number }}/kubernetes/kustomization
          message-path: ${{ runner.temp }}/flate-kustomization.md

  pull:
    if: >-
      ${{
        needs.flate.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: flate
    name: Flate - Pull Images
    runs-on: cluster-runner
    steps:
      # Only the lockfile, for the pinned talosctl.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: mise.lock
          sparse-checkout-cone-mode: false

      # The mise.lock linux-x64 entry: release url and sha256, so CI runs the pinned binary.
      - name: Install talosctl
        run: |
          set -euo pipefail
          entry="$(sed -n '/^\[tools\."aqua:siderolabs\/talos"\."platforms\.linux-x64"\]$/,/^$/p' mise.lock)"
          url="$(sed -n 's/^url = "\(.*\)"$/\1/p' <<<"${entry}")"
          sum="$(sed -n 's/^checksum = "sha256:\(.*\)"$/\1/p' <<<"${entry}")"
          [[ -n "${url}" && -n "${sum}" ]] || { echo "no linux-x64 talos entry in mise.lock" >&2; exit 1; }
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/talosctl" "$url"
          echo "${sum}  $bin/talosctl" | sha256sum --check --strict
          chmod +x "$bin/talosctl"
          echo "$bin" >> "$GITHUB_PATH"

      # One runner pod pulls all images to its node; Spegel mirrors the blobs cluster-wide,
      # so a single node is enough to pre-warm (and beats one pod + talosctl install per image).
      # yq (not jq): explicitly installed in the home-operations runner image; the guard
      # fails loudly if the flate output doesn't parse (yq is lenient about garbage input).
      - name: Pull Images
        env:
          IMAGES: ${{ needs.flate.outputs.images }}
        run: |
          set -euo pipefail
          images=$(yq -r '.[]' <<< "$IMAGES")
          [ -n "$images" ] || { echo "no images parsed from flate output: $IMAGES"; exit 1; }
          # talosctl pulls anonymously, so the private rsume image (imagePullSecrets) is skipped;
          # move to Talos registry auth if a second private image appears.
          images=$(grep -v '^ghcr\.io/tanguille/rsume[:@]' <<< "$images" || true)
          rc=0
          while IFS= read -r image; do
            [ -n "$image" ] || continue # an rsume-only diff leaves nothing to pull
            echo "Pulling ${image}"
            talosctl --nodes "$NODE" image pull "${image}" || rc=1
          done <<< "$images"
          exit $rc

---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Tests - scripts regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # Secret-check tests need yq and exercise hook ordering with pinned Lefthook; the bootstrap test builds the helmfiles.
          install_args: aqua:mikefarah/yq aqua:evilmartians/lefthook aqua:helm/helm aqua:helmfile/helmfile

      - name: Regression tests
        run: mise exec -- python3 -m unittest discover -s scripts -v

---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Tests - scripts regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # Save from main only; PR-scoped copies crowd the Actions cache quota.
          cache_save: ${{ github.event_name == 'push' }}
          # Secret-check tests need yq and exercise hook ordering with pinned Lefthook; the bootstrap test builds the helmfiles.
          install_args: aqua:mikefarah/yq aqua:evilmartians/lefthook aqua:helm/helm aqua:helmfile/helmfile

      - name: Regression tests
        run: python3 -m unittest discover -s scripts -v

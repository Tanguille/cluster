---
name: CLM Head Server

on:
  push:
    branches: ["main"]
    paths:
      - "docker/clm/**"
  pull_request:
    paths:
      - "docker/clm/**"
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (default: the triggering commit SHA)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The pull_request paths filter evaluates the whole base..head diff, so
    # every push to a clm PR re-builds. The pin-back commit below (which only
    # touches the helmrelease tag) would re-trigger itself forever — skip
    # builds whose head commit is that pin-back.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        !startsWith(github.event.head_commit.message, 'chore: pin clm-head tag')
      }}
    # One tag per commit: the HelmRelease pins the git SHA, so a re-run of an
    # older ref publishes the same tag and Flux sees no change. Two no-op
    # guards, complementary: the job-level if: skips pin-back commits (breaks
    # the re-trigger loop), and the "Resolve target tag" step below skips a
    # build when the manifest already pins the head (e.g. workflow-only
    # changes) — that one is race-safe, so it can stand alone if the message
    # guard is ever dropped.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full depth: the pin-back step checks out the raw head SHA, which a
          # default depth-1 checkout of the merge ref does not contain.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target tag
        # Skip the build when the PR manifest already pins exactly the head
        # SHA this event publishes. Without this, workflow-only changes (or
        # a late-arriving pin-back) make the build publish an orphan tag.
        # DO_BUILD is consumed by the shell of the next step via GITHUB_ENV
        # (step `if:` cannot read it — only job/workflow-level env can).
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |-
          PINS="kubernetes/apps/ai/clm/app/helmrelease.yaml"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -f "$PINS" ]; then
            CURRENT=$(sed -n 's/^[[:space:]]*tag:[[:space:]]*//p' "$PINS" | head -1)
            if [ "$CURRENT" = "$HEAD_SHA" ]; then
              echo "manifest already pins head $HEAD_SHA; skipping build"
              echo "DO_BUILD=false" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "DO_BUILD=true" >> "$GITHUB_ENV"

      - name: Build and publish
        # Guard: a concurrent pin-back may have advanced the manifest tag
        # between the pre-check and this step. Build only the tag the
        # manifest pins now, so we never publish an orphan.
        run: |
          set -euo pipefail
          [ "${DO_BUILD:-true}" = "true" ] || { echo "skip build (manifest already pinned)"; exit 0; }
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || \
            TAG="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            CURRENT=$(sed -n 's/^[[:space:]]*tag:[[:space:]]*//p' \
              kubernetes/apps/ai/clm/app/helmrelease.yaml | head -1)
            [ "$CURRENT" = "$TAG" ] || \
              { echo "::error::manifest pins ${CURRENT:-<none>} but building ${TAG}; skipping to avoid an orphan tag"; exit 1; }
          fi
          IMAGE="ghcr.io/tanguille/clm-head:${TAG}"
          # Same bootstrap guard as scripts/talos-kernel-build.sh: the hosted
          # runner's default 'docker' buildx driver cannot push, so promote
          # the docker-container driver before building.
          docker buildx inspect --bootstrap 2>/dev/null | grep -q '^Driver:[[:space:]]*docker-container' || \
            docker buildx create --driver docker-container --use --bootstrap >/dev/null
          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE}" \
            -t "ghcr.io/tanguille/clm-head:latest" \
            --push \
            docker/clm
          echo "published: ${IMAGE}"

      - name: Pin built tag to PR manifest
        # The HelmRelease must reference a tag this run actually published
        # (the PR head SHA). The pin commit carries a fixed message so the
        # job guard above breaks the re-trigger loop. Same-repo PRs only:
        # GITHUB_TOKEN cannot push into a fork's branch.
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Validate the ref/SHA from the event payload before use: this
          # step only runs for same-repo PRs (see the guard above), so a
          # normal git ref is the only legitimate value.
          echo "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$' || { echo "refusing to push to malformed branch"; exit 1; }
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "refusing to use malformed sha"; exit 1; }
          # The default checkout on pull_request is the merge ref; reset to
          # the exact branch tip in a clean worktree before editing it.
          git fetch -q origin "$BRANCH"
          git checkout -qf "$SHA"
          git clean -qfd
          sed -i "s/^\( *\)tag: .*/\1tag: ${SHA}/" \
            kubernetes/apps/ai/clm/app/helmrelease.yaml
          if git diff --quiet -- kubernetes/apps/ai/clm/app/helmrelease.yaml; then
            echo "tag already pinned to ${SHA}"
          else
            git add kubernetes/apps/ai/clm/app/helmrelease.yaml
            git -c user.name="github-actions[bot]" \
               -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
               commit -q -m "chore: pin clm-head tag"
            # persist-credentials: false left origin unauthenticated; push
            # over an explicit GH_TOKEN URL instead of relying on stored creds.
            # Injection note: GITHUB_REPOSITORY is GitHub-provided; BRANCH was
            # validated against ^[A-Za-z0-9._/-]+$ at the top of this step.
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${BRANCH}"
            echo "pinned helmrelease to ${SHA} on ${BRANCH}"
          fi

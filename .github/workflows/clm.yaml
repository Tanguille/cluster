---
name: CLM Head Server

on:
  push:
    branches: ["main"]
    paths:
      - "docker/clm/**"
  pull_request:
    paths:
      - "docker/clm/**"
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (default: the triggering commit SHA)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One tag per commit: the HelmRelease pins the git SHA, so a re-run of an
    # older ref publishes the same tag and Flux sees no change.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure public package
        # New GHCR packages default to PRIVATE; the flate "Pull Images" job
        # pulls anonymously from node networks, so a private package 403s
        # there. GITHUB_TOKEN (write:packages) creates/patches the package
        # visibility before the push so no manual UI step is needed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          H="Authorization: Bearer $GH_TOKEN"
          API="https://api.github.com"
          ID=$(curl -fsSL -H "$H" -H "Accept: application/vnd.github+json" \
            "$API/user/packages/clm-head?package_type=container" | jq -r '.id // empty') || ID=""
          if [ -n "$ID" ]; then
            curl -fsSL -X PATCH -H "$H" -H "Accept: application/vnd.github+json" \
              -d '{"visibility":"public"}' "$API/user/packages/$ID" >/dev/null
            echo "package clm-head already exists (id $ID); visibility set public"
          else
            curl -fsSL -X POST -H "$H" -H "Accept: application/vnd.github+json" \
              -d '{"name":"clm-head","package_type":"container","visibility":"public"}' \
              "$API/user/packages" >/dev/null
            echo "package clm-head created as public"
          fi

      - name: Build and publish
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || \
            TAG="${{ github.event.pull_request.head.sha || github.sha }}"
          IMAGE="ghcr.io/tanguille/clm-head:${TAG}"
          # Same bootstrap guard as scripts/talos-kernel-build.sh: the hosted
          # runner's default 'docker' buildx driver cannot push, so promote
          # the docker-container driver before building.
          docker buildx inspect --bootstrap 2>/dev/null | grep -q '^Driver:[[:space:]]*docker-container' || \
            docker buildx create --driver docker-container --use --bootstrap >/dev/null
          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE}" \
            -t "ghcr.io/tanguille/clm-head:latest" \
            --push \
            docker/clm
          echo "published: ${IMAGE}"

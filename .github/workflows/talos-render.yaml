---
# The render path has no other CI coverage: `render-config` needs the age key, so it only ever
# runs on a workstation. This check needs no secret -- sops leaves the key structure in
# cleartext -- so it can run here and catch the one class of regression that would otherwise
# surface at `apply-node` time, against a live node.
name: Talos Render

on:
  pull_request:
    paths:
      - talos/**
      - .justfile
      - scripts/talos-template-vars.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  template-vars:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Check template variables
        run: scripts/talos-template-vars.sh

      # talos-kernel.yaml skips recipe edits on purpose, so prove the recipes its script calls
      # still resolve here, without building. Same version guard the script applies first.
      - name: Resolve kernel-build recipes
        run: |
          kernel="$(just kernel-version)"
          version="$(just tuppr-version talos)"
          [[ "${version#*-k}" == "${kernel}" ]] || { echo "CR names ${version}, Dockerfile builds ${kernel}" >&2; exit 1; }
          # Assigned first: a failed substitution in the for list would pass on zero nodes.
          nodes="$(just talos nodes)"
          for node in ${nodes}; do
            file="$(just talos schematic-file "${node}")"
            [[ -f "${file}" ]] || { echo "no schematic for ${node}: ${file}" >&2; exit 1; }
            echo "${node}: ${file}"
          done
